<!-- === 2 PLAYER SNAKE - 22PX BÜYÜTÜLMÜŞ BAŞLIK (SABİT KUTU BOYUTU), 700PX & SAYDAM HUD === -->
<style>
  /* 1. Neon Çerçeve Animasyonu (Pembe <-> Turkuaz) */
  @keyframes snakeNeonDesktopCycle {
    0%, 100% {
      box-shadow: 0 0 16px rgba(0, 242, 255, 0.45), 0 0 35px rgba(0, 242, 255, 0.22);
      border-color: rgba(0, 242, 255, 0.75);
    }
    50% {
      box-shadow: 0 0 16px rgba(255, 51, 153, 0.45), 0 0 35px rgba(255, 51, 153, 0.22);
      border-color: rgba(255, 51, 153, 0.75);
    }
  }

  /* 2. EN ÜSTTEKİ TÜM TEMA BOŞLUKLARINI VE OK/WIDGET KALINTILARINI SIFIRLA */
  #ps-widget,
  #ps-peek-tab,
  #ps-mobile-banner,
  #ps-mobile-peek-tab {
    display: none !important;
    visibility: hidden !important;
    pointer-events: none !important;
    opacity: 0 !important;
  }

  #page,
  #content,
  .site-content,
  #primary,
  #main,
  .ast-article-single,
  .entry-content {
    padding-top: 0 !important;
    margin-top: 0 !important;
  }

  /* 3. OYUNUN ALTINDAKİ DEV BOŞLUĞU SIFIRLA */
  .snake-hero {
    display: flex !important;
    flex-direction: column !important;
    align-items: center !important;
    padding-top: 0 !important;
    margin-top: 0 !important;
    min-height: auto !important;
    padding-bottom: 25px !important;
  }

  /* 4. MAĞAZA BUTONLARI KUTUSU (EBATLARI KORUNAN DENGE) */
  .snake-store-buttons {
    order: 1 !important;
    display: inline-flex !important;
    flex-direction: column !important;
    align-items: center !important;
    gap: 9px !important; /* Boşluk dengelendi, kutu büyümez */
    padding: 10px 28px 12px !important; /* Yazı büyümesini absorbe eden optimize padding */
    background: rgba(10, 15, 30, 0.85) !important;
    backdrop-filter: blur(14px) !important;
    -webkit-backdrop-filter: blur(14px) !important;
    border: 1.5px solid rgba(0, 242, 255, 0.5) !important;
    border-radius: 18px !important;
    box-shadow: 
      0 0 25px rgba(0, 242, 255, 0.28), 
      0 8px 30px rgba(0, 0, 0, 0.65),
      inset 0 0 14px rgba(0, 242, 255, 0.08) !important;
    margin: 8px auto 14px auto !important;
    position: relative !important;
    z-index: 20 !important;
    width: auto !important;
    max-width: fit-content !important;
  }

  .snake-store-buttons::before {
    content: "";
    position: absolute;
    top: -1px;
    left: 20%;
    right: 20%;
    height: 2px;
    background: linear-gradient(90deg, transparent, #00f2ff, #ff3399, transparent);
    box-shadow: 0 0 8px #00f2ff;
  }

  /* HAREKETLİ NEON BAŞLIK - 22PX BÜYÜTÜLMÜŞ */
  .snake-store-box-header {
    display: flex;
    align-items: center;
    gap: 10px;
    user-select: none;
    line-height: 1.15;
  }

  @keyframes neonTextFlow {
    0% {
      background-position: 0% 50%;
      filter: drop-shadow(0 0 10px rgba(0, 242, 255, 0.65));
    }
    50% {
      background-position: 100% 50%;
      filter: drop-shadow(0 0 12px rgba(255, 51, 153, 0.7));
    }
    100% {
      background-position: 0% 50%;
      filter: drop-shadow(0 0 10px rgba(0, 242, 255, 0.65));
    }
  }

  .snake-store-box-header span.header-text {
    font-size: 22px; /* 1-2px büyütüldü */
    font-weight: 900;
    letter-spacing: 0.6px;
    background: linear-gradient(90deg, #00f2ff, #ff3399, #00f2ff, #ff3399);
    background-size: 300% 300%;
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    animation: neonTextFlow 5s ease-in-out infinite;
    display: inline-block;
  }

  @keyframes storeDotColorCycle {
    0%, 100% { background: #00f2ff; box-shadow: 0 0 10px #00f2ff; transform: scale(1); }
    50% { background: #ff3399; box-shadow: 0 0 10px #ff3399; transform: scale(1.15); }
  }

  .store-pulse-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    animation: storeDotColorCycle 5s ease-in-out infinite;
    flex-shrink: 0;
  }

  .snake-store-row {
    display: flex !important;
    align-items: center !important;
    justify-content: center !important;
    gap: 14px !important;
  }

  /* 5. 700PX DEV OYUN PENCERESİ (1050px Genişlik & 700px Yükseklik) */
  @media (min-width: 901px) {
    .snake-game-container {
      order: 2 !important;
      width: 1050px !important;
      max-width: 1050px !important;
      height: 700px !important;
      max-height: none !important;
      margin: 0 auto !important;
    }
  }

  .snake-game-container {
    position: relative !important;
    border: 2px solid rgba(0, 242, 255, 0.6) !important;
    animation: snakeNeonDesktopCycle 6s infinite ease-in-out !important;
    transition: border-color 0.4s ease, box-shadow 0.4s ease !important;
  }

  body.fullscreen-active .snake-game-container,
  :fullscreen .snake-game-container,
  :-webkit-full-screen .snake-game-container {
    border: none !important;
    box-shadow: none !important;
    animation: none !important;
  }

  .snake-fullscreen-btn {
    display: none !important;
  }

  /* 6. SAYDAM BUZLU CAM (FROSTED GLASS HUD) TAM EKRAN BUTONU */
  #snake-top-fs-btn {
    position: absolute;
    top: 16px;
    right: 16px;
    z-index: 100;
    display: inline-flex;
    align-items: center;
    gap: 10px;
    padding: 10px 22px;
    border-radius: 9999px;
    font-family: inherit;
    font-size: 16px;
    font-weight: 800;
    letter-spacing: 0.6px;
    color: #ffffff;
    background: rgba(10, 15, 30, 0.35) !important;
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    border: 1.5px solid rgba(0, 242, 255, 0.65);
    box-shadow: 0 0 16px rgba(0, 242, 255, 0.35), inset 0 0 10px rgba(0, 242, 255, 0.15);
    cursor: pointer;
    transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
    user-select: none;
  }

  #snake-top-fs-btn:hover {
    transform: translateY(-2px) scale(1.06);
    background: rgba(10, 15, 30, 0.65) !important;
    border-color: #00f2ff;
    box-shadow: 0 0 28px rgba(0, 242, 255, 0.8), inset 0 0 14px rgba(0, 242, 255, 0.35);
    color: #00f2ff;
  }

  #snake-top-fs-btn svg {
    width: 28px;
    height: 28px;
    stroke: currentColor;
    stroke-width: 2.6;
    stroke-linecap: round;
    stroke-linejoin: round;
    fill: none;
    transition: transform 0.25s ease;
  }

  #snake-top-fs-btn:hover svg {
    transform: scale(1.14);
  }

  body.fullscreen-active #snake-top-fs-btn {
    display: none !important;
  }
</style>

  };

  function getDetectedLang() {
    var pathLang = window.location.pathname.split('/')[1];
    if (pathLang && FS_TEXTS[pathLang.toLowerCase()]) {
      return pathLang.toLowerCase();
    }
    var htmlLang = (document.documentElement.lang || '').slice(0, 2).toLowerCase();
    if (htmlLang && FS_TEXTS[htmlLang]) {
      return htmlLang;
    }
    var browserLang = ((navigator.languages && navigator.languages[0]) || navigator.language || 'en').slice(0, 2).toLowerCase();
    return FS_TEXTS[browserLang] ? browserLang : 'en';
  }

  function setupStoreBox() {
    var container = document.querySelector('.snake-game-container');
    var storeBtns = document.querySelector('.snake-store-buttons');
    if (!storeBtns || !container) return;

    if (storeBtns.previousElementSibling !== null || storeBtns.compareDocumentPosition(container) & Node.DOCUMENT_POSITION_PRECEDING) {
      container.parentNode.insertBefore(storeBtns, container);
    }

    if (!storeBtns.querySelector('.snake-store-row')) {
      var btns = Array.from(storeBtns.querySelectorAll('.snake-store-btn'));
      if (btns.length > 0) {
        var row = document.createElement('div');
        row.className = 'snake-store-row';
        btns.forEach(function(b) { row.appendChild(b); });

        var currentLang = getDetectedLang();
        var headerText = BOX_HEADERS[currentLang] || BOX_HEADERS.en;

        var header = document.createElement('div');
        header.className = 'snake-store-box-header';
        header.innerHTML = '<span class="store-pulse-dot"></span><span class="header-text">' + headerText + '</span>';

        storeBtns.innerHTML = '';
        storeBtns.appendChild(header);
        storeBtns.appendChild(row);
      }
    }
  }

  function initDesktopTopFsButton() {
    var container = document.querySelector('.snake-game-container');
    if (!container || document.getElementById('snake-top-fs-btn')) return;

    setupStoreBox();

    var currentLang = getDetectedLang();
    var label = FS_TEXTS[currentLang] || FS_TEXTS.en;

    var btn = document.createElement('button');
    btn.id = 'snake-top-fs-btn';
    btn.type = 'button';
    btn.setAttribute('aria-label', label);
    btn.innerHTML = '<svg viewBox="0 0 24 24"><path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"/></svg><span>' + label + '</span>';

    btn.addEventListener('
