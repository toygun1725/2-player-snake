<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>2 Player Snake - Beta v1.35 Mobile (v3)</title>
  
  <!-- iOS & Mobile Specific Meta Tags -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="2P Snake">

  <!-- Import fonts -->
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;900&family=VT323&display=swap" rel="stylesheet">
  
  <!-- Version: Beta v1.35 Mobile (v3) -->
  <style>
    :root{
      --bg:#0b0f14;
      --grid:#1a2537;
      --p1:#ff4fbf;
      --p2:#35e6e6;
      --gold:#ffd166;
      --heart:#ff1744;
      --ui-tile:#0c141f;
      --ui-tile-border:#1b2a41;
      --ui-tile-soft:#0f1a2a;
      --text:#e7f1ff;
      --muted:#9fb3d1;
      --safe-area-top: env(safe-area-inset-top, 0px);
      --safe-area-bottom: env(safe-area-inset-bottom, 0px);
    }
    *{box-sizing:border-box; -webkit-tap-highlight-color: transparent;}
    html,body{height:100%; width: 100%;}
    body{
      margin:0;background:var(--bg);color:var(--text);
      font-family:'Orbitron', sans-serif;
      overflow:hidden;
      text-transform: uppercase;
      display: flex;
      flex-direction: column;
      height: 100vh; /* Full viewport height */
      height: -webkit-fill-available; /* iOS Safari fix */
    }
    .banner p, .banner .small-text { text-transform: none; }
    #instructionsContainer, #developersContainer, #highscoreContainer { text-transform: none; }

    #p2-controls, #p1-controls {
        height: 24vh; /* Increased height */
        min-height: 170px;
        width: 100%;
        background: var(--ui-tile);
        flex-shrink: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        position: relative;
    }
    #p2-controls { 
        padding-top: var(--safe-area-top);
        border-bottom: 1px solid var(--ui-tile-border);
    }
    #p1-controls { 
        padding-bottom: var(--safe-area-bottom);
        border-top: 1px solid var(--ui-tile-border);
    }

    #stage{
        flex-grow: 1;
        position:relative;
        width: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
    }
    #canvasWrap{
      position:relative;
      width: 100%;
      height: 100%;
      box-shadow: inset 0 0 0 1px #1a2636;
      background:#09101a;
    }
    canvas{
      width:100%;height:100%;display:block;
      background:radial-gradient(ellipse at center, #122034 0%, #0b121c 60%, #081018 85%, #050a10 100%);
    }
    #canvasWrap.shake { animation: shake-anim 0.1s 2; }
    @keyframes shake-anim {
        0%, 100% { transform: translateX(0); }
        25% { transform: translateX(-4px); }
        75% { transform: translateX(4px); }
    }
    #canvasWrap::before{
      content:"";position:absolute;inset:0;
      background:linear-gradient(transparent,rgba(0,0,0,.35)),
                 repeating-linear-gradient(180deg,#0000 0 2px,#0003 2px 3px);
      mix-blend-mode:multiply;pointer-events:none
    }

    .overlay{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none;z-index:6}
    .banner{
      pointer-events:auto;min-width:300px;max-width:90%;text-align:center;
      transform:translateY(10px) scale(.96);opacity:0;transition:all .45s cubic-bezier(.2,.8,.2,1);
    }
    .banner.show{transform:translateY(0) scale(1);opacity:1}
    .banner.padded {
      padding:18px 22px;border-radius:18px;
      background:linear-gradient(180deg,#0d1624ee,#0a111de0);
      border:1px solid #1b2a41;box-shadow:0 16px 50px #0009;
    }
    .banner h1{margin:0 0 10px;font-size:clamp(32px, 9vw, 64px);letter-spacing:1px; line-height: 1.1;}
    .banner h2{margin:0 0 15px;font-size:clamp(18px, 4vw, 24px); opacity: 0.9;}
    .banner p{margin:0;opacity:.9;font-size:14px}
    .banner .p1{color:var(--p1)} .banner .p2{color:var(--p2)} .banner .draw{color:#9ed0ff}
    .btn{
        background:var(--ui-tile-soft); border:1px solid var(--ui-tile-border); color:var(--text);
        padding:10px 16px; border-radius:8px; font-family:'Orbitron',sans-serif;
        text-transform:uppercase; cursor:pointer; transition:all .1s;
        display: block; width: 100%; font-size: 18px;
    }
    .btn:not(:last-child) { margin-bottom: 10px; }
    .btn.big{padding:14px 18px;font-size:16px}
    .btn.back{padding:14px 12px;font-size:16px;margin-top:8px}
    .btn:hover{filter:brightness(1.08)}

    /* Turn Controls */
    .turn-controls-container {
        display: flex;
        justify-content: center;
        align-items: stretch;
        width: 28vh;
        height: 14vh;
        min-width: 200px;
        min-height: 100px;
        max-width: 260px;
        max-height: 130px;
    }
    #p2-controls .turn-controls-container {
        transform: rotate(180deg);
    }
    .turn-btn {
        flex: 1;
        background-color: var(--ui-tile-soft);
        border: 1px solid var(--ui-tile-border);
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        transition: background-color 0.1s;
    }
    .turn-btn.left { border-radius: 16px 0 0 16px; }
    .turn-btn.right { border-radius: 0 16px 16px 0; }
    .turn-btn:active {
        background-color: #2a3f5d;
    }
    .turn-separator {
        width: 1px;
        background-color: var(--ui-tile-border);
    }
    .turn-btn svg {
        width: 50%;
        height: 50%;
        max-width: 40px;
        max-height: 40px;
        fill: var(--text);
        opacity: 0.7;
    }

    /* Mobile UI Buttons */
    .mobile-ui-buttons {
        position: absolute;
        top: 15px;
        left: 15px;
        display: flex;
        flex-direction: column;
        gap: 12px; /* More spacing */
    }
    #p2-controls .mobile-ui-buttons {
        left: auto;
        right: 15px; /* Mirrored for P2 */
        transform: rotate(180deg);
    }
    .mobile-ui-btn {
        width: 55px; /* Smaller buttons */
        height: 55px;
        background: var(--ui-tile-soft);
        border: 1px solid var(--ui-tile-border);
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
    }
    .mobile-ui-btn:active {
        background-color: #2a3f5d;
    }
    .mobile-ui-btn svg {
        width: 30px; /* Smaller icons */
        height: 30px;
        fill: var(--text);
        opacity: 0.8;
    }

    #settingsBtnP1 {
        position: absolute;
        top: 15px;
        right: 20px;
    }

    /* Score Display Area */
    .ui-score-display {
        position: absolute;
        top: 50%;
        right: 20px;
        transform: translateY(-50%);
        display: flex;
        flex-direction: column;
        align-items: flex-end;
        gap: 8px;
        pointer-events: none;
    }
    
    #p2-controls .ui-score-display {
        right: auto;
        left: 20px;
        align-items: flex-start;
        transform: translateY(-50%) rotate(180deg);
    }

    /* Center Info Area */
    .center-info {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 4px;
        pointer-events: none;
    }
    .series-mobile {
        display: none; /* Hide center series display */
        gap: 8px;
    }
    .dot {
        width: 12px; height: 12px; border-radius: 50%;
        background: #263449; box-shadow: inset 0 0 0 1px #162131;
    }
    .dot.win-p1 {
        background: radial-gradient(circle at 30% 30%, #fff, var(--p1) 55%, #300b22 140%);
        box-shadow: 0 0 6px var(--p1), inset 0 0 2px #fff6;
    }
    .dot.win-p2 {
        background: radial-gradient(circle at 30% 30%, #fff, var(--p2) 55%, #083033 140%);
        box-shadow: 0 0 6px var(--p2), inset 0 0 2px #fff6;
    }
    #timeLabel {
        display: none; /* Hide timer */
        font-family: 'VT323', monospace;
        font-size: 28px;
        color: var(--white);
        background: #0b1420a0;
        padding: 2px 8px;
        border-radius: 6px;
    }
    .player-scores {
        font-size: 18px; /* Larger font */
        text-align: right;
        line-height: 1.3;
    }
    #p2-controls .player-scores {
        text-align: right; /* Keep text alignment consistent */
    }
    .player-scores .val { font-weight: bold; }
    #p1Score .val { color: var(--p1); }
    #p2Score .val { color: var(--p2); }
    #p1Score-1P .val-len { color: var(--p1); }
    #p1Score-1P .val-food { color: var(--gold); }

    /* Series score display in corners */
    .series-corner {
        display: flex;
        gap: 6px;
    }

    #p1-main-controls, #p2-main-controls {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 8px; /* Space between dots and buttons */
    }

    #p2-main-controls {
        flex-direction: column-reverse;
    }

    #p2-main-controls .series-corner {
        flex-direction: row-reverse; /* P2's score reads left-to-right */
    }


    /* Color selection menu styles */
    .color-options { display: flex; gap: 8px; margin: 12px 0; justify-content: center; }
    .color-btn { width: 28px; height: 28px; border-radius: 50%; border: 2px solid #fff; cursor: pointer; transition: transform 0.2s; }
    .color-menu-separator { height: 28px; width: 1px; background: #fff; opacity: 0.3; }
    .color-btn:hover { transform: scale(1.1); }
    .color-btn:disabled { opacity: 0.3; cursor: not-allowed; transform: none; }
    .banner h2 { font-size: clamp(18px, 4vw, 24px); opacity: 0.9; margin: 15px 0 5px; }
    .edit-icon { cursor: pointer; font-size: 16px; opacity: 0.6; display: inline-block; margin-left: 8px; vertical-align: middle; }
    .edit-icon:hover { opacity: 1; }
    #p1NameInput, #p2NameInput { background: #0003; color: #fff; border: 1px solid #fff8; padding: 6px 8px; font-family: 'Orbitron', sans-serif; width: 140px; text-align: center; }
    .countdown-text {
        font-family: 'Orbitron', sans-serif;
        font-size: 120px;
        font-weight: 900;
        text-shadow: 0 0 2px #fff, 0 0 8px var(--p1);
        animation: countdown-anim 0.5s cubic-bezier(.25,1.5,.5,1) forwards;
        transform: scale(0.5);
        opacity: 0;
    }
    @keyframes countdown-anim { to { transform: scale(1); opacity: 1; } }
    .countdown-text.start {
        font-size: 80px;
        text-shadow: 0 0 5px var(--gold), 0 0 10px var(--p1);
    }
    
    /* Hide elements not used in mobile */
    #version-info, #langBtn, #resetBtn, #highscoreBtn, #menuBtn, footer { display: none !important; }
  </style>
</head>

  function updatePlayerColors(p1_hex, p2_hex) {
    document.documentElement.style.setProperty('--p1', p1_hex);

  /* === Canvas === */
  const canvas=document.getElementById('game');
  const canvasWrap = document.getElementById('canvasWrap');
  const ctx=canvas.getContext('2d');
  let GRID_COLS=36, GRID_ROWS=54; // Mobile-friendly grid
  const BASE_TPS=14.2;
  let dpr=Math.max(1,Math.min(2,window.devicePixelRatio||1));
  function resize(){
    const st=document.getElementById('stage');
    const r=st.getBoundingClientRect();
    if (r.width === 0 || r.height === 0) return; // Safeguard against zero-size container
    canvas.width=Math.floor(r.width*dpr); canvas.height=Math.floor(r.height*dpr);
    ctx.setTransform(dpr,0,0,dpr,0,0);
    // Adjust grid to aspect ratio
    const aspectRatio = r.width / r.height;
    GRID_ROWS = Math.round(GRID_COLS / aspectRatio);
    if (GRID_ROWS % 2 !== 0) GRID_ROWS++; // Ensure even number of rows for symmetry
  }
  addEventListener('resize',resize,{passive:true}); resize();

  /* === Sound === */
  let audioCtx; let muted=localStorage.getItem('neoSnakeMutedMobile')==='1';
  
  function updateSoundIcons() {
    document.querySelectorAll('.soundOnIcon').forEach(icon => icon.style.display = muted ? 'none' : 'block');
    document.querySelectorAll('.soundOffIcon').forEach(icon => icon.style.display = muted ? 'block' : 'none');
  }

  function toggleSound() {
    muted = !muted;
    localStorage.setItem('neoSnakeMutedMobile', muted ? '1' : '0');
    updateSoundIcons();
    if (!muted) {
        ensureAudio();
        SFX.menuClick();
    }
  }
  document.querySelectorAll('.soundBtn').forEach(btn => btn.addEventListener('click', toggleSound));

  function ensureAudio(){ if(!audioCtx) audioCtx=new (window.AudioContext||window.webkitAudioContext)(); }
  function tone(freq,dur,{type='square',gain=0.06,attack=0.004,release=0.06,sweep=0}={}){
    if(muted) return; try{
      ensureAudio(); const now=audioCtx.currentTime;
      const o=audioCtx.createOscillator(); const g=audioCtx.createGain();
      o.type=type; o.frequency.value=freq;
      if(sweep){ o.frequency.linearRampToValueAtTime(freq*(1+sweep), now+dur); }
      g.gain.value=0; g.gain.linearRampToValueAtTime(gain, now+attack);
      g.gain.linearRampToValueAtTime(0.0001, now+Math.max(dur-0.01,0)+release);
      o.connect(g).connect(audioCtx.destination); o.start(now); o.stop(now+dur+release+0.03);
    }catch(e){}
  }
  const SFX={
    eat(){ tone(720,0.08,{type:'square',gain:0.05}); },

  document.querySelectorAll('.turn-btn').forEach(btn => {
    const player = btn.dataset.player;
    const turnDir = btn.dataset.dir; // 'left' or 'right'

    const handlePress = (e) => {
        e.preventDefault();
        ensureAudio();
        if(!snakes || !snakes[player] || inCountdown || intermission || paused || !currentSpeedMode) return;
        
        const s = snakes[player];
        if (!s) return;

        // Determine the new direction based on the current direction and the turn
        const currentDir = s.dir;
        let nextDirKey;

        const dirRotation = ['up', 'right', 'down', 'left'];
        const currentIndex = dirRotation.indexOf(Object.keys(dirMap).find(key => dirMap[key].x === currentDir.x && dirMap[key].y === currentDir.y));

        let newIndex;
        if (player === 'p1') {
            newIndex = turnDir === 'left' 
                ? (currentIndex - 1 + 4) % 4 
                : (currentIndex + 1) % 4;
        } else { // Player 2's controls are now swapped
            newIndex = turnDir === 'left' 
                ? (currentIndex - 1 + 4) % 4 
                : (currentIndex + 1) % 4;
        }
        
        nextDirKey = dirRotation[newIndex];
        const d = dirMap[nextDirKey];

        if (!opposite(d, s.dir)) s.nextDir = d;
    };

    btn.addEventListener('touchstart', handlePress, { passive: false });
    btn.addEventListener('mousedown', handlePress, { passive: false }); // Also handle mouse for testing
  });

  /* === Helpers === */
  function rngCell(){
    if (currentWallMode === MOD_WALLS.SOLID) {
        return { x: 1 + (Math.random() * (GRID_COLS - 2)) | 0, y: 1 + (Math.random() * (GRID_ROWS - 2)) | 0 };
    }
    return { x:(Math.random()*GRID_COLS)|0, y:(Math.random()*GRID_ROWS)|0 }
  }
  function handleBoundaries(c) {
    let {x,y} = c;
    if (currentWallMode === MOD_WALLS.SOLID) {
        if (x < 0 || x >= GRID_COLS || y < 0 || y >= GRID_ROWS) return null;
    } else {
        if(x<0)x=GRID_COLS-1; else if(x>=GRID_COLS)x=0;
        if(y<0)y=GRID_ROWS-1; else if(y>=GRID_ROWS)y=0;
    }
    return {x,y};
  }
  
  async function countdown(n){
    inCountdown=true;
    roundCount++;
    const numColor = (roundCount % 2 !== 0) ? playerColors.p1 : playerColors.p2;
    const startColor = (roundCount % 2 !== 0) ? playerColors.p2 : playerColors.p1;

    for(let i=n;i>0;i--){
      showBanner(`<div class="countdown-text" style="color: ${numColor}; text-shadow: 0 0 8px ${numColor};">${i}</div>`, false);
      SFX.countdownTick();
      await new Promise(r=>setTimeout(r,800));
    }
    showBanner(`<div class="countdown-text start" style="color: ${startColor}; text-shadow: 0 0 5px ${startColor};">${t('start')}</div>`, false); SFX.start();
    if (gameMode === '2P') {
        roundTimerEnd = performance.now() + ROUND_DURATION;
        timerEnded = false;
    }
    inCountdown=false; intermission=false;
    await new Promise(r=>setTimeout(r,1000));
    hideBanner();
  }

  function modLerp(prev, cur, cap, t){
    if (currentWallMode === MOD_WALLS.SOLID) return prev + (cur - prev) * t;
    let a=prev, b=cur, d=b-a;
    if(d>cap/2) a+=cap; else if(d<-cap/2) a-=cap;
    const v=a + (b-a)*t;
    let out=v%cap; if(out<0) out+=cap;
    return out;
  }
  function hexToRgba(hex, alpha=1.0){
    if(!hex) return `rgba(255,255,255,${alpha})`;
    let c = hex.replace('#','');
    if(c.length === 3) c = c[0]+c[0] + c[1]+c[1] + c[2]+c[2];
    const bigint = parseInt(c, 16);
    return `rgba(${(bigint >> 16) & 255},${(bigint >> 8) & 255},${bigint & 255},${alpha})`;
  }
  
  function varToCss(varName) {
    return getComputedStyle(document.documentElement).getPropertyValue(varName).trim();
  }

  function updateTimerUI(timeLeftMs){
    if (gameMode !== '2P') return;
    const label = document.getElementById('timeLabel');
    if (!label) return;
    let ms = Math.max(0, timeLeftMs);
    const secs = Math.ceil(ms/1000);
    if (secs <= 10 && secs > 0 && Math.ceil(lastTimeLeft/1000) > secs) SFX.countdownTick();
    lastTimeLeft = ms;
    const m = Math.floor(secs / 60), s = secs % 60;
    label.textContent = `${m.toString().padStart(2,'0')}:${s.toString().padStart(2,'0')}`;
    if (intermission) label.style.display = 'none';
  }

  function endRoundByTime(){
    if(!snakes || gameMode !== '2P') return;
    const l1 = snakes.p1.segments.length, l2 = snakes.p2.segments.length;
    if(l1 > l2) endGame('p1');
    else if(l2 > l1) endGame('p2');
    else endGame('draw');
  }

  /* === Core === */
  const dirMap={up:{x:0,y:-1},down:{x:0,y:1},left:{x:-1,y:0},right:{x:1,y:0}};
  function opposite(a,b){return a.x===-b.x&&a.y===-b.y;}
  function createSnake(start,dir){ const seg=[ start,{x:start.x-dir.x,y:start.y-dir.y},{x:start.x-2*dir.x,y:start.y-2*dir.y} ]; return { segments:seg, prev:seg.map(s=>({...s})), dir:{...dir}, nextDir:{...dir}, grow:0, powerEnd:0, flashUntil:0, flashColor:null, shakeUntil: 0, digestAnims: [] }; }
  function isPowered(s){ return s && performance.now()<s.powerEnd; }

  const ROUND_DURATION = 3 * 60 * 1000;
  const GAMES_TO_ROUND = 5;
  
  function speedMult(s){ return isPowered(s) ? 1.45 : 1.00; }

  function softReset(full=false, countdownNum = 3){
    if(full){
      games={p1:0,p2:0}; drawSeries();
      stats.p1Food = 0; stats.p2Food = 0; updateFoodCounters();
      roundCount = 0;
    }
    foods=[];
    normalFoodsEaten = 0;
    diamondActive = false;
    redFoodPresent = false;
    redBulkEndTime = 0;
    doubleActive = false;
    beastOwner = null;
    paused = false;
    intermission = true;
    timerEnded = false;
    deathAnim.active = false;
    winAnim.active = false;
    updateTimerUI(ROUND_DURATION);

    const y1 = Math.floor(GRID_ROWS * 0.25);
    const y2 = Math.floor(GRID_ROWS * 0.75);
    const x1 = Math.floor(GRID_COLS * 0.25);
    const x2 = Math.floor(GRID_COLS * 0.75);

    if(gameMode === '1P'){
      const startPos = {x:Math.floor(GRID_COLS/2), y:Math.floor(GRID_ROWS/2)};
      snakes = { p1: createSnake(startPos, dirMap.right) };
      stats.p1Food = 0;
    } else if (gameMode === '2P') {
      // Always create new snakes for every round reset
      snakes = {
        p1: createSnake({x:x1, y:y1}, dirMap.right),
        p2: createSnake({x:x2, y:y2}, dirMap.left)
      };
      if (full) {
        stats.p1Food = 0; stats.p2Food = 0;
      }
    }
    updateFoodCounters();
    updateUIVisibility();
    
    return new Promise(resolve => {
        countdown(countdownNum).then(resolve);
    });
  }

  function awardGame(who){ if(who==='p1') games.p1++; else if(who==='p2') games.p2++; drawSeries(); }

  function spawnFood(){
    const now = performance.now();
    if(redBulkEndTime && now < redBulkEndTime) return;
    if(doubleActive || diamondActive) return;

    if (beastOwner && !redFoodPresent) {
      spawnSpecialFood('heart');
      redFoodPresent = true;
      return;
    }

    // New food sequence based on normalFoodsEaten
    if (normalFoodsEaten > 0) {
      const step = normalFoodsEaten % 14 || 14; // 14'te reset
      switch (step) {
        case 4:
        case 8:
        case 11:
          if (!doubleActive) {
            spawnSpecialFood('double');
            return;
          }
          break;
        case 6:
          if (!diamondActive) {
            spawnSpecialFood('diamond');
            return;
          }
          break;
        case 12:
          if (!redFoodPresent) {
            spawnSpecialFood('heart');
            return;
          }
          break;
        case 13:
          if (!redFoodPresent) {
            spawnSpecialFood('heart');
            for (let i = 0; i < 8; i++) spawnNormal();
            return;
          }
          break;
      }
    }

    const normalCount = foods.filter(f => f.type === 'normal' && !f.pairId).length;
    if(normalCount < 1) spawnNormal();
  }
  function spawnNormal(){
    let tries=0, f; 
    const occ = new Set();
    if (snakes && snakes.p1) snakes.p1.segments.forEach(s => occ.add(s.x+','+s.y));
    if (snakes && snakes.p2) snakes.p2.segments.forEach(s => occ.add(s.x+','+s.y));
    foods.forEach(food => occ.add(food.x+','+food.y));
    do{ f=rngCell(); tries++; if(tries>800) return; }while(occ.has(f.x+','+f.y));
    foods.push({x:f.x, y:f.y, type:'normal', spawnAt:performance.now()});
  }
  function spawnSpecialFood(type, extra=false){
    let tries=0, f;
    const occ = new Set();
    if (snakes && snakes.p1) snakes.p1.segments.forEach(s => occ.add(s.x+','+s.y));
    if (snakes && snakes.p2) snakes.p2.segments.forEach(s => occ.add(s.x+','+s.y));
    foods.forEach(food => occ.add(food.x+','+food.y));
    
    do{ f=rngCell(); tries++; if(tries>800) return; }while(occ.has(f.x+','+f.y));
    
    if (type === 'diamond') {
        foods.push({ x:f.x, y:f.y, type:'diamond', spawnAt:performance.now(), relocateTime:performance.now()+3000 });
        diamondActive = true;
    } else if (type === 'heart') {
        foods.push({ x:f.x, y:f.y, type:'heart', spawnAt:performance.now(), extra:extra });
        if (!extra) redFoodPresent = true;
    } else if (type === 'double') {
        let f2;
        let tries2 = 0;
        do {
            f2 = rngCell();
            tries2++;
            if(tries2 > 100) { // Failsafe
                f2 = {x: (f.x + 1) % GRID_COLS, y: f.y};
                break;
            }
        } while(occ.has(f2.x+','+f2.y) || (f2.x === f.x && f2.y === f.y));

        const pairId = 'pair_' + performance.now();
        foods.push({ x:f.x, y:f.y, type:'double', spawnAt:performance.now(), pairId: pairId });
        foods.push({ x:f2.x, y:f2.y, type:'double', spawnAt:performance.now(), pairId: pairId });
        doubleActive = true;
    }
  }
  function spawnBulkNormals(count){
    for(let k=0;k<count;k++) spawnNormal();
  }
  function updateFoodCounters(){ 
      const p1s1p = document.getElementById('p1Score-1P');
      
      if (gameMode === '1P') {
          if(p1s1p && snakes && snakes.p1) {
              p1s1p.querySelector('.val-len').textContent = snakes.p1.segments.length;
              p1s1p.querySelector('.val-food').textContent = stats.p1Food;
          }
      } else {
          document.getElementById('p1ScoreP1').querySelector('.val').textContent = snakes ? (snakes.p1 ? snakes.p1.segments.length : 0) : 0;
          document.getElementById('p2ScoreP1').querySelector('.val').textContent = snakes ? (snakes.p2 ? snakes.p2.segments.length : 0) : 0;
          document.getElementById('p1ScoreP2').querySelector('.val').textContent = snakes ? (snakes.p1 ? snakes.p1.segments.length : 0) : 0;
          document.getElementById('p2ScoreP2').querySelector('.val').textContent = snakes ? (snakes.p2 ? snakes.p2.segments.length : 0) : 0;
      }
  }

  function eatFoodIfAny(s, ownerKey){
    for(let i=foods.length-1; i>=0; i--){
      const f=foods[i];
      if(s.segments[0].x===f.x && s.segments[0].y===f.y){
        if(f.type==='normal'){
          s.grow+=1; SFX.eat();
          if(ownerKey==='p1') stats.p1Food++; else stats.p2Food++;
          normalFoodsEaten++;
        } else if(f.type==='diamond'){
          s.grow += s.segments.length; SFX.diamond();
          if(ownerKey==='p1') stats.p1Food+=3; else stats.p2Food+=3;
          const otherKey = ownerKey === 'p1' ? 'p2' : 'p1';
          if (snakes[otherKey] && snakes[otherKey].segments.length > 3) {
              snakes[otherKey].segments.pop();
          }
          diamondActive = false;
          normalFoodsEaten++;
        } else if(f.type==='heart'){
          if (f.extra) {
              // extra heart
              if (beastOwner === ownerKey) {
                  s.powerEnd += 5000;
              } else {
                  if (beastOwner && snakes[beastOwner]) {
                      snakes[beastOwner].powerEnd = 0;
                  }
                  beastOwner = ownerKey;
                  s.powerEnd = performance.now() + 5000;
              }
              s.flashUntil = s.powerEnd;
              s.flashColor = varToCss('--heart');
              SFX.heart();
          } else {
              // normal heart
              beastOwner = ownerKey;
              s.powerEnd = performance.now() + 5000;
              s.flashUntil = s.powerEnd;
              s.flashColor = varToCss('--heart');
              SFX.heart();
              redFoodPresent = false;
              spawnSpecialFood('heart', true);
              spawnBulkNormals(8);
          }
        } else if (f.type === 'double') {
            s.grow += 1; SFX.eat();
            if(ownerKey==='p1') stats.p1Food++; else stats.p2Food++;
            normalFoodsEaten++; // Still counts as one normal food eaten
            // Remove the other paired food
            foods = foods.filter(food => food.pairId !== f.pairId);
            doubleActive = false;
            updateFoodCounters();
            spawnFood(); // Check if a new food should be spawned
            return; // Exit after eating one of the pair
        }
        foods.splice(i,1);
        updateFoodCounters();
      }
    }
  }

  function bodyAdvance(s, ownerKey){
    const head=s.segments[0];
    if(!opposite(s.nextDir,s.dir)) s.dir={...s.nextDir};
    const nextPos = {x:head.x+s.dir.x, y:head.y+s.dir.y};
    const nextHead = handleBoundaries(nextPos);
    s.prev = s.segments.map(c=>({...c}));
    if (!nextHead) { // Wall collision
        if (currentWallMode === MOD_WALLS.SOLID) {
            if (gameMode === '1P') {
                endGame('p1_death');
            } else {
                const otherPlayer = ownerKey === 'p1' ? 'p2' : 'p1';
                endGame(otherPlayer);
            }
            return false;
        }
    }
    s.segments.unshift(nextHead);
    if(s.grow>0) s.grow--; else s.segments.pop();
    return true;
  }

  function collideCheckDetailed(){
    if (!snakes) return { result: null };
    if (gameMode === '1P') {
        const s1 = snakes.p1;
        if (!s1 || s1.segments.length === 0) return { result: null };
        const head1 = s1.segments[0];
        const self1 = new Set(s1.segments.slice(1).map(c => c.x + ',' + c.y));
        const k1 = head1.x + ',' + head1.y;
        if (self1.has(k1)) return { result: 'p1_death' };
        return { result: null };
    }
    // 2P Logic
    const s1=snakes.p1, s2=snakes.p2;
    if (!s1 || !s2) return { result: null };
    const head1=s1.segments[0], head2=s2.segments[0];
    const intangible1 = isPowered(s1), intangible2 = isPowered(s2);
    
    const self1=new Set(s1.segments.slice(1).map(c=>c.x+','+c.y));
    const self2=new Set(s2.segments.slice(1).map(c=>c.x+','+c.y));
    const k1=head1.x+','+head1.y, k2=head2.x+','+head2.y;

    if(head1.x===head2.x && head1.y===head2.y){
      const l1=s1.segments.length, l2=s2.segments.length;
      if(l1>l2) return {result:'p1'};
      if(l2>l1) return {result:'p2'};
      return {result:'draw'};
    }

    let hit1 = self1.has(k1) || (!intangible1 && self2.has(k1));
    let hit2 = self2.has(k2) || (!intangible2 && self1.has(k2));

    if(hit1 && hit2) return {result:'draw'};
    if(hit1) return {result:'p2'};
    if(hit2) return {result:'p1'};
    return {result:null};
  }

  /* === Animations & Rendering === */
  let deathAnim = { active:false, loser:null, winner:null, nextAt:0, stepMs:0 };
  function startDeathAnim(loser, winner){
    const len = snakes && snakes[loser] ? snakes[loser].segments.length : 1;
    deathAnim = { active:true, loser, winner, nextAt:performance.now(), stepMs: len > 0 ? 500 / len : 40 };
    intermission = true; SFX.crash();
  }
  let winAnim = { active:false, winner:null, start:0, duration:2000, final:false };
  function startWinAnim(winner, final=false){
    winAnim = { active: true, winner, start: performance.now(), final, duration: final ? 5000 : 2000 };
    if(final) SFX.win(); else SFX.winRound();
  }

  function show1PGameOver() {
    intermission = true;
    paused = true;
    const finalScore = stats.p1Food;
    addHighScore('Player', finalScore);
    showBanner(`<h1>${t('gameOver')}</h1>
        <h2>${t('finalScore')}: <span style="color:var(--gold);">${finalScore}</span></h2>
        <button class="btn big" id="playAgainBtn" style="margin-top:12px;">${t('playAgain')}</button>
        <button class="btn" id="mainMenuBtn" style="margin-top:8px;">${t('mainMenu')}</button>`);
    document.getElementById('playAgainBtn').onclick = () => { SFX.menuClick(); softReset(true); };
    document.getElementById('mainMenuBtn').onclick = () => { SFX.menuClick(); openMainMenu(); };
  }

  function endGame(result){
    intermission = true;
    let winner = null, loser = null, isDraw = false;
    if(result === 'draw'){ isDraw = true; SFX.drawCrash(); }
    else if (result === 'p1') { winner = 'p1'; loser = 'p2'; }
    else if (result === 'p2') { winner = 'p2'; loser = 'p1'; }
    else { // 1P game over
        show1PGameOver();
        return;
    }
    
    if (winner) awardGame(winner);
    startDeathAnim(loser, winner);

    setTimeout(() => {
        deathAnim.active = false;
        const p1Wins = games.p1;
        const p2Wins = games.p2;

        if (p1Wins >= GAMES_TO_ROUND || p2Wins >= GAMES_TO_ROUND) {
            const matchWinner = p1Wins > p2Wins ? 'p1' : 'p2';
            startWinAnim(matchWinner, true);
            showBanner(`<h1>${t('win' + (matchWinner === 'p1' ? 'P1' : 'P2'))}</h1>
                <h2>${playerNames[matchWinner] || t(matchWinner === 'p1' ? 'p1' : 'p2')} ${t('winsTheMatch')}</h2>
                <button class="btn" id="playAgainBtn" style="margin-top:12px;">${t('playAgain')}</button>
                <button class="btn" id="mainMenuBtn" style="margin-top:8px;">${t('mainMenu')}</button>`);
            document.getElementById('playAgainBtn').onclick = () => { SFX.menuClick(); softReset(true); };
            document.getElementById('mainMenuBtn').onclick = () => { SFX.menuClick(); openMainMenu(); };
        } else {
            const roundWinner = isDraw ? null : winner;
            if (roundWinner) {
                startWinAnim(roundWinner, false);
                showBanner(`<h1>${t('win' + (roundWinner === 'p1' ? 'P1' : 'P2'))}</h1>
                    <h2>${p1Wins} - ${p2Wins}</h2>`);
            } else { // Draw
                showBanner(`<h1>${t('draw')}</h1><h2>${p1Wins} - ${p2Wins}</h2>`);
            }
            setTimeout(() => resetRound(), 2500);
        }
    }, 600);
  }
  async function resetRound(count=3){
    hideBanner();
    await softReset(false, count);
  }

  function drawGrid(){
    ctx.strokeStyle=varToCss('--grid'); ctx.lineWidth=1;
    for(let i=1;i<GRID_COLS;i++){ ctx.beginPath(); ctx.moveTo(i*canvas.width/dpr/GRID_COLS,0); ctx.lineTo(i*canvas.width/dpr/GRID_COLS,canvas.height/dpr); ctx.stroke(); }
    for(let i=1;i<GRID_ROWS;i++){ ctx.beginPath(); ctx.moveTo(0,i*canvas.height/dpr/GRID_ROWS); ctx.lineTo(canvas.width/dpr,i*canvas.height/dpr/GRID_ROWS); ctx.stroke(); }
    
    if (currentWallMode === MOD_WALLS.SOLID) {
        const szX=canvas.width/dpr/GRID_COLS, szY=canvas.height/dpr/GRID_ROWS;
        ctx.strokeStyle = '#c00'; ctx.lineWidth = 2;
        ctx.strokeRect(1, 1, canvas.width/dpr - 2, canvas.height/dpr - 2);
    }
  }
  function drawSnakeBlocks(s, ownerKey, alphaProgress){
    if(!s || s.segments.length === 0) return;
    const szX=canvas.width/dpr/GRID_COLS, szY=canvas.height/dpr/GRID_ROWS;
    const baseColor = playerColors[ownerKey];
    
    s.segments.forEach((seg,i)=>{
      const prevSeg = s.prev[i] || seg;
      const x = modLerp(prevSeg.x, seg.x, GRID_COLS, alphaProgress);
      const y = modLerp(prevSeg.y, seg.y, GRID_ROWS, alphaProgress);
      
      const isHead = i === 0;
      const now = performance.now();
      let color = baseColor;
      if (now < s.flashUntil) {
          const flashOn = Math.floor((s.flashUntil - now) / 100) % 2 === 0;
          color = flashOn ? s.flashColor : baseColor;
      }
      
      ctx.fillStyle = hexToRgba(color, 1.0);
      
      const offset = 1.5;
      const pixelSize = Math.min(szX, szY) - (offset * 2);
      
      ctx.fillRect(x*szX + offset, y*szY + offset, pixelSize, pixelSize);
      
    });
  }
  function drawFoods(){
    const szX=canvas.width/dpr/GRID_COLS, szY=canvas.height/dpr/GRID_ROWS;
    foods.forEach(f=>{
      const now = performance.now();
      const cx=(f.x+.5)*szX, cy=(f.y+.5)*szY;
      const r=Math.min(szX,szY)*0.34;
      ctx.save();
      ctx.globalCompositeOperation='screen';
      let haloRadius, base, innerColor;
      const glowAnim = 0.5 + (Math.sin(now / 200) + 1) / 4; // 0.5 to 1.0

      if(f.type === 'diamond'){
        haloRadius = r * 4.5 * glowAnim;
        base = `rgba(255,209,102,${0.7 * glowAnim})`;
        innerColor = '#ffd166';
      } else if(f.type === 'heart'){
        haloRadius = r * 4.2 * glowAnim;
        base = `rgba(255,23,68,${0.7 * glowAnim})`;
        innerColor = '#ff1744';
      } else { // normal food
        const normalGlowAnim = 0.7 + (Math.sin(now / 300) + 1) / 6;
        haloRadius = r * 2.8 * normalGlowAnim;
        base = `rgba(158,208,255,${0.3 * normalGlowAnim})`;
        innerColor = '#9ed0ff';
      }
      const halo=ctx.createRadialGradient(cx,cy,1,cx,cy,haloRadius);
      halo.addColorStop(0, base);
      halo.addColorStop(1, 'rgba(0,0,0,0)');
      ctx.fillStyle=halo; ctx.beginPath(); ctx.arc(cx,cy,haloRadius*0.75,0,Math.PI*2); ctx.fill();
      ctx.restore();
      ctx.beginPath();
      ctx.arc(cx,cy,r,0,Math.PI*2);
      ctx.fillStyle = innerColor;
      ctx.fill();
      ctx.save();
      ctx.globalCompositeOperation='lighter';
      ctx.beginPath();
      ctx.arc(cx,cy,r*0.75,0,Math.PI*2);
      ctx.fillStyle=`rgba(255,255,255,${0.55 * glowAnim})`;
      ctx.fill();
      ctx.restore();
    });
  }
  function render(alpha1, alpha2){
    ctx.clearRect(0,0,canvas.width/dpr,canvas.height/dpr);
    drawGrid();
    
    if(deathAnim.active){
      const l = snakes[deathAnim.loser];
      const w = snakes[deathAnim.winner];
      if(l) drawSnakeBlocks(l, deathAnim.loser, 1);
      if(w) drawSnakeBlocks(w, deathAnim.winner, 1);
    } else if (winAnim.active) {
        const s = snakes[winAnim.winner];
        if(s) drawSnakeBlocks(s, winAnim.winner, 1);
    } else if(snakes){
      if(snakes.p1) drawSnakeBlocks(snakes.p1, 'p1', alpha1);
      if(snakes.p2) drawSnakeBlocks(snakes.p2, 'p2', alpha2);
    }
    
    drawFoods();
  }

  /* === Loop === */
  function moveSnake(s, ownerKey) {
    if (!s) return;
    if (!bodyAdvance(s, ownerKey)) return;
    eatFoodIfAny(s, ownerKey);
    if (s.segments.length === 0) {
        const otherPlayer = ownerKey === 'p1' ? 'p2' : 'p1';
        endGame(otherPlayer);
    }
  }

  function step(time){
    if(!last) last = time;
    const delta = time - last;
    last = time;
    
    if(paused){ requestAnimationFrame(step); return; }

    // Check if beast mode has ended
    if (beastOwner && snakes[beastOwner] && !isPowered(snakes[beastOwner])) {
      beastOwner = null;
      redFoodPresent = false;
      foods = [];
      spawnNormal();
      normalFoodsEaten = 0;
    }

    if(!intermission && !inCountdown && snakes){
      const speed1 = BASE_TPS * MOD_SPEED[currentSpeedMode] * speedMult(snakes.p1);
      const speed2 = gameMode === '2P' ? BASE_TPS * MOD_SPEED[currentSpeedMode] * speedMult(snakes.p2) : 0;
      
      acc1 += delta;
      if(acc1 >= 1000/speed1){
        moveSnake(snakes.p1, 'p1');
        acc1 = 0;
      }
      
      if(gameMode === '2P'){
        acc2 += delta;
        if(acc2 >= 1000/speed2){
          moveSnake(snakes.p2, 'p2');
          acc2 = 0;
        }
      }
      
      const {result} = collideCheckDetailed();
      if(result) endGame(result);
      
      if(gameMode === '2P' && !timerEnded){
        const timeLeft = roundTimerEnd - performance.now();
        updateTimerUI(timeLeft);
        if(timeLeft <= 0){
          timerEnded = true;
          endRoundByTime();
        }
      }
      
      spawnFood();
      updateFoodCounters();
      
      // Handle diamond relocation
      foods.forEach(f => {
        if (f.type === 'diamond' && f.relocateTime && performance.now() > f.relocateTime) {
          let tries = 0, newPos;
          const occ = new Set();
          if (snakes && snakes.p1) snakes.p1.segments.forEach(s => occ.add(s.x + ',' + s.y));
          if (snakes && snakes.p2) snakes.p2.segments.forEach(s => occ.add(s.x + ',' + s.y));
          foods.forEach(food => { if (food !== f) occ.add(food.x + ',' + food.y); });
          do {
            newPos = rngCell();
            tries++;
            if (tries > 800) break;
          } while (occ.has(newPos.x + ',' + newPos.y));
          if (newPos) {
            f.x = newPos.x;
            f.y = newPos.y;
          }
          f.relocateTime += 3000;
        }
      });
      
      // Clean extra foods after beast mode ends
      if (redBulkEndTime && performance.now() > redBulkEndTime) {
          const normalFoods = foods.filter(f => f.type === 'normal');
          if (normalFoods.length > 1) {
              const keep = normalFoods[0];
              foods = foods.filter(f => f.type !== 'normal' || f === keep);
          }
          redBulkEndTime = 0;
      }
      
      foods = foods.filter(f => !f.expiryTime || performance.now() < f.expiryTime);
    }

    if(deathAnim.active && time > deathAnim.nextAt){
      const l = snakes[deathAnim.loser];
      if(l && l.segments.length > 0){
        l.segments.pop();
        deathAnim.nextAt = time + deathAnim.stepMs;
      } else {
        deathAnim.active = false;
      }
    }
    
    const alpha1 = acc1 / (1000 / (BASE_TPS * MOD_SPEED[currentSpeedMode] * speedMult(snakes ? snakes.p1 : null)));
    const alpha2 = gameMode === '2P' ? acc2 / (1000 / (BASE_TPS * MOD_SPEED[currentSpeedMode] * speedMult(snakes ? snakes.p2 : null))) : 0;
    render(alpha1, alpha2);
    requestAnimationFrame(step);
  }

  openMainMenu();
  applyLang();
  updateSoundIcons();
  requestAnimationFrame(step);
})();</script>
