<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>2 Player Snake - Beta v1.12 Mobile (v7)</title>
  
  <!-- iOS & Mobile Specific Meta Tags -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="2P Snake">

  <!-- Import fonts -->
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;900&family=VT323&display=swap" rel="stylesheet">
  
  <!-- Version: Beta v1.12 Mobile (v7) -->
  <style>
    :root{
      --bg:#0b0f14;
      --grid:#1a2537;
      --p1:#ff4fbf;
      --p2:#35e6e6;
      --gold:#ffd166;
      --heart:#ff1744;
      --ui-tile:#0c141f;
      --ui-tile-border:#1b2a41;
      --ui-tile-soft:#0f1a2a;
      --text:#e7f1ff;
      --muted:#9fb3d1;
      --safe-area-top: env(safe-area-inset-top, 0px);
      --safe-area-bottom: env(safe-area-inset-bottom, 0px);
    }
    *{box-sizing:border-box; -webkit-tap-highlight-color: transparent;}
    html,body{height:100%; width: 100%;}
    body{
      margin:0;background:var(--bg);color:var(--text);
      font-family:'Orbitron', sans-serif;
      overflow:hidden;
      text-transform: uppercase;
      display: flex;
      flex-direction: column;
      height: 100vh; /* Full viewport height */
      height: -webkit-fill-available; /* iOS Safari fix */
    }
    .banner p, .banner .small-text { text-transform: none; }
    #instructionsContainer, #developersContainer, #highscoreContainer { text-transform: none; }

    #p2-controls, #p1-controls {
        height: 22vh; /* Increased height */
        min-height: 160px;
        width: 100%;
        background: var(--ui-tile);
        flex-shrink: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        position: relative;
    }
    #p2-controls { 
        padding-top: var(--safe-area-top);
        border-bottom: 1px solid var(--ui-tile-border);
    }
    #p1-controls { 
        padding-bottom: var(--safe-area-bottom);
        border-top: 1px solid var(--ui-tile-border);
    }

    #stage{
        flex-grow: 1;
        position:relative;
        width: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
    }
    #canvasWrap{
      position:relative;
      width: 100%;
      height: 100%;
      box-shadow: inset 0 0 0 1px #1a2636;
      background:#09101a;
    }
    canvas{
      width:100%;height:100%;display:block;
      background:radial-gradient(ellipse at center, #122034 0%, #0b121c 60%, #081018 85%, #050a10 100%);
    }
    #canvasWrap.shake { animation: shake-anim 0.1s 2; }
    @keyframes shake-anim {
        0%, 100% { transform: translateX(0); }
        25% { transform: translateX(-4px); }
        75% { transform: translateX(4px); }
    }
    #canvasWrap::before{
      content:"";position:absolute;inset:0;
      background:linear-gradient(transparent,rgba(0,0,0,.35)),
                 repeating-linear-gradient(180deg,#0000 0 2px,#0003 2px 3px);
      mix-blend-mode:multiply;pointer-events:none
    }

    .overlay{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none;z-index:6}
    .banner{
      pointer-events:auto;min-width:300px;max-width:90%;text-align:center;
      transform:translateY(10px) scale(.96);opacity:0;transition:all .45s cubic-bezier(.2,.8,.2,1);
    }
    .banner.show{transform:translateY(0) scale(1);opacity:1}
    .banner.padded {
      padding:18px 22px;border-radius:18px;
      background:linear-gradient(180deg,#0d1624ee,#0a111de0);
      border:1px solid #1b2a41;box-shadow:0 16px 50px #0009;
    }
    .banner h1{margin:0 0 10px;font-size:clamp(32px, 9vw, 64px);letter-spacing:1px; line-height: 1.1;}
    .banner h2{margin:0 0 15px;font-size:clamp(18px, 4vw, 24px); opacity: 0.9;}
    .banner p{margin:0;opacity:.9;font-size:14px}
    .banner .p1{color:var(--p1)} .banner .p2{color:var(--p2)} .banner .draw{color:#9ed0ff}
    .btn{
        background:var(--ui-tile-soft); border:1px solid var(--ui-tile-border); color:var(--text);
        padding:10px 16px; border-radius:8px; font-family:'Orbitron',sans-serif;
        text-transform:uppercase; cursor:pointer; transition:all .1s;
        display: block; width: 100%;
    }
    .btn:not(:last-child) { margin-bottom: 10px; }
    .btn.big{padding:14px 18px;font-size:16px}
    .btn:hover{filter:brightness(1.08)}

    /* D-Pad Controls - Redesigned for better touch area */
    .d-pad-container {
        position: relative;
        width: 24vh; /* Even larger size */
        height: 24vh;
        min-width: 180px;
        min-height: 180px;
        max-width: 260px;
        max-height: 260px;
    }
    #p2-controls .d-pad-container {
        transform: rotate(180deg);
    }
    .d-pad-btn {
        position: absolute;
        background-color: var(--ui-tile-soft);
        border: 1px solid var(--ui-tile-border);
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        transition: background-color 0.1s;
        border-radius: 16px;
    }
    .d-pad-btn:active {
        background-color: #2a3f5d;
    }
    /* New layout with center gap - more space */
    .d-pad-btn.up    { top: 0; left: 38%; right: 38%; height: 42%; }
    .d-pad-btn.down  { bottom: 0; left: 38%; right: 38%; height: 42%; }
    .d-pad-btn.left  { left: 0; top: 30%; bottom: 30%; width: 38%; }
    .d-pad-btn.right { right: 0; top: 30%; bottom: 30%; width: 38%; }
    
    .d-pad-btn svg {
        width: 65%;
        height: 65%;
        max-width: 40px; /* Larger icon */
        max-height: 40px;
        fill: var(--text);
        opacity: 0.7;
    }
    /* No longer needed, container rotation is sufficient */
    /* #p2-controls .d-pad-btn svg {
        transform: rotate(180deg);
    } */

    /* Mobile UI Buttons */
    .mobile-ui-buttons {
        position: absolute;
        top: 15px;
        left: 15px;
        display: flex;
        flex-direction: column;
        gap: 12px; /* More spacing */
    }
    #p2-controls .mobile-ui-buttons {
        left: auto;
        right: 15px; /* Mirrored for P2 */
        transform: rotate(180deg);
    }
    .mobile-ui-btn {
        width: 65px; /* Even larger buttons */
        height: 65px;
        background: var(--ui-tile-soft);
        border: 1px solid var(--ui-tile-border);
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
    }
    .mobile-ui-btn:active {
        background-color: #2a3f5d;
    }
    .mobile-ui-btn svg {
        width: 35px; /* Larger icons */
        height: 35px;
        fill: var(--text);
        opacity: 0.8;
    }

    /* Score Display Area */
    .ui-score-display {
        position: absolute;
        top: 50%;
        right: 20px;
        transform: translateY(-50%);
        display: flex;
        flex-direction: column;
        align-items: flex-end;
        gap: 8px;
        pointer-events: none;
    }
    
    #p2-controls .ui-score-display {
        right: auto;
        left: 20px;
        align-items: flex-start;
        transform: translateY(-50%) rotate(180deg);
    }

    /* Center Info Area */
    .center-info {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 4px;
        pointer-events: none;
    }
    .series-mobile {
        display: none; /* Hide center series display */
        gap: 8px;
    }
    .dot {
        width: 12px; height: 12px; border-radius: 50%;
        background: #263449; box-shadow: inset 0 0 0 1px #162131;
    }
    .dot.win-p1 {
        background: radial-gradient(circle at 30% 30%, #fff, var(--p1) 55%, #300b22 140%);
        box-shadow: 0 0 6px var(--p1), inset 0 0 2px #fff6;
    }
    .dot.win-p2 {
        background: radial-gradient(circle at 30% 30%, #fff, var(--p2) 55%, #083033 140%);
        box-shadow: 0 0 6px var(--p2), inset 0 0 2px #fff6;
    }
    #timeLabel {
        display: none; /* Hide timer */
        font-family: 'VT323', monospace;
        font-size: 28px;
        color: var(--white);
        background: #0b1420a0;
        padding: 2px 8px;
        border-radius: 6px;
    }
    .player-scores {
        font-size: 18px; /* Larger font */
        text-align: right;
        line-height: 1.3;
    }
    #p2-controls .player-scores {
        text-align: right; /* Keep text alignment consistent */
    }
    .player-scores .val { font-weight: bold; }
    #p1Score .val { color: var(--p1); }
    #p2Score .val { color: var(--p2); }
    #p1Score-1P .val-len { color: var(--p1); }
    #p1Score-1P .val-food { color: var(--gold); }

    /* Series score display in corners */
    .series-corner {
        position: absolute;
        bottom: 15px;
        right: 20px;
        display: flex;
        gap: 6px;
    }
    #p2-controls .series-corner {
        bottom: auto;
        top: 15px;
        left: 20px; /* Mirrored for P2 */
        right: auto;
        flex-direction: row-reverse; /* P2's score reads left-to-right */
    }


    /* Countdown banner style */
    .countdown-text {
        font-family: 'Orbitron', sans-serif;
        font-size: 120px;
        font-weight: 900;
        text-shadow: 0 0 2px #fff, 0 0 8px var(--p1);
        animation: countdown-anim 0.5s cubic-bezier(.25,1.5,.5,1) forwards;
        transform: scale(0.5);
        opacity: 0;
    }
    @keyframes countdown-anim { to { transform: scale(1); opacity: 1; } }
    .countdown-text.start {
        font-size: 80px;
        text-shadow: 0 0 5px var(--gold), 0 0 10px var(--p1);
    }
    
    /* Hide elements not used in mobile */
    #version-info, #langBtn, #resetBtn, #highscoreBtn, #menuBtn, footer { display: none !important; }
  </style>
</head>

(()=>{
  /* ==========================================
    2 Player Snake - Beta v1.12 Mobile (v7)
    ========================================== */

  const VERSION = 'Beta v1.12 Mobile (v7)';

  /* === i18n (trimmed for brevity, full list in logic) === */

  ];

  let playerNames = { p1: '', p2: '' };
  function updatePlayerColors(p1_hex, p2_hex) {
    document.documentElement.style.setProperty('--p1', p1_hex);
    if (p2_hex) document.documentElement.style.setProperty('--p2', p2_hex);
    playerColors.p1 = p1_hex;
    if (p2_hex) playerColors.p2 = p2_hex;

  /* === Canvas === */
  const canvas=document.getElementById('game');
  const canvasWrap = document.getElementById('canvasWrap');

  let GRID_COLS=34, GRID_ROWS=48; // Mobile-friendly grid
  const BASE_TPS=14.2;
  let dpr=Math.max(1,Math.min(2,window.devicePixelRatio||1));
  function resize(){

    if (r.width === 0 || r.height === 0) return; // Safeguard against zero-size container
    canvas.width=Math.floor(r.width*dpr); canvas.height=Math.floor(r.height*dpr);
    ctx.setTransform(dpr,0,0,dpr,0,0);
    // Adjust grid to aspect ratio
    const aspectRatio = r.width / r.height;
    GRID_ROWS = Math.round(GRID_COLS / aspectRatio);
    if (GRID_ROWS % 2 !== 0) GRID_ROWS++; // Ensure even number of rows for symmetry
  }

  function tone(freq,dur,{type='square',gain=0.06,attack=0.004,release=0.06,sweep=0}={}){
    if(muted||!audioCtx) return;
    const osc=audioCtx.createOscillator(), g=audioCtx.createGain();
    osc.type=type; osc.frequency.setValueAtTime(freq, 0);
    if(sweep){ osc.frequency.linearRampToValueAtTime(freq*(1+sweep), 0+dur); }
    g.gain.setValueAtTime(0, 0);
    g.gain.linearRampToValueAtTime(gain, attack);
    g.gain.linearRampToValueAtTime(0.0001, Math.max(dur-0.01,0)+release);
    osc.connect(g).connect(audioCtx.destination); osc.start(0); osc.stop(0+dur);
  }

  /* === Helpers === */
  function rngCell(){
    if (currentWallMode === MOD_WALLS.SOLID) {
        return { x: 1 + (Math.random() * (GRID_COLS - 2)) | 0, y: 1 + (Math.random() * (GRID_ROWS - 2)) | 0 };
    }
    return { x:(Math.random()*GRID_COLS)|0, y:(Math.random()*GRID_ROWS)|0 }
  }
  function handleBoundaries(c) {
    let {x,y} = c;
    if (currentWallMode === MOD_WALLS.SOLID) {
        if (x < 0 || x >= GRID_COLS || y < 0 || y >= GRID_ROWS) return null;
    } else {
        if(x<0)x=GRID_COLS-1; else if(x>=GRID_COLS)x=0;
        if(y<0)y=GRID_ROWS-1; else if(y>=GRID_ROWS)y=0;
    }
    return {x,y};
  }
  
  async function countdown(n){
    inCountdown=true;
    roundCount++;
    const numColor = (roundCount % 2 !== 0) ? playerColors.p1 : playerColors.p2;
    const startColor = (roundCount % 2 !== 0) ? playerColors.p2 : playerColors.p1;

    for(let i=n;i>0;i--){
      showBanner(`<div class="countdown-text" style="color: ${numColor}; text-shadow: 0 0 8px ${numColor};">${i}</div>`, false);

    if (gameMode === '2P') {
        roundTimerEnd = performance.now() + ROUND_DURATION;
        timerEnded = false;
    }
    inCountdown=false; intermission=false;
    await new Promise(r=>setTimeout(r,1000));
    hideBanner();
  }

  function modLerp(prev, cur, cap, t){
    if (currentWallMode === MOD_WALLS.SOLID) return prev + (cur - prev) * t;
    let a=prev, b=cur, d=b-a;
    if(d>cap/2) a+=cap; else if(d<-cap/2) a-=cap;
    const v=a + (b-a)*t;
    let out=v%cap; if(out<0) out+=cap;
    return out;
  }
  function hexToRgba(hex, alpha=1.0){
    if(!hex) return `rgba(255,255,255,${alpha})`;
    let c = hex.replace('#','');
    if(c.length === 3) c = c[0]+c[0] + c[1]+c[1] + c[2]+c[2];
    const bigint = parseInt(c, 16);
    return `rgba(${(bigint >> 16) & 255},${(bigint >> 8) & 255},${bigint & 255},${alpha})`;
  }

  function updateTimerUI(timeLeftMs){

    lastTimeLeft = ms;
    const m = Math.floor(secs / 60), s = secs % 60;
    label.textContent = `${m.toString().padStart(2,'0')}:${s.toString().padStart(2,'0')}`;
    if (intermission) label.style.display = 'none';
  }

  function endRoundByTime(){
    if(!snakes || gameMode !== '2P') return;
    const l1 = snakes.p1.segments.length, l2 = snakes.p2.segments.length;
    if(l1 > l2) endGame('p1');
    else if(l2 > l1) endGame('p2');
    else endGame('draw');
  }

  /* === Core === */
  const dirMap={up:{x:0,y:-1},down:{x:0,y:1},left:{x:-1,y:0},right:{x:1,y:0}};
  function opposite(a,b){return a.x===-b.x&&a.y===-b.y;}
  function createSnake(start,dir){ const seg=[ start,{x:start.x-dir.x,y:start.y-dir.y},{x:start.x-2*dir.x,y:start.y-2*dir.y} ]; return { segments:seg, prev:seg.map(s=>({...s})), dir:{...dir}, nextDir:{...dir}, grow:0, powerEnd:0, flashUntil:0, flashColor:null, shakeUntil: 0, digestAnims: [] }; }
  function isPowered(s){ return s && performance.now()<s.powerEnd; }

  const ROUND_DURATION = 3 * 60 * 1000;
  const GAMES_TO_ROUND = 5;
  
  function speedMult(s){ return isPowered(s) ? 1.45 : 1.00; }

  function softReset(full=false, countdownNum = 3){
    const midX=(GRID_COLS/2)|0, midY=(GRID_ROWS/2)|0;
    if (gameMode === '1P') {
        snakes = { p1: createSnake({x: midX, y: midY + 10}, dirMap.up), p2: null };
    } else {
        snakes={ p1:createSnake({x:midX, y:midY+10}, dirMap.up), p2:createSnake({x:midX, y:midY-10}, dirMap.down) };
    }
    foods.length=0; acc1=0; acc2=0; redBulkEndTime=0; normalFoodsEaten=0;
    diamondActive=false; redFoodPresent=false; doubleActive=false; beastOwner=null;
    if(full){ games={p1:0,p2:0}; drawSeries(); roundCount = 0; }
    stats.p1Food=0; stats.p2Food=0; updateFoodCounters();
    spawnFood();
    if (gameMode === '2P') { timerEnded = true; updateTimerUI(ROUND_DURATION); }
    paused = false;
    countdown(countdownNum);
  }

  function awardGame(who){ if(who==='p1') games.p1++; else if(who==='p2') games.p2++; drawSeries(); }

  function spawnFood(){
    const now = performance.now();
    if(redBulkEndTime && now < redBulkEndTime) return;
    if(doubleActive || diamondActive) return;
    const normalCount = foods.filter(f => f.type === 'normal' && !f.pairId).length;
    if(normalCount < 1) spawnNormal();
  }
  function spawnNormal(){
    let tries=0, f; 
    const occ = new Set();
    if (snakes.p1) snakes.p1.segments.forEach(s => occ.add(s.x+','+s.y));
    if (snakes.p2) snakes.p2.segments.forEach(s => occ.add(s.x+','+s.y));
    foods.forEach(food => occ.add(food.x+','+food.y));
    do{ f=rngCell(); tries++; if(tries>800) return; }while(occ.has(f.x+','+f.y));
    foods.push({x:f.x, y:f.y, type:'normal', spawnAt:performance.now()});
  }
  function spawnSpecialFood(type, extra=false){
    let tries=0, f;
    const occ = new Set();
    if (snakes.p1) snakes.p1.segments.forEach(s => occ.add(s.x+','+s.y));
    if (snakes.p2) snakes.p2.segments.forEach(s => occ.add(s.x+','+s.y));
    foods.forEach(food => occ.add(food.x+','+food.y));
    do{ f=rngCell(); tries++; if(tries>800) return; }while(occ.has(f.x+','+f.y));
    
    if (type === 'diamond') {
        diamondActive = true;
        foods = foods.filter(item => item.type !== 'normal' || item.pairId);
        foods.push({ x:f.x, y:f.y, type:'diamond', spawnAt:performance.now(), expiryTime:performance.now()+3000 });
    } else if (type === 'heart') {
        redFoodPresent = true;
        foods.push({ x:f.x, y:f.y, type:'heart', spawnAt:performance.now(), extra:extra });
    } else if (type === 'double') {
        doubleActive = true;
        foods = foods.filter(item => item.type !== 'normal' || item.pairId);
        const pairId = Date.now();
        foods.push({x:f.x, y:f.y, type:'normal', pairId:pairId, spawnAt:performance.now()});
        // Spawn second of pair
        let f2;
        do{ f2=rngCell(); tries++; if(tries>800) return; }while(occ.has(f2.x+','+f2.y) || (f2.x === f.x && f2.y === f.y));
        foods.push({x:f2.x, y:f2.y, type:'normal', pairId:pairId, spawnAt:performance.now()});
    }
  }
  function spawnBulkNormals(count){
    for(let k=0;k<count;k++) spawnNormal();
  }
  function updateFoodCounters(){ 
      const p1s1p = document.getElementById('p1Score-1P');
      
      if (gameMode === '1P') {
          if (p1s1p) {
            p1s1p.querySelector('.val-food').textContent = stats.p1Food; 
            if (snakes && snakes.p1) {
              p1s1p.querySelector('.val-len').textContent = snakes.p1.segments.length;
            }
          }
      } else {
          document.getElementById('p1ScoreP1').querySelector('.val').textContent = stats.p1Food;
          document.getElementById('p2ScoreP1').querySelector('.val').textContent = stats.p2Food;
          document.getElementById('p1ScoreP2').querySelector('.val').textContent = stats.p1Food;
          document.getElementById('p2ScoreP2').querySelector('.val').textContent = stats.p2Food;
      }
  }

  function eatFoodIfAny(s, ownerKey){
    for(let i=foods.length-1; i>=0; i--){
      const f=foods[i];
      if(f.x===s.segments[0].x && f.y===s.segments[0].y){
        s.digestAnims.push({ startTime: performance.now(), color: f.type === 'normal' ? playerColors[ownerKey] : (f.type === 'diamond' ? '#ffd166' : '#ff1744') });
        foods.splice(i,1);
        if(f.pairId){ foods = foods.filter(food => !food.pairId || food.pairId !== f.pairId); doubleActive = false; }
        const now = performance.now();
        if(f.type==='diamond'){
          s.grow += 3;
          if (gameMode === '2P') {
              const other = snakes[ownerKey === 'p1' ? 'p2' : 'p1'];
              if(other.segments.length > 1){ other.segments.pop(); }
              if(other.segments.length <= 0){ endGame(ownerKey); return; }
          }
          SFX.diamond(); s.flashUntil = now + 400; s.flashColor = '#ffd166'; diamondActive = false;
        } else if(f.type==='heart'){
          s.grow += 1; SFX.heart();
          s.powerEnd = now + 5000; beastOwner = ownerKey; redFoodPresent = false;
          if(!f.extra){
            foods.length = 0; diamondActive = false; doubleActive = false;
            redBulkEndTime = now + 5000;
            spawnBulkNormals(10);
            spawnSpecialFood('heart', true);
          }
        } else { // Normal food
          s.grow += (gameMode === '1P' ? 2 : 1);
          normalFoodsEaten++; SFX.eat();
        }
        if(ownerKey==='p1') stats.p1Food++; else stats.p2Food++;
        updateFoodCounters();
        if(f.type==='normal'){
          if(normalFoodsEaten % 10 === 0 && !redFoodPresent && !(redBulkEndTime && now < redBulkEndTime)) spawnSpecialFood('heart', false);
          else if(normalFoodsEaten % 5 === 0 && !diamondActive && !redFoodPresent && !(redBulkEndTime && now < redBulkEndTime)) spawnSpecialFood('diamond');
          else if(normalFoodsEaten % 3 === 0 && !doubleActive && !diamondActive && !(redBulkEndTime && now < redBulkEndTime)) spawnSpecialFood('double');
        }
        spawnFood();
        return;
      }
    }
  }

  function bodyAdvance(s, ownerKey){
    const head=s.segments[0];
    if(!opposite(s.nextDir,s.dir)) s.dir={...s.nextDir};
    const nextPos = {x:head.x+s.dir.x, y:head.y+s.dir.y};
    const nextHead = handleBoundaries(nextPos);
    s.prev = s.segments.map(c=>({...c}));
    if (!nextHead) {
        startDeathAnim(ownerKey, gameMode === '1P' ? null : (ownerKey === 'p1' ? 'p2' : 'p1'));
        return false;
    }
    s.segments.unshift(nextHead);
    if(s.grow>0) s.grow--; else s.segments.pop();
    return true;
  }

  function collideCheckDetailed(){
    if (gameMode === '1P') {
        const s1 = snakes.p1;
        const head1 = s1.segments[0];
        const self1 = new Set(s1.segments.slice(1).map(c => c.x + ',' + c.y));
        if (self1.has(head1.x + ',' + head1.y)) return { result: 'p1_self' };
        return { result: null };
    }
    // 2P Logic
    const s1=snakes.p1, s2=snakes.p2;
    const head1=s1.segments[0], head2=s2.segments[0];
    const intangible1 = isPowered(s1), intangible2 = isPowered(s2);
    if(head1.x===head2.x && head1.y===head2.y){
      if(intangible1 && !intangible2) return {result:'p1'};
      if(intangible2 && !intangible1) return {result:'p2'};
      return {result:'draw'};
    }
    const self1=new Set(s1.segments.slice(1).map(c=>c.x+','+c.y));
    const self2=new Set(s2.segments.slice(1).map(c=>c.x+','+c.y));
    const k1=head1.x+','+head1.y, k2=head2.x+','+head2.y;
    if(intangible1 || intangible2) { // Simplified powerup logic
        if(intangible1 && self2.has(k1)) return {result:'p1'};
        if(intangible2 && self1.has(k2)) return {result:'p2'};
        if(self1.has(k1)) return {result:'p2'};
        if(self2.has(k2)) return {result:'p1'};
        return {result:null};
    }
    const hit1 = self1.has(k1) || self2.has(k1);
    const hit2 = self2.has(k2) || self1.has(k2);
    if(hit1 && hit2) return {result:'draw'};
    if(hit1) return {result:'p2'};
    if(hit2) return {result:'p1'};
    return {result:null};
  }

  /* === Animations & Rendering === */
  let deathAnim = { active:false, loser:null, winner:null, nextAt:0, stepMs:0 };
  function startDeathAnim(loser, winner){
    const len = snakes && snakes[loser] ? snakes[loser].segments.length : 1;
    deathAnim = { active:true, loser, winner, nextAt:performance.now(), stepMs: len > 0 ? 500 / len : 40 };
    intermission = true; SFX.crash();
  }
  let winAnim = { active:false, winner:null, start:0, duration:2000, final:false };
  function startWinAnim(winner, final=false){
    winAnim = { active: true, winner, start: performance.now(), final, duration: final ? 5000 : 2000 };
    if(final) SFX.win(); else SFX.winRound();
    intermission = true; foods.length = 0;
    const col = playerColors[winner];
    showBanner(`<h1 style="color:${col}; text-shadow: 0 0 8px ${col};">${winner === 'p1' ? t('winP1') : t('winP2')}</h1>`);
  }

  function show1PGameOver() {
    intermission = true;
    const finalFood = stats.p1Food;
    addHighScore(t('p1'), finalFood);
    const finalLength = snakes.p1.segments.length;
    showBanner(`<h1>${t('gameOver')}</h1>
        <div style="margin: 12px 0; font-size: 16px; text-transform: none;">
            <p>${t('snakeLength')}: <span style="color: var(--p1);">${finalLength}</span></p>
            <p>${t('foodEaten')}: <span style="color: var(--gold);">${finalFood}</span></p>
        </div>
        <button class="btn big" id="playAgainBtn">${t('playAgain')}</button>
        <button class="btn" id="mainMenuBtn" style="margin-top: 8px;">${t('mainMenu')}</button>`);
    document.getElementById('playAgainBtn').onclick = () => { SFX.menuClick(); softReset(true); };
    document.getElementById('mainMenuBtn').onclick = () => { SFX.menuClick(); openMainMenu(); };
  }

  function endGame(result){
    if (gameMode === '1P') {
        if (result === 'p1_self') {
            intermission = true; SFX.crash();
            if (snakes.p1) snakes.p1.shakeUntil = performance.now() + 200;
            canvasWrap.classList.add('shake');
            setTimeout(() => { canvasWrap.classList.remove('shake'); show1PGameOver(); }, 400);
        }
        return;
    }
    // 2P Logic
    if(result==='p1' || result==='p2'){
      addHighScore(t('p1'), stats.p1Food); addHighScore(t('p2'), stats.p2Food);
      awardGame(result); hideBanner();
      startWinAnim(result, games[result] >= GAMES_TO_ROUND);
    } else { // Draw
      intermission = true; showBanner(`<h1>${t('draw')}</h1>`); SFX.drawCrash();
      const now = performance.now();
      if(snakes.p1) snakes.p1.shakeUntil = now + 200;
      if(snakes.p2) snakes.p2.shakeUntil = now + 200;
      canvasWrap.classList.add('shake');
      setTimeout(()=>{ canvasWrap.classList.remove('shake'); hideBanner(); resetRound(3); }, 1300);
    }
  }
  async function resetRound(count=3){
    const midX=(GRID_COLS/2)|0, midY=(GRID_ROWS/2)|0;
    stats.p1Food=0; stats.p2Food=0; updateFoodCounters();
    snakes={ p1:createSnake({x:midX, y:midY+10}, dirMap.up), p2:createSnake({x:midX, y:midY-10}, dirMap.down) };
    foods.length=0; acc1=0; acc2=0; redBulkEndTime=0; normalFoodsEaten=0;
    diamondActive=false; redFoodPresent=false; doubleActive=false; beastOwner=null;
    deathAnim.active=false; spawnFood();
    timerEnded = true; updateTimerUI(ROUND_DURATION);
    await countdown(count);
  }

  function drawGrid(){
    const w=canvas.width/dpr, h=canvas.height/dpr;
    const sW=w/GRID_COLS, sH=h/GRID_ROWS;
    ctx.strokeStyle = getComputedStyle(document.documentElement).getPropertyValue('--grid');
    ctx.lineWidth=1/dpr;
    ctx.beginPath();
    for(let i=1;i<GRID_COLS;i++){ ctx.moveTo(i*sW,0); ctx.lineTo(i*sW,h); }
    for(let i=1;i<GRID_ROWS;i++){ ctx.moveTo(0,i*sH); ctx.lineTo(w,i*sH); }
    ctx.globalAlpha=0.2; ctx.stroke(); ctx.globalAlpha=1;
  }
  function drawSnakeBlocks(s, ownerKey, alphaProgress){
    if(!s) return;
    const w=canvas.width/dpr, h=canvas.height/dpr;
    const sW=w/GRID_COLS, sH=h/GRID_ROWS;
    ctx.fillStyle = getComputedStyle(document.documentElement).getPropertyValue('--' + ownerKey);
    
    const now = performance.now();
    let baseAlpha = 1.0;
    if (s.flashUntil > now) {
        baseAlpha = (now - (s.flashUntil - 400)) % 200 > 100 ? 0.5 : 1.0;
    }
    ctx.globalAlpha = baseAlpha;

    for(let i=0; i<s.segments.length; i++){
      const seg = s.segments[i];
      const prev = s.prev[i] || seg;
      const x=modLerp(prev.x, seg.x, GRID_COLS, alphaProgress); 
      const y=modLerp(prev.y, seg.y, GRID_ROWS, alphaProgress); 
      const cx=(x+.5)*sW, cy=(y+.5)*sH;
      const size=Math.min(sW,sH)*0.85;
      const left=cx-size/2, top=cy-size/2;
      ctx.fillRect(left, top, size, size);
    }

    // Draw digestion animations
    for (let i = s.digestAnims.length - 1; i >= 0; i--) {
        const anim = s.digestAnims[i];
        const elapsed = now - anim.startTime;
        if (elapsed > 500) {
            s.digestAnims.splice(i, 1);
            continue;
        }
        const progress = elapsed / 500;
        const head = s.segments[0];
        const prevHead = s.prev[0] || head;
        const x = modLerp(prevHead.x, head.x, GRID_COLS, alphaProgress);
        const y = modLerp(prevHead.y, head.y, GRID_ROWS, alphaProgress);
        const cx = (x + .5) * sW, cy = (y + .5) * sH;
        const radius = (Math.min(sW, sH) * 0.5) * (1 + progress * 1.5);
        ctx.beginPath();
        ctx.arc(cx, cy, radius, 0, Math.PI * 2);
        ctx.fillStyle = hexToRgba(anim.color, 1 - progress);
        ctx.fill();
    }
    ctx.globalAlpha = 1.0;
  }
  function drawFoods(){
    const w=canvas.width/dpr,h=canvas.height/dpr,cw=w/GRID_COLS,ch=h/GRID_ROWS;
    for(const f of foods){
      const cx=(f.x+.5)*cw, cy=(f.y+.5)*ch;
      const r=Math.min(cw,ch)*0.38;
      ctx.save();
      ctx.globalCompositeOperation='screen';
      const glowAnim = 0.5 + (Math.sin(performance.now() / 200) + 1) / 4;
      let haloRadius, base, innerColor;
      if(f.type === 'diamond'){ haloRadius = r * 4.5 * glowAnim; base = `rgba(255,209,102,${0.7 * glowAnim})`; innerColor = '#ffd166'; } 
      else if(f.type === 'heart'){ haloRadius = r * 4.2 * glowAnim; base = `rgba(255,23,68,${0.7 * glowAnim})`; innerColor = '#ff1744'; } 
      else { haloRadius = r * 2.8 * glowAnim; base = `rgba(158,208,255,${0.3 * glowAnim})`; innerColor = '#9ed0ff'; }
      const halo=ctx.createRadialGradient(cx,cy,1,cx,cy,haloRadius);
      halo.addColorStop(0, base); halo.addColorStop(1, 'rgba(0,0,0,0)');
      ctx.fillStyle=halo; ctx.beginPath(); ctx.arc(cx,cy,haloRadius*0.75,0,Math.PI*2); ctx.fill();
      ctx.restore();
      ctx.beginPath(); ctx.arc(cx,cy,r,0,Math.PI*2); ctx.fillStyle = innerColor; ctx.fill();
    }
  }
  function render(alpha1, alpha2){
    ctx.clearRect(0,0,canvas.width,canvas.height);
    drawGrid();
    if(snakes){
      drawFoods();
      drawSnakeBlocks(snakes.p2, 'p2', alpha2);
      drawSnakeBlocks(snakes.p1, 'p1', alpha1);
    }
  }

  /* === Loop === */
  function moveSnake(s, ownerKey) {
    if (!bodyAdvance(s, ownerKey)) return;
    const collision = collideCheckDetailed();
    if (collision.result) {
        endGame(collision.result);
    } else {
        eatFoodIfAny(s, ownerKey);
    }
  }

  function step(){
    requestAnimationFrame(step);
    const now=performance.now();
    const delta=now-last;
    last = now;

    if (gameMode === '2P' && !intermission && !inCountdown && !paused) {
        const timeLeft = roundTimerEnd - now;
        updateTimerUI(timeLeft);
        if (timeLeft <= 0 && !timerEnded) {
            timerEnded = true;
            endRoundByTime();
        }
    }

    if (!snakes || !snakes.p1) return;

    const tps1 = BASE_TPS * MOD_SPEED[currentSpeedMode] * speedMult(snakes.p1);
    acc1 += delta;
    const steps1 = Math.floor(acc1 / (1000/tps1));
    if(steps1 > 0) acc1 = acc1 % (1000/tps1);

    let tps2 = 0, steps2 = 0;
    if(gameMode==='2P' && snakes.p2){
      tps2 = BASE_TPS * MOD_SPEED[currentSpeedMode] * speedMult(snakes.p2);
      acc2 += delta;
      steps2 = Math.floor(acc2 / (1000/tps2));
      if(steps2 > 0) acc2 = acc2 % (1000/tps2);
    }

    if(!paused && !intermission){
      for(let i=0;i<steps1;i++) moveSnake(snakes.p1, 'p1');
      if(gameMode==='2P' && snakes.p2) {
        for(let i=0;i<steps2;i++) moveSnake(snakes.p2, 'p2');
      }
    }
    
    const alpha1 = acc1 / (1000/tps1);
    const alpha2 = (gameMode === '2P' && snakes.p2) ? acc2 / (1000/tps2) : 0;
    render(alpha1, alpha2);
  }

  openMainMenu();
  applyLang();
  updateSoundIcons();
  step();
})();
</script>
