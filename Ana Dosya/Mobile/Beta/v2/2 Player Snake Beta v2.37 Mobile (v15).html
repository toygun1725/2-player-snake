        crossorigin="anonymous" referrerpolicy="no-referrer" />

    <!-- Version: Beta v2.37 Mobile (v15) -->
    <style>
        :root {
            --bg: #0b0f14;
            --grid: #1a2537;
            --p1: #ff4fbf;
            --p2: #35e6e6;
            --gold: #ffd166;
            --heart: #ff1744;
            --ui-tile: #0c141f;
            --ui-tile-border: #1b2a41;
            --ui-tile-soft: #0f1a2a;
            --text: #e7f1ff;
            --muted: #9fb3d1;
            --safe-area-top: env(safe-area-inset-top, 0px);
            --safe-area-bottom: env(safe-area-inset-bottom, 0px);
        }

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        html,
        body {
            height: 100%;
            width: 100%;
        }

        body {
            margin: 0;
            background: var(--bg);
            color: var(--text);
            font-family: 'Orbitron', sans-serif;
            overflow: hidden;
            text-transform: uppercase;
            display: flex;
            flex-direction: column;
            height: 100vh;
            /* Full viewport height */
            height: -webkit-fill-available;
            /* iOS Safari fix */
        }

        .banner p,
        .banner .small-text {
            text-transform: none;
        }

        #instructionsContainer,
        #developersContainer,
        #highscoreContainer {
            text-transform: none;
        }

        /* ── v13: Control bar layout ── */
        #p2-controls,
        #p1-controls {
            height: 18vh;
            min-height: 124px;
            width: 100%;
            background: var(--ui-tile);
            flex-shrink: 0;
            display: flex;
            align-items: stretch;
            justify-content: stretch;
            position: relative;
            z-index: 1003;
            gap: 0;
        }

        #p2-controls {
            padding-top: var(--safe-area-top);
            border-bottom: 1px solid var(--ui-tile-border);
        }

        #p1-controls {
            padding-bottom: var(--safe-area-bottom);
            border-top: 1px solid var(--ui-tile-border);
        }

        /* ── v15: Pause butonu panelin içinde, round dotların altında ── */
        .panel-pause-btn {
            width: 34px;
            height: 34px;
            background: rgba(255,255,255,0.06);
            border: 1px solid rgba(255,255,255,0.12);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            flex-shrink: 0;
            transition: background-color 0.15s;
            position: relative;
            z-index: 2;
            margin-top: 4px;
        }

        .panel-pause-btn:active {
            background-color: rgba(255,255,255,0.15);
        }

        .panel-pause-btn svg {
            width: 16px;
            height: 16px;
            fill: var(--text);
            opacity: 0.7;
        }

        /* ── v13.1: Center section — column: butonlar üstte, panel altta ── */
        .ctrl-center {
            flex: 1;
            display: flex;
            align-items: stretch;
            min-width: 0;
        }

        /* Panel wrapper: single panel box with pause inside */
        .panel-with-btns {
            flex: 1;
            min-width: 70px;
            max-width: 120px;
            display: flex;
            flex-direction: column;
            align-items: stretch;
        }

        /* ── v13.1: Player stat panels (glassmorphism) ── */
        .player-stat-panel {
            flex: 1;
            min-width: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 5px;
            padding: 4px 6px 8px;
            position: relative;
            z-index: 1;
        }

        .player-stat-panel::before {
            content: '';
            position: absolute;
            inset: 6px 4px;
            border-radius: 14px;
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            pointer-events: none;
        }

        .player-stat-panel.p1-panel::before {
            background: linear-gradient(160deg,
                rgba(255, 79, 191, 0.18) 0%,
                rgba(255, 79, 191, 0.06) 100%);
            border-color: rgba(255, 79, 191, 0.25);
            box-shadow: inset 0 1px 0 rgba(255, 79, 191, 0.15),
                        0 4px 20px rgba(255, 79, 191, 0.08);
        }

        .player-stat-panel.p2-panel::before {
            background: linear-gradient(160deg,
                rgba(53, 230, 230, 0.18) 0%,
                rgba(53, 230, 230, 0.06) 100%);
            border-color: rgba(53, 230, 230, 0.25);
            box-shadow: inset 0 1px 0 rgba(53, 230, 230, 0.15),
                        0 4px 20px rgba(53, 230, 230, 0.08);
        }

        /* Dynamic tint — updated via JS when playerColors change */
        .player-stat-panel.p1-panel {
            --panel-color: var(--p1);
        }
        .player-stat-panel.p2-panel {
            --panel-color: var(--p2);
        }

        .panel-player-name {
            font-family: 'Orbitron', sans-serif;
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 0.5px;
            text-transform: uppercase;
            opacity: 0.95;
            text-align: center;
            position: relative;
            z-index: 2;
            line-height: 1.1;
        }

        .panel-player-name.p1-name { color: var(--p1); text-shadow: 0 0 8px var(--p1); }
        .panel-player-name.p2-name { color: var(--p2); text-shadow: 0 0 8px var(--p2); }

        .panel-length-number {
            font-family: 'Orbitron', sans-serif;
            font-size: 28px;
            font-weight: 900;
            line-height: 1;
            position: relative;
            z-index: 2;
            text-align: center;
        }

        .panel-length-number.p1-num { color: var(--p1); text-shadow: 0 0 12px var(--p1); }
        .panel-length-number.p2-num { color: var(--p2); text-shadow: 0 0 12px var(--p2); }

        .panel-length-label {
            font-family: 'Orbitron', sans-serif;
            font-size: 8px;
            font-weight: 600;
            letter-spacing: 0.3px;
            color: var(--muted);
            text-transform: uppercase;
            position: relative;
            z-index: 2;
            text-align: center;
            opacity: 0.7;
            margin-top: -4px;
        }

        /* Dots inside panels — 2-2-1 layout */
        .panel-dots {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            position: relative;
            z-index: 2;
        }

        .panel-dots-row {
            display: flex;
            gap: 4px;
        }

        .panel-dot {
            width: 14px;
            height: 14px;
            border-radius: 50%;
            background: rgba(255,255,255,0.08);
            border: 1px solid rgba(255,255,255,0.12);
            flex-shrink: 0;
        }

        .panel-dot.filled-p1 {
            background: radial-gradient(circle at 30% 30%, #fff, var(--p1) 55%, #300b22 140%);
            box-shadow: 0 0 6px var(--p1), inset 0 0 2px #fff6;
            border-color: var(--p1);
        }

        .panel-dot.filled-p2 {
            background: radial-gradient(circle at 30% 30%, #fff, var(--p2) 55%, #083033 140%);
            box-shadow: 0 0 6px var(--p2), inset 0 0 2px #fff6;
            border-color: var(--p2);
        }

        .panel-dot.new-win-p1 {
            background: radial-gradient(circle at 30% 30%, #fff, var(--p1) 55%, #300b22 140%);
            box-shadow: 0 0 6px var(--p1), inset 0 0 2px #fff6;
            border-color: var(--p1);
            animation: panel-dot-pop 0.7s ease-out;
        }

        .panel-dot.new-win-p2 {
            background: radial-gradient(circle at 30% 30%, #fff, var(--p2) 55%, #083033 140%);
            box-shadow: 0 0 6px var(--p2), inset 0 0 2px #fff6;
            border-color: var(--p2);
            animation: panel-dot-pop 0.7s ease-out;
        }

        @keyframes panel-dot-pop {
            0%   { transform: scale(1);   filter: brightness(1); }
            30%  { transform: scale(1.5); filter: brightness(1.8); }
            60%  { transform: scale(1.3); filter: brightness(1.5); }
            100% { transform: scale(1);   filter: brightness(1); }
        }

        #stage {
            flex-grow: 1;
            position: relative;
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        #canvasWrap {
            position: relative;
            width: 100%;
            height: 100%;
            box-shadow: inset 0 0 0 1px #1a2636;
            background: #09101a;
        }

        canvas {
            width: 100%;
            height: 100%;
            display: block;
            background: radial-gradient(ellipse at center, #122034 0%, #0b121c 60%, #081018 85%, #050a10 100%);
        }

        #canvasWrap.shake {
            animation: shake-anim 0.1s 2;
        }

        @keyframes shake-anim {

            0%,
            100% {
                transform: translateX(0);
            }

            25% {
                transform: translateX(-4px);
            }

            75% {
                transform: translateX(4px);
            }
        }

        #canvasWrap::before {
            content: "";
            position: absolute;
            inset: 0;
            background: linear-gradient(transparent, rgba(0, 0, 0, .35)),
                repeating-linear-gradient(180deg, #0000 0 2px, #0003 2px 3px);
            mix-blend-mode: multiply;
            pointer-events: none
        }

        .overlay {
            position: absolute;
            inset: 0;
            display: grid;
            place-items: center;
            pointer-events: none;
            z-index: 2000
        }

        .banner {
            pointer-events: auto;
            min-width: 250px;
            max-width: 75%;
            text-align: center;
            transform: translateY(10px) scale(.96);
            opacity: 0;
            transition: all .45s cubic-bezier(.2, .8, .2, 1);
            z-index: 2005;
        }

        .banner.show {
            transform: translateY(0) scale(1);
            opacity: 1
        }

        @keyframes borderGlow {
            0% {
                border-color: #ff4fbf;
                box-shadow: 0 16px 50px #0004, 0 0 8px rgba(255, 79, 191, 0.3);
            }

            50% {
                border-color: #35e6e6;
                box-shadow: 0 16px 50px #0004, 0 0 8px rgba(53, 230, 230, 0.3);
            }

            100% {
                border-color: #ff4fbf;
                box-shadow: 0 16px 50px #0004, 0 0 8px rgba(255, 79, 191, 0.3);
            }
        }

        .banner.padded {
            padding: 10px 14px;
            border-radius: 18px;
            background: linear-gradient(180deg, #0d1624ee, #0a111de0);
            border: 2px solid #ff4fbf;
            box-shadow: 0 16px 50px #0004, 0 0 8px rgba(255, 79, 191, 0.3);
            animation: borderGlow 3s infinite;
        }

        .banner h1 {
            margin: 0 0 10px;
            font-size: clamp(26px, 7.5vw, 42px);
            letter-spacing: 1px;
            line-height: 1.1;
        }

        .banner h2 {
            margin: 0 0 10px;
            font-size: clamp(16px, 3.8vw, 22px);
            opacity: 0.9;
        }

        .banner p {
            margin: 0;
            opacity: .9;
            font-size: 14px
        }

        .banner .p1 {
            color: var(--p1)
        }

        .banner .p2 {
            color: var(--p2)
        }

        .banner .draw {
            color: #9ed0ff
        }

        .btn {
            background: var(--ui-tile-soft);
            border: 1px solid var(--ui-tile-border);
            color: var(--text);
            padding: 10px 16px;
            border-radius: 8px;
            font-family: 'Orbitron', sans-serif;
            text-transform: uppercase;
            cursor: pointer;
            transition: all .1s;
            display: block;
            width: 100%;
            font-size: 18px;
        }

        .btn:not(:last-child) {
            margin-bottom: 10px;
        }

        /* v7 Menu Button Styles */
        .btn-menu-row {
            display: flex;
            align-items: center;
            text-align: left;
            padding: 0 18px !important;
            height: 48px;
        }

        .btn-menu-icon {
            font-size: 20px;
            width: 30px;
            display: flex;
            justify-content: center;
        }

        .btn-menu-sep {
            width: 1px;
            height: 22px;
            background: rgba(255, 255, 255, 0.15);
            margin: 0 14px;
        }

        .btn-menu-text {
            flex: 1;
            font-weight: 600;
            letter-spacing: 0.5px;
        }

        .btn.big {
            padding: 14px 18px;
            font-size: 16px
        }

        .btn.back {
            padding: 14px 12px;
            font-size: 16px;
            margin-top: 8px
        }

        .btn:hover {
            filter: brightness(1.08)
        }

        .btn-patreon {
            background: linear-gradient(135deg, #ff424d 0%, #f96854 100%);
            color: white !important;
            border: none;
            padding: 12px 18px;
            border-radius: 12px;
            font-weight: 700;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            margin: 14px 0;
            width: 100%;
            box-shadow: 0 4px 15px rgba(255, 66, 77, 0.4);
            text-transform: uppercase;
            font-family: 'Orbitron', sans-serif;
            font-size: 14px;
            cursor: pointer;
            text-decoration: none;
            transition: transform 0.1s, filter 0.1s;
        }

        .btn-patreon i {
            font-size: 20px;
        }

        .btn-patreon:active {
            transform: scale(0.98);
            filter: brightness(0.9);
        }

        /* Turn Controls */
        .turn-controls-container {
            display: flex;
            justify-content: center;
            align-items: stretch;
            flex: 1;
            height: 100%;
            min-width: 0;
        }

        /* P2 entire center area is rotated 180° so P2 sees it correctly */
        #p2-controls .ctrl-content-rotated {
            transform: rotate(180deg);
        }

        .turn-btn {
            flex: 1;
            background-color: var(--ui-tile-soft);
            border: 1px solid var(--ui-tile-border);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: background-color 0.1s;
            height: 100%;
        }

        .turn-btn.left {
            border-radius: 16px 0 0 16px;
        }

        .turn-btn.right {
            border-radius: 0 16px 16px 0;
        }

        .turn-btn:active {
            background-color: #2a3f5d;
        }

        .turn-separator {
            width: 1px;
            background-color: var(--ui-tile-border);
        }

        .turn-btn svg {
            width: 44px;
            height: 44px;
            fill: var(--text);
            opacity: 0.7;
        }

        /* Hide old mobile-ui-buttons (replaced by ctrl-side-btns) */
        .mobile-ui-buttons {
            display: none !important;
        }

        /* Hide old absolute-positioned settings button */
        #settingsBtnP1 {
            display: none !important;
        }

        /* Score Display Area — hidden in v12, replaced by panels */
        .ui-score-display {
            display: none !important;
        }

        /* v13: main controls wrapper */
        #p1-main-controls,
        #p2-main-controls {
            display: flex;
            flex-direction: column;
            align-items: stretch;
            flex: 1;
            height: 100%;
            gap: 0;
            min-width: 0;
        }

        /* Center Info Area */
        .center-info {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            pointer-events: none;
        }

        .series-mobile {
            display: none;
            /* Hide center series display */
            gap: 8px;
        }

        .dot {
            width: 16px;
            height: 16px;
            border-radius: 50%;
            background: #263449;
            box-shadow: inset 0 0 0 1px #162131;
        }

        .dot.win-p1 {
            background: radial-gradient(circle at 30% 30%, #fff, var(--p1) 55%, #300b22 140%);
            box-shadow: 0 0 6px var(--p1), inset 0 0 2px #fff6;
        }

        .dot.win-p2 {
            background: radial-gradient(circle at 30% 30%, #fff, var(--p2) 55%, #083033 140%);
            box-shadow: 0 0 6px var(--p2), inset 0 0 2px #fff6;
        }

        #timeLabel {
            display: none;
            /* Hide timer */
            font-family: 'VT323', monospace;
            font-size: 28px;
            color: var(--white);
            background: #0b1420a0;
            padding: 2px 8px;
            border-radius: 6px;
        }

        .player-scores {
            font-size: 15px;
            /* Compact font */
            text-align: right;
            line-height: 1.3;
        }

        #p2-controls .player-scores {
            text-align: right;
            /* Keep text alignment consistent */
        }

        .player-scores .val {
            font-weight: bold;
        }

        #p1Score .val {
            color: var(--p1);
        }

        #p2Score .val {
            color: var(--p2);
        }

        #p1Score-1P .val-len {
            color: var(--p1);
        }

        #p1Score-1P .val-food {
            color: var(--gold);
        }

        /* Series corner — hidden, replaced by panel dots */
        .series-corner { display: none; }

        .color-options {
            display: flex;
            gap: 8px;
            margin: 12px 0;
            justify-content: center;
        }

        .color-btn {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            border: 2px solid #fff;
            cursor: pointer;
            transition: transform 0.2s;
        }

        .color-menu-separator {
            height: 28px;
            width: 1px;
            background: #fff;
            opacity: 0.3;
        }

        .color-btn:hover {
            transform: scale(1.1);
        }

        .color-btn:disabled {
            opacity: 0.3;
            cursor: not-allowed;
            transform: none;
        }

        .banner h2 {
            font-size: clamp(18px, 4vw, 24px);
            opacity: 0.9;
            margin: 15px 0 5px;
        }

        .edit-icon {
            cursor: pointer;
            font-size: 16px;
            opacity: 0.6;
            display: inline-block;
            margin-left: 8px;
            vertical-align: middle;
        }

        .edit-icon:hover {
            opacity: 1;
        }

        #p1NameInput,
        #p2NameInput {
            background: #0003;
            color: #fff;
            border: 1px solid #fff8;
            padding: 6px 8px;
            font-family: 'Orbitron', sans-serif;
            width: 140px;
            text-align: center;
        }

        .countdown-text {
            font-family: 'Orbitron', sans-serif;
            font-size: 120px;
            font-weight: 900;
            text-shadow: 0 0 2px #fff, 0 0 8px var(--p1);
            animation: countdown-anim 0.5s cubic-bezier(.25, 1.5, .5, 1) forwards;
            transform: scale(0.5);
            opacity: 0;
        }

        @keyframes countdown-anim {
            to {
                transform: scale(1);
                opacity: 1;
            }
        }

        .countdown-text.start {
            font-size: 80px;
            text-shadow: 0 0 5px var(--gold), 0 0 10px var(--p1);
        }

        
        /* ====== Game End Statistics Overlay ====== */
        .game-end-overlay {
            position: fixed;
            inset: 0;
            background: rgba(8, 12, 18, 0.25);
            backdrop-filter: blur(12px) saturate(120%);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 2100;
            opacity: 0;
            animation: game-end-fade-in 0.4s ease forwards;
        }

        @keyframes game-end-fade-in {
            to { opacity: 1; }
        }

        .game-end-card {
            background: linear-gradient(135deg, rgba(13, 22, 36, 0.78), rgba(10, 17, 29, 0.72));
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 18px;
            padding: 20px 22px;
            width: min(90vw, 420px);
            box-shadow: 0 20px 60px rgba(0,0,0,0.5), 0 0 30px rgba(64,224,208,0.12);
            text-align: center;
            transform: translateY(18px) scale(0.97);
            animation: game-end-card-in 0.4s 0.1s ease forwards;
            opacity: 0;
        }

        @keyframes game-end-card-in {
            to { transform: translateY(0) scale(1); opacity: 1; }
        }

        .game-end-title {
            font-family: 'Orbitron', sans-serif;
            font-size: clamp(20px, 6vw, 34px);
            font-weight: 900;
            margin-bottom: 14px;
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }

        .game-end-trophy {
            font-size: 40px;
            margin-bottom: 6px;
            animation: trophy-bounce 1s ease infinite alternate;

                    instructionsText: `<div class="rules-section">
  <h3>🎯 Ziel</h3>
  <p>Dies ist ein Schlangen-Duell für zwei Spieler. Gewinne eine Runde, indem du deinen Gegner eliminierst oder am Ende der Zeit länger bist. Wer zuerst 5 Runden gewinnt, gewinnt das Spiel.</p>

  <h3>🍎 Futter & Power-Ups</h3>
  <p><b>Normal:</b> Lässt deine Schlange wachsen.<br><b>Diamant (Gold):</b> Erscheint alle 5 normalen Futter. Lässt dich um 3 wachsen, schrumpft den Gegner um 1.<br><b>Rubin (Rot):</b> Erscheint alle 10 normalen Futter. Macht dich für 5s schneller und unantastbar.<br><b>Doppeltes Futter:</b> Ein Paar normaler Futter erscheint nach jedem 3 normalen Futter. Wenn eines gegessen wird, verschwindet das andere.</p>
</div>
<div class="rules-section">
  <h3>⚙️ Mechanik</h3>
  <p>Eine Schlange der Länge null wird eliminiert.</p>
</div>`,

            function tone(freq, dur, { type = 'square', gain = 0.06, attack = 0.004, release = 0.06, sweep = 0 } = {}) {
                if (muted) return; try {

                    g.gain.value = 0; g.gain.linearRampToValueAtTime(gain, now + attack);
                    g.gain.linearRampToValueAtTime(0.0001, now + Math.max(dur - 0.01, 0) + release);
                    o.connect(g).connect(audioCtx.destination); o.start(now); o.stop(now + dur + release + 0.03);
                } catch (e) { }
            }
            const SFX = {

            /* === Game State & Render Prep === */
            const banner = document.getElementById('banner');
            let snakes = null, foods = [], stats = { p1Food: 0, p2Food: 0 }, gameMode = null, games = { p1: 0, p2: 0 };
            let matchStartTime = 0, matchTotalFoodP1 = 0, matchTotalFoodP2 = 0, longestSnakeP1 = 0, longestSnakeP2 = 0;
            let last = 0, acc1 = 0, acc2 = 0;

            function cloneForGameState(value) {
                if (typeof structuredClone === 'function') return structuredClone(value);

            function shiftFoodTimestamps(foodList, delta) {
                for (const food of foodList || []) {
                    if (typeof food.expiryTime === 'number') food.expiryTime += delta;
                    if (typeof food.spawnAt === 'number') food.spawnAt += delta;
                    if (typeof food.relocateTime === 'number') food.relocateTime += delta;

            function shiftSnakeTimestamps(snake, delta) {
                if (!snake) return;
                const timestampKeys = ['powerEnd', 'flashUntil', 'shakeUntil'];
                for (const key of timestampKeys) {
                    if (typeof snake[key] === 'number') snake[key] += delta;
                }
                if (Array.isArray(snake.digestAnims)) {
                    for (const anim of snake.digestAnims) {
                        if (typeof anim.startTime === 'number') anim.startTime += delta;
                    }
                }
            }

            function normalizeSnakeLength(snake, targetLength = 10) {
                if (!snake || !Array.isArray(snake.segments) || snake.segments.length === 0) return;
                while (snake.segments.length > targetLength) snake.segments.pop();
                while (snake.segments.length < targetLength) {
                    const tail = snake.segments[snake.segments.length - 1];
                    snake.segments.push({ ...tail });
                }
                snake.prev = snake.segments.map(seg => ({ ...seg }));
                snake.grow = 0;

            function syncAdSoundConfig() {

            const AdManager = {
                cooldownMs: 90000,
                startAdChance: 0.30,
                snapshotDepth: 5,
                lastAdShownAt: 0,
                sessionStartedMatchCount: 0,
                sessionCompletedMatchCount: 0,
                mandatoryAdShownThisMatch: false,
                startAdShownThisMatch: false,
                rewardedUsedThisMatch: false,
                rewardedPendingLoss: null,
                adInProgress: false,

                isSdkReady() {
                    return !!window.__h5GamesAdsReady && typeof adBreak === 'function';
                },

                isGlobalCooldownActive() {
                    return this.lastAdShownAt > 0 && (performance.now() - this.lastAdShownAt) < this.cooldownMs;
                },

                recordAdShown(kind) {
                    this.lastAdShownAt = performance.now();
                    if (kind === 'start') {
                        this.mandatoryAdShownThisMatch = true;
                        this.startAdShownThisMatch = true;
                    } else if (kind === 'gameover') {

                resetMatchState() {
                    this.mandatoryAdShownThisMatch = false;
                    this.startAdShownThisMatch = false;

                beginMatchCycle() {

                recordMatchCompleted() {

                canShowMandatoryAd() {
                    return this.isSdkReady() &&
                        !this.adInProgress &&
                        !this.isGlobalCooldownActive() &&
                        !this.mandatoryAdShownThisMatch;
                },

                maybeShowStartAdThenStart(startFn) {
                    this.beginMatchCycle();
                    const shouldTry =
                        this.sessionStartedMatchCount > 1 &&
                        this.canShowMandatoryAd() &&
                        Math.random() < this.startAdChance;

                    if (!shouldTry) {
                        startFn();
                        return;
                    }

                    this.showInterstitial({
                        type: 'start',
                        name: 'match_start',
                        recordKind: 'start',
                        onDone: startFn
                    });
                },

                maybeShowRestartAdThenRestart(restartFn) {
                    const continueRestart = () => {
                        this.beginDirectRestartMatch();
                        if (restartFn) restartFn();
                    };

                    const shouldTry =
                        this.isSdkReady() &&
                        !this.adInProgress &&
                        !this.isGlobalCooldownActive();

                    if (!shouldTry) {
                        continueRestart();
                        return;

                    this.showInterstitial({
                        type: 'next',
                        name: 'match_restart',
                        recordKind: 'restart',
                        onDone: continueRestart

                    if (!this.isSdkReady()) {
                        if (onDone) onDone();
                        return;

                    this.adInProgress = true;
                    let adShown = false;
                    let finished = false;

                    const finish = () => {
                        if (finished) return;
                        finished = true;
                        this.adInProgress = false;
                        if (onDone) onDone();
                    };

                    try {
                        adBreak({
                            type,
                            name,
                            beforeAd: () => {
                                adShown = true;
                                paused = true;
                                intermission = true;
                                syncAdSoundConfig();
                            },
                            afterAd: () => {
                                if (adShown) this.recordAdShown(recordKind);

                        !this.rewardedPendingLoss &&
                        !this.startAdShownThisMatch &&

                        this.canShowMandatoryAd();

                captureRewardSnapshot() {

                    const snapshot = cloneForGameState({

                            name: 'ai_continue',
                            beforeAd: () => {

                                intermission = true;

                                this.rewardedUsedThisMatch = true;

                            adDismissed: () => {

                finalizePendingLoss(message = '') {
                    const pending = this.rewardedPendingLoss;

                    if (!baseSnapshot) {

                    const snapshot = cloneForGameState(baseSnapshot);
                    const delta = performance.now() - snapshot.capturedAt;

                    if (typeof snapshot.roundTimerEnd === 'number') snapshot.roundTimerEnd += delta;

            const p1Series = document.getElementById('p1Series'), p2Series = document.getElementById('p2Series');
            let lastGames = { p1: 0, p2: 0 };

            /* Build 2-2-1 dot rows for a given count/owner */
            function buildPanelDots(count, owner, lastCount) {
                const total = GAMES_TO_ROUND; // 5
                const rows = [[0,1],[2,3],[4]]; // 2-2-1 layout
                let html = '';
                for (const row of rows) {
                    html += '<div class="panel-dots-row">';
                    for (const idx of row) {
                        let cls = 'panel-dot';
                        if (idx < count) {
                            const isNew = (idx === count - 1 && count > lastCount);
                            cls += isNew ? ` new-win-${owner}` : ` filled-${owner}`;
                        }
                        html += `<div class="${cls}"></div>`;

                    html += '</div>';

                return html;

                    if (p1DotsEl) p1DotsEl.innerHTML = buildPanelDots(games.p1, 'p1', lastGames.p1);
                    if (p2DotsEl) p2DotsEl.innerHTML = buildPanelDots(games.p2, 'p2', lastGames.p2);

                    if (p2NameEl) p2NameEl.textContent = (playerNames.p2 && playerNames.p2.trim()) || 'P2';
                }

                // Also keep legacy series dots in sync (hidden but used by old code paths)
                const renderLegacy = (count, owner, lastCount) => {
                    let html = '';
                    for (let i = 0; i < GAMES_TO_ROUND; i++) {
                        let cls = 'dot';
                        if (i < count) {
                            const isNew = (i === count - 1 && count > lastCount);
                            cls += isNew ? ` new-win-${owner}` : ` win-${owner}`;
                        }
                        html += `<div class="${cls}"></div>`;
                    }
                    return html;
                };
                if (p1Series) p1Series.innerHTML = renderLegacy(games.p1, 'p1', lastGames.p1);
                if (p2Series) p2Series.innerHTML = renderLegacy(games.p2, 'p2', lastGames.p2);

                const turnDir = btn.dataset.dir; // 'left' or 'right'

                    e.preventDefault();
                    ensureAudio();
                    if (!snakes || !snakes[player] || inCountdown || intermission || paused || !currentSpeedMode) return;

                    const s = snakes[player];
                    if (!s) return;

                    // Determine the new direction based on the current direction and the turn
                    const currentDir = s.dir;
                    let nextDirKey;

                    const dirRotation = ['up', 'right', 'down', 'left'];
                    const currentIndex = dirRotation.indexOf(Object.keys(dirMap).find(key => dirMap[key].x === currentDir.x && dirMap[key].y === currentDir.y));

                    let newIndex;
                    if (player === 'p1') {
                        newIndex = turnDir === 'left'
                            ? (currentIndex - 1 + 4) % 4
                            : (currentIndex + 1) % 4;
                    } else { // Player 2's controls are now swapped
                        newIndex = turnDir === 'left'
                            ? (currentIndex - 1 + 4) % 4
                            : (currentIndex + 1) % 4;
                    }

                    nextDirKey = dirRotation[newIndex];
                    const d = dirMap[nextDirKey];

                    if (!opposite(d, s.dir)) s.nextDir = d;
                };

                btn.addEventListener('touchstart', handlePress, { passive: false });
                btn.addEventListener('mousedown', handlePress, { passive: false }); // Also handle mouse for testing
            });

      <div style="margin-top:12px"><button class="btn big back" id="developersBack">${t('back')}</button></div>`);
                document.getElementById('developersBack').onclick = () => { SFX.menuClick(); openMainMenu(); };
            }

            function addHighScore(name, score) {
                if (score <= 0) return;
                try {
                    const scoresJSON = localStorage.getItem('neoSnakeHighscoresMobile');
                    let scores = scoresJSON ? JSON.parse(scoresJSON) : [];
                    scores.push({ name, score });
                    scores.sort((a, b) => b.score - a.score);
                    if (scores.length > 10) scores = scores.slice(0, 10);
                    localStorage.setItem('neoSnakeHighscoresMobile', JSON.stringify(scores));
                } catch (e) { console.error("Could not save high score", e); }
            }

            function openHighscore() {
                paused = true; intermission = true;
                let scoresHTML;
                try {
                    const scoresJSON = localStorage.getItem('neoSnakeHighscoresMobile');
                    const scores = scoresJSON ? JSON.parse(scoresJSON) : [];
                    if (scores.length > 0) {
                        scoresHTML = scores.map((entry, index) =>
                            `<p style="margin: 4px 0; display: flex; justify-content: space-between;">
                    <span>${index + 1}. ${entry.name}</span>
                    <strong style="color: var(--gold);">${entry.score}</strong>
                 </p>`
                        ).join('');
                    } else {
                        scoresHTML = `<p>${t('noScores')}</p>`;
                    }
                } catch (e) { scoresHTML = `<p>Error loading scores.</p>`; }

                showBanner(`<h1>${t('highscoresTitle')}</h1>
      <div style="width: 280px; max-height: 300px; overflow-y: auto; margin:10px auto;text-align:left; font-size: 16px; line-height: 1.8;">
        <h3>${t('top10Scores')}</h3>
        ${scoresHTML}
      </div>
      <div style="margin-top:20px"><button class="btn big back" id="highscoreBack">${t('back')}</button></div>`);
                document.getElementById('highscoreBack').onclick = () => { SFX.menuClick(); openMainMenu(); };
            }

            /* === Helpers === */
            function rngCell() {
                if (currentWallMode === MOD_WALLS.SOLID) {
                    return { x: 1 + (Math.random() * (GRID_COLS - 2)) | 0, y: 1 + (Math.random() * (GRID_ROWS - 2)) | 0 };
                }
                return { x: (Math.random() * GRID_COLS) | 0, y: (Math.random() * GRID_ROWS) | 0 }
            }
            function handleBoundaries(c) {
                let { x, y } = c;
                if (currentWallMode === MOD_WALLS.SOLID) {
                    if (x < 0 || x >= GRID_COLS || y < 0 || y >= GRID_ROWS) return null;
                } else {
                    if (x < 0) x = GRID_COLS - 1; else if (x >= GRID_COLS) x = 0;
                    if (y < 0) y = GRID_ROWS - 1; else if (y >= GRID_ROWS) y = 0;
                }
                return { x, y };
            }

            async function countdown(n) {
                inCountdown = true;
                roundCount++;
                const numColor = (roundCount % 2 !== 0) ? playerColors.p1 : playerColors.p2;
                const startColor = (roundCount % 2 !== 0) ? playerColors.p2 : playerColors.p1;

                for (let i = n; i > 0; i--) {
                    showBanner(`<div class="countdown-text" style="color: ${numColor}; text-shadow: 0 0 8px ${numColor};">${i}</div>`, false);
                    SFX.countdownTick();
                    await new Promise(r => setTimeout(r, 800));
                }
                showBanner(`<div class="countdown-text start" style="color: ${startColor}; text-shadow: 0 0 5px ${startColor};">${t('start')}</div>`, false); SFX.start();
                if (gameMode === '2P' || (gameMode === '1P' && aiSnakeEnabled)) {
                    roundTimerEnd = performance.now() + ROUND_DURATION;
                    timerEnded = false;
                }
                inCountdown = false; intermission = false;
                await new Promise(r => setTimeout(r, 1000));
                hideBanner();
            }

            function modLerp(prev, cur, cap, t) {
                if (currentWallMode === MOD_WALLS.SOLID) return prev + (cur - prev) * t;
                let a = prev, b = cur, d = b - a;
                if (d > cap / 2) a += cap; else if (d < -cap / 2) a -= cap;
                const v = a + (b - a) * t;
                let out = v % cap; if (out < 0) out += cap;
                return out;
            }
            function hexToRgba(hex, alpha = 1.0) {
                if (!hex) return `rgba(255,255,255,${alpha})`;
                let c = hex.replace('#', '');
                if (c.length === 3) c = c[0] + c[0] + c[1] + c[1] + c[2] + c[2];
                const bigint = parseInt(c, 16);
                return `rgba(${(bigint >> 16) & 255},${(bigint >> 8) & 255},${bigint & 255},${alpha})`;
            }

            function varToCss(varName) {
                return getComputedStyle(document.documentElement).getPropertyValue(varName).trim();
            }

            function updateTimerUI(timeLeftMs) {
                if (gameMode !== '2P' && !(gameMode === '1P' && aiSnakeEnabled)) return;
                const label = document.getElementById('timeLabel');
                if (!label) return;
                let ms = Math.max(0, timeLeftMs);
                const secs = Math.ceil(ms / 1000);
                if (secs <= 10 && secs > 0 && Math.ceil(lastTimeLeft / 1000) > secs) SFX.countdownTick();
                lastTimeLeft = ms;
                const m = Math.floor(secs / 60), s = secs % 60;
                label.textContent = `${m.toString().padStart(2, '0')}:${s.toString().padStart(2, '0')}`;
                if (intermission) label.style.display = 'none';
            }

            function endRoundByTime() {
                if (!snakes) return;
                if (gameMode !== '2P' && !(gameMode === '1P' && aiSnakeEnabled)) return;
                const l1 = snakes.p1.segments.length, l2 = snakes.p2.segments.length;
                if (l1 > l2) endGame('p1');
                else if (l2 > l1) endGame('p2');
                else endGame('draw');
            }

            /* === Core === */
            const dirMap = { up: { x: 0, y: -1 }, down: { x: 0, y: 1 }, left: { x: -1, y: 0 }, right: { x: 1, y: 0 } };
            function opposite(a, b) { return a.x === -b.x && a.y === -b.y; }
            function createSnake(start, dir, len = 3) {
                const seg = [];
                for (let i = 0; i < len; i++) {
                    seg.push({ x: start.x - i * dir.x, y: start.y - i * dir.y });
                }
                return { segments: seg, prev: seg.map(s => ({ ...s })), dir: { ...dir }, nextDir: { ...dir }, grow: 0, powerEnd: 0, flashUntil: 0, flashColor: null, shakeUntil: 0, digestAnims: [] };
            }
            function isPowered(s) { return s && performance.now() < s.powerEnd; }

            const GAMES_TO_ROUND = 5;

            function speedMult(s) { return isPowered(s) ? 1.45 : 1.00; }

            // AI Snake pathfinding using BFS
            function calculateAIMove(aiSnake, playerSnake, foods, wallMode) {
                if (!aiSnake || aiSnake.segments.length === 0) return null;
                const head = aiSnake.segments[0];
                const currentDir = aiSnake.dir;

                // Find nearest food
                let nearestFood = null;
                let minDist = Infinity;
                for (const f of foods) {
                    const dist = Math.abs(f.x - head.x) + Math.abs(f.y - head.y);
                    if (dist < minDist) {
                        minDist = dist;
                        nearestFood = f;
                    }
                }
                if (!nearestFood) return currentDir;

                // BFS to find path to food
                const queue = [{ x: head.x, y: head.y, path: [] }];
                const visited = new Set();
                visited.add(head.x + ',' + head.y);

                // Obstacles: both snakes
                const obstacles = new Set();
                aiSnake.segments.forEach(s => obstacles.add(s.x + ',' + s.y));
                if (playerSnake) playerSnake.segments.forEach(s => obstacles.add(s.x + ',' + s.y));

                const dirs = [dirMap.up, dirMap.down, dirMap.left, dirMap.right];

                let iterations = 0;
                while (queue.length > 0 && iterations < 2000) {
                    const curr = queue.shift();
                    iterations++;

                    if (curr.x === nearestFood.x && curr.y === nearestFood.y) {
                        if (curr.path.length > 0) return curr.path[0];
                        return currentDir;
                    }

                    for (const d of dirs) {
                        if (curr.path.length === 0 && opposite(d, currentDir)) continue;

                        let nx = curr.x + d.x;
                        let ny = curr.y + d.y;

                        // Handle walls
                        if (wallMode === MOD_WALLS.SOLID) {
                            if (nx < 0 || nx >= GRID_COLS || ny < 0 || ny >= GRID_ROWS) continue;
                        } else {
                            if (nx < 0) nx = GRID_COLS - 1; else if (nx >= GRID_COLS) nx = 0;
                            if (ny < 0) ny = GRID_ROWS - 1; else if (ny >= GRID_ROWS) ny = 0;
                        }

                        const key = nx + ',' + ny;
                        if (!visited.has(key) && !obstacles.has(key)) {
                            visited.add(key);
                            queue.push({ x: nx, y: ny, path: [...curr.path, d] });
                        }
                    }
                }

                // If no path found, try any valid move to survive
                for (const d of dirs) {
                    if (opposite(d, currentDir)) continue;
                    let nx = head.x + d.x;
                    let ny = head.y + d.y;
                    if (wallMode === MOD_WALLS.SOLID) {
                        if (nx < 0 || nx >= GRID_COLS || ny < 0 || ny >= GRID_ROWS) continue;
                    } else {
                        if (nx < 0) nx = GRID_COLS - 1; else if (nx >= GRID_COLS) nx = 0;
                        if (ny < 0) ny = GRID_ROWS - 1; else if (ny >= GRID_ROWS) ny = 0;
                    }
                    if (!obstacles.has(nx + ',' + ny)) return d;
                }

                return currentDir;
            }

            function softReset(full = false, countdownNum = 3) {
                if (full) {
                    games = { p1: 0, p2: 0 }; drawSeries();
                    stats.p1Food = 0; stats.p2Food = 0; updateFoodCounters();
                    roundCount = 0;
                    matchStartTime = performance.now();
                    matchTotalFoodP1 = 0; matchTotalFoodP2 = 0;
                    longestSnakeP1 = 0; longestSnakeP2 = 0;
                }
                // Refresh panel names whenever a round starts
                const p1NameEl = document.getElementById('p1PanelName');
                const p2NameEl = document.getElementById('p2PanelName');
                if (p1NameEl) p1NameEl.textContent = (playerNames.p1 && playerNames.p1.trim()) || 'P1';
                if (p2NameEl) p2NameEl.textContent = (gameMode === '1P' && aiSnakeEnabled) ? 'AI' : ((playerNames.p2 && playerNames.p2.trim()) || 'P2');
                foods = [];
                normalFoodsEaten = 0;
                diamondActive = false;
                redFoodPresent = false;
                redBulkEndTime = 0;
                doubleActive = false;
                beastOwner = null;
                paused = false;
                intermission = true;
                timerEnded = false;
                deathAnim.active = false;
                winAnim.active = false;
                aiFirstPelletEatenThisRound = false;
                updateTimerUI(ROUND_DURATION);

                const y1 = Math.floor(GRID_ROWS * 0.25);
                const y2 = Math.floor(GRID_ROWS * 0.75);
                const x1 = Math.floor(GRID_COLS * 0.25);
                const x2 = Math.floor(GRID_COLS * 0.75);

                if (gameMode === '1P') {
                    const mid = { x: Math.floor(GRID_COLS / 2), y: Math.floor(GRID_ROWS / 2) };
                    if (aiSnakeEnabled) {
                        const startLen = 5;
                        const startP1 = { x: mid.x - 8, y: mid.y };
                        const startP2 = { x: mid.x + 8, y: mid.y };
                        snakes = {
                            p1: createSnake(startP1, dirMap.right, startLen),
                            p2: createSnake(startP2, dirMap.left, startLen)
                        };
                    } else {
                        const startPos = { x: mid.x, y: mid.y };
                        snakes = { p1: createSnake(startPos, dirMap.right) };
                    }
                    stats.p1Food = 0;
                } else if (gameMode === '2P') {
                    snakes = {
                        p1: createSnake({ x: x2, y: y2 }, dirMap.left),
                        p2: createSnake({ x: x1, y: y1 }, dirMap.right)
                    };
                    if (full) {
                        stats.p1Food = 0; stats.p2Food = 0;
                    }
                }
                updateFoodCounters();
                updateUIVisibility();

                return new Promise(resolve => {
                    countdown(countdownNum).then(resolve);
                });
            }

            function awardGame(who) { if (who === 'p1') games.p1++; else if (who === 'p2') games.p2++; drawSeries(); }

            function spawnFood() {
                const now = performance.now();
                if (redBulkEndTime && now < redBulkEndTime) return;
                if (doubleActive || diamondActive) return;

                // New food sequence based on normalFoodsEaten
                if (normalFoodsEaten > 0) {
                    const step = normalFoodsEaten % 14 || 14; // 14'te reset
                    switch (step) {
                        case 4:
                        case 8:
                        case 11:
                            if (!doubleActive) {
                                spawnSpecialFood('double');
                                return;
                            }
                            break;
                        case 6:
                            if (!diamondActive) {
                                spawnSpecialFood('diamond');
                                return;
                            }
                            break;
                        case 12:
                            if (!redFoodPresent) {
                                spawnSpecialFood('heart');
                                return;
                            }
                            break;
                        // case 13 removed
                    }
                }

                const normalCount = foods.filter(f => f.type === 'normal' && !f.pairId).length;
                if (normalCount < 1) spawnNormal();
            }
            function spawnNormal() {
                let tries = 0, f;
                const occ = new Set();
                if (snakes && snakes.p1) snakes.p1.segments.forEach(s => occ.add(s.x + ',' + s.y));
                if (snakes && snakes.p2) snakes.p2.segments.forEach(s => occ.add(s.x + ',' + s.y));
                foods.forEach(food => occ.add(food.x + ',' + food.y));
                do { f = rngCell(); tries++; if (tries > 800) return; } while (occ.has(f.x + ',' + f.y));
                foods.push({ x: f.x, y: f.y, type: 'normal', spawnAt: performance.now() });
            }
            function spawnSpecialFood(type, extra = false) {
                let tries = 0, f;
                const occ = new Set();
                if (snakes && snakes.p1) snakes.p1.segments.forEach(s => occ.add(s.x + ',' + s.y));
                if (snakes && snakes.p2) snakes.p2.segments.forEach(s => occ.add(s.x + ',' + s.y));
                foods.forEach(food => occ.add(food.x + ',' + food.y));

                do { f = rngCell(); tries++; if (tries > 800) return; } while (occ.has(f.x + ',' + f.y));

                if (type === 'diamond') {
                    foods.push({ x: f.x, y: f.y, type: 'diamond', spawnAt: performance.now(), relocateTime: performance.now() + 3000 });
                    diamondActive = true;
                } else if (type === 'heart') {
                    foods.push({ x: f.x, y: f.y, type: 'heart', spawnAt: performance.now(), extra: extra });
                    if (!extra) redFoodPresent = true;
                } else if (type === 'double') {
                    let f2;
                    let tries2 = 0;
                    do {
                        f2 = rngCell();
                        tries2++;
                        if (tries2 > 100) { // Failsafe
                            f2 = { x: (f.x + 1) % GRID_COLS, y: f.y };
                            break;
                        }
                    } while (occ.has(f2.x + ',' + f2.y) || (f2.x === f.x && f2.y === f.y));

                    const pairId = 'pair_' + performance.now();
                    foods.push({ x: f.x, y: f.y, type: 'double', spawnAt: performance.now(), pairId: pairId });
                    foods.push({ x: f2.x, y: f2.y, type: 'double', spawnAt: performance.now(), pairId: pairId });
                    doubleActive = true;
                }
            }
            function spawnBulkNormals(count) {
                for (let k = 0; k < count; k++) spawnNormal();
            }
            function updateFoodCounters() {
                const p1Len = snakes && snakes.p1 ? snakes.p1.segments.length : 0;
                const p2Len = snakes && snakes.p2 ? snakes.p2.segments.length : 0;

                // Update new v12 panel length numbers
                const p1PanelLen = document.getElementById('p1PanelLen');
                const p2PanelLen = document.getElementById('p2PanelLen');
                if (p1PanelLen) p1PanelLen.textContent = p1Len;
                if (p2PanelLen) p2PanelLen.textContent = p2Len;

                // Keep legacy hidden elements in sync for any code that reads them
                const p1s1p = document.getElementById('p1Score-1P');
                if (gameMode === '1P' && aiSnakeEnabled) {
                    const p1El = document.getElementById('p1ScoreP1');
                    const p2El = document.getElementById('p2ScoreP1');
                    if (p1El) p1El.querySelector('.val').textContent = p1Len;
                    if (p2El) p2El.querySelector('.val').textContent = p2Len;
                } else if (gameMode === '1P') {
                    if (p1s1p) {
                        p1s1p.querySelector('.val-len').textContent = p1Len;
                        p1s1p.querySelector('.val-food').textContent = stats.p1Food;
                    }
                } else {
                    const p1El = document.getElementById('p1ScoreP1');
                    const p2El = document.getElementById('p2ScoreP1');
                    const p1El2 = document.getElementById('p1ScoreP2');
                    const p2El2 = document.getElementById('p2ScoreP2');
                    if (p1El) p1El.querySelector('.val').textContent = p1Len;
                    if (p2El) p2El.querySelector('.val').textContent = p2Len;
                    if (p1El2) p1El2.querySelector('.val').textContent = p1Len;
                    if (p2El2) p2El2.querySelector('.val').textContent = p2Len;
                }
            }

            function eatFoodIfAny(s, ownerKey) {
                for (let i = foods.length - 1; i >= 0; i--) {
                    const f = foods[i];
                    if (s.segments[0].x === f.x && s.segments[0].y === f.y) {
                        if (f.type === 'normal') {
                            s.grow += 1; SFX.eat();
                            if (ownerKey === 'p1') stats.p1Food++; else stats.p2Food++;
                            normalFoodsEaten++;

                            // Competitive shrinking: opponent loses 1 segment
                            if (gameMode === '2P' || (gameMode === '1P' && aiSnakeEnabled)) {
                                const otherKey = ownerKey === 'p1' ? 'p2' : 'p1';
                                let allowShrink = true;
                                if (gameMode === '1P' && aiSnakeEnabled && ownerKey === 'p2' && !aiFirstPelletEatenThisRound) {
                                    allowShrink = false;
                                    aiFirstPelletEatenThisRound = true;
                                }
                                if (allowShrink) {
                                    if (snakes[otherKey] && snakes[otherKey].segments.length > 1) {
                                        snakes[otherKey].segments.pop();
                                    } else if (snakes[otherKey] && snakes[otherKey].segments.length === 1) {
                                        // Opponent reaches 0 - eater wins round like PC version
                                        snakes[otherKey].segments.pop();
                                        foods.splice(i, 1);
                                        endGame(ownerKey);
                                        return;
                                    }
                                }
                            }
                        } else if (f.type === 'diamond') {
                            s.grow += s.segments.length; SFX.diamond();
                            if (ownerKey === 'p1') stats.p1Food += 3; else stats.p2Food += 3;
                            const otherKey = ownerKey === 'p1' ? 'p2' : 'p1';
                            if (snakes[otherKey]) {
                                if (snakes[otherKey].segments.length > 3) {
                                    snakes[otherKey].segments.pop();
                                } else if ((gameMode === '2P' || (gameMode === '1P' && aiSnakeEnabled)) && snakes[otherKey].segments.length <= 1) {
                                    // Shrink to zero in competitive mode if already at 1
                                    snakes[otherKey].segments.pop();
                                    foods.splice(i, 1);
                                    endGame(ownerKey);
                                    return;
                                }
                            }
                            diamondActive = false;
                            normalFoodsEaten++;
                        } else if (f.type === 'heart') {
                            if (f.extra) {
                                // extra heart
                                if (beastOwner === ownerKey) {
                                    s.powerEnd += 5000;
                                } else {
                                    if (beastOwner && snakes[beastOwner]) {
                                        snakes[beastOwner].powerEnd = 0;
                                    }
                                    beastOwner = ownerKey;
                                    s.powerEnd = performance.now() + 5000;
                                }
                                s.flashUntil = s.powerEnd;
                                s.flashColor = varToCss('--heart');
                                SFX.heart();
                            } else {
                                // normal heart (first red food eaten in step 12)
                                if (beastOwner && beastOwner !== ownerKey && snakes[beastOwner]) {
                                    snakes[beastOwner].powerEnd = 0;
                                }
                                beastOwner = ownerKey;
                                s.powerEnd = performance.now() + 5000;
                                s.flashUntil = s.powerEnd;
                                s.flashColor = varToCss('--heart');
                                SFX.heart();
                                redFoodPresent = false;
                                normalFoodsEaten++; // Count as step completion
                                // For step 13: spawn 1 red + 8 normal foods
                                spawnSpecialFood('heart', true);
                                spawnBulkNormals(8);
                            }
                        } else if (f.type === 'double') {
                            s.grow += 1; SFX.eat();
                            if (ownerKey === 'p1') stats.p1Food++; else stats.p2Food++;
                            normalFoodsEaten++; // Still counts as one normal food eaten

                            // Competitive shrinking for double food
                            if (gameMode === '2P' || (gameMode === '1P' && aiSnakeEnabled)) {
                                const otherKey = ownerKey === 'p1' ? 'p2' : 'p1';
                                if (snakes[otherKey] && snakes[otherKey].segments.length > 1) {
                                    snakes[otherKey].segments.pop();
                                } else if (snakes[otherKey] && snakes[otherKey].segments.length === 1) {
                                    snakes[otherKey].segments.pop();
                                    foods.splice(i, 1);
                                    endGame(ownerKey);
                                    return;
                                }
                            }

                            // Remove the other paired food
                            foods = foods.filter(food => food.pairId !== f.pairId);
                            doubleActive = false;
                            updateFoodCounters();
                            spawnFood(); // Check if a new food should be spawned
                            return; // Exit after eating one of the pair
                        }
                        foods.splice(i, 1);
                        updateFoodCounters();
                    }
                }
            }

            function bodyAdvance(s, ownerKey) {
                const head = s.segments[0];
                if (!opposite(s.nextDir, s.dir)) s.dir = { ...s.nextDir };
                const nextPos = { x: head.x + s.dir.x, y: head.y + s.dir.y };
                const nextHead = handleBoundaries(nextPos);
                s.prev = s.segments.map(c => ({ ...c }));
                if (!nextHead) { // Wall collision
                    if (currentWallMode === MOD_WALLS.SOLID) {
                        if (gameMode === '1P' && !aiSnakeEnabled) {
                            endGame('p1_death');
                        } else {
                            const otherPlayer = ownerKey === 'p1' ? 'p2' : 'p1';
                            endGame(otherPlayer);
                        }
                        return false;
                    }
                }
                s.segments.unshift(nextHead);
                if (s.grow > 0) s.grow--; else s.segments.pop();
                return true;
            }

            function collideCheckDetailed() {
                if (!snakes) return { result: null };

                // Solo 1P mode (no AI) - only self collision
                if (gameMode === '1P' && !aiSnakeEnabled) {
                    const s1 = snakes.p1;
                    if (!s1 || s1.segments.length === 0) return { result: null };
                    const head1 = s1.segments[0];
                    const self1 = new Set(s1.segments.slice(1).map(c => c.x + ',' + c.y));
                    const k1 = head1.x + ',' + head1.y;
                    if (self1.has(k1)) return { result: 'p1_death' };
                    return { result: null };
                }

                // 2P mode OR 1P+AI mode - full collision logic
                const s1 = snakes.p1, s2 = snakes.p2;
                if (!s1 || !s2) return { result: null };
                const head1 = s1.segments[0], head2 = s2.segments[0];
                const intangible1 = isPowered(s1), intangible2 = isPowered(s2);

                const self1 = new Set(s1.segments.slice(1).map(c => c.x + ',' + c.y));
                const self2 = new Set(s2.segments.slice(1).map(c => c.x + ',' + c.y));

                                f.y = newPos.y;
                            }
                            f.relocateTime += 3000;
                        }
                    });

                    // Clean extra foods after beast mode ends
                    if (redBulkEndTime && performance.now() > redBulkEndTime) {
                        const normalFoods = foods.filter(f => f.type === 'normal');
                        if (normalFoods.length > 1) {
                            const keep = normalFoods[0];
                            foods = foods.filter(f => f.type !== 'normal' || f === keep);
                        }
                        redBulkEndTime = 0;
                    }

                    foods = foods.filter(f => !f.expiryTime || performance.now() < f.expiryTime);
                }

                if (deathAnim.active && time > deathAnim.nextAt) {
                    const l = snakes[deathAnim.loser];
                    if (l && l.segments.length > 0) {
                        l.segments.pop();
                        deathAnim.nextAt = time + deathAnim.stepMs;
                    } else {
                        deathAnim.active = false;
                    }
                }

                const alpha1 = acc1 / (1000 / (BASE_TPS * MOD_SPEED[currentSpeedMode] * speedMult(snakes ? snakes.p1 : null)));
                const alpha2 = effectiveSpeed2 > 0 ? acc2 / (1000 / effectiveSpeed2) : 0;
                render(alpha1, alpha2);
                requestAnimationFrame(step);
            }

            openMainMenu();
            applyLang();
            updateSoundIcons();
            syncAdSoundConfig();
            requestAnimationFrame(step);
        })();</script>
</body>

</html>
