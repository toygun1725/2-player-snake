        'A': [[1, 2], [0, 3], [0, 3], [0, 1, 2, 3], [0, 3], [0, 3], [0, 3]],
        'I': [[0, 1, 2], [1], [1], [1], [1], [1], [0, 1, 2]]
    };
    const charWidths = { 'P': 4, '1': 4, '2': 4, 'A': 4, 'I': 3 };
    const charHeight = 7;
    const scale = 3;

    function scaledChar(char) {
        const rows = patterns[char];
        const positions = [];
        for (let row = 0; row < rows.length; row++) {
            for (const col of rows[row]) {
                for (let dy = 0; dy < scale; dy++) {
                    for (let dx = 0; dx < scale; dx++) {
                        positions.push({ x: col * scale + dx, y: row * scale + dy });

        return { positions, width: charWidths[char] * scale, height: charHeight * scale };

    winAnim = { active: true, winner, start: performance.now(), final, duration: final ? 3000 : 2000, blinkPeriod: 200, color: (playerColors[winner] || '#ffffff') };

    if (winner === 'p2' && gameMode === '1P' && aiSnakeEnabled) {
        c1 = 'A';
        c2 = 'I';
    }

    const firstGlyph = scaledChar(c1);
    const secondGlyph = scaledChar(c2);
    const gap = scale;
    const totalWidth = firstGlyph.width + gap + secondGlyph.width;
    const totalHeight = Math.max(firstGlyph.height, secondGlyph.height);
    const offsetX = Math.floor((GRID_COLS - totalWidth) / 2);
    const offsetY = Math.max(5, Math.floor((GRID_ROWS - totalHeight) / 2) - 2);
    const firstPositions = firstGlyph.positions.map(p => ({ x: p.x + offsetX, y: p.y + offsetY }));
    const secondPositions = secondGlyph.positions.map(p => ({ x: p.x + offsetX + firstGlyph.width + gap, y: p.y + offsetY }));

    if (!snakes) {
        const mid = { x: Math.floor(GRID_COLS / 2), y: Math.floor(GRID_ROWS / 2) };
        snakes = {
            p1: createSnake({ x: mid.x - 6, y: mid.y }, dirMap.right, 5),
            p2: createSnake({ x: mid.x + 6, y: mid.y }, dirMap.left, 5)
        };
    }

    if (final) {
        if (winner === 'p1') {
            snakes.p1.segments = [...firstPositions, ...secondPositions];
            if (snakes.p2) snakes.p2.segments = [];
        } else {
            snakes.p2.segments = [...firstPositions, ...secondPositions];
            if (snakes.p1) snakes.p1.segments = [];
        }
    } else {
        if (winner === 'p1') {
            snakes.p1.segments = secondPositions;
            if (snakes.p2) snakes.p2.segments = firstPositions;
        } else {
            snakes.p2.segments = secondPositions;
            if (snakes.p1) snakes.p1.segments = firstPositions;
        }
    }

    for (const key of ['p1', 'p2']) {
        if (!snakes[key]) continue;
        const snake = snakes[key];
        snake.prev = snake.segments.map(seg => ({ ...seg }));
        snake.dir = { x: 0, y: 0 };
        snake.nextDir = { x: 0, y: 0 };
        snake.grow = 0;
        snake.powerEnd = 0;
        snake.flashUntil = 0;
        snake.flashColor = null;
        snake.shakeUntil = 0;
    }

                        const cx = (p.x + 0.5) * szX, cy = (p.y + 0.5) * szY;
                        const r = Math.min(szX, szY) * 0.38;
                        ctx.save();
                        const haloRadius = r * 3 * glowAnim;
                        const halo = ctx.createRadialGradient(cx, cy, 1, cx, cy, haloRadius);
                        halo.addColorStop(0, `rgba(138,43,226,${0.8 * glowAnim})`);
                        halo.addColorStop(1, 'rgba(0,0,0,0)');
                        ctx.fillStyle = halo;
                        ctx.beginPath();
                        ctx.arc(cx, cy, haloRadius * 0.8, 0, Math.PI * 2);
                        ctx.fill();
                        ctx.strokeStyle = '#8A2BE2';
                        ctx.lineWidth = 2.5;
                        ctx.globalAlpha = 0.9;
                        ctx.beginPath();
                        ctx.arc(cx, cy, r, 0, Math.PI * 2);
                        ctx.stroke();
                        ctx.fillStyle = '#4B0082';
                        ctx.globalAlpha = 0.6;
                        ctx.beginPath();
                        ctx.arc(cx, cy, r * 0.7, 0, Math.PI * 2);
                        ctx.fill();
                        ctx.restore();
                    }
                }
            }

            function render(alpha1, alpha2) {
                ctx.clearRect(0, 0, canvas.width / dpr, canvas.height / dpr);
                drawGrid();
                drawAdventureOverlay();
                if (gameStyle === 'selfArea51') drawSelfArea51Divider();

                if (deathAnim.active) {
                    const l = snakes[deathAnim.loser];
                    const w = snakes[deathAnim.winner];
                    if (l) drawSnakeBlocks(l, deathAnim.loser, 1);
                    if (w) drawSnakeBlocks(w, deathAnim.winner, 1);
                } else if (snakes) {
                    if (snakes.p1) drawSnakeBlocks(snakes.p1, 'p1', alpha1);
                    if (snakes.p2) drawSnakeBlocks(snakes.p2, 'p2', alpha2);
                }

                drawFoods();
                drawInGameCountdown();
            }

            function drawSelfArea51Divider() {
                const w = canvas.width / dpr;
                const h = canvas.height / dpr;
                const szY = h / GRID_ROWS;
                const halfRow = (GRID_ROWS / 2) | 0;
                const y = halfRow * szY;
                ctx.save();
                const grad = ctx.createLinearGradient(0, y - 4, 0, y + 4);
                grad.addColorStop(0, 'rgba(0,229,255,0)');
                grad.addColorStop(0.5, 'rgba(0,229,255,0.95)');
                grad.addColorStop(1, 'rgba(0,229,255,0)');
                ctx.fillStyle = grad;
                ctx.fillRect(0, y - 4, w, 8);
                // Add subtle dashed line for clarity
                ctx.strokeStyle = 'rgba(0,229,255,0.85)';
                ctx.lineWidth = 1;
                ctx.setLineDash([6, 5]);
                ctx.beginPath();
                ctx.moveTo(0, y);
                ctx.lineTo(w, y);
                ctx.stroke();
                ctx.setLineDash([]);
                ctx.restore();
            }

            function drawPixelWinnerText() {
                const w = canvas.width / dpr;
                const h = canvas.height / dpr;
                const winnerText = (gameMode === '1P' && aiSnakeEnabled && winAnim.winner === 'p2') ? 'AI' : (winAnim.winner === 'p1' ? 'P1' : 'P2');
                const winnerColor = playerColors[winAnim.winner] || '#ffffff';
                const fontSize = Math.floor(h * 0.72);

                ctx.save();
                ctx.imageSmoothingEnabled = false;
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.font = `900 ${fontSize}px VT323, monospace`;

                // Outer glow
                ctx.shadowColor = winnerColor;
                ctx.shadowBlur = 36;
                ctx.fillStyle = hexToRgba(winnerColor, 0.38);
                ctx.fillText(winnerText, w / 2, h / 2);

                // Pixel-like hard edge core
                ctx.shadowBlur = 0;
                ctx.lineWidth = Math.max(3, Math.floor(fontSize * 0.02));
                ctx.strokeStyle = hexToRgba('#ffffff', 0.45);
                ctx.strokeText(winnerText, w / 2, h / 2);
                ctx.fillStyle = hexToRgba(winnerColor, 0.80);
                ctx.fillText(winnerText, w / 2, h / 2);
                ctx.restore();
            }

            function renderConfettiOnCanvas(ctx, canvasW, canvasH) {
    if (!confettiParticles || confettiParticles.length === 0) return;
    for (const p of confettiParticles) {
        p.x += p.vx;
        p.y += p.vy;
        p.rot += p.rotSpeed;
        p.vy += 0.06;
        if (p.y > canvasH + 20) {
            p.y = -20;
            p.x = Math.random() * canvasW;
            p.vy = (Math.random() * 3 + 1.5);
        }
        if (p.x < -20) p.x = canvasW + 20;
        if (p.x > canvasW + 20) p.x = -20;
        ctx.save();
        ctx.translate(p.x, p.y);
        ctx.rotate(p.rot);
        ctx.globalAlpha = p.opacity;
        ctx.fillStyle = p.color;
        if (p.shape === 'rect') {
            ctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h);
        } else {
            ctx.beginPath();
            ctx.arc(0, 0, p.w / 2, 0, Math.PI * 2);
            ctx.fill();
        }
        ctx.restore();
    }
    ctx.globalAlpha = 1;
}
function renderWinAnim() {
                ctx.clearRect(0, 0, canvas.width / dpr, canvas.height / dpr);
                drawGrid();
                const elapsed = performance.now() - winAnim.start;
                const period = winAnim.blinkPeriod;
                const visible = Math.floor(elapsed / period) % 2 === 0;
                if (visible && snakes) {
                    if (snakes.p1) drawSnakeBlocks(snakes.p1, 'p1', 0);
                    if (snakes.p2) drawSnakeBlocks(snakes.p2, 'p2', 0);
                }
                drawFoods();
                renderConfettiOnCanvas(ctx, canvas.width / dpr, canvas.height / dpr);
            }

            /* === Loop === */
            function moveSnake(s, ownerKey) {
                if (!s) return;
                if (!bodyAdvance(s, ownerKey)) return;
                eatFoodIfAny(s, ownerKey);
                if (s.segments.length === 0 && (gameMode === '2P' || (gameMode === '1P' && aiSnakeEnabled))) {
                    const otherPlayer = ownerKey === 'p1' ? 'p2' : 'p1';
                    endGame(otherPlayer);
                }
            }

            function step(time) {
                if (!last) last = time;
                const delta = time - last;
                last = time;

                // Process win animation before pause check so it runs even if game was paused 
                // by a rewarded continue overlay or manual pause
                if (winAnim.active) {
                    const elapsed = performance.now() - winAnim.start;
                    if (elapsed >= winAnim.duration) {
                        if (winAnim.final) {
                            winAnim.active = false;
                            stopConfetti();
                            const finalWinner = winAnim.winner;
                            // In v6, show stats window immediately. Ads are moved to buttons inside stats.
                            hideBanner();
                            showGameEndStats(finalWinner);
                            requestAnimationFrame(step);
                            return;
                        }
                    }
                    renderWinAnim();
                    requestAnimationFrame(step);
                    return;
                }

                if (paused) { requestAnimationFrame(step); return; }

                // Adventure portal timer
                if (gameStyle === 'adventure' && portals.length === 2 && !intermission && !inCountdown) {
                    portalTimerMs -= delta;
                    if (portalTimerMs <= 0 && !teleportingOwner) spawnPortals();
                }
                // Adventure teleport countdown
                if (gameStyle === 'adventure' && teleportingOwner) {
                    teleportStepsRemaining = Math.max(0, teleportStepsRemaining - 1);
                    if (teleportStepsRemaining === 0) {
                        teleportingOwner = null;
                        attemptedPortalEntry = { p1: false, p2: false };
                        portalTimerMs = 15000;
                    }
                }
                // Reset per-frame portal entry tracking
                if (gameStyle === 'adventure') {
                    attemptedPortalEntry.p1 = false;
                    attemptedPortalEntry.p2 = false;
                    barrierHitThisStep.p1 = false;
                    barrierHitThisStep.p2 = false;
                }
                // Check if beast mode has ended
                if (beastOwner && snakes[beastOwner] && !isPowered(snakes[beastOwner])) {
                    beastOwner = null;
                    redFoodPresent = false;
                }

                let effectiveSpeed2 = 0;
                if (!intermission && !inCountdown && snakes) {
                    const speed1 = BASE_TPS * MOD_SPEED[currentSpeedMode] * speedMult(snakes.p1);
                    let playerMovedThisStep = false;

                    acc1 += delta;
                    if (acc1 >= 1000 / speed1) {
                        moveSnake(snakes.p1, 'p1');
                        acc1 = 0;
                        playerMovedThisStep = true;
                    }

                    if (intermission || winAnim.active) { requestAnimationFrame(step); return; }

                    if (gameMode === '2P' || (gameMode === '1P' && aiSnakeEnabled)) {
                        // AI movement calculation for 1P+AI mode
                        if (gameMode === '1P' && aiSnakeEnabled && snakes.p2) {
                            const aiMove = calculateAIMove(snakes.p2, snakes.p1, foods, currentWallMode);
                            if (aiMove) snakes.p2.nextDir = aiMove;
                        }

                        // v2.82: Rebalanced AI difficulty with 'Orta' (60%)
                        let speedFactor = 0.60; 
                        if (currentSpeedMode === 'EASY') speedFactor = 0.40;
                        else if (currentSpeedMode === 'NORMAL') speedFactor = 0.60;
                        else if (currentSpeedMode === 'FAST') speedFactor = 0.80;
                        else if (currentSpeedMode === 'EXTREME') speedFactor = 0.90;

                        const aiSpeedFactor = (gameMode === '1P' && aiSnakeEnabled) ? speedFactor : 1.0;
                        const aiDifficultyFactor = 1.0; // Retired in v2.60
                        
                        // Fast Competitive: AI beast mode is capped at P1's actual current speed
                        const aiP2SpeedMult = (gameStyle === 'fastCompetitive' && isPowered(snakes.p2))
                            ? speedMult(snakes.p1)
                            : speedMult(snakes.p2);
                        effectiveSpeed2 = BASE_TPS * MOD_SPEED[currentSpeedMode] * aiP2SpeedMult * aiSpeedFactor * aiDifficultyFactor;
                        acc2 += delta;
                        if (acc2 >= 1000 / effectiveSpeed2) {
                            moveSnake(snakes.p2, 'p2');
                            acc2 = 0;
                        }
                    }

                    if (intermission || winAnim.active) { requestAnimationFrame(step); return; }

                    
                    if (snakes && snakes.p1 && snakes.p1.segments.length > longestSnakeP1) longestSnakeP1 = snakes.p1.segments.length;
                    if (snakes && snakes.p2 && snakes.p2.segments.length > longestSnakeP2) longestSnakeP2 = snakes.p2.segments.length;
                    const { result } = collideCheckDetailed();
                    if (result) {
                        endGame(result);
                        if (intermission || winAnim.active || deathAnim.active) {
                            updateFoodCounters();
                            render(0, 0);
                            requestAnimationFrame(step);
                            return;
                        }
                    }
                    else if (gameMode === '1P' && aiSnakeEnabled && playerMovedThisStep) AdManager.captureRewardSnapshot();

                    if ((gameMode === '2P' || (gameMode === '1P' && aiSnakeEnabled)) && !timerEnded) {
                        if (roundTimerEnd > 0) {
                            const timeLeft = roundTimerEnd - performance.now();
                            updateTimerUI(timeLeft);
                            if (timeLeft <= 0) {
                                timerEnded = true;
                                endRoundByTime();
                            }
                        } else {
                            updateTimerUI(Infinity);
                        }
                    }

                    if (!intermission && !winAnim.active && !deathAnim.active) {
                        spawnFood();
                        updateFoodCounters();
                    }

                    // Self Area 51: handle green diamond timer + win-on-51 + panel update
                    if (gameStyle === 'selfArea51' && !intermission && !winAnim.active && !deathAnim.active) {
                        const _now = performance.now();
                        maybeSpawnGreenDiamonds(_now);
                        updateSelfArea51Panels();
                        const l1 = snakes && snakes.p1 ? snakes.p1.segments.length : 0;
                        const l2 = snakes && snakes.p2 ? snakes.p2.segments.length : 0;
                        // v2.95.6: simultaneous reach of 51 → draw round (no point awarded)
                        if (l1 >= SELF_AREA_51_TARGET && l2 >= SELF_AREA_51_TARGET) {
                            endGame('draw');
                        } else if (l1 >= SELF_AREA_51_TARGET) {
                            endGame('p1');
                        } else if (l2 >= SELF_AREA_51_TARGET) {
                            endGame('p2');
                        }
                    }

                    // Handle diamond relocation
                    foods.forEach(f => {
                        if (f.type === 'diamond' && f.relocateTime && performance.now() > f.relocateTime) {
                            let tries = 0, newPos;
                            const occ = new Set();
                            if (snakes && snakes.p1) snakes.p1.segments.forEach(s => occ.add(s.x + ',' + s.y));
                            if (snakes && snakes.p2) snakes.p2.segments.forEach(s => occ.add(s.x + ',' + s.y));
                            foods.forEach(food => { if (food !== f) occ.add(food.x + ',' + food.y); });
                            do {
                                newPos = rngCell();
                                tries++;
                                if (tries > 800) break;
                            } while (occ.has(newPos.x + ',' + newPos.y));
                            if (newPos) {
                                f.x = newPos.x;
                                f.y = newPos.y;
                            }
                            f.relocateTime += 3000;
                        }
                    });

                    // Clean extra foods after beast mode ends
                    if (redBulkEndTime && performance.now() > redBulkEndTime) {
                        const hadRubyBurstFoods = foods.some(f => f.rubyBurst);
                        if (hadRubyBurstFoods) {
                            foods = foods.filter(f => !f.rubyBurst);
                            diamondActive = foods.some(f => f.type === 'diamond');
                            doubleActive = foods.some(f => f.type === 'double' || f.pairId);
                            redFoodPresent = foods.some(f => f.type === 'heart');
                        }
                        redBulkEndTime = 0;
                    }

                    foods = foods.filter(f => !f.expiryTime || performance.now() < f.expiryTime);
                }

                if (deathAnim.active && time > deathAnim.nextAt) {
                    const l = snakes[deathAnim.loser];
                    if (l && l.segments.length > 0) {
                        l.segments.pop();
                        deathAnim.nextAt = time + deathAnim.stepMs;
                    } else {
                        deathAnim.active = false;
                    }
                }

                const alpha1 = acc1 / (1000 / (BASE_TPS * MOD_SPEED[currentSpeedMode] * speedMult(snakes ? snakes.p1 : null)));
                const alpha2 = effectiveSpeed2 > 0 ? acc2 / (1000 / effectiveSpeed2) : 0;
                render(alpha1, alpha2);
                requestAnimationFrame(step);
            }

            function consumeShortcutQueryParam() {
                try {
                    const url = new URL(window.location.href);
                    if (!url.searchParams.has('shortcut')) return;
                    url.searchParams.delete('shortcut');
                    history.replaceState(null, '', url.toString());
                } catch (err) {
                    console.warn('Could not clear shortcut query param:', err);
                }
            }

            function getShortcutMenuHistory(shortcutId) {
                switch (shortcutId) {
                    case 'normal_1p':
                    case 'fc_2p':
                    case 'fc_1p_ai':
                        return [MENU_IDS.MAIN, MENU_IDS.GAME_MODE, MENU_IDS.PLAYER_MODE, MENU_IDS.WALL, MENU_IDS.SPEED];
                    default:
                        return [];
                }
            }

            function checkShortcuts() {
                const urlParams = new URLSearchParams(window.location.search);
                const s = urlParams.get('shortcut');
                if (!s) return false;

                // Sync audio context if possible (though browser policy might block until first click)
                ensureAudio();

                // FIX: Recalculate canvas size and grid before starting game,
                // ensuring GRID_ROWS is computed from actual canvas aspect ratio
                // so cells are square (prevents snake appearing to move different
                // distances vertically vs horizontally).
                resize();

                closePauseBubbles();
                stopConfetti();
                AdManager.resetMatchState();
                const canvasWrapEl = document.getElementById('canvasWrap');
                if (canvasWrapEl) canvasWrapEl.classList.remove('paused-blur', 'shake');
                pendingBannerTransition = null;
                games = { p1: 0, p2: 0 };
                drawSeries();
                stats.p1Food = 0;
                stats.p2Food = 0;
                updateFoodCounters();
                snakes = null;
                foods = [];
                barriers = [];
                portals = [];
                beastOwner = null;
                redBulkEndTime = 0;
                diamondActive = false;
                redFoodPresent = false;
                doubleActive = false;
                deathAnim.active = false;
                winAnim.active = false;
                timerEnded = false;
                inCountdown = false;
                paused = true;
                intermission = true;
                frozenPanelLengthP1 = null;
                lastStableLengthP1 = 0;
                matchStartTime = 0;
                matchTotalFoodP1 = 0;
                matchTotalFoodP2 = 0;
                longestSnakeP1 = 0;
                longestSnakeP2 = 0;
                adventureRound = 0;
                updateTimerUI(ROUND_DURATION);

                const p1NameEl = document.getElementById('p1PanelName');
                const p2NameEl = document.getElementById('p2PanelName');
                const p1LenEl = document.getElementById('p1PanelLen');
                const p2LenEl = document.getElementById('p2PanelLen');
                if (p1NameEl) p1NameEl.textContent = '';
                if (p2NameEl) p2NameEl.textContent = '';
                if (p1LenEl) p1LenEl.textContent = '0';
                if (p2LenEl) p2LenEl.textContent = '0';

                // Common defaults for all shortcuts
                currentWallMode = MOD_WALLS.NONE;
                currentSpeedMode = 'NORMAL';
                playerNames = { p1: '', p2: '' };
                // Colors (Pink & Turquoise)
                playerColors.p1 = '#ff4fbf';
                playerColors.p2 = '#35e6e6';
                updatePlayerColors(playerColors.p1, playerColors.p2);

                if (s === 'normal_1p') {
                    gameStyle = 'normal';
                    gameMode = '1P';
                    aiSnakeEnabled = false;
                    playerNames.p2 = ''; // Solo mode — no P2
                } else if (s === 'fc_2p') {
                    gameStyle = 'fastCompetitive';
                    gameMode = '2P';
                    aiSnakeEnabled = false;
                } else if (s === 'fc_1p_ai') {
                    gameStyle = 'fastCompetitive';
                    gameMode = '1P';
                    aiSnakeEnabled = true;
                    playerNames.p2 = ''; // Hide P2 name for AI
                } else {
                    return false;
                }

                menuHistory = getShortcutMenuHistory(s);
                updateUIVisibility();
                consumeShortcutQueryParam();
                openColorMenu();
                return true;
            }

            // v2.93.0: Loading splash with progress bar + preroll
            const _splashLoadingTexts = {
                tr: 'Y\u00fckleniyor...', en: 'Loading...', fr: 'Chargement...', de: 'Laden...',
                es: 'Cargando...', it: 'Caricamento...', pt: 'Carregando...', nl: 'Laden...',
                pl: '\u0141adowanie...', ru: '\u0417\u0430\u0433\u0440\u0443\u0437\u043a\u0430...', ja: '\u8aad\u307f\u8fbc\u307f\u4e2d...', ko: '\ub85c\ub529 \uc911...',
                zh: '\u52a0\u8f7d\u4e2d...', ar: '\u062c\u0627\u0631\u064a \u0627\u0644\u062a\u062d\u0645\u064a\u0644...', hi: '\u0932\u094b\u0921 \u0939\u094b \u0930\u0939\u093e \u0939\u0948...', vi: '\u0110ang t\u1ea3i...',
                th: '\u0e01\u0e33\u0e25\u0e31\u0e07\u0e42\u0e2b\u0e25\u0e14...', id: 'Memuat...', ms: 'Memuatkan...', fil: 'Naglo-load...',
                sv: 'Laddar...'
            };
            (function initSplashText() {
                const el = document.getElementById('splashText');
                if (!el) return;
                const saved = localStorage.getItem('snakeLang');
                const nav = (navigator.language || 'en').slice(0, 2).toLowerCase();
                const lang = saved || (nav in _splashLoadingTexts ? nav : 'en');
                el.textContent = _splashLoadingTexts[lang] || _splashLoadingTexts.en;
            })();

            // Loading bar progress controller
            const SPLASH_DURATION_MS = 3000;
            const _splash = {
                el: document.getElementById('loading-splash'),
                bar: document.getElementById('splashBarFill'),
                progress: 0,
                target: 100,
                timer: null,
                done: false,
                startedAt: performance.now()
            };
            function splashTick(now) {
                if (_splash.done) return;
                const elapsed = Math.max(0, now - _splash.startedAt);
                const ratio = Math.min(1, elapsed / SPLASH_DURATION_MS);
                _splash.progress = ratio * 100;
                if (_splash.bar) _splash.bar.style.width = _splash.progress + '%';
                if (ratio < 1) {
                    _splash.timer = requestAnimationFrame(splashTick);
                }
            }
            _splash.timer = requestAnimationFrame(splashTick);

            function splashComplete(cb) {
                _splash.done = true;
                if (_splash.timer) cancelAnimationFrame(_splash.timer);
                _splash.target = 100;
                _splash.progress = 100;
                if (_splash.bar) _splash.bar.style.width = '100%';
                setTimeout(function() {
                    if (_splash.el) _splash.el.classList.add('fade-out');
                    setTimeout(function() {
                        if (_splash.el) _splash.el.remove();
                        if (cb) cb();
                    }, 30);
                }, 0);
            }

            function initGame() {
                if (!checkShortcuts()) {
                    transitionToMenu(openMainMenu, 'forward');
                }
                applyLang();
                setupMenuButtonTouchPulse();
                updateSoundIcons();
                syncAdSoundConfig();
                scheduleVersionCheck(true, 900);
                window.addEventListener('pageshow', () => scheduleVersionCheck(true, 120), { passive: true });
                window.addEventListener('focus', () => scheduleVersionCheck(false, 120), { passive: true });
                document.addEventListener('visibilitychange', () => {
                    if (!document.hidden) scheduleVersionCheck(false, 120);
                });
                requestAnimationFrame(step);
            }

            // v2.93.2: Preroll removed on all platforms. Mobile preroll format caused
            // full-page redirect when dismissed, kicking users off the site.
            // Between-rounds and rewarded-continue ads remain active.
            setTimeout(() => { splashComplete(initGame); }, SPLASH_DURATION_MS);
        })();</script>
