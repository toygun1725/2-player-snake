    <style>
        :root {

        /* ── v13: Control bar layout ── */
        #p2-controls,
        #p1-controls {
            min-height: 105px;
            width: 100%;
            background: var(--ui-tile);
            flex-shrink: 0;
            display: flex;
            align-items: stretch;
            justify-content: stretch;
            position: relative;
            z-index: 1003;
            gap: 0;
            transition: transform 0.45s cubic-bezier(0.22, 0.61, 0.35, 1), 
                        max-height 0.45s cubic-bezier(0.22, 0.61, 0.35, 1),
                        min-height 0.45s cubic-bezier(0.22, 0.61, 0.35, 1),
                        background 0.3s ease, border-color 0.3s ease;
            will-change: transform, max-height;
            backface-visibility: hidden;
            transform-style: preserve-3d;
            /* overflow: hidden; removed to allow pause bubbles to fan out */
        }

        #p2-controls.hud-hidden,
        #p1-controls.hud-hidden {
            max-height: 0 !important;
            min-height: 0 !important;
            border-top: none;
            border-bottom: none;
            pointer-events: none; /* prevent invisible clicks */
        }

        #p2-controls.hud-hidden {
            transform: translate3d(0, -100%, 0);
        }

        #p1-controls.hud-hidden {
            transform: translate3d(0, 100%, 0);
        }

        [data-theme="light"] #p2-controls,
        [data-theme="light"] #p1-controls {
            background: rgba(255, 255, 255, 0.45);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            border-color: rgba(255, 255, 255, 0.6);
            /* Soft shadow to separate from white background if any */
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.03);
        }

        #p2-controls {
            height: calc(var(--control-bar-base-height) + var(--safe-area-top));
            max-height: 200px;
            min-height: calc(105px + var(--safe-area-top));
            padding-top: 0;
            border-bottom: 1px solid var(--ui-tile-border);
        }

        #p2-controls .p2-panel {
            padding-top: calc(1px + var(--safe-area-top));
        }

        #p1-controls {
            height: calc(var(--control-bar-base-height) + var(--safe-area-bottom));
            max-height: 200px;
            min-height: calc(105px + var(--safe-area-bottom));
            padding-bottom: var(--safe-area-bottom);
            border-top: 1px solid var(--ui-tile-border);
        }

        /* ── v15: Pause butonu panelin içinde, round dotların altında ── */
        .panel-pause-btn {

        .panel-pause-btn:active {

        /* ── v13.1: Center section — column: butonlar üstte, panel altta ── */
        .ctrl-center {
            flex: 1;
            display: flex;
            align-items: stretch;
            min-width: 0;
        }

        /* Panel wrapper: single panel box with pause inside */
        .panel-with-btns {

            flex-direction: column;
            align-items: stretch;
        }

        /* 1PvsAI dual-panel mode */
        #p1-controls.dual-ai .panel-with-btns {
            max-width: none;
            flex-direction: row;
            align-items: stretch;
            justify-content: stretch;
            gap: 0;
        }
        #p1-controls.dual-ai .player-stat-panel {
            flex: 1 1 50%;
            min-width: 0;
            max-width: 50%;
        }
        #aiStatPanel .panel-player-name { display: none; }
        /* Lift p1StatPanel above aiStatPanel so absolute pause btn is not hidden */
        #p1-controls.dual-ai #p1StatPanel {

        /* Pause btn floats at center boundary — no horizontal space taken */
        #p1-controls.dual-ai #pauseBtnP1 {

            z-index: 20;

            height: 36px;

        }
        #p1-controls.dual-ai #pauseBtnP1 > svg {

        }

        /* ── v13.1: Player stat panels (glassmorphism) ── */
        .player-stat-panel {
            flex: 1;
            min-width: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 3px;
            padding: 1px 5px;
            position: relative;
            z-index: 1;
        }

        .player-stat-panel::before {
            content: '';
            position: absolute;
            inset: 0 0;
            border-radius: 12px;
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            pointer-events: none;
            will-change: transform;
        }

        /* Dynamic tint — RGB components set via JS in updatePlayerColors() */
        .player-stat-panel.p1-panel { --pr: 255; --pg: 79; --pb: 191; --panel-color: var(--p1); }
        .player-stat-panel.p2-panel { --pr: 53; --pg: 230; --pb: 230; --panel-color: var(--p2); }

        .player-stat-panel.p1-panel::before,
        .player-stat-panel.p2-panel::before {
            background: linear-gradient(160deg,
                rgba(var(--pr), var(--pg), var(--pb), 0.28) 0%,
                rgba(var(--pr), var(--pg), var(--pb), 0.12) 100%);
            border-color: rgba(var(--pr), var(--pg), var(--pb), 0.38);
            box-shadow: 0 4px 20px rgba(var(--pr), var(--pg), var(--pb), 0.15);
        }

        .panel-player-name {
            font-family: 'Orbitron', sans-serif;
            font-size: 9px;
            font-weight: 700;
            letter-spacing: 0.5px;
            text-transform: uppercase;
            opacity: 0.95;
            text-align: center;
            position: relative;
            z-index: 2;
            line-height: 1.1;
            transform: translateY(-2px);
            margin-bottom: 1px;
        }

        .panel-player-name.p1-name { color: var(--p1); text-shadow: 0 0 8px var(--p1); }
        .panel-player-name.p2-name { color: var(--p2); text-shadow: 0 0 8px var(--p2); }
        .panel-player-name:empty { display: none; }

        .panel-length-number {
            font-family: 'Orbitron', sans-serif;
            font-size: 26px;
            font-weight: 900;
            line-height: 1;
            position: relative;
            z-index: 2;
            text-align: center;
            transform: translateY(-1px);
            margin-bottom: 1px;
        }

        .panel-length-number.p1-num { color: var(--p1); text-shadow: 0 0 12px var(--p1); }
        .panel-length-number.p2-num { color: var(--p2); text-shadow: 0 0 12px var(--p2); }

        .panel-length-label {
            font-family: 'Orbitron', sans-serif;
            font-size: 8px;
            font-weight: 600;
            letter-spacing: 0.3px;
            color: var(--muted);
            text-transform: uppercase;
            position: relative;
            z-index: 2;
            text-align: center;
            opacity: 0.7;
            margin-top: -4px;
        }

        /* Dots inside panels — 2-2-1 layout */
        .panel-dots {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            position: relative;
            z-index: 2;
            margin-top: 1px;
        }

        .panel-dots-row {
            display: flex;
            gap: 4px;
        }

        .panel-dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: rgba(255,255,255,0.08);
            border: 1px solid rgba(255,255,255,0.12);
            flex-shrink: 0;
        }

        .panel-dot.filled-p1 {
            background: radial-gradient(circle at 30% 30%, #fff, var(--p1) 55%, #300b22 140%);
            box-shadow: 0 0 6px var(--p1), inset 0 0 2px #fff6;
            border-color: var(--p1);
        }

        .panel-dot.filled-p2 {
            background: radial-gradient(circle at 30% 30%, #fff, var(--p2) 55%, #083033 140%);
            box-shadow: 0 0 6px var(--p2), inset 0 0 2px #fff6;
            border-color: var(--p2);
        }

        .panel-dot.new-win-p1 {
            background: radial-gradient(circle at 30% 30%, #fff, var(--p1) 55%, #300b22 140%);
            box-shadow: 0 0 6px var(--p1), inset 0 0 2px #fff6;
            border-color: var(--p1);
            animation: panel-dot-pop 0.7s ease-out;
        }

        .panel-dot.new-win-p2 {
            background: radial-gradient(circle at 30% 30%, #fff, var(--p2) 55%, #083033 140%);
            box-shadow: 0 0 6px var(--p2), inset 0 0 2px #fff6;
            border-color: var(--p2);
            animation: panel-dot-pop 0.7s ease-out;
        }

        @keyframes panel-dot-pop {
            0%   { transform: scale(1);   filter: brightness(1); }
            30%  { transform: scale(1.5); filter: brightness(1.8); }
            60%  { transform: scale(1.3); filter: brightness(1.5); }
            100% { transform: scale(1);   filter: brightness(1); }
        }

        /* Self Area 51: clockwise progress fill on player-stat-panel.
           v2.95.6: ring color is the player color (set via --self51-color & --self51-color-rgb). */
        .player-stat-panel.self51-active {
            --self51-pct: 0deg;
            --self51-color: #00e5ff;
            --self51-color-rgb: 0,229,255;
        }
        .player-stat-panel.self51-active::after {
            content: '';
            position: absolute;
            inset: 0;
            border-radius: 12px;
            pointer-events: none;
            z-index: 1;
            background: conic-gradient(
                from 0deg,
                rgba(var(--self51-color-rgb),0.55) 0deg,
                rgba(var(--self51-color-rgb),0.55) var(--self51-pct),
                rgba(var(--self51-color-rgb),0) var(--self51-pct),
                rgba(var(--self51-color-rgb),0) 360deg
            );
            -webkit-mask: linear-gradient(#000, #000);
                    mask: linear-gradient(#000, #000);
            mix-blend-mode: screen;
            opacity: 0.9;
            transition: background 0.18s linear;
        }
        .player-stat-panel.self51-active::before {
            border: 1.5px solid var(--self51-color) !important;
            box-shadow: 0 0 14px rgba(var(--self51-color-rgb),0.55), inset 0 0 12px rgba(var(--self51-color-rgb),0.25) !important;
            animation: self51-pulse 2.4s ease-in-out infinite;
        }
        @keyframes self51-pulse {
            0%, 100% { box-shadow: 0 0 10px rgba(var(--self51-color-rgb),0.45), inset 0 0 8px rgba(var(--self51-color-rgb),0.18); }
            50%      { box-shadow: 0 0 22px rgba(var(--self51-color-rgb),0.85), inset 0 0 16px rgba(var(--self51-color-rgb),0.4); }
        }
        .player-stat-panel.self51-active .panel-length-number {
            font-size: 20px;
            color: #ffffff !important;
            text-shadow: 0 0 10px var(--self51-color), 0 0 18px rgba(var(--self51-color-rgb),0.7) !important;
        }

        #stage {
            flex-grow: 1;

            display: flex;
            align-items: center;
            justify-content: center;

            position: relative;

            height: 100%;
            box-shadow: inset 0 0 0 1px #1a2636;
            background: #09101a;
        }

        canvas {
            width: 100%;

        #canvasWrap.shake {

        @keyframes shake-anim {

                transform: translateX(-4px);

        }

        }

            will-change: transform, opacity;

        }

        @keyframes borderGlow {
            0% {
                border-color: #ff4fbf;
                box-shadow: 0 16px 50px #0004, 0 0 8px rgba(255, 79, 191, 0.3);

            100% {
                border-color: #ff4fbf;
                box-shadow: 0 16px 50px #0004, 0 0 8px rgba(255, 79, 191, 0.3);

        }

        .banner.padded {

        .btn {
            background: var(--ui-tile-soft);
            border: 1px solid var(--ui-tile-border);
            color: var(--text);
            padding: 10px 16px;
            border-radius: 8px;
            font-family: 'Orbitron', sans-serif;

            transition: background 0.3s, color 0.3s, border-color 0.3s, box-shadow 0.3s, transform 0.1s, filter 0.1s;

            width: 100%;
            font-size: 18px;

        /* ── v19: Pause bubble fan system ── */

        /* Blur only the canvas element — overlay/banner inside canvasWrap stays sharp */
        #canvasWrap.paused-blur > canvas {
            filter: blur(10px);
            -webkit-filter: blur(10px);
            transition: filter 0.3s ease;
        }

        #canvasWrap.paused-blur::after {
            content: '';
            position: absolute;
            inset: 0;
            background: rgba(8, 12, 18, 0.20);
            z-index: 10;
            pointer-events: none;
        }

        [data-theme="light"] #canvasWrap.paused-blur::after {
            background: rgba(255, 255, 255, 0.25);
        }

        /* Pause button needs overflow visible and relative for bubble anchoring */
        .panel-pause-btn {
            position: relative;
            overflow: visible;
        }

        /* Container: zero-size anchor point at the pause button center */
        .pause-bubbles {
            position: absolute;
            left: 50%;
            top: 50%;
            width: 0;
            height: 0;
            z-index: 2100;
            pointer-events: none;
        }

        /* Each bubble is absolutely positioned from the pause button center */
        .pause-bubble {
            position: absolute;
            width: 58px;
            height: 58px;
            margin-left: -29px;
            margin-top: -29px;
            border-radius: 50%;
            background: #0d1624;
            border: 1px solid rgba(255, 255, 255, 0.15);
            box-shadow: 0 4px 20px rgba(0,0,0,0.4), 0 0 15px rgba(64,224,208,0.08);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            pointer-events: auto;
            transform: scale(0) translate(0, 0);
            opacity: 0;
        }

        /* Fan target positions — P1 */
        .p1-bubbles .pause-bubble:nth-child(1) { --tx: -62px; --ty: -154px; }
        .p1-bubbles .pause-bubble:nth-child(2) { --tx: 0px;   --ty: -198px; }
        .p1-bubbles .pause-bubble:nth-child(3) { --tx: 62px;  --ty: -154px; }

        /* Fan target positions — P2 (same coords, parent already rotated 180°) */
        .p2-bubbles .pause-bubble:nth-child(1) { --tx: -62px; --ty: -154px; }
        .p2-bubbles .pause-bubble:nth-child(2) { --tx: 0px;   --ty: -198px; }
        .p2-bubbles .pause-bubble:nth-child(3) { --tx: 62px;  --ty: -154px; }

        /* Compact fan positions for 1P vs AI mode (body-anchored, button is low on screen) */
        .anchored-compact.p1-bubbles .pause-bubble:nth-child(1) { --tx: -62px; --ty: -130px; }
        .anchored-compact.p1-bubbles .pause-bubble:nth-child(2) { --tx: 0px;   --ty: -190px; }
        .anchored-compact.p1-bubbles .pause-bubble:nth-child(3) { --tx: 62px;  --ty: -130px; }


        .pause-bubble:active {
            background: #1a2d45;

        .pause-bubble svg {
            width: 30px;
            height: 30px;
            fill: var(--text);
            opacity: 0.9;
        }

        .pause-bubble.bubble-appear {
            animation: bubble-fan-out 0.22s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }

        .pause-bubble.bubble-disappear {
            animation: bubble-fan-in 0.2s ease-in forwards;
        }

        @keyframes bubble-fan-out {
            0%   { transform: scale(0) translate(0, 0); opacity: 0; }
            60%  { transform: scale(1.12) translate(var(--tx), var(--ty)); opacity: 1; }
            100% { transform: scale(1) translate(var(--tx), var(--ty)); opacity: 1; }
        }

        @keyframes bubble-fan-in {
            0%   { transform: scale(1) translate(var(--tx), var(--ty)); opacity: 1; }
            100% { transform: scale(0) translate(0, 0); opacity: 0; }
        }

        .dot.new-win-p1 {

            background: radial-gradient(circle at 30% 30%, #fff, var(--p2) 55%, #083033 140%);

        @keyframes round-win-celebration {
            0% {
                transform: scale(1);
                filter: brightness(1);
                box-shadow: 0 0 14px currentColor, inset 0 0 3px #fff6;
            }

            25% {
                transform: scale(1.3);
                filter: brightness(1.5);
                box-shadow: 0 0 25px currentColor, 0 0 40px currentColor, inset 0 0 3px #fff6;
            }

            50% {
                transform: scale(1.2);
                filter: brightness(1.8);
                box-shadow: 0 0 30px currentColor, 0 0 50px currentColor, inset 0 0 3px #fff6;
            }

            75% {
                transform: scale(1.15);
                filter: brightness(1.6);
                box-shadow: 0 0 20px currentColor, 0 0 35px currentColor, inset 0 0 3px #fff6;
            }

            100% {

            /* ==============================
              2 Player Snake - Beta v2.95.7 Mobile

            const VERSION = 'v2.96.8';
            const VERSION_CHECK_INTERVAL_MS = 45000;

            function hapticVibrate(duration) {
                if (window.Android && typeof window.Android.triggerVibration === 'function') {
                    window.Android.triggerVibration(duration.toString());
                } else if (navigator.vibrate) {
                    navigator.vibrate(duration);
                }
            }

            let lastVersionCheckAt = 0;
            let versionCheckInFlight = false;
            let pendingVersionRefresh = null;
            let versionReloadIssued = false;

            function stripTransientVersionParams() {
                try {
                    const url = new URL(window.location.href);
                    const hadTransientParams =
                        url.searchParams.has('__v') ||
                        url.searchParams.has('__ts') ||
                        url.searchParams.has('__versionCheck');
                    if (!hadTransientParams) return;
                    url.searchParams.delete('__v');
                    url.searchParams.delete('__ts');
                    url.searchParams.delete('__versionCheck');
                    history.replaceState(null, '', url.toString());
                } catch (err) {
                    console.warn('Could not normalize version-check URL params:', err);
                }
            }

            function parseVersionParts(version) {
                return String(version || '')
                    .replace(/^[^\d]*/, '')
                    .split('.')
                    .map(part => parseInt(part, 10))
                    .filter(part => !Number.isNaN(part));
            }

            function compareVersions(a, b) {
                const pa = parseVersionParts(a);
                const pb = parseVersionParts(b);
                const len = Math.max(pa.length, pb.length);
                for (let i = 0; i < len; i++) {
                    const av = pa[i] || 0;
                    const bv = pb[i] || 0;
                    if (av > bv) return 1;
                    if (av < bv) return -1;
                }
                return 0;
            }

            function extractVersionFromHtml(html) {
                const versionMatch = html.match(/const VERSION = ['"]([^'"]+)['"]/);
                return versionMatch ? versionMatch[1] : null;
            }

            function buildVersionCheckUrl() {
                const url = new URL(window.location.href);
                url.searchParams.delete('__v');
                url.searchParams.delete('__ts');
                url.searchParams.set('__versionCheck', String(Date.now()));
                return url.toString();
            }

            function canApplyVersionRefreshNow() {
                if (document.hidden || versionReloadIssued) return false;
                if (gameMode !== null) return false;
                if (typeof winAnim !== 'undefined' && winAnim.active) return false;
                if (typeof deathAnim !== 'undefined' && deathAnim.active) return false;
                if (AdManager.adInProgress) return false;
                if (document.querySelector('.rewarded-continue-overlay')) return false;
                return true;
            }

            function reloadWithFreshVersion(targetVersion) {
                if (versionReloadIssued) return;
                versionReloadIssued = true;
                const url = new URL(window.location.href);
                url.searchParams.delete('shortcut');
                url.searchParams.set('__v', targetVersion || VERSION);
                url.searchParams.set('__ts', String(Date.now()));
                window.location.replace(url.toString());
            }

            function maybeApplyPendingVersionRefresh() {
                if (!pendingVersionRefresh) return;
                if (!canApplyVersionRefreshNow()) return;
                const targetVersion = pendingVersionRefresh;
                pendingVersionRefresh = null;
                reloadWithFreshVersion(targetVersion);
            }

            async function checkForFreshVersion(force = false) {
                const now = Date.now();
                if (versionCheckInFlight || versionReloadIssued) return;
                if (!force && (now - lastVersionCheckAt) < VERSION_CHECK_INTERVAL_MS) return;
                lastVersionCheckAt = now;
                versionCheckInFlight = true;
                try {
                    const response = await fetch(buildVersionCheckUrl(), {
                        cache: 'no-store',
                        credentials: 'same-origin',
                        headers: { 'Cache-Control': 'no-cache' }
                    });
                    if (!response.ok) return;
                    const html = await response.text();
                    const remoteVersion = extractVersionFromHtml(html);
                    if (!remoteVersion || compareVersions(remoteVersion, VERSION) <= 0) return;
                    pendingVersionRefresh = remoteVersion;
                    maybeApplyPendingVersionRefresh();
                } catch (err) {
                    console.warn('Version revalidation skipped:', err);
                } finally {
                    versionCheckInFlight = false;
                }
            }

            function scheduleVersionCheck(force = false, delay = 180) {
                window.setTimeout(() => {
                    checkForFreshVersion(force);
                    maybeApplyPendingVersionRefresh();
                }, delay);

            };
            Object.keys(MODE_DESC_STRINGS).forEach(locale => {
                EXTRA_STRINGS[locale] = { ...(EXTRA_STRINGS[locale] || {}), ...MODE_DESC_STRINGS[locale] };
            });

            const LANG_STORAGE_KEY = 'neoSnakeLangMobile';
            const langCycle = ['en', 'tr', 'fr', 'it', 'es', 'de', 'zh', 'hi', 'pl', 'ptbr', 'ar', 'ru', 'id', 'ja', 'ko', 'vi', 'th', 'tl', 'nl', 'el', 'cs'];
            function detectBrowserLang() {
                const candidates = (navigator.languages && navigator.languages.length)
                    ? Array.from(navigator.languages)
                    : [navigator.language || 'en'];
                for (const raw of candidates) {
                    const low = (raw || '').toLowerCase();
                    if (low.startsWith('pt')) return 'ptbr';
                    if (low.startsWith('zh')) return 'zh';
                    const base = low.split('-')[0];
                    if (base === 'in') return 'id';
                    if (langCycle.includes(base)) return base;
                    if (low.startsWith('vi')) return 'vi';
                    if (low.startsWith('th')) return 'th';
                    if (low.startsWith('tl') || low.startsWith('fil')) return 'tl';
                    if (low.startsWith('nl')) return 'nl';
                    if (low.startsWith('el')) return 'el';
                    if (low.startsWith('cs')) return 'cs';
                }
                return 'en';
            }
            let lang = (() => {
                const saved = localStorage.getItem(LANG_STORAGE_KEY);
                if (saved && langCycle.includes(saved)) return saved;
                const d = detectBrowserLang();
                localStorage.setItem(LANG_STORAGE_KEY, d);
                return d;
            })();
            function t(key) {
                return (STRINGS[lang] && STRINGS[lang][key]) ||
                    (EXTRA_STRINGS[lang] && EXTRA_STRINGS[lang][key]) ||
                    (STRINGS['en'] && STRINGS['en'][key]) ||
                    (EXTRA_STRINGS['en'] && EXTRA_STRINGS['en'][key]) ||
                    key;
            }

            function injectRulesObjective(markup) {
                if (!markup) return '';
                const title = RULES_OBJECTIVE_TITLES[lang] || RULES_OBJECTIVE_TITLES.en;
                const text = RULES_OBJECTIVE_TEXTS[lang] || RULES_OBJECTIVE_TEXTS.en;
                return markup.replace(
                    /<div class="rules-section">\s*<h3>[\s\S]*?<\/h3>\s*<p>[\s\S]*?<\/p>\s*<\/div>/,
                    `<div class="rules-section">
  <h3>${title}</h3>
  <p>${text}</p>
</div>`
                );
            }

            function injectRulesAISection(markup) {
                if (!markup) return '';
                const text = RULES_AI_TEXTS[lang] || RULES_AI_TEXTS.en;
                const section = `<div class="rules-section">
  <h3>1P vs AI</h3>
  <p>${text}</p>
</div>`;
                const aiPattern = /<div class="rules-section">\s*<h3>1P vs AI<\/h3>\s*<p>[\s\S]*?<\/p>\s*<\/div>/;
                if (aiPattern.test(markup)) {
                    return markup.replace(aiPattern, section);
                }
                return `${markup}${section}`;
            }

            function stripRulesNoise(markup) {
                if (!markup) return '';
                return markup
                    .replace(/<div class="rules-section">\s*<h3>\s*1P\s*vs\s*AI[^<]*(Reward\s*Continue|Reklamla\s*Devam|Devam)[\s\S]*?<\/div>/gi, '')
                    .replace(/<div class="rules-section">\s*<h3>\s*1P\s*vs\s*AI\s*Reward[^<]*[\s\S]*?<\/div>/gi, '');
            }

            function injectRulesFoodSection(markup) {
                if (!markup) return buildFoodRulesSectionClean();
                const section = buildFoodRulesSectionClean();
                const foodSectionPattern = /<div class="rules-section">\s*<h3>[\s\S]*?(Food|Yem|Nourriture|Cibo|Comida|Jedzenie|食物|खाद्य|مأكولات|Еда|Makanan|フード|먹이|Thức ăn|อาหาร|Pagkain|Voedsel|Τροφ|Jidlo)[\s\S]*?<\/div>/i;
                if (foodSectionPattern.test(markup)) {
                    return markup.replace(foodSectionPattern, section);
                }
                return `${markup}${section}`;
            }

            function getInstructionsMarkup() {
                const markup =
                    (EXTRA_STRINGS[lang] && EXTRA_STRINGS[lang].instructionsTextV254) ||
                    (STRINGS[lang] && STRINGS[lang].instructionsText) ||
                    (EXTRA_STRINGS['en'] && EXTRA_STRINGS['en'].instructionsTextV254) ||
                    (STRINGS['en'] && STRINGS['en'].instructionsText) ||
                    '';
                return injectRulesFoodSection(injectRulesObjective(stripRulesNoise(markup)));
            }

            function isCompetitiveModeActive() {
                if (gameStyle !== 'fastCompetitive' && gameStyle !== 'adventure') return false;
                return gameMode === '2P' || (gameMode === '1P' && aiSnakeEnabled);
            }

            function markFirstAIFood(ownerKey) {
                const isFirstAiFood = gameMode === '1P' && aiSnakeEnabled && ownerKey === 'p2' && !aiFirstPelletEatenThisRound;
                if (isFirstAiFood) aiFirstPelletEatenThisRound = true;
                return isFirstAiFood;
            }

            function shrinkOpponentBy(ownerKey, amount, skipShrink = false) {
                if (skipShrink || !isCompetitiveModeActive() || amount <= 0) return false;
                const otherKey = ownerKey === 'p1' ? 'p2' : 'p1';
                const other = snakes[otherKey];
                if (!other) return false;

                let remaining = amount;
                while (remaining > 0 && other.segments.length > 1) {
                    other.segments.pop();
                    remaining--;
                }

                if (remaining > 0 && other.segments.length === 1) {
                    other.segments.pop();
                    endGame(ownerKey);
                    return true;
                }

                return false;
            }

            function getFastCompetitiveCountdownValue() {
                if (gameStyle !== 'fastCompetitive' || paused || intermission || timerEnded || roundTimerEnd <= 0) return null;
                const timeLeft = roundTimerEnd - performance.now();
                if (timeLeft <= 0 || timeLeft > 3000) return null;
                return Math.ceil(timeLeft / 1000);
            }

            /* === Theme System === */
            function getCurrentTheme() {
                const ct = document.documentElement.getAttribute('data-theme');
                return ct === 'light' ? t('light') : t('dark');
            }
            function toggleTheme() {
                const ct = document.documentElement.getAttribute('data-theme');
                const nt = ct === 'light' ? 'dark' : 'light';
                document.documentElement.setAttribute('data-theme', nt);
                localStorage.setItem('neoSnakeThemeMobile', nt);
            }
            function loadTheme() {
                const saved = localStorage.getItem('neoSnakeThemeMobile') || 'dark';
                document.documentElement.setAttribute('data-theme', saved);
            }
            loadTheme();

            /* === Color Palette & Selection === */
            const COLOR_PALETTE = [
                { name: 'Pink', hex: '#ff4fbf' }, { name: 'Turquoise', hex: '#35e6e6' },
                { name: 'Orange', hex: '#ff9f1c' }, { name: 'Green', hex: '#44ff88' },
                { name: 'Purple', hex: '#9b59b6' }, { name: 'Red', hex: '#e74c3c' },
                { name: 'Yellow', hex: '#f1c40f' }, { name: 'Blue', hex: '#3498db' }
            ];
            let playerColors = { p1: COLOR_PALETTE[0].hex, p2: COLOR_PALETTE[1].hex };
            let playerNames = { p1: '', p2: '' };
            function hexToRgb(hex) {
                const r = parseInt(hex.slice(1, 3), 16);
                const g = parseInt(hex.slice(3, 5), 16);
                const b = parseInt(hex.slice(5, 7), 16);
                return { r, g, b };
            }

            function updatePlayerColors(p1_hex, p2_hex) {
                document.documentElement.style.setProperty('--p1', p1_hex);
                if (p2_hex) document.documentElement.style.setProperty('--p2', p2_hex);
                playerColors.p1 = p1_hex;
                if (p2_hex) playerColors.p2 = p2_hex;

                // Update panel ::before tint via RGB CSS custom properties
                const p1Panel = document.getElementById('p1StatPanel');
                const p2Panel = document.getElementById('p2StatPanel');
                if (p1Panel) {
                    const c = hexToRgb(p1_hex);
                    p1Panel.style.setProperty('--pr', c.r);
                    p1Panel.style.setProperty('--pg', c.g);
                    p1Panel.style.setProperty('--pb', c.b);
                }
                if (p2Panel && p2_hex) {
                    const c = hexToRgb(p2_hex);
                    p2Panel.style.setProperty('--pr', c.r);
                    p2Panel.style.setProperty('--pg', c.g);
                    p2Panel.style.setProperty('--pb', c.b);
                }
                // AI panel uses p2 color
                const aiPanel = document.getElementById('aiStatPanel');
                if (aiPanel && p2_hex) {
                    const c = hexToRgb(p2_hex);
                    aiPanel.style.setProperty('--pr', c.r);
                    aiPanel.style.setProperty('--pg', c.g);
                    aiPanel.style.setProperty('--pb', c.b);
                }

                // Update panel name glow colors
                const p1NameEl = document.getElementById('p1PanelName');
                const p2NameEl = document.getElementById('p2PanelName');
                const aiNameEl = document.getElementById('aiPanelName');
                if (p1NameEl) { p1NameEl.style.color = p1_hex; p1NameEl.style.textShadow = `0 0 8px ${p1_hex}`; }
                if (p2NameEl && p2_hex) { p2NameEl.style.color = p2_hex; p2NameEl.style.textShadow = `0 0 8px ${p2_hex}`; }
                if (aiNameEl && p2_hex) { aiNameEl.style.color = p2_hex; aiNameEl.style.textShadow = `0 0 8px ${p2_hex}`; }

                const p1NumEl = document.getElementById('p1PanelLen');
                const p2NumEl = document.getElementById('p2PanelLen');
                const aiNumEl = document.getElementById('aiPanelLen');
                if (p1NumEl) { p1NumEl.style.color = p1_hex; p1NumEl.style.textShadow = `0 0 12px ${p1_hex}`; }
                if (p2NumEl && p2_hex) { p2NumEl.style.color = p2_hex; p2NumEl.style.textShadow = `0 0 12px ${p2_hex}`; }
                if (aiNumEl && p2_hex) { aiNumEl.style.color = p2_hex; aiNumEl.style.textShadow = `0 0 12px ${p2_hex}`; }
            }

            /* === Canvas === */
            const canvas = document.getElementById('game');
            const canvasWrap = document.getElementById('canvasWrap');
            const ctx = canvas.getContext('2d');
            let GRID_COLS = 36, GRID_ROWS = 54; // Mobile-friendly grid
            let NOTCH_SAFE_ROWS = 0; // Cells reserved for the notch area
            const BASE_TPS = 14.2;
            let dpr = Math.max(1, Math.min(2, window.devicePixelRatio || 1));
            
            function resize() {
                const st = document.getElementById('stage');
                const r = st.getBoundingClientRect();
                if (r.width === 0 || r.height === 0) return; 
                canvas.width = Math.floor(r.width * dpr); canvas.height = Math.floor(r.height * dpr);
                ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

                    if (p2NameEl) p2NameEl.textContent = (playerNames.p2 && playerNames.p2.trim()) || '';
                    if (timeLabel) timeLabel.style.display = '';
                    const p1DotsEl = document.getElementById('p1PanelDots');
                    const p2DotsEl = document.getElementById('p2PanelDots');
                    if (p1DotsEl) p1DotsEl.style.display = '';
                    if (p2DotsEl) p2DotsEl.style.display = '';
                } else { // main menu (gameMode is null)
                    p2Controls.classList.add('hud-hidden');
                    p1Controls.classList.add('hud-hidden');
                    p1Controls.classList.remove('dual-ai');
                }
            }

            function drawSeries() {
                const p1DotsEl  = document.getElementById('p1PanelDots');
                const p2DotsEl  = document.getElementById('p2PanelDots');
                const p1NameEl  = document.getElementById('p1PanelName');
                const p2NameEl  = document.getElementById('p2PanelName');

                const aiDotsEl = document.getElementById('aiPanelDots');
                const aiNameEl = document.getElementById('aiPanelName');

                if (gameMode === '1P' && !aiSnakeEnabled) {
                    // Solo 1P: no round dots
                    if (p1DotsEl) p1DotsEl.innerHTML = '';
                    if (p1NameEl) p1NameEl.textContent = (playerNames.p1 && playerNames.p1.trim()) || '';
                } else if (gameMode === '1P' && aiSnakeEnabled) {
                    // P1 panel shows P1 dots; AI panel shows AI dots
                    if (p1DotsEl) p1DotsEl.innerHTML = buildPanelDots(games.p1, 'p1', lastGames.p1);
                    if (aiDotsEl) aiDotsEl.innerHTML = buildPanelDots(games.p2, 'p2', lastGames.p2);
                    if (p2DotsEl) p2DotsEl.innerHTML = buildPanelDots(games.p2, 'p2', lastGames.p2);
                    if (p1NameEl) p1NameEl.textContent = (playerNames.p1 && playerNames.p1.trim()) || '';
                    if (aiNameEl) aiNameEl.textContent = '';
                    if (p2NameEl) p2NameEl.textContent = '';
                } else {
                    // 2P mode
                    if (p1DotsEl) p1DotsEl.innerHTML = buildPanelDots(games.p1, 'p1', lastGames.p1);
                    if (p2DotsEl) p2DotsEl.innerHTML = buildPanelDots(games.p2, 'p2', lastGames.p2);
                    if (p1NameEl) p1NameEl.textContent = (playerNames.p1 && playerNames.p1.trim()) || '';
                    if (p2NameEl) p2NameEl.textContent = (playerNames.p2 && playerNames.p2.trim()) || '';
                }

                // Also keep legacy series dots in sync (hidden but used by old code paths)
                const renderLegacy = (count, owner, lastCount) => {
                    let html = '';
                    for (let i = 0; i < GAMES_TO_ROUND; i++) {
                        let cls = 'dot';
                        if (i < count) {
                            const isNew = (i === count - 1 && count > lastCount);
                            cls += isNew ? ` new-win-${owner}` : ` win-${owner}`;
                        }
                        html += `<div class="${cls}"></div>`;
                    }
                    return html;
                };
                if (p1Series) p1Series.innerHTML = renderLegacy(games.p1, 'p1', lastGames.p1);
                if (p2Series) p2Series.innerHTML = renderLegacy(games.p2, 'p2', lastGames.p2);

                lastGames = { p1: games.p1, p2: games.p2 };
            }

            function clearBannerGhost() {
                if (activeBannerGhostTimer) {
                    clearTimeout(activeBannerGhostTimer);
                    activeBannerGhostTimer = null;
                }
                if (activeBannerGhost) {
                    activeBannerGhost.remove();
                    activeBannerGhost = null;
                }
            }

            function resetBannerInlineStyles() {
                if (bannerInlineResetTimer) {
                    clearTimeout(bannerInlineResetTimer);
                    bannerInlineResetTimer = null;
                }
                banner.style.transition = '';
                banner.style.opacity = '';
                banner.style.transform = '';
            }

            function transitionToMenu(openFn, direction = 'forward') {
                pendingBannerTransition = direction;
                openFn();
            }

            function markMenuScreen(screenId, resetHistory = false) {
                if (resetHistory) {
                    menuHistory = [];
                }
                currentMenuScreen = screenId;
                updateUIVisibility();
            }

            function getMenuOpener(screenId) {
                switch (screenId) {
                    case MENU_IDS.MAIN: return openMainMenu;
                    case MENU_IDS.GAME_MODE: return openGameModeMenu;
                    case MENU_IDS.GAME_MODE_INFO: return openGameModeInfoMenu;
                    case MENU_IDS.PLAYER_MODE: return openPlayerModeMenu;
                    case MENU_IDS.AI_SNAKE: return openAISnakeMenu;
                    case MENU_IDS.WALL: return openWallMenu;
                    case MENU_IDS.SPEED: return openSpeedMenu;
                    case MENU_IDS.COLOR: return openColorMenu;
                    case MENU_IDS.SETTINGS: return openSettings;
                    case MENU_IDS.LANGUAGE: return openLanguagePicker;
                    case MENU_IDS.DEVELOPERS: return openDevelopers;
                    case MENU_IDS.INSTRUCTIONS: return openInstructions;
                    case MENU_IDS.HIGHSCORE: return openHighscore;

                    case MENU_IDS.QUICK_SETUP: return openQuickSetupMenu;
                    default: return null;
                }
            }

            function buildMenuBackButton(id, backText = t('back')) {
                return `<div class="menu-back-divider">
        <button class="btn big back btn-menu-row" id="${id}">
          <span class="btn-menu-icon"><i class="fa-solid fa-arrow-left"></i></span>
          <span class="btn-menu-sep"></span>
          <span class="btn-menu-text">${backText}</span>
        </button>
      </div>`;
            }

            function wrapMenuBackDivider(content) {
                return `<div class="menu-back-divider">${content}</div>`;
            }

            function navigateToMenu(screenId, direction = 'forward') {
                const opener = getMenuOpener(screenId);
                if (!opener) return;
                if (direction === 'forward' && currentMenuScreen && currentMenuScreen !== screenId) {
                    menuHistory.push(currentMenuScreen);
                }
                transitionToMenu(opener, direction === 'back' ? 'back' : 'forward');
            }

            function goBack(fallbackScreen = MENU_IDS.MAIN) {
                const previousScreen = menuHistory.length ? menuHistory.pop() : fallbackScreen;
                const opener = getMenuOpener(previousScreen);
                if (!opener) return;
                transitionToMenu(opener, 'back');
            }

            function showBanner(html, padded = true, extraBannerClass = '') {
                const transitionDirection = pendingBannerTransition;
                pendingBannerTransition = null;
                const wasVisible = banner.classList.contains('show') && banner.innerHTML.trim() !== '';
                const shouldAnimateSwap = wasVisible && (transitionDirection === 'forward' || transitionDirection === 'back');

                if (shouldAnimateSwap) {
                    clearBannerGhost();
                    const rect = banner.getBoundingClientRect();
                    if (rect.width > 0 && rect.height > 0) {
                        const ghost = banner.cloneNode(true);
                        ghost.style.position = 'fixed';
                        ghost.style.left = `${rect.left}px`;
                        ghost.style.top = `${rect.top}px`;
                        ghost.style.width = `${rect.width}px`;
                        ghost.style.maxWidth = `${rect.width}px`;
                        ghost.style.minWidth = `${rect.width}px`;
                        ghost.style.height = `${rect.height}px`;
                        ghost.style.margin = '0';
                        ghost.style.pointerEvents = 'none';
                        ghost.style.zIndex = '2100';
                        ghost.style.opacity = '1';
                        ghost.style.transform = 'translate3d(0, 0, 0) scale(1)';
                        ghost.style.transition = `transform ${BANNER_SWAP_MS}ms ${BANNER_SWAP_EASE}, opacity ${BANNER_SWAP_MS}ms ease`;
                        document.body.appendChild(ghost);
                        activeBannerGhost = ghost;
                        requestAnimationFrame(() => {
                            const exitOffset = transitionDirection === 'forward' ? -18 : 18;
                            ghost.style.transform = `translate3d(0, ${exitOffset}px, 0) scale(.985)`;
                            ghost.style.opacity = '0';
                        });
                        activeBannerGhostTimer = setTimeout(() => {
                            clearBannerGhost();
                        }, BANNER_SWAP_MS + 80);
                    }
                }

                resetBannerInlineStyles();
                banner.className = 'banner';
                banner.innerHTML = html;
                banner.classList.toggle('padded', padded);
                if (extraBannerClass) extraBannerClass.split(/\s+/).filter(Boolean).forEach(cls => banner.classList.add(cls));

                if (shouldAnimateSwap) {
                    const enterOffset = transitionDirection === 'forward' ? 18 : -18;
                    banner.style.transition = 'none';
                    banner.style.opacity = '0';
                    banner.style.transform = `translate3d(0, ${enterOffset}px, 0) scale(.975)`;
                    void banner.offsetHeight;
                    banner.classList.add('show');
                    requestAnimationFrame(() => {
                        banner.style.transition = `transform ${BANNER_SWAP_MS}ms ${BANNER_SWAP_EASE}, opacity ${BANNER_SWAP_MS}ms ease`;
                        banner.style.opacity = '1';
                        banner.style.transform = 'translate3d(0, 0, 0) scale(1)';
                    });
                    bannerInlineResetTimer = setTimeout(() => {
                        resetBannerInlineStyles();
                    }, BANNER_SWAP_MS + 60);
                } else {
                    requestAnimationFrame(() => {
                        banner.classList.add('show');
                    });
                }
            }

            function triggerMenuButtonPulse(target) {
                const button = target && target.closest ? target.closest('.banner button') : null;
                if (!button || button.disabled) return;
                if (button.classList.contains('menu-touch-pulse')) {
                    button.classList.remove('menu-touch-pulse');
                    void button.offsetWidth;
                }
                if (button.__menuTouchPulseTimer) clearTimeout(button.__menuTouchPulseTimer);
                button.classList.add('menu-touch-pulse');
                button.__menuTouchPulseTimer = setTimeout(() => {
                    button.classList.remove('menu-touch-pulse');
                    button.__menuTouchPulseTimer = null;
                }, 300);
            }

            function setupMenuButtonTouchPulse() {
                if (document.body.dataset.menuTouchPulseBound === '1') return;
                document.body.dataset.menuTouchPulseBound = '1';
                const pulseHandler = (event) => {
                    if (!event.target) return;
                    triggerMenuButtonPulse(event.target);
                };
                if (window.PointerEvent) {
                    document.addEventListener('pointerdown', pulseHandler, { passive: true });
                } else {
                    document.addEventListener('touchstart', pulseHandler, { passive: true });
                    document.addEventListener('mousedown', pulseHandler, { passive: true });
                }
            }

            function hideBanner() {
                pendingBannerTransition = null;
                clearBannerGhost();
                resetBannerInlineStyles();
                banner.classList.remove('show');
            }

            function syncPauseButtons() {
                document.querySelectorAll('.pauseIcon').forEach(icon => icon.style.display = paused ? 'none' : 'block');
                document.querySelectorAll('.playIcon').forEach(icon => icon.style.display = paused ? 'block' : 'none');
            }

            function setPauseState(nextPaused, withSound = false) {
                paused = nextPaused;
                if (withSound) {
                    if (paused) SFX.pause();
                    else SFX.unpause();
                }
                syncPauseButtons();
            }

            function closePauseBubbles(andResume = false) {
                // Remove canvas blur
                const cw = document.getElementById('canvasWrap');
                if (cw) cw.classList.remove('paused-blur');

                // Shrink all bubbles then remove
                document.querySelectorAll('.pause-bubbles').forEach(container => {
                    const bubbles = container.querySelectorAll('.pause-bubble');
                    bubbles.forEach(b => {
                        b.classList.remove('bubble-appear');
                        b.classList.add('bubble-disappear');
                    });
                    setTimeout(() => container.remove(), 220);
                });

                if (andResume) setPauseState(false, true);
            }

                closePauseBubbles();
                AdManager.maybeShowRestartAdThenRestart(() => {
                    hideBanner();
                    stopConfetti();
                    canvasWrap.classList.remove('shake');
                    setPauseState(false);
                    softReset(true);
                });

            function updateUIVisibility() {
                const p2Controls = document.getElementById('p2-controls');
                const p1Controls = document.getElementById('p1-controls');
                const timeLabel = document.getElementById('timeLabel');
                const stage = document.getElementById('stage');
                const p1StatPanel = document.getElementById('p1StatPanel');
                const p2StatPanel = document.getElementById('p2StatPanel');
                const p2NameEl = document.getElementById('p2PanelName');
                const p1NameEl = document.getElementById('p1PanelName');

                // Clear any previously set inline height so flex-grow:1 takes over cleanly
                stage.style.height = '';

                const aiStatPanel = document.getElementById('aiStatPanel');
                const aiNameEl    = document.getElementById('aiPanelName');
                const aiDotsEl    = document.getElementById('aiPanelDots');

                const isPreGameFlow = [
                    MENU_IDS.GAME_MODE,
                    MENU_IDS.PLAYER_MODE,
                    MENU_IDS.AI_SNAKE,
                    MENU_IDS.WALL,
                    MENU_IDS.SPEED,
                    MENU_IDS.COLOR
                ].includes(currentMenuScreen);

                if (gameMode === '1P' && aiSnakeEnabled) {
                    // 1P+AI: dual-panel mode — P1 left, AI right
                    if (p2Controls) p2Controls.classList.add('hud-hidden');
                    if (p1Controls) p1Controls.classList.remove('hud-hidden');
                    if (p1Controls) p1Controls.classList.add('dual-ai');
                    if (p1StatPanel) p1StatPanel.style.display = 'flex';
                    if (p2StatPanel) p2StatPanel.style.display = 'none';
                    if (aiStatPanel) aiStatPanel.style.display = 'flex';
                    if (aiNameEl) aiNameEl.textContent = '';
                    if (timeLabel) timeLabel.style.display = '';
                } else if (gameMode === '1P') {
                    // Solo 1P: only P1 panel, no dots, no AI panel
                    if (p2Controls) p2Controls.classList.add('hud-hidden');
                    if (p1Controls) p1Controls.classList.remove('hud-hidden');
                    if (p1Controls) p1Controls.classList.remove('dual-ai');
                    if (p1StatPanel) p1StatPanel.style.display = 'flex';
                    if (p2StatPanel) p2StatPanel.style.display = 'none';
                    if (aiStatPanel) aiStatPanel.style.display = 'none';
                    if (timeLabel) timeLabel.style.display = 'none';
                } else if (gameMode === '2P' || isPreGameFlow) {
                    // 2P Flow or Mode Picker: both panels visible
                    if (p2Controls) p2Controls.classList.remove('hud-hidden');
                    if (p1Controls) p1Controls.classList.remove('hud-hidden');
                    if (p1Controls) p1Controls.classList.remove('dual-ai');
                    if (p1StatPanel) p1StatPanel.style.display = 'flex';
                    if (p2StatPanel) p2StatPanel.style.display = 'flex';
                    if (aiStatPanel) aiStatPanel.style.display = 'none';
                    if (p2NameEl) p2NameEl.textContent = (playerNames.p2 && playerNames.p2.trim()) || '';
                    if (timeLabel) timeLabel.style.display = (isPreGameFlow ? 'none' : '');
                } else { // main menu or other menus
                    if (p2Controls) p2Controls.classList.add('hud-hidden');
                    if (p1Controls) p1Controls.classList.add('hud-hidden');
                    if (p1Controls) p1Controls.classList.remove('dual-ai');
                }

                // Common logic
                const p1DotsEl = document.getElementById('p1PanelDots');
                const p2DotsEl = document.getElementById('p2PanelDots');
                if (gameMode === '2P' || (gameMode === '1P' && aiSnakeEnabled)) {
                    if (p1DotsEl) p1DotsEl.style.display = '';
                    if (p2DotsEl) p2DotsEl.style.display = (gameMode === '2P' ? '' : 'none');
                    if (aiDotsEl && gameMode === '1P') aiDotsEl.style.display = '';
                } else {
                    if (p1DotsEl) p1DotsEl.style.display = 'none';
                    if (p2DotsEl) p2DotsEl.style.display = 'none';
                }

                // Refresh P1 panel name
                if (p1NameEl) p1NameEl.textContent = (playerNames.p1 && playerNames.p1.trim()) || '';

                drawSeries();

                // v2.95.6: Self Area 51 — keep series dots visible (5 round wins to take match);
                // hide only the round timer; activate per-player progress ring on the stat panels.
                {
                    const isSelf51 = (gameStyle === 'selfArea51');
                    if (isSelf51) {
                        if (timeLabel) timeLabel.style.display = 'none';
                        if (p1StatPanel) p1StatPanel.classList.add('self51-active');
                        if (p2StatPanel) p2StatPanel.classList.add('self51-active');
                        if (aiStatPanel) aiStatPanel.classList.add('self51-active');
                    } else {
                        if (p1StatPanel) p1StatPanel.classList.remove('self51-active');
                        if (p2StatPanel) p2StatPanel.classList.remove('self51-active');
                        if (aiStatPanel) aiStatPanel.classList.remove('self51-active');
                    }
                }

                resize();
            }

            function updateSelfArea51Panels() {
                if (gameStyle !== 'selfArea51' || !snakes) return;
                const l1 = snakes.p1 ? snakes.p1.segments.length : 0;
                const l2 = snakes.p2 ? snakes.p2.segments.length : 0;
                const pct1 = Math.min(1, l1 / SELF_AREA_51_TARGET);
                const pct2 = Math.min(1, l2 / SELF_AREA_51_TARGET);
                const p1Panel = document.getElementById('p1StatPanel');
                const p2Panel = document.getElementById('p2StatPanel');

                // v2.95.6: ring color = player color
                const colP1 = playerColors.p1 || '#00e5ff';
                const colP2 = playerColors.p2 || '#ff4fbf';
                const rgbP1 = hexToRgbTuple(colP1);
                const rgbP2 = hexToRgbTuple(colP2);
                if (p1Panel) {
                    p1Panel.style.setProperty('--self51-pct', (pct1 * 360).toFixed(1) + 'deg');
                    p1Panel.style.setProperty('--self51-color', colP1);
                    p1Panel.style.setProperty('--self51-color-rgb', rgbP1);

            // v2.95.6: convert "#rrggbb" → "r,g,b" tuple for CSS rgba() usage
            function hexToRgbTuple(hex) {
                if (!hex) return '255,255,255';
                let c = hex.replace('#', '');
                if (c.length === 3) c = c[0] + c[0] + c[1] + c[1] + c[2] + c[2];
                const n = parseInt(c, 16);
                return `${(n >> 16) & 255},${(n >> 8) & 255},${n & 255}`;

                let out = cells.map(c => ({ ...c }));
                for (let t = 0; t < times; t++) {
                    out = out.map(c => ({ x: c.y, y: -c.x }));
                    const minX = Math.min(...out.map(c => c.x));
                    const minY = Math.min(...out.map(c => c.y));
                    out = out.map(c => ({ x: c.x - minX, y: c.y - minY }));
                }
                return out;
            }
            function translateCells(cells, dx, dy) { return cells.map(c => ({ x: c.x + dx, y: c.y + dy })); }
            function getBarrierCellsSet() {
                const set = new Set();
                for (const b of barriers) { if (!b || !b.cells) continue; for (const c of b.cells) { set.add(c.x + ',' + c.y); } }
                return set;
            }
            function spawnBarriers(desiredCount) {
                barriers = [];
                const maxAttempts = 2000;
                let attempts = 0;

                // Pre-build static occupancy once for this round
                const baseOcc = new Set();
                foods.forEach(f => baseOcc.add(f.x + ',' + f.y));
                portals.forEach(p => baseOcc.add(p.x + ',' + p.y));

                // Center safe zone (approx. starting positions)
                const cx = Math.floor(GRID_COLS / 2), cy = Math.floor(GRID_ROWS / 2);
                for (let x = cx - 3; x <= cx + 3; x++) {
                    for (let y = cy - 3; y <= cy + 3; y++) baseOcc.add(x + ',' + y);
                }

                // Snake safe zones
                const addSnakeOcc = (s) => {
                    if (!s || !s.segments) return;
                    s.segments.forEach((seg, idx) => {
                        if (idx === 0) {
                            // Head safety zone: 3x3
                            for (let bx = -1; bx <= 1; bx++) {
                                for (let by = -1; by <= 1; by++) baseOcc.add((seg.x + bx) + ',' + (seg.y + by));
                            }
                        } else {
                            // Body: just the segment itself
                            baseOcc.add(seg.x + ',' + seg.y);
                        }
                    });
                };
                if (snakes) {
                    addSnakeOcc(snakes.p1);
                    addSnakeOcc(snakes.p2);
                }

                while (barriers.length < desiredCount && attempts++ < maxAttempts) {
                    const base = TETROMINO_SHAPES[(Math.random() * TETROMINO_SHAPES.length) | 0];
                    const rot = (Math.random() * 4) | 0;
                    let cells = rotateCells(base, rot);
                    const maxX = GRID_COLS - Math.max(...cells.map(c => c.x)) - 1;
                    const maxY = GRID_ROWS - Math.max(...cells.map(c => c.y)) - 1;
                    const dx = (Math.random() * Math.max(1, maxX)) | 0;
                    const dy = (Math.random() * Math.max(1, maxY)) | 0;
                    cells = translateCells(cells, dx, dy);

                    let valid = true;
                    // Current round barriers
                    const currentBarrierCells = getBarrierCellsSet();
                    
                    for (const c of cells) {
                        if (c.x < 0 || c.x >= GRID_COLS || c.y < 0 || c.y >= GRID_ROWS) { valid = false; break; }
                        const key = c.x + ',' + c.y;
                        if (baseOcc.has(key) || currentBarrierCells.has(key)) { valid = false; break; }
                    }
                    if (!valid) continue;
                    barriers.push({ cells });
                }
            }


            function spawnPortals() {
                if (teleportingOwner) return;
                portals = [];
                for (let i = 0; i < 2; i++) {
                    let tries = 0;
                    const occ = new Set();
                    if (snakes && snakes.p1) snakes.p1.segments.forEach(s => occ.add(s.x + ',' + s.y));
                    if (snakes && snakes.p2) snakes.p2.segments.forEach(s => occ.add(s.x + ',' + s.y));
                    foods.forEach(f => occ.add(f.x + ',' + f.y));
                    for (const b of barriers) { if (b && b.cells) for (const c of b.cells) occ.add(c.x + ',' + c.y); }
                    portals.forEach(p => occ.add(p.x + ',' + p.y));
                    let p;
                    do { p = rngCell(); tries++; if (tries > 800) return; } while (occ.has(p.x + ',' + p.y));
                    portals.push({ x: p.x, y: p.y, id: i });
                }
                portalTimerMs = 15000;
            }
            function isPortalCell(x, y) {
                if (!portals || portals.length !== 2) return false;
                return (portals[0].x === x && portals[0].y === y) || (portals[1].x === x && portals[1].y === y);
            }
            function otherPortal(x, y) {
                if (!portals || portals.length !== 2) return null;
                if (portals[0].x === x && portals[0].y === y) return portals[1];
                if (portals[1].x === x && portals[1].y === y) return portals[0];
                return null;
            }

            /* === Helpers === */
            function rngCell() {
                const minY = (!intermission) ? NOTCH_SAFE_ROWS : 0;
                const maxY = GRID_ROWS;
                
                if (currentWallMode === MOD_WALLS.SOLID) {
                    return { 
                        x: 1 + (Math.random() * (GRID_COLS - 2)) | 0, 
                        y: (minY + 1) + (Math.random() * (maxY - minY - 2)) | 0 
                    };
                }
                return { 
                    x: (Math.random() * GRID_COLS) | 0, 
                    y: minY + (Math.random() * (maxY - minY)) | 0 
                };
            }
            function handleBoundaries(c, ownerKey) {
                if (gameStyle === 'selfArea51' && ownerKey) {
                    return selfArea51WrapForOwner(c, ownerKey);
                }
                let { x, y } = c;
                if (currentWallMode === MOD_WALLS.SOLID) {
                    if (x < 0 || x >= GRID_COLS || y < 0 || y >= GRID_ROWS) return null;
                } else {
                    if (x < 0) x = GRID_COLS - 1; else if (x >= GRID_COLS) x = 0;
                    if (y < 0) y = GRID_ROWS - 1; else if (y >= GRID_ROWS) y = 0;
                }
                return { x, y };
            }

            // === Self Area 51 helpers (mobile = horizontal split) ===
            // P1 occupies the BOTTOM half (closer to P1 controls), P2 occupies the TOP half.
            function selfArea51HalfBounds(ownerKey) {
                const half = (GRID_ROWS / 2) | 0;
                if (ownerKey === 'p2') return { yMin: 0, yMax: half - 1 };
                return { yMin: half, yMax: GRID_ROWS - 1 };
            }
            function selfArea51WrapForOwner(c, ownerKey) {
                const { yMin, yMax } = selfArea51HalfBounds(ownerKey);
                let x = c.x, y = c.y;
                if (x < 0) x = GRID_COLS - 1; else if (x >= GRID_COLS) x = 0;
                if (y < yMin) y = yMax;
                else if (y > yMax) y = yMin;
                return { x, y };
            }
            function rngCellForHalf(ownerKey) {
                const { yMin, yMax } = selfArea51HalfBounds(ownerKey);
                return {
                    x: (Math.random() * GRID_COLS) | 0,
                    y: yMin + (Math.random() * (yMax - yMin + 1)) | 0
                };
            }
            function findFreeFoodCellForHalf(occ, ownerKey) {
                let cell, tries = 0;
                do { cell = rngCellForHalf(ownerKey); tries++; if (tries > 800) break; } while (occ.has(cell.x + ',' + cell.y));
                return cell;
            }

            async function countdown(n) {
                inCountdown = true;
                roundCount++;
                const numColor = (roundCount % 2 !== 0) ? playerColors.p1 : playerColors.p2;
                const startColor = (roundCount % 2 !== 0) ? playerColors.p2 : playerColors.p1;

                    showBanner(`<div class="countdown-text" style="color: ${numColor}; text-shadow: 0 0 8px ${numColor};">${i}</div>`, false);

                }
                showBanner(`<div class="countdown-text start" style="color: ${startColor}; text-shadow: 0 0 5px ${startColor};">${t('start')}</div>`, false); SFX.start();

                }

            }

            function modLerp(prev, cur, cap, t) {
                if (currentWallMode === MOD_WALLS.SOLID) return prev + (cur - prev) * t;
                let a = prev, b = cur, d = b - a;
                if (d > cap / 2) a += cap; else if (d < -cap / 2) a -= cap;
                const v = a + (b - a) * t;
                let out = v % cap; if (out < 0) out += cap;
                return out;
            }
            // v2.95.6: Self Area 51 — half-aware Y-axis lerp so wrap inside a player's
            // half (Mobile horizontal split) renders like a normal screen-edge wrap.
            function selfArea51LerpY(prev, cur, ownerKey, t) {
                const { yMin, yMax } = selfArea51HalfBounds(ownerKey);
                const span = yMax - yMin + 1;
                let a = prev - yMin, b = cur - yMin, d = b - a;
                if (d > span / 2) a += span; else if (d < -span / 2) a -= span;
                const v = a + (b - a) * t;
                let out = v % span; if (out < 0) out += span;
                return out + yMin;
            }
            function hexToRgba(hex, alpha = 1.0) {
                if (!hex) return `rgba(255,255,255,${alpha})`;
                let c = hex.replace('#', '');
                if (c.length === 3) c = c[0] + c[0] + c[1] + c[1] + c[2] + c[2];
                const bigint = parseInt(c, 16);
                return `rgba(${(bigint >> 16) & 255},${(bigint >> 8) & 255},${bigint & 255},${alpha})`;
            }

            function varToCss(varName) {
                return getComputedStyle(document.documentElement).getPropertyValue(varName).trim();
            }

            function updateTimerUI(timeLeftMs) {
                if (gameMode !== '2P' && !(gameMode === '1P' && aiSnakeEnabled)) return;
                const label = document.getElementById('timeLabel');
                if (!label) return;
                // v2.61: Fast competitive and adventure have a timer
                if (gameStyle !== 'fastCompetitive' && gameStyle !== 'adventure') {
                    label.textContent = '\u221e'; // ∞
                    return;
                }
                if (!isFinite(timeLeftMs) || timeLeftMs > 100000000) {
                    label.textContent = '\u221e';
                    return;
                }
                let ms = Math.max(0, timeLeftMs);
                const secs = Math.ceil(ms / 1000);
                if (secs <= 10 && secs > 0 && Math.ceil(lastTimeLeft / 1000) > secs) SFX.countdownTick();
                lastTimeLeft = ms;
                const m = Math.floor(secs / 60), s = secs % 60;
                label.textContent = `${m.toString().padStart(2, '0')}:${s.toString().padStart(2, '0')}`;
                if (intermission) label.style.display = 'none';
            }

            function endRoundByTime() {
                if (!snakes) return;
                if (gameMode !== '2P' && !(gameMode === '1P' && aiSnakeEnabled)) return;
                const l1 = snakes.p1.segments.length, l2 = snakes.p2.segments.length;
                if (l1 > l2) endGame('p1');
                else if (l2 > l1) endGame('p2');
                else endGame('draw');
            }

            /* === Core === */
            const dirMap = { up: { x: 0, y: -1 }, down: { x: 0, y: 1 }, left: { x: -1, y: 0 }, right: { x: 1, y: 0 } };
            function opposite(a, b) { return a.x === -b.x && a.y === -b.y; }
            function createSnake(start, dir, len = 6) {
                const seg = [];
                for (let i = 0; i < len; i++) {
                    seg.push({ x: start.x - i * dir.x, y: start.y - i * dir.y });
                }
                return { segments: seg, prev: seg.map(s => ({ ...s })), dir: { ...dir }, nextDir: { ...dir }, grow: 0, powerEnd: 0, flashUntil: 0, flashColor: null, shakeUntil: 0, digestAnims: [], slowEnd: 0 };
            }
            function isPowered(s) { return s && performance.now() < s.powerEnd; }

            const GAMES_TO_ROUND = 5;

            function speedMult(s) {
                if (!s) return 1.00;
                let mult = isPowered(s) ? 1.45 : 1.00;
                if (performance.now() < s.slowEnd) mult *= 0.5;
                return mult;
            }

            function buildRespawnSegments(head, dir, len = 5) {
                if (!head || !dir) return null;
                const segments = [{ x: head.x, y: head.y }];
                let cursor = { ...head };
                for (let i = 1; i < len; i++) {
                    const next = handleBoundaries({ x: cursor.x - dir.x, y: cursor.y - dir.y });
                    if (!next) return null;
                    segments.push(next);
                    cursor = next;
                }
                const unique = new Set(segments.map(seg => seg.x + ',' + seg.y));
                return unique.size === segments.length ? segments : null;
            }

            function getRespawnTargetHead(head, dir, distance = 15) {
                let cursor = { ...head };
                for (let i = 0; i < distance; i++) {
                    const next = handleBoundaries({ x: cursor.x - dir.x, y: cursor.y - dir.y });
                    if (!next) break;
                    cursor = next;
                }
                return cursor;
            }

            function findSafeRewardRespawnHead(targetHead, dir, len, blockedCells) {
                const start = handleBoundaries(targetHead) || rngCell();
                if (!start) return null;

                const queue = [start];
                const visited = new Set([start.x + ',' + start.y]);
                const searchDirs = [dirMap.up, dirMap.right, dirMap.down, dirMap.left];

                while (queue.length) {
                    const cell = queue.shift();
                    const segments = buildRespawnSegments(cell, dir, len);
                    const forwardCell = handleBoundaries({ x: cell.x + dir.x, y: cell.y + dir.y });
                    const isSafe = segments &&
                        forwardCell &&
                        segments.every(seg => !blockedCells.has(seg.x + ',' + seg.y)) &&
                        !blockedCells.has(forwardCell.x + ',' + forwardCell.y);

                    if (isSafe) return cell;

                    for (const stepDir of searchDirs) {
                        const next = handleBoundaries({ x: cell.x + stepDir.x, y: cell.y + stepDir.y });
                        if (!next) continue;
                        const key = next.x + ',' + next.y;
                        if (visited.has(key)) continue;
                        visited.add(key);
                        queue.push(next);
                    }
                }

                return null;
            }

            function buildRewardedContinueSnake(snapshotSnake, enemySnake) {
                const dir = snapshotSnake && snapshotSnake.dir ? { ...snapshotSnake.dir } : { ...dirMap.right };
                const originalHead = snapshotSnake && snapshotSnake.segments && snapshotSnake.segments[0]
                    ? { ...snapshotSnake.segments[0] }
                    : { x: Math.floor(GRID_COLS / 2), y: Math.floor(GRID_ROWS / 2) };
                const blockedCells = new Set();
                if (enemySnake && Array.isArray(enemySnake.segments)) {
                    enemySnake.segments.forEach(seg => blockedCells.add(seg.x + ',' + seg.y));
                }

                const targetHead = getRespawnTargetHead(originalHead, dir, 15);
                const fallbackHead = findSafeRewardRespawnHead(
                    { x: Math.floor(GRID_COLS / 2), y: Math.floor(GRID_ROWS / 2) },
                    dir,
                    5,
                    blockedCells
                );
                const safeHead =
                    findSafeRewardRespawnHead(targetHead, dir, 5, blockedCells) ||
                    findSafeRewardRespawnHead(originalHead, dir, 5, blockedCells) ||
                    fallbackHead;

                const segments = buildRespawnSegments(
                    safeHead || originalHead,
                    dir,
                    5
                ) || createSnake(
                    fallbackHead || { x: Math.floor(GRID_COLS / 2), y: Math.floor(GRID_ROWS / 2) },
                    dir,
                    5
                ).segments;

                return {
                    segments,
                    prev: segments.map(seg => ({ ...seg })),
                    dir: { ...dir },
                    nextDir: { ...dir },
                    grow: 0,
                    powerEnd: 0,
                    flashUntil: 0,
                    flashColor: null,
                    shakeUntil: 0,
                    digestAnims: [],
                    slowEnd: 0
                };
            }

            // AI Snake pathfinding using BFS
            function calculateAIMove(aiSnake, playerSnake, foods, wallMode) {
                if (!aiSnake || aiSnake.segments.length === 0) return null;
                const head = aiSnake.segments[0];
                const currentDir = aiSnake.dir;

                const isSelf51 = (gameStyle === 'selfArea51');
                const aiHalf = isSelf51 ? selfArea51HalfBounds('p2') : null;

                // Find nearest food (prefer green diamond in Self Area 51)
                let nearestFood = null;
                let minDist = Infinity;
                const candidates = isSelf51
                    ? foods.filter(f => f.selfArea51Half === 'p2')
                    : foods;
                if (isSelf51) {
                    const greens = candidates.filter(f => f.type === 'green');
                    if (greens.length) {
                        // pick closest green
                        for (const f of greens) {
                            const dist = Math.abs(f.x - head.x) + Math.abs(f.y - head.y);
                            if (dist < minDist) { minDist = dist; nearestFood = f; }
                        }
                    } else {
                        for (const f of candidates) {
                            const dist = Math.abs(f.x - head.x) + Math.abs(f.y - head.y);
                            if (dist < minDist) { minDist = dist; nearestFood = f; }
                        }
                    }
                } else {
                    for (const f of foods) {
                        const dist = Math.abs(f.x - head.x) + Math.abs(f.y - head.y);
                        if (dist < minDist) {
                            minDist = dist;
                            nearestFood = f;
                        }
                    }
                }
                if (!nearestFood) return currentDir;

                // BFS to find path to food
                const queue = [{ x: head.x, y: head.y, path: [] }];
                const visited = new Set();
                visited.add(head.x + ',' + head.y);

                // Obstacles: own body (and player body when not in Self Area 51)
                const obstacles = new Set();
                aiSnake.segments.forEach(s => obstacles.add(s.x + ',' + s.y));
                if (!isSelf51 && playerSnake) playerSnake.segments.forEach(s => obstacles.add(s.x + ',' + s.y));

                const dirs = [dirMap.up, dirMap.down, dirMap.left, dirMap.right];

                let iterations = 0;
                while (queue.length > 0 && iterations < 2000) {
                    const curr = queue.shift();
                    iterations++;

                    if (curr.x === nearestFood.x && curr.y === nearestFood.y) {
                        if (curr.path.length > 0) return curr.path[0];
                        return currentDir;
                    }

                    for (const d of dirs) {
                        if (curr.path.length === 0 && opposite(d, currentDir)) continue;

                        let nx = curr.x + d.x;
                        let ny = curr.y + d.y;

                        // Handle walls
                        if (isSelf51) {
                            const w = selfArea51WrapForOwner({ x: nx, y: ny }, 'p2');
                            nx = w.x; ny = w.y;
                        } else if (wallMode === MOD_WALLS.SOLID) {
                            if (nx < 0 || nx >= GRID_COLS || ny < 0 || ny >= GRID_ROWS) continue;
                        } else {
                            if (nx < 0) nx = GRID_COLS - 1; else if (nx >= GRID_COLS) nx = 0;
                            if (ny < 0) ny = GRID_ROWS - 1; else if (ny >= GRID_ROWS) ny = 0;
                        }

                        const key = nx + ',' + ny;
                        if (!visited.has(key) && !obstacles.has(key)) {
                            visited.add(key);
                            queue.push({ x: nx, y: ny, path: [...curr.path, d] });
                        }
                    }
                }

                // If no path found, try any valid move to survive
                for (const d of dirs) {
                    if (opposite(d, currentDir)) continue;
                    let nx = head.x + d.x;
                    let ny = head.y + d.y;
                    if (isSelf51) {
                        const w = selfArea51WrapForOwner({ x: nx, y: ny }, 'p2');
                        nx = w.x; ny = w.y;
                    } else if (wallMode === MOD_WALLS.SOLID) {
                        if (nx < 0 || nx >= GRID_COLS || ny < 0 || ny >= GRID_ROWS) continue;
                    } else {
                        if (nx < 0) nx = GRID_COLS - 1; else if (nx >= GRID_COLS) nx = 0;
                        if (ny < 0) ny = GRID_ROWS - 1; else if (ny >= GRID_ROWS) ny = 0;
                    }
                    if (!obstacles.has(nx + ',' + ny)) return d;
                }

                return currentDir;
            }

            function softReset(full = false, countdownNum = 3) {
                // FIX: Control bars have a 0.45s CSS transition (height 0→105px).
                // If resize() runs while they're mid-transition, GRID_ROWS is wrong
                // and cells become non-square (snake moves farther in one axis).
                // Solution: temporarily suppress transitions, force a layout reflow,
                // then call resize() so it sees the bars' final rendered height.
                {
                    const p1c = document.getElementById('p1-controls');
                    const p2c = document.getElementById('p2-controls');

                foods = [];

                const x1 = Math.floor(GRID_COLS * 0.25);
                const x2 = Math.floor(GRID_COLS * 0.75);

                if (gameStyle === 'selfArea51') {
                    // Horizontal split: P1 in BOTTOM half, P2 in TOP half
                    const halfRows = Math.floor(GRID_ROWS / 2);
                    const cx = Math.floor(GRID_COLS / 2);
                    const p1Y = halfRows + Math.floor(halfRows / 2); // center of bottom half
                    const p2Y = Math.floor(halfRows / 2);            // center of top half
                    const startLen = 5;
                    snakes = {

                        snakes = {
