<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Neo Snake Duel — Alpha v0.25</title>
  <!-- Import fonts: Orbitron for neon/matrix style, VT323 for digital timer -->
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600&family=VT323&display=swap" rel="stylesheet">
  <!-- Version: Alpha v0.25 -->
  <style>
    :root{
      --bg:#0b0f14;
      --grid:#1a2537;
      --p1:#ff4fbf;       /* Pembe (Player 1) */
      --p2:#35e6e6;       /* Turkuaz (Player 2) */
      --gold:#ffd166;     /* Elmas (sarı) */
      --heart:#ff1744;    /* Yakut kırmızısı */
      --ui-tile:#0c141f;
      --ui-tile-border:#1b2a41;
      --ui-tile-soft:#0f1a2a;
      --text:#e7f1ff;
      --muted:#9fb3d1;
    }
    *{box-sizing:border-box}
    html,body{height:100%}
    body{
      margin:0;background:var(--bg);color:var(--text);
      /* Genel yazı tipi Orbitron olarak ayarlandı */
      font-family:'Orbitron', ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial;
      overflow:hidden
    }
    .wrap{height:100%;display:grid;grid-template-rows:1fr auto}
    #stage{position:relative;height:calc(100vh - 180px)}
    #canvasWrap{
      position:relative;width:100%;height:100%;border-radius:22px;overflow:hidden;
      box-shadow:0 44px 130px #000a,0 12px 44px #0009,inset 0 0 0 1px #1a2636;
      background:#09101a
    }
    canvas{width:100%;height:100%;display:block;
      background:radial-gradient(1200px 900px at 50% -30%, #122034 0%, #0b121c 40%, #081018 75%, #050a10 100%)
    }
    #canvasWrap::before{
      content:"";position:absolute;inset:0;
      background:linear-gradient(transparent,rgba(0,0,0,.35)),
                 repeating-linear-gradient(180deg,#0000 0 2px,#0003 2px 3px);
      mix-blend-mode:multiply;pointer-events:none
    }

    /* Hide the old HUD; version info will be shown in main menu */
    .hudTop{display:none!important}

    .overlay{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none;z-index:6}
    .banner{
      pointer-events:auto;min-width:320px;max-width:92%;text-align:center;padding:18px 22px;border-radius:18px;
      background:linear-gradient(180deg,#0d1624ee,#0a111de0);
      border:1px solid #1b2a41;box-shadow:0 16px 50px #0009;
      transform:translateY(10px) scale(.96);opacity:0;transition:all .45s cubic-bezier(.2,.8,.2,1)
    }
    .banner.show{transform:translateY(0) scale(1);opacity:1}
    .banner h1{margin:0 0 6px;font-size:clamp(22px,4.2vw,44px);letter-spacing:1px}
    .banner p{margin:0;opacity:.9;font-size:14px}
    .banner .p1{color:var(--p1)} .banner .p2{color:var(--p2)} .banner .draw{color:#9ed0ff}

    /* New footer layout */
    footer{
      height:180px;
      display:flex;
      justify-content:space-between;
      align-items:flex-start;
      gap:10px;
      padding:14px;
      background:linear-gradient(180deg,#0e1726cc,#0a111dcc);
      border-top:1px solid #1b2a41;
      backdrop-filter:blur(6px)
    }
    .panel-left, .panel-right{
      display:flex;
      flex-direction:column;
      gap:10px;
      align-items:flex-start;
    }
    .panel-right{align-items:flex-end}
    .panel-center{
      flex:1;
      display:flex;
      flex-direction:column;
      align-items:center;
      gap:10px;
    }
    /* Buttons */
    .btn{
      padding:12px 16px;
      border-radius:12px;
      background:var(--ui-tile-soft);
      border:1px solid var(--ui-tile-border);
      color:#d9e6ff;
      cursor:pointer;
      font-weight:800;
      letter-spacing:.3px;
      font-size:14px;
    }
    .btn:hover{filter:brightness(1.08)}
    .btn.big{padding:14px 18px;font-size:16px}

    /* Player labels and timer */
    .players-header{
      display:flex;
      justify-content:space-between;
      align-items:flex-end;
      width:100%;
      max-width:600px;
      font-size:24px;
      font-weight:900;
      letter-spacing:1px;
    }
    .players-header .player-label{
      text-shadow:0 0 6px rgba(0,0,0,0.6);
    }
    #timeLabel{
      font-family:'VT323', monospace;
      font-size:48px;
      letter-spacing:2px;
      text-shadow:0 0 4px rgba(0,0,0,0.7);
      line-height:1;
    }

    /* Score row containing series and time bar */
    .score-row{
      display:flex;
      justify-content:center;
      align-items:center;
      gap:20px;
      width:100%;
      max-width:600px;
    }
    .series{
      display:flex;
      gap:12px;
      align-items:center;
    }
    .dot{
      width:40px;
      height:40px;
      border-radius:50%;
      background:#263449;
      box-shadow:inset 0 0 0 2px #162131;
    }
    .dot.win-p1{
      background:radial-gradient(circle at 30% 30%,#fff,var(--p1) 55%,#300b22 140%);
      box-shadow:0 0 14px var(--p1), inset 0 0 3px #fff6;
    }
    .dot.win-p2{
      background:radial-gradient(circle at 30% 30%,#fff,var(--p2) 55%,#083033 140%);
      box-shadow:0 0 14px var(--p2), inset 0 0 3px #fff6;
    }

    /* Time bar container and neon separators */
    .time-bar-container{
      position:relative;
      width:230px;
      height:24px;
      display:flex;
      align-items:center;
      justify-content:center;
    }
    .time-bar-container::before,
    .time-bar-container::after{
      content:"";
      position:absolute;
      top:2px;
      bottom:2px;
      width:2px;
      background:linear-gradient(to bottom,var(--p2),var(--p1));
    }
    .time-bar-container::before{ right:calc(100% + 6px); }
    .time-bar-container::after{ left:calc(100% + 6px); }
    #timeBar{
      width:100%;
      height:20px;
      border-radius:10px;
      background:#162131;
      border:1px solid #1a2636;
      overflow:hidden;
      position:relative;
    }
    #timeFill{
      height:100%;
      width:0%;
      background:var(--p2);
      transition:none;
    }

    .food-row{
      display:flex;
      gap:20px;
      margin-top:4px;
      font-size:14px;
    }
    .counter{
      padding:6px 10px;
      border-radius:10px;
      background:#0b1420cc;
      border:1px solid #1a2636;
      color:var(--muted);
      font-weight:700;
    }
    .counter .val{
      color:#fff;
      font-weight:900;
      margin-left:6px;
    }

    /* Hide language button in UI */
    #langBtn{display:none;}
  </style>
</head>
<body>
  <div class="wrap">
    <div id="stage">
      <div id="canvasWrap">
        <canvas id="game" aria-label="Neo Snake Duel canvas"></canvas>
        <!-- Hidden mode title element to satisfy script references -->
        <div id="modeTitle" style="display:none"></div>
        <div class="overlay"><div class="banner" id="banner"></div></div>
      </div>
    </div>

    <footer>
      <div class="panel-left">
        <button id="pauseBtn" class="btn big" data-i18n="pause">Duraklat (Space)</button>
        <button id="resetBtn" class="btn big" data-i18n="reset">Maçı Sıfırla (R)</button>
      </div>
      <div class="panel-center">
        <div class="players-header">
          <span class="player-label p1" id="p1Label">OYUNCU 1</span>
          <span id="timeLabel">03:00</span>
          <span class="player-label p2" id="p2Label">OYUNCU 2</span>
        </div>
        <div class="score-row">
          <div class="series left" id="p1Series"></div>
          <div class="time-bar-container">
            <div id="timeBar"><div id="timeFill"></div></div>
          </div>
          <div class="series right" id="p2Series"></div>
        </div>
        <div class="food-row">
          <div class="counter" id="p1FoodBox"><span data-i18n="p1Food">P1 Yem</span>: <span class="val" id="p1Food">0</span></div>
          <div class="counter" id="p2FoodBox"><span data-i18n="p2Food">P2 Yem</span>: <span class="val" id="p2Food">0</span></div>
        </div>
      </div>
      <div class="panel-right">
        <button id="menuBtn" class="btn big" data-i18n="menu">Ana Menü</button>
        <button id="muteBtn" class="btn big">Ses: Açık (M)</button>
        <button id="langBtn" class="btn big">TR/EN</button>
      </div>
    </footer>
  </div>

<script>
(()=>{
  /* ===========================
    Neo Snake Duel — Alpha v0.25
     ODAK: Yeni UI düzeni, neon/matrix temalı yazı tipleri, zaman barı ve sayaç yenilendi.
     Kırmızı yem mekaniği güncellendi ve ekstra kırmızı yemler eklendi. Hata düzeltmeleri ve elmas sonrası oyunun donması giderildi.
    =========================== */

  const VERSION = 'Alpha v0.25';

  /* === i18n === */
  const STRINGS = {
    tr: {
      menu: 'Ana Menü',
      pause: 'Duraklat (Space)',
      resume: 'Sürdür (Space)',
      reset: 'Maçı Sıfırla (R)',
      modeNone: 'MOD: Seçilmedi',
      modePick: 'Oyun Modu',
      pickOne: 'Birini seç:',
      ready: 'Hazır olun…',
      start: 'BAŞLA!',
      p1: 'OYUNCU 1',
      p2: 'OYUNCU 2',
      p1Food: 'P1 Yem',
      p2Food: 'P2 Yem',
      winP1: '<span class="p1">P1</span> kazandı!',
      winP2: '<span class="p2">P2</span> kazandı!',
      draw:  '<span class="draw">Berabere</span>',
      normal: 'NORMAL',
      fast: 'HIZLI',
      extreme: 'AŞIRI',
      play: 'Oyna',
      settings: 'Ayarlar',
      instructions: 'Talimatlar',
      developers: 'Geliştiriciler',
      mainMenu: 'Ana Menü',
      snakeSpeed: 'Yılan Hızı',
      back: 'Geri',
      instructionsText: 'Bu oyun iki kişilik bir yılan düellosudur. Amaç rakibinizin yılanını yok etmektir veya süre sonunda en uzun yılan olmaktır. Her round 3 dakika sürer; süre dolduğunda daha uzun olan yılan roundu kazanır. Normal yemler yılanınızı büyütür. Her 5 normal yemden sonra altın bir elmas ortaya çıkar; bu yemi yiyen yılan 3 kare büyür, rakibi ise 1 kare küçülür ve elmas 3 saniyede bir yer değiştirir. Her 10 normal yemden sonra kırmızı bir yem belirir; bu yem yendiğinde yılan 5 saniye boyunca hızlanır ve saydamlaşır, rakibinin içinden geçebilir. Kırmızı yem yenildiğinde 10 normal yem sahaya gelir ve 5 saniye sonra kaybolur. Her 3 yemden sonra ekranda iki yem birden belirir, biri yenildiğinde diğeri kaybolur. Arena kenarları teleporter gibidir; kenardan çıkan yılan karşı kenardan çıkar. Sıfır uzunluğa düşen yılan kaybeder. İlk 5 roundu alan oyuncu maçı kazanır.',
      developersText: 'Bu oyun Romina Franko & Toygun Çetin tarafından Yapay Zeka desteği ile geliştirilmiştir. Topluluğa armağan edilmiştir.'
    },
    en: {
      menu: 'Main Menu',
      pause: 'Pause (Space)',
      resume: 'Resume (Space)',
      reset: 'Reset Match (R)',
      modeNone: 'MODE: Not Selected',
      modePick: 'Game Mode',
      pickOne: 'Choose one:',
      ready: 'Get Ready…',
      start: 'START!',
      p1: 'PLAYER 1',
      p2: 'PLAYER 2',
      p1Food: 'P1 Food',
      p2Food: 'P2 Food',
      winP1: '<span class="p1">P1</span> wins!',
      winP2: '<span class="p2">P2</span> wins!',
      draw:  '<span class="draw">Draw</span>',
      normal: 'NORMAL',
      fast: 'FAST',
      extreme: 'EXTREME',
      play: 'Play',
      settings: 'Settings',
      instructions: 'Instructions',
      developers: 'Developers',
      mainMenu: 'Main Menu',
      snakeSpeed: 'Snake Speed',
      back: 'Back',
      instructionsText: 'This game is a two‑player snake duel. Your goal is to eliminate your opponent’s snake or be the longest when time runs out. Each round lasts 3 minutes; when time expires, the longer snake wins the round. Eating normal food makes your snake grow. After every 5 normal foods, a golden diamond appears; the snake that eats it grows by 3 segments and the opponent shrinks by 1 segment. The diamond relocates every 3 seconds. After every 10 normal foods, a red food appears; eating it speeds up the snake and makes it intangible for 5 seconds so it can pass through the opponent. When a red food is eaten, 10 normal foods spawn on the field for 5 seconds. After every 3 foods, a double-food pair appears; when one is eaten, the other disappears. The arena wraps around the edges. A snake that shrinks to zero segments loses. The first to win 5 rounds wins the match.',
      developersText: 'This game was developed by Romina Franko & Toygun Çetin with support from AI. It is presented to the community.'
    }
  };
  let lang = localStorage.getItem('neoSnakeLang') || 'tr';
  function t(key){ return (STRINGS[lang] && STRINGS[lang][key]) || key; }

  /* === Canvas === */
  const canvas=document.getElementById('game');
  const ctx=canvas.getContext('2d');
  let GRID_COLS=64, GRID_ROWS=36;
  const BASE_TPS=14.2;
  let dpr=Math.max(1,Math.min(2,window.devicePixelRatio||1));
  function resize(){
    const st=document.getElementById('stage');
    const r=st.getBoundingClientRect();
    canvas.width=Math.floor(r.width*dpr); canvas.height=Math.floor(r.height*dpr);
    ctx.setTransform(dpr,0,0,dpr,0,0);
  }
  addEventListener('resize',resize,{passive:true}); resize();

  /* === Sound === */
  let audioCtx; let muted=localStorage.getItem('neoSnakeMuted')==='1'; const muteBtn=document.getElementById('muteBtn');
  function ensureAudio(){ if(!audioCtx) audioCtx=new (window.AudioContext||window.webkitAudioContext)(); }
  function tone(freq,dur,{type='square',gain=0.06,attack=0.004,release=0.06,sweep=0}={}){
    if(muted) return; try{
      ensureAudio(); const now=audioCtx.currentTime;
      const o=audioCtx.createOscillator(); const g=audioCtx.createGain();
      o.type=type; o.frequency.value=freq;
      if(sweep){ o.frequency.linearRampToValueAtTime(freq*(1+sweep), now+dur); }
      g.gain.value=0; g.gain.linearRampToValueAtTime(gain, now+attack);
      g.gain.linearRampToValueAtTime(0.0001, now+Math.max(dur-0.01,0)+release);
      o.connect(g).connect(audioCtx.destination); o.start(now); o.stop(now+dur+release+0.03);
    }catch(e){}
  }
  const SFX={
    eat(){ tone(720,0.08,{type:'square',gain:0.05}); },
    diamond(){ tone(1200,0.10,{type:'triangle',gain:0.05}); },
    heart(){ tone(640,0.10,{type:'square',gain:0.06}); setTimeout(()=>tone(1240,0.12,{type:'sawtooth',gain:0.06}),90); },
    crash(){ tone(180,0.20,{type:'sawtooth',gain:0.08,sweep:-0.35}); },
    start(){ tone(420,0.10,{type:'sine',gain:0.05}); setTimeout(()=>tone(640,0.12,{type:'sine',gain:0.05}),120); setTimeout(()=>tone(860,0.14,{type:'sine',gain:0.05}),260); },
    pause(){ tone(360,0.06,{type:'square',gain:0.04}); },
    gulp(){ tone(420,0.06,{type:'triangle',gain:0.06}); setTimeout(()=>tone(240,0.08,{type:'sine',gain:0.05}),50); },
    whoosh(){ tone(980,0.05,{type:'triangle',gain:0.04}); setTimeout(()=>tone(820,0.05,{type:'triangle',gain:0.04}),55); setTimeout(()=>tone(680,0.05,{type:'triangle',gain:0.04}),110); },
    /*
      Özel kaybolma animasyonu için ses. Bir yılan diğerini yediğinde çalınır.
      Kademeli olarak alçalan iki ton ile kısa bir "yok olma" hissi verir.
    */
    disappear(){
      tone(560,0.10,{type:'triangle',gain:0.06});
      setTimeout(()=>tone(340,0.14,{type:'triangle',gain:0.05}),80);
    },
    /*
      Kazanan için 8‑bit tarzında kutlama melodisi. Yaklaşık 5 saniye sürer.
      Farklı frekanslarda kısa notalar çalarak retro bir zafer hissi oluşturur.
    */
    win(){
      if(muted) return;
      ensureAudio();
      const notes=[660,880,660,990,880,660,550,660,770,660,880,990,880,660,550,660,770,880,660,440];
      notes.forEach((freq,idx)=>{
        const delay=idx*230;
        setTimeout(()=>{
          tone(freq,0.14,{type:'square',gain:0.05});
        },delay);
      });
    },
    /*
      Kısa tur galibiyet melodisi. Yaklaşık 2 saniye sürer.
    */
    winRound(){
      if(muted) return;
      ensureAudio();
      const notes=[660,880,990,880,660,550,660];
      notes.forEach((freq,idx)=>{
        const delay=idx*220;
        setTimeout(()=>{
          tone(freq,0.14,{type:'square',gain:0.05});
        },delay);
      });
    }
  };
  function updateMuteUI(){
    const label = lang==='tr' ? (muted?'Kapalı':'Açık') : (muted?'Off':'On');
    muteBtn.textContent = (lang==='tr'?'Ses':'Sound')+': '+label+' (M)';
    localStorage.setItem('neoSnakeMuted', muted?'1':'0');
  }
  updateMuteUI();

  /* === Background Music (BGM) === */
  let bgmInterval = null;
  function scheduleBgmPattern(){
    // basit 8‑bit melodik döngü: bir dizi notayı ardışık olarak çal
    const pattern=[
      {freq:660,dur:0.12,delay:0},
      {freq:880,dur:0.12,delay:200},
      {freq:990,dur:0.12,delay:400},
      {freq:880,dur:0.12,delay:600},
      {freq:660,dur:0.12,delay:800},
      {freq:550,dur:0.12,delay:1000},
      {freq:660,dur:0.12,delay:1200},
      {freq:770,dur:0.12,delay:1400},
      {freq:660,dur:0.12,delay:1600},
      {freq:880,dur:0.12,delay:1800},
      {freq:990,dur:0.12,delay:2000},
      {freq:880,dur:0.12,delay:2200},
      {freq:660,dur:0.12,delay:2400},
      {freq:550,dur:0.12,delay:2600},
      {freq:660,dur:0.12,delay:2800},
      {freq:770,dur:0.12,delay:3000},
    ];
    pattern.forEach(note=>{
      setTimeout(()=>{
        tone(note.freq,note.dur,{type:'square',gain:0.02});
      },note.delay);
    });
  }
  function startBgm(){
    if(bgmInterval) return;
    // Başlangıçta hemen çal ve her 4 saniyede bir tekrarla. Toplam 15 tekrar ~60 saniye eder
    scheduleBgmPattern();
    bgmInterval=setInterval(scheduleBgmPattern,4000);
  }
  function stopBgm(){
    if(bgmInterval){ clearInterval(bgmInterval); bgmInterval=null; }
  }
  // Başlangıçta BGM başlat
  startBgm();

  /* === UI State === */
  const banner=document.getElementById('banner');
  function showBanner(html){ banner.innerHTML=html; banner.classList.add('show'); }
  function hideBanner(){ banner.classList.remove('show'); }

  const GAMES_TO_ROUND=5;
  let games={p1:0,p2:0};
  const p1Series=document.getElementById('p1Series'), p2Series=document.getElementById('p2Series');
  function drawSeries(){
    const render=(el,count,owner)=>{
      const label=el.querySelector('.barLabel');
      if(label){ /* preserve label for fallback but not used in new layout */ }
      el.innerHTML='';
      for(let i=0;i<GAMES_TO_ROUND;i++){
        const dot=document.createElement('div');
        dot.className='dot'+(i<count?(' win-'+owner):'');
        el.appendChild(dot);
      }
    };
    render(p1Series,games.p1,'p1');
    render(p2Series,games.p2,'p2');
  }

  const MOD_SPEED = { NORMAL:1.00, FAST:1.35, EXTREME:1.80 }; let currentMode=null;
  function applyLang(){
    // Başlık artık görünmediği için yalnızca buton ve sayaç etiketlerini güncelle
    document.getElementById('menuBtn').textContent = t('menu');
    document.getElementById('pauseBtn').textContent = paused ? t('resume') : t('pause');
    document.getElementById('resetBtn').textContent = t('reset');
    document.getElementById('p1Label').textContent = t('p1');
    document.getElementById('p2Label').textContent = t('p2');
    document.querySelector('#p1FoodBox [data-i18n="p1Food"]').textContent = t('p1Food');
    document.querySelector('#p2FoodBox [data-i18n="p2Food"]').textContent = t('p2Food');
    updateMuteUI();
  }

  function openMenu(){
    paused = true;
    intermission = true;
    showBanner(`<h1>${t('snakeSpeed')}</h1><p>${t('pickOne')}</p>
      <div class="modeBtns" style="display:flex;gap:10px;justify-content:center;margin-top:10px">
        <button class="btn big" id="mNormal">${t('normal')}</button>
        <button class="btn big" id="mFast">${t('fast')}</button>
        <button class="btn big" id="mExtreme">${t('extreme')}</button>
      </div>
      <div style="margin-top:12px;display:flex;justify-content:center"><button class="btn" id="modeBack">${t('back')}</button></div>`);
    const wait=()=>{
      const n=document.getElementById('mNormal'), f=document.getElementById('mFast'), e=document.getElementById('mExtreme'), back=document.getElementById('modeBack');
      if(!n||!f||!e||!back){ requestAnimationFrame(wait); return; }
      n.onclick=()=>selectMode('NORMAL');
      f.onclick=()=>selectMode('FAST');
      e.onclick=()=>selectMode('EXTREME');
      back.onclick=()=>{ openMainMenu(); };
    }; wait();
  }
  function selectMode(mode){ currentMode=mode; hideBanner(); paused=false; softReset(true); applyLang(); }

  document.getElementById('langBtn').onclick=()=>{
    lang = (lang==='tr') ? 'en' : 'tr';
    localStorage.setItem('neoSnakeLang', lang);
    applyLang();
    // Mod seçim ekranı açıksa, menüyü yeni dilde yeniden oluştur
    if(paused && !currentMode && !inCountdown && !intermission){ openMenu(); }
  };

  /* === Input === */
  let paused=false, inCountdown=false, intermission=false;
  addEventListener('keydown',e=>{
    if([' ','r','R','m','M','w','a','s','d','W','A','S','D','ArrowUp','ArrowLeft','ArrowDown','ArrowRight'].includes(e.key)) e.preventDefault();
    if(e.key===' '){ paused=!paused; SFX.pause(); document.getElementById('pauseBtn').textContent=paused ? t('resume') : t('pause'); }
    if(e.key==='r'||e.key==='R'){ softReset(true); }
    if(e.key==='m'||e.key==='M'){ muted=!muted; updateMuteUI(); }
    if(!snakes || inCountdown || intermission || paused || !currentMode) return;
    if(/^[wasd]$/i.test(e.key)){ const m={w:'up',a:'left',s:'down',d:'right'}; const d=dirMap[m[e.key.toLowerCase()]]; const s=snakes.p1; if(!opposite(d,s.dir)) s.nextDir=d; }
    if(/^Arrow/.test(e.key)){ const m={ArrowUp:'up',ArrowLeft:'left',ArrowDown:'down',ArrowRight:'right'}; const d=dirMap[m[e.key]]; const s=snakes.p2; if(!opposite(d,s.dir)) s.nextDir=d; }
  },{passive:false});
  document.getElementById('pauseBtn').onclick=()=>{ paused=!paused; SFX.pause(); document.getElementById('pauseBtn').textContent=paused ? t('resume') : t('pause'); };
  document.getElementById('resetBtn').onclick=()=>softReset(true);
  muteBtn.onclick=()=>{ muted=!muted; updateMuteUI(); };

  /* === Helpers === */
  function rngCell(){ return { x:(Math.random()*GRID_COLS)|0, y:(Math.random()*GRID_ROWS)|0 } }
  function wrapCell(c){ let x=c.x,y=c.y; if(x<0)x=GRID_COLS-1; else if(x>=GRID_COLS)x=0; if(y<0)y=GRID_ROWS-1; else if(y>=GRID_ROWS)y=0; return {x,y}; }
  async function countdown(n){
    inCountdown=true;
    for(let i=n;i>0;i--){
      showBanner(`<h1>${i}</h1><p>${t('ready')}</p>`);
      await new Promise(r=>setTimeout(r,520));
    }
    showBanner(`<h1 style="color:#9ed0ff">${t('start')}</h1>`); SFX.start();
    await new Promise(r=>setTimeout(r,360));
    hideBanner(); inCountdown=false; intermission=false;
  }

  function modLerp(prev, cur, cap, t){
    let a=prev, b=cur;
    let d=b-a;
    if(d>cap/2) a+=cap; else if(d<-cap/2) a-=cap;
    const v=a + (b-a)*t;
    let out=v%cap; if(out<0) out+=cap;
    return out;
  }

  function hexToRgba(hex, alpha=1.0){
    if(!hex) return `rgba(255,255,255,${alpha})`;
    let c = hex.replace('#','');
    if(c.length === 3){ c = c[0]+c[0] + c[1]+c[1] + c[2]+c[2]; }
    const bigint = parseInt(c, 16);
    const r = (bigint >> 16) & 255;
    const g = (bigint >> 8) & 255;
    const bcol = bigint & 255;
    return `rgba(${r},${g},${bcol},${alpha})`;
  }

  function mixColors(a, b, t){
    function parse(hex){ let c = hex.replace('#',''); if(c.length === 3){ c = c[0]+c[0]+c[1]+c[1]+c[2]+c[2]; } const n=parseInt(c,16); return {r:(n>>16)&255,g:(n>>8)&255,b:n&255}; }
    const ca=parse(a), cb=parse(b);
    const r = Math.round(ca.r + (cb.r - ca.r) * t);
    const g = Math.round(ca.g + (cb.g - ca.g) * t);
    const bcol = Math.round(ca.b + (cb.b - ca.b) * t);
    return `#${((1<<24)+(r<<16)+(g<<8)+bcol).toString(16).slice(1)}`;
  }

  // Sayaç ve dolum çubuğunu güncelleme fonksiyonu
  function updateTimerUI(timeLeftMs){
    const label = document.getElementById('timeLabel');
    const fill = document.getElementById('timeFill');
    const total = ROUND_DURATION;
    let ms = Math.max(0, timeLeftMs);
    const ratio = (total - ms) / total;
    fill.style.width = `${Math.min(1, Math.max(0, ratio)) * 100}%`;
    const rootStyles = getComputedStyle(document.documentElement);
    const colBlue = rootStyles.getPropertyValue('--p2').trim() || '#35e6e6';
    const colPink = rootStyles.getPropertyValue('--p1').trim() || '#ff4fbf';
    fill.style.background = mixColors(colBlue, colPink, ratio);
    const secs = Math.ceil(ms/1000);
    const m = Math.floor(secs / 60);
    const s = secs % 60;
    label.textContent = `${m.toString().padStart(2,'0')}:${s.toString().padStart(2,'0')}`;
    let color;
    if(secs > 60){ const idx = Math.floor(secs / 10) % 2; color = idx === 0 ? colBlue : colPink; }
    else if(secs > 30){ color = '#ffd166'; }
    else if(secs > 10){ color = '#ff8f33'; }
    else { color = '#ff1744'; }
    label.style.color = color;
  }

  // Süre bittiğinde daha uzun yılanı belirleyip turu bitirir
  function endRoundByTime(){
    if(!snakes) return;
    const l1 = snakes.p1.segments.length;
    const l2 = snakes.p2.segments.length;
    if(l1 > l2){ endGame('p1'); }
    else if(l2 > l1){ endGame('p2'); }
    else { endGame('draw'); }
  }

  /* === Core === */
  const dirMap={up:{x:0,y:-1},down:{x:0,y:1},left:{x:-1,y:0},right:{x:1,y:0}};
  function opposite(a,b){return a.x===-b.x&&a.y===-b.y;}
  function createSnake(start,dir){ const seg=[ start,{x:start.x-dir.x,y:start.y-dir.y},{x:start.x-2*dir.x,y:start.y-2*dir.y} ]; return { segments:seg, prev:seg.map(s=>({...s})), dir:{...dir}, nextDir:{...dir}, grow:0, powerEnd:0, flashUntil:0, flashColor:null }; }
  function isPowered(s){ return s && performance.now()<s.powerEnd; }

  // Küresel sayaçlar ve zamanlayıcılar
  let totalEaten = 0;
  let bulkFoodEndTime = 0;
  let pairIdCounter = 0;
  let normalFoodsEaten = 0;
  let diamondActive = false;
  let redFoodPresent = false;
  let redBulkEndTime = 0;
  let doubleActive = false;
  // beast modunda hangi yılan olduğunu tut
  let beastOwner = null;

  // Round timer (3 dakikalık süre)
  const ROUND_DURATION = 3 * 60 * 1000;
  let roundTimerEnd = 0;
  let timerEnded = false;

  let snakes=null, foods=[], stats={p1Food:0,p2Food:0};
  let acc1=0, acc2=0;
  function speedMult(s){ return isPowered(s) ? 1.45 : 1.00; }

  function softReset(full=false){
    GRID_COLS=64; GRID_ROWS=36;
    const mid={x:(GRID_COLS/2)|0, y:(GRID_ROWS/2)|0};
    const startP1={x:mid.x-20, y:mid.y-6};
    const startP2={x:mid.x+20, y:mid.y+6};
    snakes={ p1:createSnake(startP1, dirMap.right), p2:createSnake(startP2, dirMap.left) };
    foods.length=0;
    acc1=0; acc2=0;
    bulkFoodEndTime = 0;
    totalEaten = 0;
    pairIdCounter = 0;
    normalFoodsEaten = 0;
    diamondActive = false;
    redFoodPresent = false;
    redBulkEndTime = 0;
    doubleActive = false;
    beastOwner = null;
    if(full){ games={p1:0,p2:0}; drawSeries(); }
    stats.p1Food=0; stats.p2Food=0; updateFoodCounters();
    spawnFood();
    roundTimerEnd = performance.now() + ROUND_DURATION;
    timerEnded = false;
    updateTimerUI(ROUND_DURATION);
    countdown(3);
  }

  function awardGame(who){ if(who==='p1'){ games.p1++; } else if(who==='p2'){ games.p2++; } drawSeries(); }

  // Normal yem oluşturur
  function spawnFood(){
    const now = performance.now();
    if(redBulkEndTime && now < redBulkEndTime){ return; }
    if(doubleActive || diamondActive){ return; }
    const normalCount = foods.filter(f => f.type === 'normal' && !f.pairId).length;
    if(normalCount < 1){ spawnNormal(); }
  }
  function spawnNormal(){
    let tries=0; const occ=new Set([ ...snakes.p1.segments, ...snakes.p2.segments, ...foods ].map(o=>o.x+','+o.y));
    let f; do{ f=rngCell(); tries++; if(tries>800) return; }while(occ.has(f.x+','+f.y));
    foods.push({x:f.x, y:f.y, type:'normal', spawnAt:performance.now()});
  }
  function spawnDiamondFood(){
    diamondActive = true;
    // sahadaki eşlenmemiş normal yemleri kaldır
    for(let i=foods.length-1; i>=0; i--){ const item = foods[i]; if(item.type === 'normal' && !item.pairId){ foods.splice(i,1); } }
    let tries=0; const occ=new Set([ ...snakes.p1.segments, ...snakes.p2.segments, ...foods ].map(o=>o.x+','+o.y)); let f;
    do{ f=rngCell(); tries++; if(tries>800) return; }while(occ.has(f.x+','+f.y));
    foods.push({ x:f.x, y:f.y, type:'diamond', spawnAt:performance.now(), expiryTime:performance.now()+3000 });
  }
  function spawnRedFood(extra=false){
    let tries=0; const occ=new Set([ ...snakes.p1.segments, ...snakes.p2.segments, ...foods ].map(o=>o.x+','+o.y)); let f;
    do{ f=rngCell(); tries++; if(tries>800) return; }while(occ.has(f.x+','+f.y));
    foods.push({ x:f.x, y:f.y, type:'heart', spawnAt:performance.now(), extra:extra });
    redFoodPresent = true;
  }
  function spawnDoubleFood(){
    doubleActive = true;
    for(let i=foods.length-1;i>=0;i--){ const item = foods[i]; if(item.type==='normal' && !item.pairId){ foods.splice(i,1); } }
    const pairId = ++pairIdCounter;
    for(let j=0;j<2;j++){
      let tries=0; const occ=new Set([ ...snakes.p1.segments, ...snakes.p2.segments, ...foods ].map(o=>o.x+','+o.y)); let f;
      do{ f=rngCell(); tries++; if(tries>800) return; }while(occ.has(f.x+','+f.y));
      foods.push({x:f.x, y:f.y, type:'normal', pairId:pairId, spawnAt:performance.now()});
    }
  }
  function spawnBulkNormals(count){
    for(let k=0;k<count;k++){
      let tries=0; const occ=new Set([ ...snakes.p1.segments, ...snakes.p2.segments, ...foods ].map(o=>o.x+','+o.y)); let f;
      do{ f=rngCell(); tries++; if(tries>800) break; }while(occ.has(f.x+','+f.y));
      if(tries<=800){ foods.push({ x:f.x, y:f.y, type:'normal', spawnAt:performance.now() }); }
    }
  }
  function updateFoodCounters(){ document.getElementById('p1Food').textContent = stats.p1Food; document.getElementById('p2Food').textContent = stats.p2Food; }

  function eatFoodIfAny(s, ownerKey){
    for(let i=0;i<foods.length;i++){
      const f=foods[i];
      if(f.x===s.segments[0].x && f.y===s.segments[0].y){
        foods.splice(i,1);
        if(f.pairId){ for(let j=foods.length-1;j>=0;j--){ if(foods[j].pairId && foods[j].pairId===f.pairId){ foods.splice(j,1); break; } } doubleActive = false; }
        const now = performance.now();
        if(f.type==='diamond'){
          s.grow += 3;
          const otherKey = ownerKey === 'p1' ? 'p2' : 'p1';
          const other = snakes[otherKey];
          if(other.segments.length > 0){ other.segments.pop(); }
          // Eğer rakip yılan sıfır uzunluğa düşerse kaybolma animasyonunu başlat
          if(snakes[otherKey].segments.length === 0){ startDeathAnim(otherKey, ownerKey); return; }
          SFX.diamond();
          s.flashUntil = now + 400;
          s.flashColor = '#ffd166';
          diamondActive = false;
        } else if(f.type==='heart'){
          // kırmızı yem: güçlendirme
          s.grow += 1;
          // İki tür kalp: extra olmayan ilk kalp, ve ekstra kalp
          if(f.extra){
            // Ekstra kalp: Beast modunu uzat veya aktar
            if(beastOwner === ownerKey){
              // Aynı yılan: süreyi uzat
              s.powerEnd = now + 5000;
              redBulkEndTime = now + 5000;
            } else {
              // Farklı yılan: önceki Beast'i kapat ve yeni Beast yap
              if(beastOwner && snakes[beastOwner]){
                snakes[beastOwner].powerEnd = 0;
              }
              beastOwner = ownerKey;
              s.powerEnd = now + 5000;
              redBulkEndTime = now + 5000;
            }
            SFX.heart();
            redFoodPresent = false;
          } else {
            // İlk kırmızı yem: Beast modunu başlat
            s.powerEnd = now + 5000;
            beastOwner = ownerKey;
            SFX.heart();
            redFoodPresent = false;
            // tüm mevcut yemleri temizle ve 10 normal + ekstra kırmızı yem oluştur
            foods.length = 0;
            diamondActive = false;
            doubleActive = false;
            redBulkEndTime = now + 5000;
            spawnBulkNormals(10);
            spawnRedFood(true);
          }
        } else {
          // normal yem
          s.grow += 1;
          normalFoodsEaten++;
          SFX.eat();
        }
        if(ownerKey==='p1'){ stats.p1Food++; } else { stats.p2Food++; }
        updateFoodCounters();
        if(f.type==='normal'){
          if(normalFoodsEaten % 10 === 0){ if(!redFoodPresent && !(redBulkEndTime && now < redBulkEndTime)){ spawnRedFood(false); } }
          else if(normalFoodsEaten % 5 === 0){ if(!diamondActive && !redFoodPresent && !(redBulkEndTime && now < redBulkEndTime)){ spawnDiamondFood(); } }
          else if(normalFoodsEaten % 3 === 0){ if(!doubleActive && !diamondActive && !(redBulkEndTime && now < redBulkEndTime)){ spawnDoubleFood(); } }
        }
        spawnFood();
        return;
      }
    }
  }

  function bodyAdvance(s){
    const head=s.segments[0];
    if(!opposite(s.nextDir,s.dir)) s.dir={...s.nextDir};
    const nextHead=wrapCell({x:head.x+s.dir.x, y:head.y+s.dir.y});
    s.prev = s.segments.map(c=>({...c}));
    s.segments.unshift(nextHead);
    if(s.grow>0) s.grow--; else s.segments.pop();
  }

  function collideCheckDetailed(){
    const s1=snakes.p1, s2=snakes.p2;
    const head1=s1.segments[0], head2=s2.segments[0];
    const intangible1 = isPowered(s1);
    const intangible2 = isPowered(s2);
    if(head1.x===head2.x && head1.y===head2.y){
      if(intangible1 && !intangible2){ return {result:'p1', eater:'p1'}; }
      if(intangible2 && !intangible1){ return {result:'p2', eater:'p2'}; }
      return {result:'draw', eater:null};
    }
    const self1=new Set(s1.segments.slice(1).map(c=>c.x+','+c.y));
    const self2=new Set(s2.segments.slice(1).map(c=>c.x+','+c.y));
    const k1=head1.x+','+head1.y;
    const k2=head2.x+','+head2.y;
    if(intangible1 && !intangible2){
      const hit1Self = self1.has(k1);
      if(hit1Self) return {result:'p2', eater:null};
      const hitCross = self2.has(k1) || self1.has(k2) || self2.has(k2);
      if(hitCross){ return {result:'p1', eater:'p1'}; }
      return {result:null, eater:null};
    }
    if(intangible2 && !intangible1){
      const hit2Self = self2.has(k2);
      if(hit2Self) return {result:'p1', eater:null};
      const hitCross = self1.has(k2) || self2.has(k1) || self1.has(k1);
      if(hitCross){ return {result:'p2', eater:'p2'}; }
      return {result:null, eater:null};
    }
    if(intangible1 && intangible2){
      const hit1Self = self1.has(k1);
      const hit2Self = self2.has(k2);
      if(hit1Self && hit2Self) return {result:'draw', eater:null};
      if(hit1Self) return {result:'p2', eater:null};
      if(hit2Self) return {result:'p1', eater:null};
      return {result:null, eater:null};
    }
    const hit1Self = self1.has(k1);
    const hit2Self = self2.has(k2);
    const hit1Opp  = self2.has(k1);
    const hit2Opp  = self1.has(k2);
    const hit1 = hit1Self || hit1Opp;
    const hit2 = hit2Self || hit2Opp;
    if(hit1 && hit2) return {result:'draw', eater:null};
    if(hit1){ return {result:'p2', eater: hit1Opp ? 'p1' : null}; }
    if(hit2){ return {result:'p1', eater: hit2Opp ? 'p2' : null}; }
    return {result:null, eater:null};
  }

  /* === Animations === */
  function startDeathAnim(loser, winner){
    const len = snakes && snakes[loser] ? snakes[loser].segments.length : 1;
    const ms = len > 0 ? 500 / len : 40;
    deathAnim = { active:true, loser, winner, nextAt:performance.now(), stepMs: ms };
    intermission = true;
    SFX.gulp(); SFX.whoosh(); SFX.disappear();
  }
  let winAnim = { active:false, winner:null, start:0, duration:5000, blinkPeriod:350, final:false, color:'#fff' };
  function startWinAnim(winner, final=false){
    winAnim.active = true;
    winAnim.winner = winner;
    winAnim.start = performance.now();
    winAnim.final = final;
    if(final){ winAnim.duration = 5000; SFX.win(); }
    else{ winAnim.duration = 2000; SFX.winRound(); }
    const rootStyles = getComputedStyle(document.documentElement);
    const col = winner === 'p1' ? rootStyles.getPropertyValue('--p1').trim() : rootStyles.getPropertyValue('--p2').trim();
    winAnim.color = col || '#fff';
    intermission = true;
    foods.length = 0;
    const patterns = {
      'P': [ [0,1,2,3], [0,3], [0,3], [0,1,2], [0], [0], [0] ],
      '1': [ [1,2], [0,1,2,3], [2], [2], [2], [2], [0,1,2,3] ],
      '2': [ [0,1,2,3], [3], [2], [1], [0], [0], [0,1,2,3] ]
    };
    const charWidths = { 'P':4, '1':4, '2':4 };
    const charHeight = 7;
    const scale = 2;
    function scaledChar(char){ const rows = patterns[char]; const positions=[]; for(let row=0; row<rows.length; row++){ for(const col of rows[row]){ for(let dy=0; dy<scale; dy++){ for(let dx=0; dx<scale; dx++){ positions.push({ x: col*scale + dx, y: row*scale + dy }); } } } } return { positions, width: charWidths[char] * scale, height: charHeight * scale }; }
    const numChar = (winner === 'p1') ? '1' : '2';
    const pData = scaledChar('P');
    const nData = scaledChar(numChar);
    const gap = scale;
    const totalWidth = pData.width + gap + nData.width;
    const totalHeight = Math.max(pData.height, nData.height);
    const offsetX = Math.floor((GRID_COLS - totalWidth) / 2);
    const offsetY = Math.floor((GRID_ROWS - totalHeight) / 2);
    const pPositions = pData.positions.map(p => ({ x: p.x + offsetX, y: p.y + offsetY }));
    const nPositions = nData.positions.map(p => ({ x: p.x + offsetX + pData.width + gap, y: p.y + offsetY }));
    if(final){
      if(winner === 'p1'){ snakes.p1.segments = [...pPositions, ...nPositions]; snakes.p2.segments = []; }
      else{ snakes.p2.segments = [...pPositions, ...nPositions]; snakes.p1.segments = []; }
    }else{
      if(winner === 'p1'){ snakes.p1.segments = nPositions; snakes.p2.segments = pPositions; }
      else{ snakes.p2.segments = nPositions; snakes.p1.segments = pPositions; }
    }
    for(const key of ['p1','p2']){
      const s = snakes[key];
      s.prev = s.segments.map(c => ({...c}));
      s.dir = {x:0,y:0}; s.nextDir = {x:0,y:0}; s.grow = 0; s.powerEnd = 0;
    }
  }
  function endGame(result){
    if(result==='p1' || result==='p2'){
      awardGame(result);
      hideBanner();
      const isFinal = games[result] >= GAMES_TO_ROUND;
      startWinAnim(result, isFinal);
    } else {
      intermission = true;
      showBanner(`<h1>${t('draw')}</h1>`);
      setTimeout(()=>{ hideBanner(); resetRound(3); }, 1300);
    }
  }
  async function resetRound(count=3){
    const mid={x:(GRID_COLS/2)|0, y:(GRID_ROWS/2)|0};
    const startP1={x:mid.x-20, y:mid.y-6}; const startP2={x:mid.x+20, y:mid.y+6};
    stats.p1Food=0; stats.p2Food=0; updateFoodCounters();
    snakes={ p1:createSnake(startP1, dirMap.right), p2:createSnake(startP2, dirMap.left) };
    foods.length=0;
    acc1=0; acc2=0;
    bulkFoodEndTime=0; totalEaten=0; pairIdCounter=0;
    normalFoodsEaten=0;
    diamondActive=false; redFoodPresent=false; redBulkEndTime=0; doubleActive=false; beastOwner=null;
    deathAnim.active=false;
    spawnFood();
    roundTimerEnd = performance.now() + ROUND_DURATION;
    timerEnded = false;
    updateTimerUI(ROUND_DURATION);
    await countdown(count);
  }

  /* === Loop === */
  let deathAnim = { active:false, loser:null, winner:null, nextAt:0, stepMs:0 };
  let last=performance.now();
  function step(){
    const now=performance.now(), dt=now-last; last=now;
    if(winAnim.active){
      const elapsed = now - winAnim.start;
      if(elapsed >= winAnim.duration){
        winAnim.active = false; intermission = false;
        if(winAnim.final){ games = { p1:0, p2:0 }; drawSeries(); softReset(true); }
        else{ resetRound(3); }
        requestAnimationFrame(step); return;
      }
      renderWinAnim();
      requestAnimationFrame(step); return;
    }
    if(redBulkEndTime && now >= redBulkEndTime){
      foods.length = 0;
      redBulkEndTime = 0;
      redFoodPresent = false;
      beastOwner = null;
      spawnFood();
    }
    const modeBoost = currentMode ? (MOD_SPEED[currentMode]||1.0) : 1.0;
    const baseStepMs = 1000/(BASE_TPS*modeBoost);
    for(let i=0; i<foods.length; i++){
      const f=foods[i];
      if(f.type==='diamond' && f.expiryTime && now >= f.expiryTime){
        let tries=0;
        const occ=new Set([ ...snakes.p1.segments, ...snakes.p2.segments, ...foods ].map(o=>o.x+','+o.y));
        occ.delete(f.x+','+f.y);
        let newPos;
        do{ newPos=rngCell(); tries++; if(tries>800) break; }while(occ.has(newPos.x+','+newPos.y));
        if(tries<=800){ f.x=newPos.x; f.y=newPos.y; f.spawnAt=now; f.expiryTime=now+3000; }
      }
    }
    if(deathAnim.active){
      const loser = snakes[deathAnim.loser];
      if(now>=deathAnim.nextAt){
        loser.prev = loser.segments.map(c=>({...c}));
        loser.segments.pop();
        deathAnim.nextAt = now + deathAnim.stepMs;
        if(loser.segments.length === 0){ deathAnim.active=false; endGame(deathAnim.winner); }
      }
      render(0,0);
      requestAnimationFrame(step); return;
    }
    if(currentMode && !paused && !inCountdown && !intermission && !winAnim.active && !deathAnim.active){
      const tLeft = roundTimerEnd - now;
      updateTimerUI(tLeft);
      if(!timerEnded && tLeft <= 0){ timerEnded = true; endRoundByTime(); requestAnimationFrame(step); return; }
    }
    if(snakes && !paused && !inCountdown && !intermission && currentMode){
      acc1 += dt; acc2 += dt;
      let guard=0;
      while(guard++<12){
        const s1=snakes.p1, s2=snakes.p2;
        const i1 = baseStepMs / speedMult(s1);
        const i2 = baseStepMs / speedMult(s2);
        const r1 = acc1 >= i1, r2 = acc2 >= i2;
        if(!r1 && !r2) break;
        if(r1 && r2){
          bodyAdvance(s1); bodyAdvance(s2);
          acc1 -= i1; acc2 -= i2;
          eatFoodIfAny(s1,'p1'); eatFoodIfAny(s2,'p2');
          const chk = collideCheckDetailed();
          if(chk.result){
            if(chk.result==='draw'){ endGame('draw'); } else {
              const loser = chk.result === 'p1' ? 'p2' : 'p1';
              startDeathAnim(loser, chk.result);
            }
            break;
          }
        } else if(r1){
          bodyAdvance(s1); acc1 -= i1;
          eatFoodIfAny(s1,'p1');
          const chk = collideCheckDetailed();
          if(chk.result){
            if(chk.result==='draw'){ endGame('draw'); } else {
              const loser = chk.result === 'p1' ? 'p2' : 'p1';
              startDeathAnim(loser, chk.result);
            }
            break;
          }
        } else if(r2){
          bodyAdvance(s2); acc2 -= i2;
          eatFoodIfAny(s2,'p2');
          const chk = collideCheckDetailed();
          if(chk.result){
            if(chk.result==='draw'){ endGame('draw'); } else {
              const loser = chk.result === 'p1' ? 'p2' : 'p1';
              startDeathAnim(loser, chk.result);
            }
            break;
          }
        }
      }
    }
    const s1=snakes?.p1, s2=snakes?.p2;
    let alpha1=0, alpha2=0;
    if(s1 && currentMode){ const i1=(1000/(BASE_TPS*(MOD_SPEED[currentMode]||1.0)))/speedMult(s1); alpha1=Math.min(1,acc1/i1); }
    if(s2 && currentMode){ const i2=(1000/(BASE_TPS*(MOD_SPEED[currentMode]||1.0)))/speedMult(s2); alpha2=Math.min(1,acc2/i2); }
    render(alpha1, alpha2);
    requestAnimationFrame(step);
  }

  function render(alpha1, alpha2){
    ctx.clearRect(0,0,canvas.width,canvas.height);
    drawGrid();
    // draw foods
    drawFoods();
    // draw snakes
    drawSnakeBlocks(snakes.p1, getComputedStyle(document.documentElement).getPropertyValue('--p1').trim(), alpha1);
    drawSnakeBlocks(snakes.p2, getComputedStyle(document.documentElement).getPropertyValue('--p2').trim(), alpha2);
  }
  function drawGrid(){
    const w=canvas.clientWidth,h=canvas.clientHeight,cw=w/GRID_COLS,ch=h/GRID_ROWS;
    ctx.save(); ctx.strokeStyle=getComputedStyle(document.documentElement).getPropertyValue('--grid') || '#1a2537'; ctx.globalAlpha=0.14;
    ctx.beginPath();
    for(let x=0;x<=GRID_COLS;x++){ const X=Math.round(x*cw)+.5; ctx.moveTo(X,0); ctx.lineTo(X,h); }
    for(let y=0;y<=GRID_ROWS;y++){ const Y=Math.round(y*ch)+.5; ctx.moveTo(0,Y); ctx.lineTo(w,Y); }
    ctx.stroke(); ctx.restore();
  }
  function drawFoods(){
    const w=canvas.clientWidth,h=canvas.clientHeight,cw=w/GRID_COLS,ch=h/GRID_ROWS;
    foods.forEach(f=>{
      const cx=f.x*cw, cy=f.y*ch;
      const centerX=cx+cw/2; const centerY=cy+ch/2; const r=Math.min(cw,ch)/2*0.6;
      if(f.type==='normal'){
        ctx.fillStyle='#84b3ff';
        ctx.beginPath(); ctx.arc(centerX, centerY, r,0,Math.PI*2); ctx.fill();
      } else if(f.type==='diamond'){
        // Sarı elmas daha parlak
        const g=ctx.createRadialGradient(centerX,centerY,0,centerX,centerY,r);
        g.addColorStop(0,'#fff5cc'); g.addColorStop(0.4, '#ffd166'); g.addColorStop(1,'#30240f');
        ctx.fillStyle=g; ctx.beginPath(); ctx.arc(centerX,centerY,r,0,Math.PI*2); ctx.fill();
        // Halo
        ctx.globalAlpha=0.3; ctx.strokeStyle='#ffd166'; ctx.lineWidth=3; ctx.beginPath(); ctx.arc(centerX,centerY,r*1.5,0,Math.PI*2); ctx.stroke(); ctx.globalAlpha=1;
      } else if(f.type==='heart'){
        // Kırmızı yem daha parlak
        const g=ctx.createRadialGradient(centerX,centerY,0,centerX,centerY,r);
        g.addColorStop(0,'#ffe6e6'); g.addColorStop(0.4,'#ff1744'); g.addColorStop(1,'#4a0d15');
        ctx.fillStyle=g; ctx.beginPath(); ctx.arc(centerX,centerY,r,0,Math.PI*2); ctx.fill();
        ctx.globalAlpha=0.4; ctx.strokeStyle='#ff1744'; ctx.lineWidth=3; ctx.beginPath(); ctx.arc(centerX,centerY,r*1.5,0,Math.PI*2); ctx.stroke(); ctx.globalAlpha=1;
      }
    });
  }
  function drawSnakeBlocks(s, color, alphaProgress){
    const w=canvas.clientWidth,h=canvas.clientHeight,cw=w/GRID_COLS,ch=h/GRID_ROWS;
    ctx.save();
    s.segments.forEach((seg,idx)=>{
      const t = (idx===0?alphaProgress:1);
      const x=modLerp(seg.x, s.prev[idx]?.x ?? seg.x, GRID_COLS, t);
      const y=modLerp(seg.y, s.prev[idx]?.y ?? seg.y, GRID_ROWS, t);
      const gx=x*cw, gy=y*ch;
      let col=color;
      if(s.flashUntil && performance.now() < s.flashUntil){ if(Math.floor(performance.now()/120)%2===0){ col=s.flashColor || col; } }
      ctx.fillStyle=hexToRgba(col,1);
      ctx.fillRect(gx, gy, cw, ch);
    });
    ctx.restore();
  }
  function renderWinAnim(){
    ctx.clearRect(0,0,canvas.width,canvas.height);
    drawGrid();
    const blink = Math.floor((performance.now()-winAnim.start)/winAnim.blinkPeriod)%2===0;
    const col = blink ? winAnim.color : '#000';
    drawSnakeBlocks(snakes.p1, col, 0);
    drawSnakeBlocks(snakes.p2, col, 0);
  }
  // Başlangıçta ana menüyü aç
  openMainMenu();
  applyLang();
  requestAnimationFrame(step);
})();
</script>
