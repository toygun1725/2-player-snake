<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Neo Snake Duel — Alpha v0.29</title>
  <!-- Import fonts: Orbitron for neon/matrix style, VT323 for digital timer -->
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;900&family=VT323&display=swap" rel="stylesheet">
  <!-- Version: Alpha v0.29 -->
  <style>
    :root{
      --bg:#0b0f14;
      --grid:#1a2537;
      --p1:#ff4fbf;       /* Pembe (Player 1) */
      --p2:#35e6e6;       /* Turkuaz (Player 2) */
      --gold:#ffd166;     /* Elmas (sarı) */
      --heart:#ff1744;    /* Yakut kırmızısı */
      --orange: '#ff9f1c'; /* Turuncu */
      --green: '#44ff88';    /* Yeşil */
      --purple: '#9b59b6';   /* Mor */
      --red: '#e74c3c';      /* Kırmızı */
      --yellow: '#f1c40f';   /* Sarı */
      --emerald: '#2ecc71';  /* Zümrüt */
      --blue: '#3498db';     /* Mavi */
      --white: '#ffffff';    /* Beyaz */
      --ui-tile:#0c141f;
      --ui-tile-border:#1b2a41;
      --ui-tile-soft:#0f1a2a;
      --text:#e7f1ff;
      --muted:#9fb3d1;
    }
    *{box-sizing:border-box}
    html,body{height:100%}
    body{
      margin:0;background:var(--bg);color:var(--text);
      /* Genel yazı tipi Orbitron olarak ayarlandı */
      font-family:'Orbitron', ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial;
      overflow:hidden;
      text-transform: uppercase; /* BÜYÜK HARF */
    }
    .banner p, .banner .small-text {
        text-transform: none; /* Banner içindeki paragraflar normal kalsın */
    }
    #instructionsContainer, #developersContainer {
        text-transform: none; /* Talimatlar ve geliştiriciler normal kalsın */
    }
    .wrap{height:100%;display:grid;grid-template-rows:1fr auto}
    #stage{position:relative;height:calc(100vh - 180px)}
    #canvasWrap{
      position:relative;width:100%;height:100%;border-radius:22px;overflow:hidden;
      box-shadow:0 44px 130px #000a,0 12px 44px #0009,inset 0 0 0 1px #1a2636;
      background:#09101a
    }
    canvas{width:100%;height:100%;display:block;
      background:radial-gradient(1200px 900px at 50% -30%, #122034 0%, #0b121c 40%, #081018 75%, #050a10 100%)
    }
    #canvasWrap.shake {
        animation: shake-anim 0.1s 2;
    }
    @keyframes shake-anim {
        0%, 100% { transform: translateX(0); }
        25% { transform: translateX(-4px); }
        75% { transform: translateX(4px); }
    }
    #canvasWrap::before{
      content:"";position:absolute;inset:0;
      background:linear-gradient(transparent,rgba(0,0,0,.35)),
                 repeating-linear-gradient(180deg,#0000 0 2px,#0003 2px 3px);
      mix-blend-mode:multiply;pointer-events:none
    }

    /* Hide the old HUD; version info will be shown in main menu */
    .hudTop{display:none!important}

    .overlay{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none;z-index:6}
    .banner{
      pointer-events:auto;min-width:320px;max-width:92%;text-align:center;padding:18px 22px;border-radius:18px;
      background:linear-gradient(180deg,#0d1624ee,#0a111de0);
      border:1px solid #1b2a41;box-shadow:0 16px 50px #0009;
      transform:translateY(10px) scale(.96);opacity:0;transition:all .45s cubic-bezier(.2,.8,.2,1)
    }
    .banner.show{transform:translateY(0) scale(1);opacity:1}
    .banner h1{margin:0 0 6px;font-size:clamp(22px,4.2vw,44px);letter-spacing:1px}
    .banner p{margin:0;opacity:.9;font-size:14px}
    .banner .p1{color:var(--p1)} .banner .p2{color:var(--p2)} .banner .draw{color:#9ed0ff}

    /* New footer layout */
    footer{
      height:180px;
      display:flex;
      justify-content:space-between;
      align-items:flex-start;
      gap:10px;
      padding:14px;
      background:linear-gradient(180deg,#0e1726cc,#0a111dcc);
      border-top:1px solid #1b2a41;
      backdrop-filter:blur(6px)
    }
    .panel-left, .panel-right{
      display:flex;
      flex-direction:column;
      gap:10px;
      align-items:flex-start;
      width: 180px; /* Sabit genişlik */
    }
    .panel-right{align-items:flex-end}
    .panel-center{
      flex:1;
      display:grid;
      grid-template-areas:
        "p1-label time p2-label"
        "p1-food time p2-food"
        "series-row series-row series-row"
        "time-bar time-bar time-bar";
      grid-template-columns: 1fr auto 1fr;
      align-items:center;
      gap:4px 24px;
    }
    /* Buttons */
    .btn{
      width: 100%; /* Panelin genişliğine uyar */
      padding:12px 16px;
      border-radius:12px;
      background:var(--ui-tile-soft);
      border:1px solid var(--ui-tile-border);
      color:#d9e6ff;
      cursor:pointer;
      font-weight:800;
      letter-spacing:.3px;
      font-size:14px;
      font-family: 'Orbitron', sans-serif;
      text-transform: uppercase; /* Butonlar da büyük harf */
    }
    .btn:hover{filter:brightness(1.08)}
    .btn.big{padding:14px 18px;font-size:16px}

    /* Player labels and timer */
    .players-header{
      display:contents; /* Grid'e dahil etmek için */
    }
    .player-label{
      text-shadow:0 0 6px rgba(0,0,0,0.6);
      font-size:24px;
      font-weight:900;
      letter-spacing:1px;
    }
    .player-label.p1{grid-area: p1-label; text-align: left;}
    .player-label.p2{grid-area: p2-label; text-align: right;}

    #timeLabel{
      grid-area: time;
      font-family:'VT323', monospace;
      font-size:48px;
      letter-spacing:2px;
      text-shadow:0 0 4px rgba(0,0,0,0.7);
      line-height:1;
      text-transform: none; /* Zaman etiketi normal kalsın */
    }

    /* Score row containing series and time bar */
    .score-row{
      grid-area: series-row;
      display:flex;
      justify-content:center;
      align-items:center;
      gap:20px;
      width:100%;
    }
    .series{
      display:flex;
      gap:12px;
      align-items:center;
    }
    .dot{
      width:40px;
      height:40px;
      border-radius:50%;
      background:#263449;
      box-shadow:inset 0 0 0 2px #162131;
    }
    .dot.win-p1{
      background:radial-gradient(circle at 30% 30%,#fff,var(--p1) 55%,#300b22 140%);
      box-shadow:0 0 14px var(--p1), inset 0 0 3px #fff6;
    }
    .dot.win-p2{
      background:radial-gradient(circle at 30% 30%,#fff,var(--p2) 55%,#083033 140%);
      box-shadow:0 0 14px var(--p2), inset 0 0 3px #fff6;
    }

    /* Time bar container and neon separators */
    .time-bar-container{
      grid-area: time-bar;
      position:relative;
      width:100%; /* Genişletildi */
      max-width: 700px; /* Maksimum genişlik */
      height:24px;
      display:flex;
      align-items:center;
      justify-content:center;
      margin: 0 auto;
    }
    .neon-separator {
      content:"";
      width:2px;
      height: 40px; /* dot yüksekliği ile aynı */
      background:linear-gradient(to bottom,var(--p2),var(--p1));
      box-shadow: 0 0 4px var(--p2), 0 0 8px var(--p1);
    }

    #timeBar{
      width:100%;
      height:20px;
      border-radius:10px;
      background:#162131;
      border:1px solid #1a2636;
      overflow:hidden;
      position:relative;
    }
    #timeFill{
      height:100%;
      width:0%;
      background:var(--p2);
      transition:none;
    }

    .food-row{
      display:contents; /* Grid'e dahil etmek için */
    }
    .counter{
      padding:6px 10px;
      border-radius:10px;
      background:#0b1420cc;
      border:1px solid #1a2636;
      color:var(--muted);
      font-weight:700;
      font-size:14px;
      text-transform: none; /* Sayaçlar normal kalsın */
    }
    #p1FoodBox { grid-area: p1-food; justify-self: start; }
    #p2FoodBox { grid-area: p2-food; justify-self: end; }

    .counter .val{
      color:#fff;
      font-weight:900;
      margin-left:6px;
    }

    /* Hide language button in UI */
    #langBtn{display:none;}

    /* Color selection menu styles */
    .color-options { display: flex; gap: 8px; }
    .color-btn { 
        width: 40px; height: 40px; border-radius: 50%; 
        cursor: pointer; border: 3px solid transparent; 
        transition: all 0.2s;
    }
    .color-menu-separator {
      width: 2px;
      background: #1b2a41;
      align-self: stretch;
      margin: 0 20px;
    }
    .color-btn:hover { transform: scale(1.1); }
    .color-btn:disabled { opacity: 0.3; cursor: not-allowed; transform: none; }
    .banner h2 { font-size: 20px; }

  </style>
</head>
<body>
  <div class="wrap">
    <div id="stage">
      <div id="canvasWrap">
        <canvas id="game" aria-label="Neo Snake Duel canvas"></canvas>
        <!-- Hidden mode title element to satisfy script references -->
        <div id="modeTitle" style="display:none"></div>
        <div class="overlay"><div class="banner" id="banner"></div></div>
      </div>
    </div>

    <audio id="bgMusic" loop src="https://github.com/toy-gun/neo-snake-duel/raw/main/assets/neo-snake-theme.mp3" preload="auto"></audio>


    <footer>
      <div class="panel-left">
        <button id="pauseBtn" class="btn big" data-i18n="pause">DURAKLAT (SPACE)</button>
        <button id="resetBtn" class="btn big" data-i18n="reset">MAÇI SIFIRLA (R)</button>
      </div>
      <div class="panel-center">
        <div class="players-header">
          <span class="player-label p1" id="p1Label">OYUNCU 1</span>
          <span id="timeLabel">03:00</span>
          <span class="player-label p2" id="p2Label">OYUNCU 2</span>
        </div>
        <div class="food-row">
          <div class="counter" id="p1FoodBox"><span data-i18n="p1Food">P1 YEM</span>: <span class="val" id="p1Food">0</span></div>
          <div class="counter" id="p2FoodBox"><span data-i18n="p2Food">P2 YEM</span>: <span class="val" id="p2Food">0</span></div>
        </div>
        <div class="score-row">
          <div class="series left" id="p1Series"></div>
          <div class="neon-separator"></div>
          <div class="series right" id="p2Series"></div>
        </div>
        <div class="time-bar-container">
            <div id="timeBar"><div id="timeFill"></div></div>
        </div>
      </div>
      <div class="panel-right">
        <button id="menuBtn" class="btn big" data-i18n="menu">ANA MENÜ</button>
        <button id="muteBtn" class="btn big">SES: AÇIK (M)</button>
        <button id="musicMuteBtn" class="btn big">MÜZİK: AÇIK</button>
        <button id="langBtn" class="btn big">TR/EN</button>
      </div>
    </footer>
  </div>

<script>
(()=>{
  /* ===========================
    Neo Snake Duel — Alpha v0.29
     ODAK: Arka plan müziği, yeni SFX'ler ve arayüz iyileştirmeleri.
     - Matrix/Tron tarzında, döngüsel arka plan müziği ve ayrı ses kontrolü eklendi.
     - Menü butonları, geri sayım ve canavar modu için yeni ses efektleri (SFX) eklendi.
     - Duvarlı moddaki duvarların kalınlığı artırıldı.
     - 'Talimatlar' metni 'Kurallar' olarak güncellendi.
     - Puan tablosundaki elemanların aralıkları daha dengeli hale getirildi.
    =========================== */

  const VERSION = 'Alpha v0.29';

  /* === i18n === */
  const STRINGS = {
    tr: {
      menu: 'Ana Menü',
      pause: 'Duraklat (Space)',
      resume: 'Sürdür (Space)',
      reset: 'Maçı Sıfırla (R)',
      modeNone: 'MOD: Seçilmedi',
      modePick: 'Oyun Modu',
      pickOne: 'Birini seç:',
      ready: 'Hazır Olun…',
      start: 'BAŞLA!',
      p1: 'OYUNCU 1',
      p2: 'OYUNCU 2',
      p1Food: 'P1 Yem',
      p2Food: 'P2 Yem',
      winP1: '<span class="p1">P1</span> Kazandı!',
      winP2: '<span class="p2">P2</span> Kazandı!',
      draw:  '<span class="draw">Berabere</span>',
      normal: 'NORMAL',
      fast: 'HIZLI',
      extreme: 'AŞIRI',
      play: 'Oyna',
      settings: 'Ayarlar',
      instructions: 'Kurallar',
      developers: 'Geliştiriciler',
      mainMenu: 'Ana Menü',
      snakeSpeed: 'Yılan Hızı',
      wallMode: 'Arena Tipi',
      walls: 'Duvarlı',
      noWalls: 'Duvarsız',
      back: 'Geri',
      colorPick: 'Renk Seçimi',
      startMatch: 'Maçı Başlat!',
      instructionsText: `<h3>Oyunun Amacı</h3><p>Bu oyun iki kişilik bir yılan düellosudur. Rakibinizi yok ederek veya süre sonunda ondan daha uzun olarak roundu kazanın. 5 round kazanan maçı alır.</p>
      <h3>Süre ve Roundlar</h3><p>Her round 3 dakika sürer. Süre dolduğunda, daha uzun olan yılan roundu kazanır.</p>
      <h3>Arena Tipleri</h3><p><b>Duvarsız:</b> Arena kenarlarından geçerek karşı taraftan çıkabilirsiniz.<br><b>Duvarlı:</b> Arena kenarları kapalıdır. Duvarlara çarpmak roundu kaybettirir.</p>
      <h3>Yemler ve Güçlendirmeler</h3><p><b>Normal Yem:</b> Yılanınızı bir kare büyütür.<br><b>Elmas (Altın):</b> Her 5 normal yemden sonra belirir. Sizi 3 kare büyütür, rakibinizi 1 kare küçültür. 3 saniyede bir yer değiştirir.<br><b>Yakut (Kırmızı):</b> Her 10 normal yemden sonra belirir. Sizi 5 saniyeliğine hızlandırır ve dokunulmaz yapar, rakibin içinden geçebilirsiniz. Bu sırada sahaya 10 normal yem daha dökülür.<br><b>Çift Yem:</b> Her 3 normal yemden sonra bir çift yem belirir. Birini yediğinizde diğeri kaybolur.</p>
      <h3>Temel Mekanikler</h3><p>Uzunluğu sıfıra düşen yılan kaybeder.</p>`,
      developersText: 'Bu oyun Romina Franko & Toygun Çetin tarafından Yapay Zeka desteği ile geliştirilmiştir. Topluluğa armağan edilmiştir.'
    },
    en: {
      menu: 'Main Menu',
      pause: 'Pause (Space)',
      resume: 'Resume (Space)',
      reset: 'Reset Match (R)',
      modeNone: 'MODE: Not Selected',
      modePick: 'Game Mode',
      pickOne: 'Choose one:',
      ready: 'Get Ready…',
      start: 'START!',
      p1: 'PLAYER 1',
      p2: 'PLAYER 2',
      p1Food: 'P1 Food',
      p2Food: 'P2 Food',
      winP1: '<span class="p1">P1</span> Wins!',
      winP2: '<span class="p2">P2</span> Wins!',
      draw:  '<span class="draw">Draw</span>',
      normal: 'NORMAL',
      fast: 'FAST',
      extreme: 'EXTREME',
      play: 'Play',
      settings: 'Settings',
      instructions: 'Rules',
      developers: 'Developers',
      mainMenu: 'Main Menu',
      snakeSpeed: 'Snake Speed',
      wallMode: 'Arena Type',
      walls: 'Walls',
      noWalls: 'No Walls',
      back: 'Back',
      colorPick: 'Color Selection',
      startMatch: 'Start Match!',
      instructionsText: `<h3>Objective</h3><p>This is a two-player snake duel. Win a round by eliminating your opponent or by being longer when the time runs out. The first to 5 rounds wins the match.</p>
      <h3>Timer & Rounds</h3><p>Each round lasts 3 minutes. When the timer expires, the longer snake wins the round.</p>
      <h3>Arena Types</h3><p><b>No Walls:</b> The arena wraps around the edges.<br><b>Walls:</b> The arena edges are closed. Crashing into a wall makes you lose the round.</p>
      <h3>Food & Power-ups</h3><p><b>Normal Food:</b> Grows your snake by one segment.<br><b>Diamond (Gold):</b> Spawns after every 5 normal foods. Grows you by 3 segments and shrinks your opponent by 1. It relocates every 3 seconds.<br><b>Ruby (Red):</b> Spawns after every 10 normal foods. Makes you faster and intangible for 5 seconds, allowing you to pass through your opponent. Spawns 10 extra normal foods for its duration.<br><b>Double Food:</b> A pair of normal foods spawns after every 3 normal foods. When one is eaten, the other disappears.</p>
      <h3>Core Mechanics</h3><p>A snake with zero length is eliminated.</p>`,
      developersText: 'This game was developed by Romina Franko & Toygun Çetin with support from AI. It is presented to the community.'
    }
  };
  let lang = localStorage.getItem('neoSnakeLang') || 'tr';
  function t(key){ return (STRINGS[lang] && STRINGS[lang][key]) || key; }

  /* === Color Palette & Selection === */
  const COLOR_PALETTE = [
    { name: 'Pink', hex: '#ff4fbf' },
    { name: 'Turquoise', hex: '#35e6e6' },
    { name: 'Orange', hex: '#ff9f1c' },
    { name: 'Green', hex: '#44ff88' },
    { name: 'Purple', hex: '#9b59b6' },
    { name: 'Red', hex: '#e74c3c' },
    { name: 'Yellow', hex: '#f1c40f' },
    { name: 'Emerald', hex: '#2ecc71' },
    { name: 'Blue', hex: '#3498db' },
    { name: 'White', hex: '#ffffff' }
  ];
  let playerColors = { p1: COLOR_PALETTE[0].hex, p2: COLOR_PALETTE[1].hex };
  function updatePlayerColors(p1_hex, p2_hex) {
    document.documentElement.style.setProperty('--p1', p1_hex);
    document.documentElement.style.setProperty('--p2', p2_hex);
    playerColors.p1 = p1_hex;
    playerColors.p2 = p2_hex;
  }
  /* === Canvas === */
  const canvas=document.getElementById('game');
  const canvasWrap = document.getElementById('canvasWrap');
  const ctx=canvas.getContext('2d');
  let GRID_COLS=64, GRID_ROWS=36;
  const BASE_TPS=14.2;
  let dpr=Math.max(1,Math.min(2,window.devicePixelRatio||1));
  function resize(){
    const st=document.getElementById('stage');
    const r=st.getBoundingClientRect();
    canvas.width=Math.floor(r.width*dpr); canvas.height=Math.floor(r.height*dpr);
    ctx.setTransform(dpr,0,0,dpr,0,0);
  }
  addEventListener('resize',resize,{passive:true}); resize();

  /* === Sound === */
  let audioCtx; let muted=localStorage.getItem('neoSnakeMuted')==='1'; const muteBtn=document.getElementById('muteBtn');
  const bgMusic = document.getElementById('bgMusic');
  let musicMuted = localStorage.getItem('neoSnakeMusicMuted') === '1';
  const musicMuteBtn = document.getElementById('musicMuteBtn');

  function ensureAudio(){ 
    if(!audioCtx) audioCtx=new (window.AudioContext||window.webkitAudioContext)(); 
    if (bgMusic.paused && !musicMuted) {
        bgMusic.play().catch(e => console.error("Music play failed:", e));
    }
  }
  function tone(freq,dur,{type='square',gain=0.06,attack=0.004,release=0.06,sweep=0}={}){
    if(muted) return; try{
      ensureAudio(); const now=audioCtx.currentTime;
      const o=audioCtx.createOscillator(); const g=audioCtx.createGain();
      o.type=type; o.frequency.value=freq;
      if(sweep){ o.frequency.linearRampToValueAtTime(freq*(1+sweep), now+dur); }
      g.gain.value=0; g.gain.linearRampToValueAtTime(gain, now+attack);
      g.gain.linearRampToValueAtTime(0.0001, now+Math.max(dur-0.01,0)+release);
      o.connect(g).connect(audioCtx.destination); o.start(now); o.stop(now+dur+release+0.03);
    }catch(e){}
  }
  const SFX={
    eat(){ tone(720,0.08,{type:'square',gain:0.05}); },
    diamond(){ tone(1200, 0.1, {type:'triangle', gain:0.07}); setTimeout(()=>tone(1600, 0.15, {type:'sine', gain:0.06}), 80); },
    heart(){ tone(640, 0.1, {type:'square', gain:0.08}); setTimeout(()=>tone(1240, 0.15, {type:'sawtooth', gain:0.08}), 90); setTimeout(()=>tone(1860, 0.1, {type:'sine', gain:0.07}), 180); },
    crash(){ tone(180,0.20,{type:'sawtooth',gain:0.08,sweep:-0.35}); },
    drawCrash(){ tone(220, 0.25, {type:'sawtooth', gain:0.1, sweep:-0.5}); tone(160, 0.25, {type:'square', gain:0.1, sweep:-0.5}); },
    start(){ tone(420,0.10,{type:'sine',gain:0.05}); setTimeout(()=>tone(640,0.12,{type:'sine',gain:0.05}),120); setTimeout(()=>tone(860,0.14,{type:'sine',gain:0.05}),260); },
    pause(){ tone(360,0.06,{type:'square',gain:0.04}); },
    menuClick(){ tone(880, 0.05, {type:'triangle', gain:0.04}); },
    countdownTick(){ tone(1200, 0.08, {type:'sine', gain:0.03}); },
    beastMode(){
        if(muted) return;
        ensureAudio();
        const now = audioCtx.currentTime;
        const base = 160;
        for(let i=0; i<16; i++){
            const o=audioCtx.createOscillator(); const g=audioCtx.createGain();
            o.type='sawtooth';
            o.frequency.value = base * (1 + i/12);
            g.gain.setValueAtTime(0.05, now + i*0.2);
            g.gain.linearRampToValueAtTime(0, now + i*0.2 + 0.2);
            o.connect(g).connect(audioCtx.destination);
            o.start(now + i*0.2);
            o.stop(now + i*0.2 + 0.25);
        }
    },
    gulp(){ tone(420,0.06,{type:'triangle',gain:0.06}); setTimeout(()=>tone(240,0.08,{type:'sine',gain:0.05}),50); },
    whoosh(){ tone(980,0.05,{type:'triangle',gain:0.04}); setTimeout(()=>tone(820,0.05,{type:'triangle',gain:0.04}),55); setTimeout(()=>tone(680,0.05,{type:'triangle',gain:0.04}),110); },
    disappear(){
      tone(560,0.10,{type:'triangle',gain:0.06});
      setTimeout(()=>tone(340,0.14,{type:'triangle',gain:0.05}),80);
    },
    win(){
      if(muted) return;
      ensureAudio();
      const notes=[660,880,660,990,880,660,550,660,770,660,880,990,880,660,550,660,770,880,660,440];
      notes.forEach((freq,idx)=>{
        const delay=idx*230;
        setTimeout(()=>{
          tone(freq,0.14,{type:'square',gain:0.05});
        },delay);
      });
    },

  /* === Helpers === */
  function rngCell(){ return { x:(Math.random()*GRID_COLS)|0, y:(Math.random()*GRID_ROWS)|0 } }
  function handleBoundaries(c) {
    let x=c.x, y=c.y;
    if (currentWallMode === MOD_WALLS.SOLID) {
        if (x < 0 || x >= GRID_COLS || y < 0 || y >= GRID_ROWS) {
            return null; // Duvara çarptı
        }
    } else { // No walls
        if(x<0)x=GRID_COLS-1; else if(x>=GRID_COLS)x=0;
        if(y<0)y=GRID_ROWS-1; else if(y>=GRID_ROWS)y=0;
    }
    return {x,y};
  }
  async function countdown(n){
    inCountdown=true;
    for(let i=n;i>0;i--){
      showBanner(`<h1>${i}</h1><p class="small-text">${t('ready')}</p>`);

  function modLerp(prev, cur, cap, t){
    if (currentWallMode === MOD_WALLS.SOLID) {
        return prev + (cur - prev) * t;
    }
    let a=prev, b=cur;
    let d=b-a;
    if(d>cap/2) a+=cap; else if(d<-cap/2) a-=cap;
    const v=a + (b-a)*t;
    let out=v%cap; if(out<0) out+=cap;
    return out;
  }

  function hexToRgba(hex, alpha=1.0){
    if(!hex) return `rgba(255,255,255,${alpha})`;
    let c = hex.replace('#','');
    if(c.length === 3){ c = c[0]+c[0] + c[1]+c[1] + c[2]+c[2]; }
    const bigint = parseInt(c, 16);
    const r = (bigint >> 16) & 255;
    const g = (bigint >> 8) & 255;
    const bcol = bigint & 255;
    return `rgba(${r},${g},${bcol},${alpha})`;
  }

  function mixColors(a, b, t){
    function parse(hex){ let c = hex.replace('#',''); if(c.length === 3){ c = c[0]+c[0]+c[1]+c[1]+c[2]+c[2]; } const n=parseInt(c,16); return {r:(n>>16)&255,g:(n>>8)&255,b:n&255}; }
    const ca=parse(a), cb=parse(b);
    const r = Math.round(ca.r + (cb.r - ca.r) * t);
    const g = Math.round(ca.g + (cb.g - ca.g) * t);
    const bcol = Math.round(ca.b + (cb.b - ca.b) * t);
    return `#${((1<<24)+(r<<16)+(g<<8)+bcol).toString(16).slice(1)}`;
  }

  let lastTimeLeft = 0;
  function updateTimerUI(timeLeftMs){
    const label = document.getElementById('timeLabel');
    const fill = document.getElementById('timeFill');
    const total = ROUND_DURATION;
    let ms = Math.max(0, timeLeftMs);

    const colBlue = playerColors.p2;
    const colPink = playerColors.p1;
    fill.style.background = mixColors(colBlue, colPink, ratio);
    const secs = Math.ceil(ms/1000);
    if (secs <= 10 && secs > 0 && Math.ceil(lastTimeLeft/1000) > secs) {
        SFX.countdownTick();
    }
    lastTimeLeft = ms;
    const m = Math.floor(secs / 60);
    const s = secs % 60;
    label.textContent = `${m.toString().padStart(2,'0')}:${s.toString().padStart(2,'0')}`;
    let color;
    if(secs > 60){ const idx = Math.floor(secs / 10) % 2; color = idx === 0 ? colBlue : colPink; }

  /* === Core === */
  const dirMap={up:{x:0,y:-1},down:{x:0,y:1},left:{x:-1,y:0},right:{x:1,y:0}};
  function opposite(a,b){return a.x===-b.x&&a.y===-b.y;}
  function createSnake(start,dir){ const seg=[ start,{x:start.x-dir.x,y:start.y-dir.y},{x:start.x-2*dir.x,y:start.y-2*dir.y} ]; return { segments:seg, prev:seg.map(s=>({...s})), dir:{...dir}, nextDir:{...dir}, grow:0, powerEnd:0, flashUntil:0, flashColor:null, shakeUntil: 0 }; }
  function isPowered(s){ return s && performance.now()<s.powerEnd; }

  function softReset(full=false){
    GRID_COLS=64; GRID_ROWS=36;

  function awardGame(who){ if(who==='p1'){ games.p1++; } else if(who==='p2'){ games.p2++; } drawSeries(); }

  function spawnFood(){
    const now = performance.now();
    if(redBulkEndTime && now < redBulkEndTime){ return; }
    if(doubleActive || diamondActive){ return; }
    const normalCount = foods.filter(f => f.type === 'normal' && !f.pairId).length;
    if(normalCount < 1){ spawnNormal(); }
  }
  function spawnNormal(){
    let tries=0; const occ=new Set([ ...snakes.p1.segments, ...snakes.p2.segments, ...foods ].map(o=>o.x+','+o.y));
    let f; do{ f=rngCell(); tries++; if(tries>800) return; }while(occ.has(f.x+','+f.y));
    foods.push({x:f.x, y:f.y, type:'normal', spawnAt:performance.now()});
  }
  function spawnDiamondFood(){
    diamondActive = true;
    for(let i=foods.length-1; i>=0; i--){ const item = foods[i]; if(item.type === 'normal' && !item.pairId){ foods.splice(i,1); } }
    let tries=0; const occ=new Set([ ...snakes.p1.segments, ...snakes.p2.segments, ...foods ].map(o=>o.x+','+o.y)); let f;
    do{ f=rngCell(); tries++; if(tries>800) return; }while(occ.has(f.x+','+f.y));
    foods.push({ x:f.x, y:f.y, type:'diamond', spawnAt:performance.now(), expiryTime:performance.now()+3000 });
  }
  function spawnRedFood(extra=false){
    let tries=0; const occ=new Set([ ...snakes.p1.segments, ...snakes.p2.segments, ...foods ].map(o=>o.x+','+o.y)); let f;
    do{ f=rngCell(); tries++; if(tries>800) return; }while(occ.has(f.x+','+f.y));
    foods.push({ x:f.x, y:f.y, type:'heart', spawnAt:performance.now(), extra:extra });
    redFoodPresent = true;
  }
  function spawnDoubleFood(){
    doubleActive = true;
    for(let i=foods.length-1;i>=0;i--){ const item = foods[i]; if(item.type==='normal' && !item.pairId){ foods.splice(i,1); } }
    const pairId = ++pairIdCounter;
    for(let j=0;j<2;j++){
      let tries=0; const occ=new Set([ ...snakes.p1.segments, ...snakes.p2.segments, ...foods ].map(o=>o.x+','+o.y)); let f;
      do{ f=rngCell(); tries++; if(tries>800) return; }while(occ.has(f.x+','+f.y));
      foods.push({x:f.x, y:f.y, type:'normal', pairId:pairId, spawnAt:performance.now()});
    }
  }
  function spawnBulkNormals(count){
    for(let k=0;k<count;k++){
      let tries=0; const occ=new Set([ ...snakes.p1.segments, ...snakes.p2.segments, ...foods ].map(o=>o.x+','+o.y)); let f;
      do{ f=rngCell(); tries++; if(tries>800) break; }while(occ.has(f.x+','+f.y));
      if(tries<=800){ foods.push({ x:f.x, y:f.y, type:'normal', spawnAt:performance.now() }); }
    }
  }
  function updateFoodCounters(){ document.getElementById('p1Food').textContent = stats.p1Food; document.getElementById('p2Food').textContent = stats.p2Food; }

  function eatFoodIfAny(s, ownerKey){
    for(let i=0;i<foods.length;i++){
      const f=foods[i];
      if(f.x===s.segments[0].x && f.y===s.segments[0].y){
        foods.splice(i,1);
        if(f.pairId){ for(let j=foods.length-1;j>=0;j--){ if(foods[j].pairId && foods[j].pairId===f.pairId){ foods.splice(j,1); break; } } doubleActive = false; }
        const now = performance.now();
        if(f.type==='diamond'){
          s.grow += 3;
          const otherKey = ownerKey === 'p1' ? 'p2' : 'p1';
          const other = snakes[otherKey];
          if(other.segments.length > 0){ other.segments.pop(); }
          if(snakes[otherKey].segments.length === 0){ startDeathAnim(otherKey, ownerKey); return; }
          SFX.diamond();
          s.flashUntil = now + 400;
          s.flashColor = '#ffd166';
          diamondActive = false;
        } else if(f.type==='heart'){
          s.grow += 1;
          if(f.extra){
            if(beastOwner === ownerKey){
              s.powerEnd += 5000;
              redBulkEndTime += 5000;
            } else {
              if(beastOwner && snakes[beastOwner]){ snakes[beastOwner].powerEnd = 0; }
              beastOwner = ownerKey;
              s.powerEnd = now + 5000;
              redBulkEndTime = now + 5000;
            }
            SFX.heart();
            redFoodPresent = false;
          } else {
            s.powerEnd = now + 5000;
            beastOwner = ownerKey;
            SFX.heart();
            redFoodPresent = false;
            foods.length = 0;
            diamondActive = false;
            doubleActive = false;
            redBulkEndTime = now + 5000;
            spawnBulkNormals(10);
            spawnRedFood(true);
          }
        } else {
          s.grow += 1;
          normalFoodsEaten++;
          SFX.eat();
        }
        if(ownerKey==='p1'){ stats.p1Food++; } else { stats.p2Food++; }
        updateFoodCounters();
        if(f.type==='normal'){
          if(normalFoodsEaten % 10 === 0){ if(!redFoodPresent && !(redBulkEndTime && now < redBulkEndTime)){ spawnRedFood(false); } }
          else if(normalFoodsEaten % 5 === 0){ if(!diamondActive && !redFoodPresent && !(redBulkEndTime && now < redBulkEndTime)){ spawnDiamondFood(); } }
          else if(normalFoodsEaten % 3 === 0){ if(!doubleActive && !diamondActive && !(redBulkEndTime && now < redBulkEndTime)){ spawnDoubleFood(); } }
        }
        spawnFood();
        return;
      }
    }
  }

  function bodyAdvance(s, ownerKey){
    const head=s.segments[0];
    if(!opposite(s.nextDir,s.dir)) s.dir={...s.nextDir};
    const nextPos = {x:head.x+s.dir.x, y:head.y+s.dir.y};
    const nextHead = handleBoundaries(nextPos);

    s.prev = s.segments.map(c=>({...c}));

    if (!nextHead) { // Duvara çarptı
        const winner = ownerKey === 'p1' ? 'p2' : 'p1';
        startDeathAnim(ownerKey, winner);
        return false; // İlerleme durdu
    }

    s.segments.unshift(nextHead);
    if(s.grow>0) s.grow--; else s.segments.pop();
    return true; // İlerleme başarılı
  }

  function collideCheckDetailed(){
    const s1=snakes.p1, s2=snakes.p2;
    const head1=s1.segments[0], head2=s2.segments[0];
    const intangible1 = isPowered(s1);
    const intangible2 = isPowered(s2);
    if(head1.x===head2.x && head1.y===head2.y){
      if(intangible1 && !intangible2){ return {result:'p1', eater:'p1'}; }
      if(intangible2 && !intangible1){ return {result:'p2', eater:'p2'}; }
      return {result:'draw', eater:null};
    }
    const self1=new Set(s1.segments.slice(1).map(c=>c.x+','+c.y));
    const self2=new Set(s2.segments.slice(1).map(c=>c.x+','+c.y));
    const k1=head1.x+','+head1.y;
    const k2=head2.x+','+head2.y;
    if(intangible1 && !intangible2){
      const hit1Self = self1.has(k1);
      if(hit1Self) return {result:'p2', eater:null};
      const hitCross = self2.has(k1) || self1.has(k2) || self2.has(k2);
      if(hitCross){ return {result:'p1', eater:'p1'}; }
      return {result:null, eater:null};
    }
    if(intangible2 && !intangible1){
      const hit2Self = self2.has(k2);
      if(hit2Self) return {result:'p1', eater:null};
      const hitCross = self1.has(k2) || self2.has(k1) || self1.has(k1);
      if(hitCross){ return {result:'p2', eater:'p2'}; }
      return {result:null, eater:null};
    }
    if(intangible1 && intangible2){
      const hit1Self = self1.has(k1);
      const hit2Self = self2.has(k2);
      if(hit1Self && hit2Self) return {result:'draw', eater:null};
      if(hit1Self) return {result:'p2', eater:null};
      if(hit2Self) return {result:'p1', eater:null};
      return {result:null, eater:null};
    }
    const hit1Self = self1.has(k1);
    const hit2Self = self2.has(k2);
    const hit1Opp  = self2.has(k1);
    const hit2Opp  = self1.has(k2);
    const hit1 = hit1Self || hit1Opp;
    const hit2 = hit2Self || hit2Opp;
    if(hit1 && hit2) return {result:'draw', eater:null};
    if(hit1){ return {result:'p2', eater: hit1Opp ? 'p1' : null}; }
    if(hit2){ return {result:'p1', eater: hit2Opp ? 'p2' : null}; }
    return {result:null, eater:null};
  }

  /* === Animations & Rendering === */
  let deathAnim = { active:false, loser:null, winner:null, nextAt:0, stepMs:0 };
  function startDeathAnim(loser, winner){
    const len = snakes && snakes[loser] ? snakes[loser].segments.length : 1;
    const ms = len > 0 ? 500 / len : 40;
    deathAnim = { active:true, loser, winner, nextAt:performance.now(), stepMs: ms };
    intermission = true;
    SFX.crash(); SFX.whoosh(); SFX.disappear();
  }
  let winAnim = { active:false, winner:null, start:0, duration:5000, blinkPeriod:350, final:false, color:'#fff' };
  function startWinAnim(winner, final=false){
    winAnim.active = true;
    winAnim.winner = winner;
    winAnim.start = performance.now();
    winAnim.final = final;
    if(final){ winAnim.duration = 5000; SFX.win(); }
    else{ winAnim.duration = 2000; SFX.winRound(); } 
    const col = playerColors[winner]; // Seçilen rengi al
    winAnim.color = col || '#fff';
    intermission = true;
    foods.length = 0;
    const winText = (winner === 'p1') ? t('winP1') : t('winP2');
    showBanner(`<h1 style="color:${col}; text-shadow: 0 0 8px ${col};">${winText}</h1>`);
    const patterns = {
      'P': [ [0,1,2,3], [0,3], [0,3], [0,1,2], [0], [0], [0] ],
      '1': [ [1,2], [0,1,2,3], [2], [2], [2], [2], [0,1,2,3] ],
      '2': [ [0,1,2,3], [3], [2], [1], [0], [0], [0,1,2,3] ]
    };
    const charWidths = { 'P':4, '1':4, '2':4 };
    const charHeight = 7;
    const scale = 2;
    function scaledChar(char){ const rows = patterns[char]; const positions=[]; for(let row=0; row<rows.length; row++){ for(const col of rows[row]){ for(let dy=0; dy<scale; dy++){ for(let dx=0; dx<scale; dx++){ positions.push({ x: col*scale + dx, y: row*scale + dy }); } } } } return { positions, width: charWidths[char] * scale, height: charHeight * scale }; }
    const numChar = (winner === 'p1') ? '1' : '2';
    const pData = scaledChar('P');
    const nData = scaledChar(numChar);
    const gap = scale;
    const totalWidth = pData.width + gap + nData.width;
    const totalHeight = Math.max(pData.height, nData.height);
    const offsetX = Math.floor((GRID_COLS - totalWidth) / 2);
    const offsetY = Math.floor((GRID_ROWS - totalHeight) / 2);
    const pPositions = pData.positions.map(p => ({ x: p.x + offsetX, y: p.y + offsetY }));
    const nPositions = nData.positions.map(p => ({ x: p.x + offsetX + pData.width + gap, y: p.y + offsetY }));
    if(final){
      if(winner === 'p1'){ snakes.p1.segments = [...pPositions, ...nPositions]; snakes.p2.segments = []; }
      else{ snakes.p2.segments = [...pPositions, ...nPositions]; snakes.p1.segments = []; }
    }else{
      if(winner === 'p1'){ snakes.p1.segments = nPositions; snakes.p2.segments = pPositions; }
      else{ snakes.p2.segments = nPositions; snakes.p1.segments = pPositions; }
    }
    for(const key of ['p1','p2']){
      const s = snakes[key];
      s.prev = s.segments.map(c => ({...c}));
      s.dir = {x:0,y:0}; s.nextDir = {x:0,y:0}; s.grow = 0; s.powerEnd = 0;
    }
  }
  function endGame(result){
    if(result==='p1' || result==='p2'){
      awardGame(result);
      hideBanner(); // Önceki banner'ı gizle
      const isFinal = games[result] >= GAMES_TO_ROUND;
      startWinAnim(result, isFinal);
    } else { // Beraberlik
      intermission = true;
      showBanner(`<h1>${t('draw')}</h1>`);
      SFX.drawCrash();
      const now = performance.now();
      snakes.p1.shakeUntil = now + 200;
      snakes.p2.shakeUntil = now + 200;
      canvasWrap.classList.add('shake');
      setTimeout(()=>{ 
        canvasWrap.classList.remove('shake');
        hideBanner(); 
        resetRound(3); 
      }, 1300);
    }
  }
  async function resetRound(count=3){
    const mid={x:(GRID_COLS/2)|0, y:(GRID_ROWS/2)|0};
    const startP1={x:mid.x-20, y:mid.y-6}; const startP2={x:mid.x+20, y:mid.y+6};
    stats.p1Food=0; stats.p2Food=0; updateFoodCounters();
    snakes={ p1:createSnake(startP1, dirMap.right), p2:createSnake(startP2, dirMap.left) };
    foods.length=0; acc1=0; acc2=0; bulkFoodEndTime=0; totalEaten=0; pairIdCounter=0;
    normalFoodsEaten=0;
    diamondActive=false; redFoodPresent=false; redBulkEndTime=0; doubleActive=false; beastOwner=null;
    deathAnim.active=false;
    spawnFood();
    roundTimerEnd = performance.now() + ROUND_DURATION;
    timerEnded = false;
    updateTimerUI(ROUND_DURATION);
    await countdown(count);
  }

  function drawGrid(){
    const w=canvas.clientWidth,h=canvas.clientHeight,cw=w/GRID_COLS,ch=h/GRID_ROWS;
    ctx.save(); ctx.strokeStyle=getComputedStyle(document.documentElement).getPropertyValue('--grid') || '#1a2537'; ctx.globalAlpha=0.14;
    ctx.beginPath();
    for(let x=0;x<=GRID_COLS;x++){ const X=Math.round(x*cw)+.5; ctx.moveTo(X,0); ctx.lineTo(X,h); }
    for(let y=0;y<=GRID_ROWS;y++){ const Y=Math.round(y*ch)+.5; ctx.moveTo(0,Y); ctx.lineTo(w,Y); }
    ctx.stroke(); 
    
    if (currentWallMode === MOD_WALLS.SOLID) {
        ctx.strokeStyle = '#e74c3c';
        ctx.lineWidth = 6;
        ctx.globalAlpha = 0.7;
        ctx.shadowColor = '#e74c3c';
        ctx.shadowBlur = 10;
        ctx.strokeRect(2, 2, w - 4, h - 4);
    }
    ctx.restore();
  }
  function drawSnakeBlocks(s, ownerKey, alphaProgress){
    const cw=canvas.clientWidth/GRID_COLS, ch=canvas.clientHeight/GRID_ROWS;
    ctx.save();

    const now = performance.now();
    if (s.shakeUntil > now) {
        const shakeAmount = 4;
        const shakeX = (Math.random() - 0.5) * shakeAmount;
        const shakeY = (Math.random() - 0.5) * shakeAmount;
        ctx.translate(shakeX, shakeY);
    }

    const winning = winAnim.active;
    for(let i=0;i<s.segments.length;i++){
      const cur=s.segments[i], prev=s.prev[i]||cur;
      const x=modLerp(prev.x, cur.x, GRID_COLS, alphaProgress); 
      const y=modLerp(prev.y, cur.y, GRID_ROWS, alphaProgress); 
      const cx=(x+.5)*cw, cy=(y+.5)*ch;
      const size=Math.min(cw,ch)*0.80;
      const half=size/2;
      const left=cx-half, top=cy-half;
      const beast = isPowered(s);
      const flashing = s.flashUntil && performance.now() < s.flashUntil;
      const flashPeriod = 120;
      const flashVisible = ((performance.now()/flashPeriod)|0) % 2 === 0;
      ctx.save();
      ctx.globalCompositeOperation='screen';
      const g=ctx.createRadialGradient(cx,cy,1,cx,cy,size*1.0);
      if(winning){
        const col = winAnim.color || '#ffffff';
        g.addColorStop(0, hexToRgba(col,0.40));
      } else if(beast){
        g.addColorStop(0,'rgba(255,23,68,0.4)');
      } else {
        const baseAura = hexToRgba(playerColors[ownerKey], 0.25);
        g.addColorStop(0, baseAura);
      }
      g.addColorStop(1, 'rgba(0,0,0,0)');
      ctx.fillStyle=g;
      ctx.fillRect(left-size*0.3, top-size*0.3, size*1.6, size*1.6);
      ctx.restore();
      let bodyColor;
      if(winning){
        bodyColor = winAnim.color || '#ffffff';
      } else if(flashing && flashVisible){
        bodyColor = s.flashColor || '#ffd166';
      } else if(beast){
        bodyColor = '#ff1744';
      } else {
        bodyColor = playerColors[ownerKey];
      }
      ctx.fillStyle = bodyColor;
      ctx.fillRect(left, top, size, size);
      ctx.save();
      ctx.globalCompositeOperation='lighter';
      const ig=ctx.createRadialGradient(cx,cy,1,cx,cy,size*0.4);
      ig.addColorStop(0,'rgba(255,255,255,0.40)');
      ig.addColorStop(1,'rgba(255,255,255,0.04)');
      ctx.fillStyle=ig; ctx.fillRect(left, top, size, size);
      ctx.restore();
    }
    ctx.restore();
  }
  function drawFoods(){
    const w=canvas.clientWidth,h=canvas.clientHeight,cw=w/GRID_COLS,ch=h/GRID_ROWS;
    for(const f of foods){
      const cx=(f.x+.5)*cw, cy=(f.y+.5)*ch;
      const r=Math.min(cw,ch)*0.34;
      ctx.save();
      ctx.globalCompositeOperation='screen';
      let haloRadius, base, innerColor;
      const glowAnim = 0.5 + (Math.sin(performance.now() / 200) + 1) / 4; // 0.5 to 1.0

      if(f.type === 'diamond'){
        haloRadius = r * 3.5 * glowAnim;
        base = `rgba(255,209,102,${0.6 * glowAnim})`;
        innerColor = '#ffd166';
      } else if(f.type === 'heart'){
        haloRadius = r * 3.2 * glowAnim;
        base = `rgba(255,23,68,${0.6 * glowAnim})`;
        innerColor = '#ff1744';
      } else {
        haloRadius = r * 2.2;
        base = 'rgba(158,208,255,0.25)';
        innerColor = '#9ed0ff';
      }
      const halo=ctx.createRadialGradient(cx,cy,1,cx,cy,haloRadius);
      halo.addColorStop(0, base);
      halo.addColorStop(1, 'rgba(0,0,0,0)');
      ctx.fillStyle=halo; ctx.beginPath(); ctx.arc(cx,cy,haloRadius*0.75,0,Math.PI*2); ctx.fill();
      ctx.restore();
      ctx.beginPath();
      ctx.arc(cx,cy,r,0,Math.PI*2);
      ctx.fillStyle = innerColor;
      ctx.fill();
      ctx.save();
      ctx.globalCompositeOperation='lighter';
      ctx.beginPath();
      ctx.arc(cx,cy,r*0.75,0,Math.PI*2);
      ctx.fillStyle=`rgba(255,255,255,${0.55 * glowAnim})`;
      ctx.fill();
      ctx.restore();
    }
  }
  function render(alpha1, alpha2){
    ctx.clearRect(0,0,canvas.width,canvas.height);
    drawGrid();
    if(snakes){
      drawFoods();
      drawSnakeBlocks(snakes.p2, 'p2', alpha2);
      drawSnakeBlocks(snakes.p1, 'p1', alpha1);
    }
  }
  function renderWinAnim(){
    ctx.clearRect(0,0,canvas.width,canvas.height);
    drawGrid();
    const elapsed = performance.now() - winAnim.start;
    const period = winAnim.blinkPeriod;
    const visible = Math.floor(elapsed / period) % 2 === 0;
    if(visible){
      if(snakes){
        drawSnakeBlocks(snakes.p2, 'p2', 0);
        drawSnakeBlocks(snakes.p1, 'p1', 0);
      }
    }
  }

  /* === Loop === */
  let last=performance.now();
  function step(){
    const now=performance.now(), dt=now-last; last=now;
    if(winAnim.active){
      const elapsed = now - winAnim.start;
      if(elapsed >= winAnim.duration){
        winAnim.active = false; intermission = false; hideBanner(); // Animasyon bitince banner'ı gizle
        if(winAnim.final){ openMainMenu(); }
        else{ resetRound(3); }
        requestAnimationFrame(step); return;
      }
      renderWinAnim();
      requestAnimationFrame(step); return;
    }
    if(redBulkEndTime && now >= redBulkEndTime){
      foods.length = 0;
      redBulkEndTime = 0;
      redFoodPresent = false;
      beastOwner = null;
      spawnFood();
    }
    const modeBoost = currentSpeedMode ? (MOD_SPEED[currentSpeedMode]||1.0) : 1.0;
    const baseStepMs = 1000/(BASE_TPS*modeBoost);
    for(let i=0; i<foods.length; i++){
      const f=foods[i];
      if(f.type==='diamond' && f.expiryTime && now >= f.expiryTime){
        let tries=0;
        const occ=new Set([ ...snakes.p1.segments, ...snakes.p2.segments, ...foods ].map(o=>o.x+','+o.y));
        occ.delete(f.x+','+f.y);
        let newPos;
        do{ newPos=rngCell(); tries++; if(tries>800) break; }while(occ.has(newPos.x+','+newPos.y));
        if(tries<=800){ f.x=newPos.x; f.y=newPos.y; f.spawnAt=now; f.expiryTime=now+3000; }
      }
    }
    if(deathAnim.active){
      const loser = snakes[deathAnim.loser];
      if(now>=deathAnim.nextAt){
        loser.prev = loser.segments.map(c=>({...c}));
        loser.segments.pop();
        deathAnim.nextAt = now + deathAnim.stepMs;
        if(loser.segments.length === 0){ deathAnim.active=false; endGame(deathAnim.winner); }
      }
      render(0,0);
      requestAnimationFrame(step); return;
    }
    if(currentSpeedMode && !paused && !inCountdown && !intermission && !winAnim.active && !deathAnim.active){
      const tLeft = roundTimerEnd - now;
      updateTimerUI(tLeft);
      if(!timerEnded && tLeft <= 0){ timerEnded = true; endRoundByTime(); requestAnimationFrame(step); return; }
    }
    if(snakes && !paused && !inCountdown && !intermission && currentSpeedMode){
      acc1 += dt; acc2 += dt;
      let guard=0;
      while(guard++<12){
        const s1=snakes.p1, s2=snakes.p2;
        const i1 = baseStepMs / speedMult(s1);
        const i2 = baseStepMs / speedMult(s2);
        const r1 = acc1 >= i1, r2 = acc2 >= i2;
        if(!r1 && !r2) break;
        if(r1 && r2){
          const moved1 = bodyAdvance(s1, 'p1');
          const moved2 = bodyAdvance(s2, 'p2');
          if (!moved1 || !moved2) break; // Biri duvara çarptı, döngüden çık
          acc1 -= i1; acc2 -= i2;
          eatFoodIfAny(s1,'p1'); eatFoodIfAny(s2,'p2');
          const chk = collideCheckDetailed();
          if(chk.result){ endGame(chk.result); break; }
        } else if(r1){
          const moved1 = bodyAdvance(s1, 'p1');
          if (!moved1) break;
          acc1 -= i1;
          eatFoodIfAny(s1,'p1');
          const chk = collideCheckDetailed();
          if(chk.result){ endGame(chk.result); break; }
        } else if(r2){
          const moved2 = bodyAdvance(s2, 'p2');
          if (!moved2) break;
          acc2 -= i2;
          eatFoodIfAny(s2,'p2');
          const chk = collideCheckDetailed();
          if(chk.result){ endGame(chk.result); break; }
        }
      }
    }
    const s1=snakes?.p1, s2=snakes?.p2;
    let alpha1=0, alpha2=0;
    if(s1 && currentSpeedMode){ const i1=(1000/(BASE_TPS*(MOD_SPEED[currentSpeedMode]||1.0)))/speedMult(s1); alpha1=Math.min(1,acc1/i1); }
    if(s2 && currentSpeedMode){ const i2=(1000/(BASE_TPS*(MOD_SPEED[currentSpeedMode]||1.0)))/speedMult(s2); alpha2=Math.min(1,acc2/i2); }
    render(alpha1, alpha2);
    requestAnimationFrame(step);
  }

  // Başlangıçta ana menüyü aç
  openMainMenu();
  applyLang();
  requestAnimationFrame(step);
})();
</script>
