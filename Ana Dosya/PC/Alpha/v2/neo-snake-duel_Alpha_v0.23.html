<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Neo Snake Duel — Alpha v0.23</title>
  <!-- Version: Alpha v0.23 -->
  <style>
    :root{
      --bg:#0b0f14;
      --grid:#1a2537;
      --p1:#ff4fbf;       /* Pembe (Player 1) */
      --p2:#35e6e6;       /* Turkuaz (Player 2) */
      --gold:#ffd166;     /* Elmas (sarı) */
      --heart:#ff1744;    /* Yakut kırmızısı */
      --ui-tile:#0c141f;
      --ui-tile-border:#1b2a41;
      --ui-tile-soft:#0f1a2a;
      --text:#e7f1ff;
      --muted:#9fb3d1;
    }
    *{box-sizing:border-box}
    html,body{height:100%}
    body{
      margin:0;background:var(--bg);color:var(--text);
      font-family:ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,Arial;
      overflow:hidden
    }
    .wrap{height:100%;display:grid;grid-template-rows:1fr auto}
    #stage{position:relative;height:calc(100vh - 150px)}
    #canvasWrap{
      position:relative;width:100%;height:100%;border-radius:22px;overflow:hidden;
      box-shadow:0 44px 130px #000a,0 12px 44px #0009,inset 0 0 0 1px #1a2636;
      background:#09101a
    }
    canvas{width:100%;height:100%;display:block;
      background:radial-gradient(1200px 900px at 50% -30%, #122034 0%, #0b121c 40%, #081018 75%, #050a10 100%)
    }
    #canvasWrap::before{
      content:"";position:absolute;inset:0;
      background:linear-gradient(transparent,rgba(0,0,0,.35)),
                 repeating-linear-gradient(180deg,#0000 0 2px,#0003 2px 3px);
      mix-blend-mode:multiply;pointer-events:none
    }

    .hudTop{
      position:absolute;inset:10px 12px auto 12px;
      display:flex;gap:10px;justify-content:center;align-items:center;pointer-events:none;z-index:5
    }
    .title{
      pointer-events:none;margin:0 12px;padding:8px 12px;font-weight:900;font-size:13px;letter-spacing:.6px;opacity:.95;
      background:#0b1420cc;border:1px solid #1a2636;border-radius:10px;box-shadow:0 8px 24px #0007
    }
    .version{opacity:.8}

    .overlay{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none;z-index:6}
    .banner{
      pointer-events:auto;min-width:320px;max-width:92%;text-align:center;padding:18px 22px;border-radius:18px;
      background:linear-gradient(180deg,#0d1624ee,#0a111de0);
      border:1px solid #1b2a41;box-shadow:0 16px 50px #0009;
      transform:translateY(10px) scale(.96);opacity:0;transition:all .45s cubic-bezier(.2,.8,.2,1)
    }
    .banner.show{transform:translateY(0) scale(1);opacity:1}
    .banner h1{margin:0 0 6px;font-size:clamp(22px,4.2vw,44px);letter-spacing:1px}
    .banner p{margin:0;opacity:.9;font-size:14px}
    .banner .p1{color:var(--p1)} .banner .p2{color:var(--p2)} .banner .draw{color:#9ed0ff}

    footer{
      height:150px;display:grid;grid-template-columns: 1fr auto 1fr;align-items:center;gap:14px;
      padding:14px;background:linear-gradient(180deg,#0e1726cc,#0a111dcc);border-top:1px solid #1b2a41;
      backdrop-filter:blur(6px)
    }
    .controls-left,.controls-right{display:flex;gap:12px;align-items:stretch}
    .tile{
      display:flex;flex-direction:column;justify-content:center;align-items:center;gap:8px;
      min-width:140px;padding:12px 14px;border-radius:16px;background:var(--ui-tile);
      border:1px solid var(--ui-tile-border);box-shadow:0 6px 20px #0007
    }
    .tile .btn{width:100%}
    .btn{
      padding:12px 16px;border-radius:12px;background:var(--ui-tile-soft);border:1px solid var(--ui-tile-border);
      color:#d9e6ff;cursor:pointer;font-weight:800;letter-spacing:.3px;font-size:14px
    }
    .btn:hover{filter:brightness(1.08)}
    .btn.big{padding:14px 18px;font-size:16px}

    .series-wrap{justify-self:center;display:flex;gap:32px;align-items:center}
    .series{display:flex;gap:12px;align-items:center}
    .series .barLabel{
      font-size:18px;font-weight:900;letter-spacing:.5px;opacity:.98;
      padding:10px 14px;background:#0b1420cc;border:1px solid #1a2636;border-radius:12px
    }
    .barLabel.p1{color:var(--p1)} .barLabel.p2{color:var(--p2)}
    .dot{
      width:26px;height:26px;border-radius:50%;
      background:#263449;box-shadow:inset 0 0 0 2px #162131
    }
    .dot.win-p1{
      background:radial-gradient(circle at 30% 30%,#fff,var(--p1) 55%,#300b22 140%);
      box-shadow:0 0 14px var(--p1), inset 0 0 3px #fff6
    }
    .dot.win-p2{
      background:radial-gradient(circle at 30% 30%,#fff,var(--p2) 55%,#083033 140%);
      box-shadow:0 0 14px var(--p2), inset 0 0 3px #fff6
    }

    .stats{
      display:flex;gap:18px;align-items:center;flex-wrap:wrap;justify-content:center;margin-top:6px;color:var(--muted);font-weight:800
    }
    .counter{padding:6px 10px;border-radius:10px;background:#0b1420cc;border:1px solid #1a2636}
    .counter .val{color:#fff;font-weight:900;margin-left:6px}

    .lang{
      display:flex;gap:10px;align-items:center;justify-content:center
    }
    .lang .btn{min-width:120px}

    /* Yeni eklenen: player-wrap ve yemek sayaçları için stil */
    .player-wrap{
      display:flex;
      flex-direction:column;
      align-items:center;
      gap:4px;
    }
    .player-wrap .counter{
      margin-top:4px;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div id="stage">
      <div id="canvasWrap">
        <canvas id="game" aria-label="Neo Snake Duel canvas"></canvas>
        <div class="hudTop">
          <div class="title" id="modeTitle">MOD: Seçilmedi</div>
          <div class="title version">Alpha v0.23</div>
        </div>
        <div class="overlay"><div class="banner" id="banner"></div></div>
      </div>
    </div>

    <footer>
      <div class="controls-left">
        <div class="tile">
          <button id="menuBtn" class="btn big" data-i18n="menu">Ana Menü</button>
          <button id="pauseBtn" class="btn big" data-i18n="pause">Duraklat (Space)</button>
        </div>
        <div class="tile">
          <button id="resetBtn" class="btn big" data-i18n="reset">Maçı Sıfırla (R)</button>
          <button id="muteBtn" class="btn big">Ses: Açık (M)</button>
        </div>
      </div>

      <div class="series-wrap">
        <div class="player-wrap left">
          <div class="series left" id="p1Series"><span class="barLabel p1" id="p1Label">OYUNCU 1</span></div>
          <div class="counter" id="p1FoodBox"><span data-i18n="p1Food">P1 Yem</span>: <span class="val" id="p1Food">0</span></div>
        </div>
        <div class="player-wrap right">
          <div class="series right" id="p2Series"><span class="barLabel p2" id="p2Label">OYUNCU 2</span></div>
          <div class="counter" id="p2FoodBox"><span data-i18n="p2Food">P2 Yem</span>: <span class="val" id="p2Food">0</span></div>
        </div>
        <div style="display:none"></div>
      </div>

      <div class="controls-right">
        <div class="tile">
          <div class="lang">
            <button id="langBtn" class="btn big">TR / EN</button>
          </div>
        </div>
      </div>
    </footer>
  </div>

<script>
(()=>{
  /* ===========================
    Neo Snake Duel — Alpha v0.23
     ODAK: Yeni ana menü tasarımı, tur ve maç galibiyet animasyon süreleri, geliştirilmiş yem efektleri ve Türkçe mod isimleri eklendi.

     Değişiklikler
     - Her 5 yem yendikten sonra elmas (altın) yem ortaya çıkar. Bu yem 3 kare büyüme sağlar ve rakipten 1 kare eksiltir; 3.5 saniye içinde alınmazsa yeni yerde doğar.
     - Her 10 yem yendikten sonra kırmızı parlayan bir yem ortaya çıkar. Yiyen yılan 5 saniye boyunca hızlanır ve saydamlaşır; rakip ona çarparsa ölür, kendi gövdesine çarparsa ölür.
     - Kırmızı yem yendikten sonraki 5 saniyelik süreçte ekran en az 10 normal yem bulundurur.
     - Her 3 yem yendikten sonra bir çift yem doğar; biri yendiğinde diğeri kaybolur.
     - Yılan gövdeleri kare şeklindedir ve yem sayaçları seri altında.
     =========================== */

  const VERSION = 'Alpha v0.23';

  /* === i18n === */
  const STRINGS = {
    tr: {
      menu: 'Ana Menü',
      pause: 'Duraklat (Space)',
      resume: 'Sürdür (Space)',
      reset: 'Maçı Sıfırla (R)',
      modeNone: 'MOD: Seçilmedi',
      modePick: 'Oyun Modu',
      pickOne: 'Birini seç:',
      ready: 'Hazır olun…',
      start: 'BAŞLA!',
      p1: 'OYUNCU 1',
      p2: 'OYUNCU 2',
      p1Food: 'P1 Yem',
      p2Food: 'P2 Yem',
      winP1: '<span class="p1">P1</span> kazandı!',
      winP2: '<span class="p2">P2</span> kazandı!',
      draw:  '<span class="draw">Berabere</span>',
      normal: 'NORMAL',
      fast: 'HIZLI',
      extreme: 'AŞIRI',
      play: 'Oyna',
      settings: 'Ayarlar',
      instructions: 'Talimatlar',
      developers: 'Geliştiriciler',
      mainMenu: 'Ana Menü',
      snakeSpeed: 'Yılan Hızı',
      back: 'Geri',
      instructionsText: 'Bu oyun iki kişilik bir yılan düellosudur. Amaç rakibinizin yılanını yok etmektir. Normal yemler yılanınızı büyütür. Her 5 normal yemden sonra altın bir elmas ortaya çıkar; bu yemi yiyen yılan 3 kare büyür, rakibi ise 1 kare küçülür ve elmas 3 saniye sonra yeni bir yere taşınır. Her 10 normal yemden sonra kırmızı bir yem belirir; bu yem yendiğinde yılan 5 saniye boyunca hızlanır ve saydamlaşır, rakibinin içinden geçebilir. Kırmızı yem yenildiğinde 10 normal yem sahaya gelir ve 5 saniye sonra kaybolur. Her 3 yemden sonra ekranda iki yem birden belirir, biri yenildiğinde diğeri kaybolur. Taşma sınırı yoktur; kenardan çıkan yılan karşı kenardan çıkar. Sıfır uzunluğa düşen yılan kaybeder. 5 kez kazanan oyuncu maçı kazanır.',
      developersText: 'Bu oyun Romina Franko & Toygun Çetin tarafından Yapay Zeka desteği ile geliştirilmiştir. Topluluğa armağan edilmiştir.'
    },
    en: {
      menu: 'Main Menu',
      pause: 'Pause (Space)',
      resume: 'Resume (Space)',
      reset: 'Reset Match (R)',
      modeNone: 'MODE: Not Selected',
      modePick: 'Game Mode',
      pickOne: 'Choose one:',
      ready: 'Get Ready…',
      start: 'START!',
      p1: 'PLAYER 1',
      p2: 'PLAYER 2',
      p1Food: 'P1 Food',
      p2Food: 'P2 Food',
      winP1: '<span class="p1">P1</span> wins!',
      winP2: '<span class="p2">P2</span> wins!',
      draw:  '<span class="draw">Draw</span>',
      normal: 'NORMAL',
      fast: 'FAST',
      extreme: 'EXTREME',
      play: 'Play',
      settings: 'Settings',
      instructions: 'Instructions',
      developers: 'Developers',
      mainMenu: 'Main Menu',
      snakeSpeed: 'Snake Speed',
      back: 'Back',
      instructionsText: 'This game is a two‑player snake duel. Your goal is to eliminate your opponent’s snake. Eating normal food makes your snake grow. After every 5 normal foods, a golden diamond appears; the snake that eats it grows by 3 segments and the opponent shrinks by 1 segment. The diamond relocates every 3 seconds. After every 10 normal foods, a red food appears; eating it speeds up the snake and makes it intangible for 5 seconds so it can pass through the opponent. When a red food is eaten, 10 normal foods spawn on the field for 5 seconds. After every 3 foods, a double-food pair appears; when one is eaten, the other disappears. The arena wraps around the edges. A snake that shrinks to zero segments loses. The first to win 5 rounds wins the match.',
      developersText: 'This game was developed by Romina Franko & Toygun Çetin with support from AI. It is presented to the community.'
    }
  };
  let lang = localStorage.getItem('neoSnakeLang') || 'tr';
  function t(key){ return (STRINGS[lang]&&STRINGS[lang][key]) || key; }

  /* === Canvas === */
  const canvas=document.getElementById('game');
  const ctx=canvas.getContext('2d');
  let GRID_COLS=64, GRID_ROWS=36;
  const BASE_TPS=14.2;
  let dpr=Math.max(1,Math.min(2,window.devicePixelRatio||1));
  function resize(){
    const st=document.getElementById('stage');
    const r=st.getBoundingClientRect();
    canvas.width=Math.floor(r.width*dpr); canvas.height=Math.floor(r.height*dpr);
    ctx.setTransform(dpr,0,0,dpr,0,0);
  }
  addEventListener('resize',resize,{passive:true}); resize();

  /* === Sesler === */
  let audioCtx; let muted=localStorage.getItem('neoSnakeMuted')==='1'; const muteBtn=document.getElementById('muteBtn');
  function ensureAudio(){ if(!audioCtx) audioCtx=new (window.AudioContext||window.webkitAudioContext)(); }
  function tone(freq,dur,{type='square',gain=0.06,attack=0.004,release=0.06,sweep=0}={}){
    if(muted) return; try{
      ensureAudio(); const now=audioCtx.currentTime;
      const o=audioCtx.createOscillator(); const g=audioCtx.createGain();
      o.type=type; o.frequency.value=freq;
      if(sweep){ o.frequency.linearRampToValueAtTime(freq*(1+sweep), now+dur); }
      g.gain.value=0; g.gain.linearRampToValueAtTime(gain, now+attack);
      g.gain.linearRampToValueAtTime(0.0001, now+Math.max(dur-0.01,0)+release);
      o.connect(g).connect(audioCtx.destination); o.start(now); o.stop(now+dur+release+0.03);
    }catch(e){}
  }
  const SFX={
    eat(){ tone(720,0.08,{type:'square',gain:0.05}); },
    diamond(){ tone(1200,0.10,{type:'triangle',gain:0.05}); },
    heart(){ tone(640,0.10,{type:'square',gain:0.06}); setTimeout(()=>tone(1240,0.12,{type:'sawtooth',gain:0.06}),90); },
    crash(){ tone(180,0.20,{type:'sawtooth',gain:0.08,sweep:-0.35}); },
    start(){ tone(420,0.10,{type:'sine',gain:0.05}); setTimeout(()=>tone(640,0.12,{type:'sine',gain:0.05}),120); setTimeout(()=>tone(860,0.14,{type:'sine',gain:0.05}),260); },
    pause(){ tone(360,0.06,{type:'square',gain:0.04}); },
    gulp(){ tone(420,0.06,{type:'triangle',gain:0.06}); setTimeout(()=>tone(240,0.08,{type:'sine',gain:0.05}),50); },
    whoosh(){ tone(980,0.05,{type:'triangle',gain:0.04}); setTimeout(()=>tone(820,0.05,{type:'triangle',gain:0.04}),55); setTimeout(()=>tone(680,0.05,{type:'triangle',gain:0.04}),110); }
    ,
    /*
      Özel kaybolma animasyonu için ses. Bir yılan diğerini yediğinde çalınır.
      Kademeli olarak alçalan iki ton ile kısa bir "yok olma" hissi verir.
    */
    disappear(){
      tone(560,0.10,{type:'triangle',gain:0.06});
      setTimeout(()=>tone(340,0.14,{type:'triangle',gain:0.05}),80);
    },
    /*
      Kazanan için 8‑bit tarzında kutlama melodisi. Yaklaşık 5 saniye sürer.
      Farklı frekanslarda kısa notalar çalarak retro bir zafer hissi oluşturur.
    */
    win(){
      if(muted) return;
      ensureAudio();
      const notes=[660,880,660,990,880,660,550,660,770,660,880,990,880,660,550,660,770,880,660,440];
      notes.forEach((freq,idx)=>{
        const delay=idx*230;
        setTimeout(()=>{
          // Her nota kısa bir kare dalga olarak çalınır
          tone(freq,0.14,{type:'square',gain:0.05});
        },delay);
      });
    }
    ,
    /*
      Kısa tur galibiyet melodisi. Yaklaşık 2 saniye sürer.
    */
    winRound(){
      if(muted) return;
      ensureAudio();
      const notes=[660,880,990,880,660,550,660];
      notes.forEach((freq,idx)=>{
        const delay=idx*220;
        setTimeout(()=>{
          tone(freq,0.14,{type:'square',gain:0.05});
        },delay);
      });
    }
  };
  function updateMuteUI(){
    const label = lang==='tr' ? (muted?'Kapalı':'Açık') : (muted?'Off':'On');
    muteBtn.textContent = (lang==='tr'?'Ses':'Sound')+': '+label+' (M)';
    localStorage.setItem('neoSnakeMuted', muted?'1':'0');
  }
  updateMuteUI();

  /* === UI State === */
  const banner=document.getElementById('banner'); 
  function showBanner(html){ banner.innerHTML=html; banner.classList.add('show'); }
  function hideBanner(){ banner.classList.remove('show'); }

  const GAMES_TO_ROUND=5;
  let games={p1:0,p2:0};
  const p1Series=document.getElementById('p1Series'), p2Series=document.getElementById('p2Series');
  function drawSeries(){
    const render=(el,count,owner)=>{
      const label=el.querySelector('.barLabel'); el.innerHTML=''; el.appendChild(label);
      for(let i=0;i<GAMES_TO_ROUND;i++){
        const dot=document.createElement('div');
        dot.className='dot'+(i<count?(' win-'+owner):'');
        el.appendChild(dot);
      }
    };
    render(p1Series,games.p1,'p1'); 
    render(p2Series,games.p2,'p2');
  }

  const modeTitle=document.getElementById('modeTitle');
  const MOD_SPEED = { NORMAL:1.00, FAST:1.35, EXTREME:1.80 }; let currentMode=null;
  function applyLang(){
    if(currentMode){
      // Aktif modun çevirisini kullanarak başlık oluştur
      const modName = t(currentMode.toLowerCase());
      document.getElementById('modeTitle').textContent = `MOD: ${modName} — ${VERSION}`;
    } else {
      // Mod seçilmemişse varsayılan başlık
      document.getElementById('modeTitle').textContent = lang==='tr' ? t('modeNone') : `MODE: ${currentMode||'Not Selected'} — ${VERSION}`;
    }
    document.getElementById('menuBtn').textContent = t('menu');
    document.getElementById('pauseBtn').textContent = paused ? t('resume') : t('pause');
    document.getElementById('resetBtn').textContent = t('reset');
    document.getElementById('p1Label').textContent = t('p1');
    document.getElementById('p2Label').textContent = t('p2');
    document.querySelector('#p1FoodBox [data-i18n="p1Food"]').textContent = t('p1Food');
    document.querySelector('#p2FoodBox [data-i18n="p2Food"]').textContent = t('p2Food');
    updateMuteUI();
  }

  function openMenu(){
    paused = true;
    intermission = true;
    // Mod seçim ekranını oluştur: başlık, seçenekler ve geri butonu
    showBanner(`<h1>${t('snakeSpeed')}</h1><p>${t('pickOne')}</p>
      <div class="modeBtns" style="display:flex;gap:10px;justify-content:center;margin-top:10px">
        <button class="btn big" id="mNormal">${t('normal')}</button>
        <button class="btn big" id="mFast">${t('fast')}</button>
        <button class="btn big" id="mExtreme">${t('extreme')}</button>
      </div>
      <div style="margin-top:12px;display:flex;justify-content:center"><button class="btn" id="modeBack">${t('back')}</button></div>`);
    const wait=()=>{
      const n=document.getElementById('mNormal'), f=document.getElementById('mFast'), e=document.getElementById('mExtreme'), back=document.getElementById('modeBack');
      if(!n||!f||!e||!back){ requestAnimationFrame(wait); return; }
      n.onclick=()=>selectMode('NORMAL');
      f.onclick=()=>selectMode('FAST');
      e.onclick=()=>selectMode('EXTREME');
      back.onclick=()=>{ openMainMenu(); };
    }; wait();
  }
  function selectMode(mode){ currentMode=mode; modeTitle.textContent=`MOD: ${mode} — ${VERSION}`; hideBanner(); paused=false; softReset(true); applyLang(); }

  document.getElementById('langBtn').onclick=()=>{
    // Dil değiştirildiğinde locale'yi tersine çevir
    lang = (lang==='tr') ? 'en' : 'tr';
    localStorage.setItem('neoSnakeLang', lang);
    applyLang();
    // Mod seçim ekranı açıksa, menüyü yeni dilde yeniden oluştur
    // Menü, oyun duraklatıldığında ve henüz mod seçilmediğinde görünür
    if(paused && !currentMode && !inCountdown && !intermission){
      openMenu();
    }
  };

  /* === Input === */
  let paused=false, inCountdown=false, intermission=false;
  addEventListener('keydown',e=>{
    if([' ','r','R','m','M','w','a','s','d','W','A','S','D','ArrowUp','ArrowLeft','ArrowDown','ArrowRight'].includes(e.key)) e.preventDefault();
    if(e.key===' '){ paused=!paused; SFX.pause(); document.getElementById('pauseBtn').textContent=paused ? t('resume') : t('pause'); }
    if(e.key==='r'||e.key==='R'){ softReset(true); }
    if(e.key==='m'||e.key==='M'){ muted=!muted; updateMuteUI(); }
    if(!snakes || inCountdown || intermission || paused || !currentMode) return;
    if(/^[wasd]$/i.test(e.key)){ const m={w:'up',a:'left',s:'down',d:'right'}; const d=dirMap[m[e.key.toLowerCase()]]; const s=snakes.p1; if(!opposite(d,s.dir)) s.nextDir=d; }
    if(/^Arrow/.test(e.key)){ const m={ArrowUp:'up',ArrowLeft:'left',ArrowDown:'down',ArrowRight:'right'}; const d=dirMap[m[e.key]]; const s=snakes.p2; if(!opposite(d,s.dir)) s.nextDir=d; }
  },{passive:false});
  document.getElementById('pauseBtn').onclick=()=>{ paused=!paused; SFX.pause(); document.getElementById('pauseBtn').textContent=paused ? t('resume') : t('pause'); };
  document.getElementById('resetBtn').onclick=()=>softReset(true);
  muteBtn.onclick=()=>{ muted=!muted; updateMuteUI(); };
  document.getElementById('menuBtn').onclick=()=>{ openMainMenu(); };

  /* === Menu Pages === */
  // Ana menü: oyun açıldığında ve menü düğmesi tıklandığında gösterilir
  function openMainMenu(){
    // Yeni bir maç için skorları ve sayaçları temizle, oyunu duraklat
    games = { p1:0, p2:0 };
    drawSeries();
    stats.p1Food = 0; stats.p2Food = 0; updateFoodCounters();
    currentMode = null;
    paused = true;
    intermission = true;
    // Başlık ve dört seçenekli menü
    showBanner(`<h1>${t('mainMenu')}</h1>
      <div class="menuBtns" style="display:flex;flex-direction:column;gap:8px;align-items:center;margin-top:12px">
        <button class="btn big" id="menuPlay">${t('play')}</button>
        <button class="btn big" id="menuSettings">${t('settings')}</button>

  /* === Helpers === */
  function rngCell(){ return { x:(Math.random()*GRID_COLS)|0, y:(Math.random()*GRID_ROWS)|0 } }
  function wrapCell(c){ let x=c.x,y=c.y; if(x<0)x=GRID_COLS-1; else if(x>=GRID_COLS)x=0; if(y<0)y=GRID_ROWS-1; else if(y>=GRID_ROWS)y=0; return {x,y}; }
  async function countdown(n){
    inCountdown=true;
    for(let i=n;i>0;i--){
      showBanner(`<h1>${i}</h1><p>${t('ready')}</p>`);
      await new Promise(r=>setTimeout(r,520));
    }
    showBanner(`<h1 style="color:#9ed0ff">${t('start')}</h1>`); SFX.start();
    await new Promise(r=>setTimeout(r,360));
    hideBanner(); inCountdown=false; intermission=false;
  }

  function modLerp(prev, cur, cap, t){
    // wrap-aware interpolation in [0,cap)
    let a=prev, b=cur;
    let d=b-a;
    if(d>cap/2) a+=cap; else if(d<-cap/2) a-=cap;
    const v=a + (b-a)*t;
    let out=v%cap; if(out<0) out+=cap;
    return out;
  }

  // Yardımcı: hex renk değerini alfa bileşeni ile rgba dizisine çevirir
  function hexToRgba(hex, alpha=1.0){
    if(!hex) return `rgba(255,255,255,${alpha})`;
    let c = hex.replace('#','');
    if(c.length === 3){
      c = c[0]+c[0] + c[1]+c[1] + c[2]+c[2];
    }
    const bigint = parseInt(c, 16);
    const r = (bigint >> 16) & 255;
    const g = (bigint >> 8) & 255;
    const b = bigint & 255;
    return `rgba(${r},${g},${b},${alpha})`;
  }

  function drawGrid(){
    const w=canvas.clientWidth,h=canvas.clientHeight,cw=w/GRID_COLS,ch=h/GRID_ROWS;
    ctx.save();
    ctx.strokeStyle=getComputedStyle(document.documentElement).getPropertyValue('--grid') || '#1a2537';
    ctx.globalAlpha=0.14;
    ctx.beginPath();
    for(let x=0;x<=GRID_COLS;x++){ const X=Math.round(x*cw)+.5; ctx.moveTo(X,0); ctx.lineTo(X,h); }
    for(let y=0;y<=GRID_ROWS;y++){ const Y=Math.round(y*ch)+.5; ctx.moveTo(0,Y); ctx.lineTo(w,Y); }
    ctx.stroke();
    ctx.restore();
  }

  /* === Core === */
  const dirMap={up:{x:0,y:-1},down:{x:0,y:1},left:{x:-1,y:0},right:{x:1,y:0}};
  function opposite(a,b){return a.x===-b.x&&a.y===-b.y}
  function createSnake(start,dir){ 
    const seg=[ start,{x:start.x-dir.x,y:start.y-dir.y},{x:start.x-2*dir.x,y:start.y-2*dir.y} ]; 
    return { segments:seg, prev:seg.map(s=>({...s})), dir:{...dir}, nextDir:{...dir}, grow:0, powerEnd:0, flashUntil:0, flashColor:null };
  }
  function isPowered(s){ return s && performance.now()<s.powerEnd; }

  // Küresel sayaçlar ve zamanlayıcılar
  let totalEaten = 0;
  let bulkFoodEndTime = 0;
  let pairIdCounter = 0;
  // v0.21: normal yemlerin sayısı için sayaç
  let normalFoodsEaten = 0;
  // özel durum bayrakları
  let diamondActive = false;
  let redFoodPresent = false;
  let redBulkEndTime = 0;

  // V0.20: çift yem etkin olduğunda normal yem sayısını kontrol etmemizi sağlayan bayrak
  // true olduğunda çift yem aktif demektir ve normal yemler ekranda tutulmaz
  let doubleActive = false;

  let snakes=null, foods=[], stats={p1Food:0,p2Food:0};
  let acc1=0, acc2=0;
  function speedMult(s){ return isPowered(s) ? 1.45 : 1.00; }

  function softReset(full=false){
    GRID_COLS=64; GRID_ROWS=36;
    const mid={x:(GRID_COLS/2)|0, y:(GRID_ROWS/2)|0};
    snakes={
      p1:createSnake({x:mid.x-10,y:mid.y}, dirMap.right),
      p2:createSnake({x:mid.x+10,y:mid.y}, dirMap.left)
    };
    foods.length=0;
    acc1=0; acc2=0;
    bulkFoodEndTime = 0;
    totalEaten = 0;
    pairIdCounter = 0;
    normalFoodsEaten = 0;
    diamondActive = false;
    redFoodPresent = false;
    redBulkEndTime = 0;
    doubleActive = false;
    if(full){ games={p1:0,p2:0}; drawSeries(); }
    stats.p1Food=0; stats.p2Food=0; updateFoodCounters();
    // başlangıçta tek normal yem — klasik mod
    spawnFood();
    countdown(3);
  }

  function awardGame(who){
    if(who==='p1'){ games.p1++; }
    else if(who==='p2'){ games.p2++; }
    drawSeries();
  }

  // Normal yem oluşturur. V0.20'de varsayılan olarak sahada yalnızca bir normal yem
  // bulunmalı. Kırmızı yem etkisi sırasında 10 yem tutulur. Çift yem aktifse
  // normal yem doğurulmaz. Bu fonksiyon force parametresi kullanmaz.
  function spawnFood(){
    const now = performance.now();
    // Eğer kırmızı yem sonrası toplu yem etkinliği varsa hiçbir şey yapma
    if(redBulkEndTime && now < redBulkEndTime){
      return;
    }
    // Çift yem veya elmas varken normal yem oluşturma
    if(doubleActive || diamondActive){
      return;
    }
    // Sahada kaç adet çift olmayan normal yem var?
    const normalCount = foods.filter(f => f.type === 'normal' && !f.pairId).length;
    if(normalCount < 1){
      spawnNormal();
    }
  }

  function spawnNormal(){
    let tries=0; const occ=new Set([ ...snakes.p1.segments, ...snakes.p2.segments, ...foods ].map(o=>o.x+','+o.y));
    let f; do{ f=rngCell(); tries++; if(tries>800) return; }while(occ.has(f.x+','+f.y));
    foods.push({x:f.x, y:f.y, type:'normal', spawnAt:performance.now()});
  }

  function spawnDiamondFood(){
    // Normal yemleri kaldır ve tek sarı elmas çıkar
    diamondActive = true;
    // sahadaki eşlenmemiş normal yemleri kaldır
    for(let i=foods.length-1; i>=0; i--){
      const item = foods[i];
      if(item.type === 'normal' && !item.pairId){
        foods.splice(i,1);
      }
    }
    let tries = 0;
    // İşgal edilen hücreleri bul
    const occ = new Set([ ...snakes.p1.segments, ...snakes.p2.segments, ...foods ].map(o => o.x + ',' + o.y));
    let f;
    do{
      f = rngCell();
      tries++;
      if(tries > 800) return;
    } while(occ.has(f.x + ',' + f.y));
    // Elmasın ömrü 3 saniye, süre bitince yeni bir noktada belirir
    foods.push({ x: f.x, y: f.y, type:'diamond', spawnAt: performance.now(), expiryTime: performance.now() + 3000 });
  }

  function spawnRedFood(){
    // Kırmızı yem sahaya eklenir. Normal yem kaldırılmaz; çünkü kırmızı yem özel kuraldır.
    let tries = 0;
    const occ = new Set([ ...snakes.p1.segments, ...snakes.p2.segments, ...foods ].map(o => o.x + ',' + o.y));
    let f;
    do{
      f = rngCell();
      tries++;
      if(tries > 800) return;
    } while(occ.has(f.x + ',' + f.y));
    foods.push({ x: f.x, y: f.y, type:'heart', spawnAt: performance.now() });
    redFoodPresent = true;
  }

  function spawnDoubleFood(){
    // Çift yem başlatıldığında normal yemler kaldırılır ve iki yeni yem doğar
    doubleActive = true;
    // Var olan eşlenmemiş normal yemleri kaldır
    for(let i=foods.length-1;i>=0;i--){
      const item = foods[i];
      if(item.type==='normal' && !item.pairId){
        foods.splice(i,1);
      }
    }
    const pairId = ++pairIdCounter;
    for(let j=0;j<2;j++){
      let tries=0;
      const occ=new Set([ ...snakes.p1.segments, ...snakes.p2.segments, ...foods ].map(o=>o.x+','+o.y));
      let f;
      do{
        f=rngCell();
        tries++;
        if(tries>800) return;
      }while(occ.has(f.x+','+f.y));
      foods.push({x:f.x, y:f.y, type:'normal', pairId:pairId, spawnAt:performance.now()});
    }
  }

  // Toplu yem oluşturur: belirtilen sayıda normal yem sahaya ekler
  function spawnBulkNormals(count){
    for(let k=0;k<count;k++){
      let tries = 0;
      const occ = new Set([ ...snakes.p1.segments, ...snakes.p2.segments, ...foods ].map(o => o.x + ',' + o.y));
      let f;
      do{
        f = rngCell();
        tries++;
        if(tries > 800) break;
      } while(occ.has(f.x + ',' + f.y));
      // Occupied may contain existing foods but we add anyway; in edge-case we break
      if(tries <= 800){
        foods.push({ x: f.x, y: f.y, type:'normal', spawnAt: performance.now() });
      }
    }
  }

  function updateFoodCounters(){
    document.getElementById('p1Food').textContent = stats.p1Food;
    document.getElementById('p2Food').textContent = stats.p2Food;
  }

  function eatFoodIfAny(s, ownerKey){
    for(let i=0;i<foods.length;i++){
      const f=foods[i];
      if(f.x===s.segments[0].x && f.y===s.segments[0].y){
        // remove consumed food
        foods.splice(i,1);
        // handle pair: remove partner if exists
        if(f.pairId){
          // çift yemin diğer parçasını kaldır
          for(let j=foods.length-1;j>=0;j--){
            if(foods[j].pairId && foods[j].pairId===f.pairId){
              foods.splice(j,1);
              break;
            }
          }
          // çift yem sona erdiğinde bayrağı kapat
          doubleActive = false;
        }
        // apply effects according to food type
        const now = performance.now();
        if(f.type === 'diamond'){
          // sarı elmas: büyüt ve rakibi küçült
          s.grow += 3;
          const otherKey = ownerKey === 'p1' ? 'p2' : 'p1';
          const other = snakes[otherKey];
          if(other.segments.length > 0){
            other.segments.pop();
            // rakip yok olduysa oyunu bitir
            if(other.segments.length === 0){
              awardGame(ownerKey);
              showBanner(`<h1>${ownerKey==='p1'?t('winP1'):t('winP2')}</h1>`);
              setTimeout(() => { hideBanner(); resetRound(3); }, 1300);
              return;
            }
          }
          SFX.diamond();
          // Sarı yem etkisi: yılan kısa süreliğine sarı renk yanıp sönecek
          s.flashUntil = now + 400;
          s.flashColor = '#ffd166';
          // elmas artık aktif değil, tek normal yem döngüsüne geçiş
          diamondActive = false;
        } else if(f.type === 'heart'){
          // kırmızı yem: güçlendirme
          s.grow += 1;
          s.powerEnd = now + 5000;
          SFX.heart();
          // kırmızı yem artık yok
          redFoodPresent = false;
          // kırmızı yem yendikten sonra sahayı temizle ve 10 sabit yem oluştur
          redBulkEndTime = now + 5000;
          // tüm mevcut yemleri kaldır
          foods.length = 0;
          // özel bayrakları sıfırla
          diamondActive = false;
          doubleActive = false;
          // 10 adet normal yem üret
          spawnBulkNormals(10);
        } else {
          // normal yem
          s.grow += 1;
          normalFoodsEaten++;
          SFX.eat();
        }
        // güncel istatistikleri yaz
        if(ownerKey === 'p1') stats.p1Food++; else stats.p2Food++;
        updateFoodCounters();
        // tetikleyiciler sadece normal yemler için çalışır
        if(f.type === 'normal'){
          // en yüksek öncelik: 10'lar kırmızı yem
          if(normalFoodsEaten % 10 === 0){
            // sadece sahada kırmızı yem yoksa ve toplu mod aktif değilse
            if(!redFoodPresent && !(redBulkEndTime && now < redBulkEndTime)){
              spawnRedFood();
            }
          } else if(normalFoodsEaten % 5 === 0){
            // elmas yoksa ve kırmızı yem yoksa
            if(!diamondActive && !redFoodPresent && !(redBulkEndTime && now < redBulkEndTime)){
              spawnDiamondFood();
            }
          } else if(normalFoodsEaten % 3 === 0){
            // çift yem yoksa ve özel mod yoksa
            if(!doubleActive && !diamondActive && !(redBulkEndTime && now < redBulkEndTime)){
              spawnDoubleFood();
            }
          }
        }
        // her yemden sonra normal yemleri dengele
        spawnFood();
        return;
      }
    }
  }

  function bodyAdvance(s){
    const head=s.segments[0];
    if(!opposite(s.nextDir,s.dir)) s.dir={...s.nextDir};
    const nextHead=wrapCell({x:head.x+s.dir.x, y:head.y+s.dir.y});
    s.prev = s.segments.map(c=>({...c}));
    s.segments.unshift(nextHead);
    if(s.grow>0) s.grow--; else s.segments.pop();
  }

  // gelişmiş çarpışma: saydamlaşma ve güçlendirmeler göz önüne alınır
  function collideCheckDetailed(){
    const s1=snakes.p1, s2=snakes.p2;
    const head1=s1.segments[0], head2=s2.segments[0];
    const intangible1 = isPowered(s1);
    const intangible2 = isPowered(s2);
    // head-to-head
    if(head1.x===head2.x && head1.y===head2.y){
      if(intangible1 && !intangible2){ return {result:'p1', eater:'p1'}; }
      if(intangible2 && !intangible1){ return {result:'p2', eater:'p2'}; }
      return {result:'draw', eater:null};
    }
    // prepare self/body sets
    const self1=new Set(s1.segments.slice(1).map(c=>c.x+','+c.y));
    const self2=new Set(s2.segments.slice(1).map(c=>c.x+','+c.y));
    const k1=head1.x+','+head1.y;
    const k2=head2.x+','+head2.y;
    // handle intangible cases
    if(intangible1 && !intangible2){
      // p1 saydam, sadece kendine çarpınca ölür, aksi takdirde p2 ölür
      const hit1Self = self1.has(k1);
      if(hit1Self) return {result:'p2', eater:null};
      const hitCross = self2.has(k1) || self1.has(k2) || self2.has(k2);
      if(hitCross){ return {result:'p1', eater:'p1'}; }
      return {result:null, eater:null};
    }
    if(intangible2 && !intangible1){
      const hit2Self = self2.has(k2);
      if(hit2Self) return {result:'p1', eater:null};
      const hitCross = self1.has(k2) || self2.has(k1) || self1.has(k1);
      if(hitCross){ return {result:'p2', eater:'p2'}; }
      return {result:null, eater:null};
    }
    if(intangible1 && intangible2){
      // both saydam, sadece kendi bedenine çarparsa ölür
      const hit1Self = self1.has(k1);
      const hit2Self = self2.has(k2);
      if(hit1Self && hit2Self) return {result:'draw', eater:null};
      if(hit1Self) return {result:'p2', eater:null};
      if(hit2Self) return {result:'p1', eater:null};
      return {result:null, eater:null};
    }
    // normal durum: klasik çarpışma
    const hit1Self = self1.has(k1);
    const hit2Self = self2.has(k2);
    const hit1Opp  = self2.has(k1);
    const hit2Opp  = self1.has(k2);
    const hit1 = hit1Self || hit1Opp;
    const hit2 = hit2Self || hit2Opp;
    if(hit1 && hit2) return {result:'draw', eater:null};
    if(hit1){
      // p1 öldü; eater varsa head p1 rakibe girdi
      return {result:'p2', eater: hit1Opp ? 'p1' : null};
    }
    if(hit2){
      return {result:'p1', eater: hit2Opp ? 'p2' : null};
    }
    return {result:null, eater:null};
  }

  /* === Rendering === */
  // Kare gövde çizimi
  function drawSnakeBlocks(s, color, alphaProgress){
    const w=canvas.clientWidth,h=canvas.clientHeight,cw=w/GRID_COLS,ch=h/GRID_ROWS;
    ctx.save();
    // Eğer kazanma animasyonu aktifse, tüm gövde parçaları kazananın renginde gösterilir.
    const winning = winAnim.active;
    for(let i=0;i<s.segments.length;i++){
      const cur=s.segments[i], prev=s.prev[i]||cur;
      const x=modLerp(prev.x, cur.x, GRID_COLS, alphaProgress);
      const y=modLerp(prev.y, cur.y, GRID_ROWS, alphaProgress);
      const cx=(x+.5)*cw, cy=(y+.5)*ch;
      const size=Math.min(cw,ch)*0.80;
      const half=size/2;
      const left=cx-half, top=cy-half;
      // aura ve renk: beast modunda kırmızı parlak renk kullan
      const beast = isPowered(s);
      // Geçici sarı parlaklık efekti için kontrol
      const flashing = s.flashUntil && performance.now() < s.flashUntil;
      const flashPeriod = 120; // ms
      const flashVisible = ((performance.now()/flashPeriod)|0) % 2 === 0;
      ctx.save();
      ctx.globalCompositeOperation='screen';
      // Aura rengi: kazanma animasyonu varsa kazananın rengine göre hesaplanır
      const g=ctx.createRadialGradient(cx,cy,1,cx,cy,size*1.0);
      if(winning){
        // winAnim.color var e.g. #ff4fbf; aura alpha azaltılmış
        const col = winAnim.color || '#ffffff';
        g.addColorStop(0, hexToRgba(col,0.40));
      } else if(beast){
        g.addColorStop(0,'rgba(255,23,68,0.4)');
      } else {
        const baseAura = (color==='p1' ? 'rgba(255,79,191,0.25)' : 'rgba(53,230,230,0.25)');
        g.addColorStop(0, baseAura);
      }
      g.addColorStop(1, 'rgba(0,0,0,0)');
      ctx.fillStyle=g;
      ctx.fillRect(left-size*0.3, top-size*0.3, size*1.6, size*1.6);
      ctx.restore();
      // body renk seçimi: kazanma animasyonu varsa kazananın rengi,
      // beast modunda kırmızı, flash sırasında sarı; normalde p1/p2 rengi
      let bodyColor;
      if(winning){
        bodyColor = winAnim.color || '#ffffff';
      } else if(flashing && flashVisible){
        bodyColor = s.flashColor || '#ffd166';
      } else if(beast){
        bodyColor = '#ff1744';
      } else {
        bodyColor = (color==='p1' ? '#ff4fbf' : '#35e6e6');
      }
      ctx.fillStyle = bodyColor;
      ctx.fillRect(left, top, size, size);
      // iç parlak vurgusu
      ctx.save();
      ctx.globalCompositeOperation='lighter';
      const ig=ctx.createRadialGradient(cx,cy,1,cx,cy,size*0.4);
      ig.addColorStop(0,'rgba(255,255,255,0.40)');
      ig.addColorStop(1,'rgba(255,255,255,0.04)');
      ctx.fillStyle=ig; ctx.fillRect(left, top, size, size);
      ctx.restore();
    }
    ctx.restore();
  }

  function drawFoods(){
    const w=canvas.clientWidth,h=canvas.clientHeight,cw=w/GRID_COLS,ch=h/GRID_ROWS;
    for(const f of foods){
      const cx=(f.x+.5)*cw, cy=(f.y+.5)*ch;
      const r=Math.min(cw,ch)*0.34;
      // glow
      ctx.save();
      ctx.globalCompositeOperation='screen';
      // Daha belirgin hale getirmek için özel yemlerin halo yarıçapını ve parlaklığını artır
      let haloRadius = r * 2.0;
      let base;
      if(f.type === 'diamond'){
        haloRadius = r * 3.0;
        base = 'rgba(255,209,102,0.55)';
      } else if(f.type === 'heart'){
        haloRadius = r * 2.7;
        base = 'rgba(255,23,68,0.55)';
      } else {
        haloRadius = r * 2.2;
        base = 'rgba(158,208,255,0.25)';
      }
      const halo=ctx.createRadialGradient(cx,cy,1,cx,cy,haloRadius);
      halo.addColorStop(0, base);
      halo.addColorStop(1, 'rgba(0,0,0,0)');
      ctx.fillStyle=halo; ctx.beginPath(); ctx.arc(cx,cy,haloRadius*0.75,0,Math.PI*2); ctx.fill();
      ctx.restore();
      // body: circle
      ctx.beginPath();
      ctx.arc(cx,cy,r,0,Math.PI*2);
      ctx.fillStyle = f.type==='diamond' ? '#ffd166' : (f.type==='heart' ? '#ff1744' : '#9ed0ff');
      ctx.fill();
      // specular
      ctx.save();
      ctx.globalCompositeOperation='lighter';
      ctx.beginPath();
      ctx.arc(cx,cy,r*0.75,0,Math.PI*2);
      ctx.fillStyle='rgba(255,255,255,0.50)';
      ctx.fill();
      ctx.restore();
    }
  }

  /* === Game Flow === */
  let deathAnim = { active:false, loser:null, winner:null, nextAt:0, stepMs:40 };
  function startDeathAnim(loser, winner){
    deathAnim = { active:true, loser, winner, nextAt:performance.now(), stepMs:40 };
    intermission = true;
    // Yutma ve kaybolma animasyonu için sesler
    SFX.gulp();
    SFX.whoosh();
    SFX.disappear();
  }

  // Kazanan animasyonu durum yapısı. active true olduğunda oyun duraklar ve ekranda "P X" mesajı yanıp söner.
  // Kazanan animasyonunun durum değişkeni. "final" bayrağı son maç galibiyetini belirtir. "color" kazananın rengini tutar.
  let winAnim = { active:false, winner:null, start:0, duration:5000, blinkPeriod:350, final:false, color:'#fff' };

  /*
    Kazanan için özel animasyonu başlatır. İki yılan büyük bir "P" ve kazanmış oyuncunun numarasını oluşturur.
    winner parametresi 'p1' veya 'p2' olmalıdır.
  */
  /**
   * Kazanan için özel animasyonu başlatır. İki yılan büyük bir "P" ve kazanmış oyuncunun numarasını
   * oluşturur. final=true ise bu animasyon maç galibiyeti içindir ve 5 saniye sürer; aksi halde
   * round galibiyeti animasyonu 2 saniye sürer. Kazanan yılanın rengi blink sırasında kullanılır.
   * @param {string} winner 'p1' veya 'p2'
   * @param {boolean} final Maç galibiyeti mi? Round galibiyeti için false
   */
  function startWinAnim(winner, final=false){
    winAnim.active = true;
    winAnim.winner = winner;
    winAnim.start = performance.now();
    winAnim.final = final;
    // Süre ve ses seçimi final'e göre belirlenir
    if(final){
      winAnim.duration = 5000;
      SFX.win();
    }else{
      winAnim.duration = 2000;
      SFX.winRound();
    }
    // Kazananın rengi: CSS kök değişkenlerinden alınır
    const rootStyles = getComputedStyle(document.documentElement);
    const col = winner === 'p1' ? rootStyles.getPropertyValue('--p1').trim() : rootStyles.getPropertyValue('--p2').trim();
    winAnim.color = col || '#fff';
    intermission = true;
    // Sahadaki tüm yiyecekleri kaldır
    foods.length = 0;
    // Harf desenleri tanımı. Her satır, o satırda doldurulacak sütun indekslerini içerir.
    const patterns = {
      'P': [ [0,1,2,3], [0,3], [0,3], [0,1,2], [0], [0], [0] ],
      '1': [ [1,2], [0,1,2,3], [2], [2], [2], [2], [0,1,2,3] ],
      '2': [ [0,1,2,3], [3], [2], [1], [0], [0], [0,1,2,3] ]
    };
    const charWidths = { 'P':4, '1':4, '2':4 };
    const charHeight = 7;
    const scale = 2; // Her nokta 2x2 hücreye ölçeklenir
    // Verilen karakter için ölçeklenmiş pozisyonlar ve boyutları hesapla
    function scaledChar(char){
      const rows = patterns[char];
      const positions = [];
      for(let row=0; row<rows.length; row++){
        for(const col of rows[row]){
          for(let dy=0; dy<scale; dy++){
            for(let dx=0; dx<scale; dx++){
              positions.push({ x: col*scale + dx, y: row*scale + dy });
            }
          }
        }
      }
      return { positions, width: charWidths[char] * scale, height: charHeight * scale };
    }
    const numChar = (winner === 'p1') ? '1' : '2';
    const pData = scaledChar('P');
    const nData = scaledChar(numChar);
    const gap = scale; // iki karakter arasındaki boşluk ölçeği
    const totalWidth = pData.width + gap + nData.width;
    const totalHeight = Math.max(pData.height, nData.height);
    const offsetX = Math.floor((GRID_COLS - totalWidth) / 2);
    const offsetY = Math.floor((GRID_ROWS - totalHeight) / 2);
    const pPositions = pData.positions.map(p => ({ x: p.x + offsetX, y: p.y + offsetY }));
    const nPositions = nData.positions.map(p => ({ x: p.x + offsetX + pData.width + gap, y: p.y + offsetY }));
    // Round galibiyetinde iki yılan da kullanılır; final galibiyetinde sadece kazanan yılan çizilir
    if(final){
      // Finalde sadece kazanan yılan şekil alır, diğer yılan silinir
      if(winner === 'p1'){
        snakes.p1.segments = [...pPositions, ...nPositions];
        snakes.p2.segments = [];
      }else{
        snakes.p2.segments = [...pPositions, ...nPositions];
        snakes.p1.segments = [];
      }
    }else{
      // Round galibiyeti: kazanan yılan rakamı, rakip yılan "P" harfini çizsin
      if(winner === 'p1'){
        snakes.p1.segments = nPositions;
        snakes.p2.segments = pPositions;
      }else{
        snakes.p2.segments = nPositions;
        snakes.p1.segments = pPositions;
      }
    }
    // Yılan hareket parametrelerini sıfırla
    for(const key of ['p1','p2']){
      const s = snakes[key];
      s.prev = s.segments.map(c => ({...c}));
      s.dir = {x:0,y:0};
      s.nextDir = {x:0,y:0};
      s.grow = 0;
      s.powerEnd = 0;
    }
  }

  function endGame(result){
    if(result==='p1' || result==='p2'){
      // Galibiyet: önce seriyi güncelle, ardından özel animasyonu başlat
      awardGame(result);
      // Mevcut banner'ı kapat ve zafer animasyonuna geç
      hideBanner();
      // Bu galibiyet maç galibiyeti mi?
      const isFinal = games[result] >= GAMES_TO_ROUND;
      startWinAnim(result, isFinal);
    } else {
      // Beraberlik: klasik davranış
      intermission = true;
      showBanner(`<h1>${t('draw')}</h1>`);
      setTimeout(()=>{ hideBanner(); resetRound(3); }, 1300);
    }
  }

  async function resetRound(count=3){
    const mid={x:(GRID_COLS/2)|0, y:(GRID_ROWS/2)|0};
    snakes={
      p1:createSnake({x:mid.x-10,y:mid.y}, dirMap.right),
      p2:createSnake({x:mid.x+10,y:mid.y}, dirMap.left)
    };
    foods.length=0; acc1=0; acc2=0; bulkFoodEndTime=0; totalEaten=0; pairIdCounter=0;
    normalFoodsEaten = 0;
    diamondActive = false;
    redFoodPresent = false;
    redBulkEndTime = 0;
    doubleActive = false;
    deathAnim.active=false;
    // başlangıçta tek yem
    spawnFood();
    await countdown(count);
  }

  /* === Loop === */
  let last=performance.now();
  function step(){
    const now=performance.now(), dt=now-last; last=now;
    // Eğer bir kazanma animasyonu aktifse tüm normal akışı durdur ve özel işlemleri uygula
    if(winAnim.active){
      const elapsed = now - winAnim.start;
      if(elapsed >= winAnim.duration){
        // Animasyon sona erdi; durumu sıfırla
        winAnim.active = false;
        intermission = false;
        if(winAnim.final){
          // Maç galibiyeti: skorları sıfırla ve tam reset yap
          games = { p1:0, p2:0 };
          drawSeries();
          softReset(true);
        } else {
          // Sadece tur galibiyeti: sıradaki round'a geç; skor korunur
          resetRound(3);
        }
        requestAnimationFrame(step);
        return;
      }
      // Yanıp sönen mesajı çiz ve bekle
      renderWinAnim();
      requestAnimationFrame(step);
      return;
    }
    // Kırmızı yem sonrası 5 saniyelik süre bittiğinde tüm yemleri temizle ve döngüyü sıfırla
    if(redBulkEndTime && now >= redBulkEndTime){
      // kalan yemleri kaldır
      foods.length = 0;
      redBulkEndTime = 0;
      // tekrar tek yem döngüsüne dön
      spawnFood();
    }
    const modeBoost = currentMode ? (MOD_SPEED[currentMode]||1.0) : 1.0;
    const baseStepMs = 1000/(BASE_TPS*modeBoost);
    // Elmas süresi bittiğinde yeni bir konuma taşı
    for(let i=0; i<foods.length; i++){
      const f = foods[i];
      if(f.type === 'diamond' && f.expiryTime && now >= f.expiryTime){
        // yeni bir konum bul
        let tries = 0;
        const occ = new Set([ ...snakes.p1.segments, ...snakes.p2.segments, ...foods ].map(o => o.x + ',' + o.y));
        // geçerli elmasın konumunu da kaldırarak tekrar kullanabilmek için set'ten çıkar
        occ.delete(f.x + ',' + f.y);
        let newPos;
        do{
          newPos = rngCell();
          tries++;
          if(tries > 800) break;
        } while(occ.has(newPos.x + ',' + newPos.y));
        if(tries <= 800){
          f.x = newPos.x;
          f.y = newPos.y;
          f.spawnAt = now;
          f.expiryTime = now + 3000;
        }
      }
    }
    if(deathAnim.active){
      const loser = snakes[deathAnim.loser];
      if(now>=deathAnim.nextAt){
        loser.prev = loser.segments.map(c=>({...c}));
        loser.segments.pop();
        deathAnim.nextAt = now + deathAnim.stepMs;
        if(loser.segments.length===0){
          deathAnim.active=false;
          endGame(deathAnim.winner);
        }
      }
      render(0,0);
      requestAnimationFrame(step); return;
    }
    if(snakes && !paused && !inCountdown && !intermission && currentMode){
      acc1 += dt; acc2 += dt;
      let guard=0;
      while(guard++<12){
        const s1=snakes.p1, s2=snakes.p2;
        const i1 = baseStepMs / speedMult(s1);
        const i2 = baseStepMs / speedMult(s2);
        const r1 = acc1 >= i1, r2 = acc2 >= i2;
        if(!r1 && !r2) break;
        if(r1 && r2){
          bodyAdvance(s1); bodyAdvance(s2);
          acc1 -= i1; acc2 -= i2;
          eatFoodIfAny(s1,'p1'); eatFoodIfAny(s2,'p2');
          const chk = collideCheckDetailed();
          if(chk.result){
            if(chk.result==='draw'){ endGame('draw'); break; }
            else{
              if(chk.eater){ startDeathAnim(chk.eater, chk.result); }
              else{ endGame(chk.result); }
              break;
            }
          }
        }else if(r1){
          bodyAdvance(s1); acc1 -= i1;
          eatFoodIfAny(s1,'p1');
          const chk = collideCheckDetailed();
          if(chk.result){
            if(chk.result==='draw'){ endGame('draw'); break; }
            else{
              if(chk.eater){ startDeathAnim(chk.eater, chk.result); }
              else{ endGame(chk.result); }
              break;
            }
          }
        }else if(r2){
          bodyAdvance(s2); acc2 -= i2;
          eatFoodIfAny(s2,'p2');
          const chk = collideCheckDetailed();
          if(chk.result){
            if(chk.result==='draw'){ endGame('draw'); break; }
            else{
              if(chk.eater){ startDeathAnim(chk.eater, chk.result); }
              else{ endGame(chk.result); }
              break;
            }
          }
        }
      }
    }
    // render
    const s1=snakes?.p1, s2=snakes?.p2;
    let alpha1=0, alpha2=0;
    if(s1&&currentMode){
      const i1=(1000/(BASE_TPS*(MOD_SPEED[currentMode]||1.0)))/speedMult(s1);
      alpha1=Math.max(0, Math.min(1, acc1/i1));
    }
    if(s2&&currentMode){
      const i2=(1000/(BASE_TPS*(MOD_SPEED[currentMode]||1.0)))/speedMult(s2);
      alpha2=Math.max(0, Math.min(1, acc2/i2));
    }
    render(alpha1,alpha2);
    requestAnimationFrame(step);
  }

  function render(alpha1, alpha2){
    const w=canvas.clientWidth,h=canvas.clientHeight;
    ctx.clearRect(0,0,w,h);
    drawGrid();
    if(snakes){
      drawFoods();
      drawSnakeBlocks(snakes.p2,'p2',alpha2);
      drawSnakeBlocks(snakes.p1,'p1',alpha1);
    }
  }

  /*
    Kazanma animasyonunu çizer. Yılanlar sabit konumlarda yanıp söner.
  */
  function renderWinAnim(){
    const w=canvas.clientWidth,h=canvas.clientHeight;
    ctx.clearRect(0,0,w,h);
    drawGrid();
    // Yanıp sönme: belirli aralıklarla görünür/görünmez
    const elapsed = performance.now() - winAnim.start;
    const period = winAnim.blinkPeriod;
    const visible = Math.floor(elapsed / period) % 2 === 0;
    if(visible){
      // Özel yiyecekler görünmezken yılanlar sabit çizilir
      if(snakes){
        drawSnakeBlocks(snakes.p2,'p2',0);
        drawSnakeBlocks(snakes.p1,'p1',0);
      }
    }
  }

  /* === Boot === */
  drawSeries();
  applyLang();
  // Başlangıçta ana menüyü aç
  openMainMenu();
  requestAnimationFrame(step);
})();
</script>
