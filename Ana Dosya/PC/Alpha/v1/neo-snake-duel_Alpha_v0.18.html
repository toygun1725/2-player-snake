<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Neo Snake Duel — Alpha v0.18</title>
  <!-- Version: Alpha v0.18 -->
  <style>
    :root{
      --bg:#0b0f14;
      --grid:#1a2537;
      --p1:#ff4fbf;       /* Pembe (Player 1) */
      --p2:#35e6e6;       /* Turkuvaz (Player 2) */
      --gold:#ffd166;     /* Elmas (sarı) */
      --heart:#ff1744;    /* Yakut kırmızısı */
      --ui-tile:#0c141f;
      --ui-tile-border:#1b2a41;
      --ui-tile-soft:#0f1a2a;
      --text:#e7f1ff;
      --muted:#9fb3d1;
    }
    *{box-sizing:border-box}
    html,body{height:100%}
    body{
      margin:0;background:var(--bg);color:var(--text);
      font-family:ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,Arial;
      overflow:hidden
    }
    .wrap{height:100%;display:grid;grid-template-rows:1fr auto}
    #stage{position:relative;height:calc(100vh - 150px)}
    #canvasWrap{
      position:relative;width:100%;height:100%;border-radius:22px;overflow:hidden;
      box-shadow:0 44px 130px #000a,0 12px 44px #0009,inset 0 0 0 1px #1a2636;
      background:#09101a
    }
    canvas{width:100%;height:100%;display:block;
      background:radial-gradient(1200px 900px at 50% -30%, #122034 0%, #0b121c 40%, #081018 75%, #050a10 100%)
    }
    #canvasWrap::before{
      content:"";position:absolute;inset:0;
      background:linear-gradient(transparent,rgba(0,0,0,.35)),
                 repeating-linear-gradient(180deg,#0000 0 2px,#0003 2px 3px);
      mix-blend-mode:multiply;pointer-events:none
    }

    .hudTop{
      position:absolute;inset:10px 12px auto 12px;
      display:flex;gap:10px;justify-content:center;align-items:center;pointer-events:none;z-index:5
    }
    .title{
      pointer-events:none;margin:0 12px;padding:8px 12px;font-weight:900;font-size:13px;letter-spacing:.6px;opacity:.95;
      background:#0b1420cc;border:1px solid #1a2636;border-radius:10px;box-shadow:0 8px 24px #0007
    }
    .version{opacity:.8}

    .overlay{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none;z-index:6}
    .banner{
      pointer-events:auto;min-width:320px;max-width:92%;text-align:center;padding:18px 22px;border-radius:18px;
      background:linear-gradient(180deg,#0d1624ee,#0a111de0);
      border:1px solid #1b2a41;box-shadow:0 16px 50px #0009;
      transform:translateY(10px) scale(.96);opacity:0;transition:all .45s cubic-bezier(.2,.8,.2,1)
    }
    .banner.show{transform:translateY(0) scale(1);opacity:1}
    .banner h1{margin:0 0 6px;font-size:clamp(22px,4.2vw,44px);letter-spacing:1px}
    .banner p{margin:0;opacity:.9;font-size:14px}
    .banner .p1{color:var(--p1)} .banner .p2{color:var(--p2)} .banner .draw{color:#9ed0ff}

    footer{
      height:150px;display:grid;grid-template-columns: 1fr auto 1fr;align-items:center;gap:14px;
      padding:14px;background:linear-gradient(180deg,#0e1726cc,#0a111dcc);border-top:1px solid #1b2a41;
      backdrop-filter:blur(6px)
    }
    .controls-left,.controls-right{display:flex;gap:12px;align-items:stretch}
    .tile{
      display:flex;flex-direction:column;justify-content:center;align-items:center;gap:8px;
      min-width:140px;padding:12px 14px;border-radius:16px;background:var(--ui-tile);
      border:1px solid var(--ui-tile-border);box-shadow:0 6px 20px #0007
    }
    .tile .btn{width:100%}
    .btn{
      padding:12px 16px;border-radius:12px;background:var(--ui-tile-soft);border:1px solid var(--ui-tile-border);
      color:#d9e6ff;cursor:pointer;font-weight:800;letter-spacing:.3px;font-size:14px
    }
    .btn:hover{filter:brightness(1.08)}
    .btn.big{padding:14px 18px;font-size:16px}

    .series-wrap{justify-self:center;display:flex;gap:32px;align-items:center}
    .series{display:flex;gap:12px;align-items:center}
    .series .barLabel{
      font-size:18px;font-weight:900;letter-spacing:.5px;opacity:.98;
      padding:10px 14px;background:#0b1420cc;border:1px solid #1a2636;border-radius:12px
    }
    .barLabel.p1{color:var(--p1)} .barLabel.p2{color:var(--p2)}
    .dot{
      width:26px;height:26px;border-radius:50%;
      background:#263449;box-shadow:inset 0 0 0 2px #162131
    }
    .dot.win-p1{
      background:radial-gradient(circle at 30% 30%,#fff,var(--p1) 55%,#300b22 140%);
      box-shadow:0 0 14px var(--p1), inset 0 0 3px #fff6
    }
    .dot.win-p2{
      background:radial-gradient(circle at 30% 30%,#fff,var(--p2) 55%,#083033 140%);
      box-shadow:0 0 14px var(--p2), inset 0 0 3px #fff6
    }

    .stats{
      display:flex;gap:18px;align-items:center;flex-wrap:wrap;justify-content:center;margin-top:6px;color:var(--muted);font-weight:800
    }
    .counter{padding:6px 10px;border-radius:10px;background:#0b1420cc;border:1px solid #1a2636}
    .counter .val{color:#fff;font-weight:900;margin-left:6px}

    .lang{
      display:flex;gap:10px;align-items:center;justify-content:center
    }
    .lang .btn{min-width:120px}
  </style>
</head>
<body>
  <div class="wrap">
    <div id="stage">
      <div id="canvasWrap">
        <canvas id="game" aria-label="Neo Snake Duel canvas"></canvas>
        <div class="hudTop">
          <div class="title" id="modeTitle">MOD: Seçilmedi</div>
          <div class="title version">Alpha v0.18</div>
        </div>
        <div class="overlay"><div class="banner" id="banner"></div></div>
      </div>
    </div>

    <footer>
      <div class="controls-left">
        <div class="tile">
          <button id="menuBtn" class="btn big" data-i18n="menu">Ana Menü</button>
          <button id="pauseBtn" class="btn big" data-i18n="pause">Duraklat (Space)</button>
        </div>
        <div class="tile">
          <button id="resetBtn" class="btn big" data-i18n="reset">Maçı Sıfırla (R)</button>
          <button id="muteBtn" class="btn big">Ses: Açık (M)</button>
        </div>
      </div>

      <div class="series-wrap">
        <div class="series left" id="p1Series"><span class="barLabel p1" id="p1Label">OYUNCU 1</span></div>
        <div class="series right" id="p2Series"><span class="barLabel p2" id="p2Label">OYUNCU 2</span></div>
        <div style="display:none"></div>
      </div>

      <div class="controls-right">
        <div class="tile">
          <div class="lang">
            <button id="langBtn" class="btn big">TR / EN</button>
          </div>
          <div class="stats">
            <div class="counter" id="p1FoodBox"><span data-i18n="p1Food">P1 Yem</span>: <span class="val" id="p1Food">0</span></div>
            <div class="counter" id="p2FoodBox"><span data-i18n="p2Food">P2 Yem</span>: <span class="val" id="p2Food">0</span></div>
          </div>
        </div>
      </div>
    </footer>
  </div>

<script>
(()=>{
  /* ===========================
     Neo Snake Duel — Alpha v0.18
     ODAK: v0.17 görsel/kurallar revizyonu
     - Kare piksel görseline geri dönüş (yılan & yem).
     - Piksel boyutları biraz büyütüldü.
     - Tek yem kuralı (sahada aynı anda 1 adet).
     - Hafif motion blur (geçiş yumuşatma).
     =========================== */

  const VERSION = 'Alpha v0.18';

  /* === i18n === */
  const STRINGS = {
    tr: {
      menu: 'Ana Menü',
      pause: 'Duraklat (Space)',
      resume: 'Sürdür (Space)',
      reset: 'Maçı Sıfırla (R)',
      modeNone: 'MOD: Seçilmedi',
      modePick: 'Oyun Modu',
      pickOne: 'Birini seç:',
      ready: 'Hazır olun…',
      start: 'BAŞLA!',
      p1: 'OYUNCU 1',
      p2: 'OYUNCU 2',
      p1Food: 'P1 Yem',
      p2Food: 'P2 Yem',
      winP1: '<span class="p1">P1</span> kazandı!',
      winP2: '<span class="p2">P2</span> kazandı!',
      draw:  '<span class="draw">Berabere</span>',
      normal: 'NORMAL',
      fast: 'FAST',
      extreme: 'EXTREME',
    },
    en: {
      menu: 'Main Menu',
      pause: 'Pause (Space)',
      resume: 'Resume (Space)',
      reset: 'Reset Match (R)',
      modeNone: 'MODE: Not Selected',
      modePick: 'Game Mode',
      pickOne: 'Choose one:',
      ready: 'Get Ready…',
      start: 'START!',
      p1: 'PLAYER 1',
      p2: 'PLAYER 2',
      p1Food: 'P1 Food',
      p2Food: 'P2 Food',
      winP1: '<span class="p1">P1</span> wins!',
      winP2: '<span class="p2">P2</span> wins!',
      draw:  '<span class="draw">Draw</span>',
      normal: 'NORMAL',
      fast: 'FAST',
      extreme: 'EXTREME',
    }
  };
  let lang = localStorage.getItem('neoSnakeLang') || 'tr';
  function t(key){ return (STRINGS[lang]&&STRINGS[lang][key]) || key; }

  /* === Canvas === */
  const canvas=document.getElementById('game');
  const ctx=canvas.getContext('2d');
  let GRID_COLS=64, GRID_ROWS=36;
  const BASE_TPS=14.2;
  let dpr=Math.max(1,Math.min(2,window.devicePixelRatio||1));
  function resize(){
    const st=document.getElementById('stage');
    const r=st.getBoundingClientRect();
    canvas.width=Math.floor(r.width*dpr); canvas.height=Math.floor(r.height*dpr);
    ctx.setTransform(dpr,0,0,dpr,0,0);
  }
  addEventListener('resize',resize,{passive:true}); resize();

  /* === Sesler === */
  let audioCtx; let muted=localStorage.getItem('neoSnakeMuted')==='1'; const muteBtn=document.getElementById('muteBtn');
  function ensureAudio(){ if(!audioCtx) audioCtx=new (window.AudioContext||window.webkitAudioContext)(); }
  function tone(freq,dur,{type='square',gain=0.06,attack=0.004,release=0.06,sweep=0}={}){
    if(muted) return; try{
      ensureAudio(); const now=audioCtx.currentTime;
      const o=audioCtx.createOscillator(); const g=audioCtx.createGain();
      o.type=type; o.frequency.value=freq;
      if(sweep){ o.frequency.linearRampToValueAtTime(freq*(1+sweep), now+dur); }
      g.gain.value=0; g.gain.linearRampToValueAtTime(gain, now+attack);
      g.gain.linearRampToValueAtTime(0.0001, now+Math.max(dur-0.01,0)+release);
      o.connect(g).connect(audioCtx.destination); o.start(now); o.stop(now+dur+release+0.03);
    }catch(e){}
  }
  const SFX={
    eat(){ tone(720,0.08,{type:'square',gain:0.05}); },
    diamond(){ tone(1200,0.10,{type:'triangle',gain:0.05}); },
    heart(){ tone(640,0.10,{type:'square',gain:0.06}); setTimeout(()=>tone(1240,0.12,{type:'sawtooth',gain:0.06}),90); },
    crash(){ tone(180,0.20,{type:'sawtooth',gain:0.08,sweep:-0.35}); },
    start(){ tone(420,0.10,{type:'sine',gain:0.05}); setTimeout(()=>tone(640,0.12,{type:'sine',gain:0.05}),120); setTimeout(()=>tone(860,0.14,{type:'sine',gain:0.05}),260); },
    pause(){ tone(360,0.06,{type:'square',gain:0.04}); },
    gulp(){ tone(420,0.06,{type:'triangle',gain:0.06}); setTimeout(()=>tone(240,0.08,{type:'sine',gain:0.05}),50); },
    whoosh(){ tone(980,0.05,{type:'triangle',gain:0.04}); setTimeout(()=>tone(820,0.05,{type:'triangle',gain:0.04}),55); setTimeout(()=>tone(680,0.05,{type:'triangle',gain:0.04}),110); }
  };
  function updateMuteUI(){
    const label = lang==='tr' ? (muted?'Kapalı':'Açık') : (muted?'Off':'On');
    muteBtn.textContent = (lang==='tr'?'Ses':'Sound')+': '+label+' (M)';
    localStorage.setItem('neoSnakeMuted', muted?'1':'0');
  }
  updateMuteUI();

  /* === UI State === */
  const banner=document.getElementById('banner'); 
  function showBanner(html){ banner.innerHTML=html; banner.classList.add('show'); }
  function hideBanner(){ banner.classList.remove('show'); }

  const GAMES_TO_ROUND=5;
  let games={p1:0,p2:0};
  const p1Series=document.getElementById('p1Series'), p2Series=document.getElementById('p2Series');
  function drawSeries(){
    const render=(el,count,owner)=>{
      const label=el.querySelector('.barLabel'); el.innerHTML=''; el.appendChild(label);
      for(let i=0;i<GAMES_TO_ROUND;i++){
        const dot=document.createElement('div');
        dot.className='dot'+(i<count?(' win-'+owner):'');
        el.appendChild(dot);
      }
    };
    render(p1Series,games.p1,'p1'); 
    render(p2Series,games.p2,'p2');
  }

  const modeTitle=document.getElementById('modeTitle');
  const MOD_SPEED = { NORMAL:1.00, FAST:1.35, EXTREME:1.80 }; let currentMode=null;
  function applyLang(){
    document.getElementById('modeTitle').textContent = currentMode ? `MOD: ${currentMode} — ${VERSION}` : (lang==='tr'?t('modeNone'):`MODE: ${currentMode||'Not Selected'} — ${VERSION}`);
    document.getElementById('menuBtn').textContent = t('menu');
    document.getElementById('pauseBtn').textContent = paused ? t('resume') : t('pause');
    document.getElementById('resetBtn').textContent = t('reset');
    document.getElementById('p1Label').textContent = t('p1');
    document.getElementById('p2Label').textContent = t('p2');
    document.querySelector('#p1FoodBox [data-i18n="p1Food"]').textContent = t('p1Food');
    document.querySelector('#p2FoodBox [data-i18n="p2Food"]').textContent = t('p2Food');
    updateMuteUI();
  }

  function openMenu(){
    paused=true;
    showBanner(`<h1>${t('modePick')}</h1><p>${t('pickOne')}</p>
      <div class="modeBtns" style="display:flex;gap:10px;justify-content:center;margin-top:10px">
        <button class="btn big" id="mNormal">${t('normal')}</button>
        <button class="btn big" id="mFast">${t('fast')}</button>
        <button class="btn big" id="mExtreme">${t('extreme')}</button>
      </div>`);
    const wait=()=>{
      const n=document.getElementById('mNormal'), f=document.getElementById('mFast'), e=document.getElementById('mExtreme');
      if(!n||!f||!e){ requestAnimationFrame(wait); return; }
      n.onclick=()=>selectMode('NORMAL'); f.onclick=()=>selectMode('FAST'); e.onclick=()=>selectMode('EXTREME');
    }; wait();
  }
  function selectMode(mode){ currentMode=mode; modeTitle.textContent=`MOD: ${mode} — ${VERSION}`; hideBanner(); paused=false; softReset(true); applyLang(); }

  document.getElementById('langBtn').onclick=()=>{
    lang = (lang==='tr')?'en':'tr';
    localStorage.setItem('neoSnakeLang', lang);
    applyLang();
  };

  /* === Input === */
  let paused=false, inCountdown=false, intermission=false;
  addEventListener('keydown',e=>{
    if([' ','r','R','m','M','w','a','s','d','W','A','S','D','ArrowUp','ArrowLeft','ArrowDown','ArrowRight'].includes(e.key)) e.preventDefault();
    if(e.key===' '){ paused=!paused; SFX.pause(); document.getElementById('pauseBtn').textContent=paused ? t('resume') : t('pause'); }
    if(e.key==='r'||e.key==='R'){ softReset(true); }
    if(e.key==='m'||e.key==='M'){ muted=!muted; updateMuteUI(); }
    if(!snakes || inCountdown || intermission || paused || !currentMode) return;
    if(/^[wasd]$/i.test(e.key)){ const m={w:'up',a:'left',s:'down',d:'right'}; const d=dirMap[m[e.key.toLowerCase()]]; const s=snakes.p1; if(!opposite(d,s.dir)) s.nextDir=d; }
    if(/^Arrow/.test(e.key)){ const m={ArrowUp:'up',ArrowLeft:'left',ArrowDown:'down',ArrowRight:'right'}; const d=dirMap[m[e.key]]; const s=snakes.p2; if(!opposite(d,s.dir)) s.nextDir=d; }
  },{passive:false});
  document.getElementById('pauseBtn').onclick=()=>{ paused=!paused; SFX.pause(); document.getElementById('pauseBtn').textContent=paused ? t('resume') : t('pause'); };
  document.getElementById('resetBtn').onclick=()=>softReset(true);
  muteBtn.onclick=()=>{ muted=!muted; updateMuteUI(); };
  document.getElementById('menuBtn').onclick=()=>{ openMenu(); };

  /* === Helpers === */
  function rngCell(){ return { x:(Math.random()*GRID_COLS)|0, y:(Math.random()*GRID_ROWS)|0 } }
  function wrapCell(c){ let x=c.x,y=c.y; if(x<0)x=GRID_COLS-1; else if(x>=GRID_COLS)x=0; if(y<0)y=GRID_ROWS-1; else if(y>=GRID_ROWS)y=0; return {x,y}; }
  async function countdown(n){
    inCountdown=true;
    for(let i=n;i>0;i--){
      showBanner(`<h1>${i}</h1><p>${t('ready')}</p>`);
      await new Promise(r=>setTimeout(r,520));
    }
    showBanner(`<h1 style="color:#9ed0ff">${t('start')}</h1>`); SFX.start();
    await new Promise(r=>setTimeout(r,360));
    hideBanner(); inCountdown=false; intermission=false;
  }

  function modLerp(prev, cur, cap, t){
    // wrap-aware interpolation in [0,cap)
    let a=prev, b=cur;
    let d=b-a;
    if(d>cap/2) a+=cap; else if(d<-cap/2) a-=cap;
    const v=a + (b-a)*t;
    let out=v%cap; if(out<0) out+=cap;
    return out;
  }

  function drawGrid(){
    const w=canvas.clientWidth,h=canvas.clientHeight,cw=w/GRID_COLS,ch=h/GRID_ROWS;
    ctx.save();
    ctx.strokeStyle=getComputedStyle(document.documentElement).getPropertyValue('--grid') || '#1a2537';
    ctx.globalAlpha=0.14;
    ctx.beginPath();
    for(let x=0;x<=GRID_COLS;x++){ const X=Math.round(x*cw)+.5; ctx.moveTo(X,0); ctx.lineTo(X,h); }
    for(let y=0;y<=GRID_ROWS;y++){ const Y=Math.round(y*ch)+.5; ctx.moveTo(0,Y); ctx.lineTo(w,Y); }
    ctx.stroke();
    ctx.restore();
  }

  /* === Core === */
  const dirMap={up:{x:0,y:-1},down:{x:0,y:1},left:{x:-1,y:0},right:{x:1,y:0}};
  function opposite(a,b){return a.x===-b.x&&a.y===-b.y}
  function createSnake(start,dir){ 
    const seg=[ start,{x:start.x-dir.x,y:start.y-dir.y},{x:start.x-2*dir.x,y:start.y-2*dir.y} ]; 
    return { segments:seg, prev:seg.map(s=>({...s})), dir:{...dir}, nextDir:{...dir}, grow:0, powerEnd:0 };
  }
  function isPowered(s){ return s && performance.now()<s.powerEnd; }

  let snakes=null, foods=[], stats={p1Food:0,p2Food:0};
  let acc1=0, acc2=0;
  function speedMult(s){ return isPowered(s) ? 1.45 : 1.00; }

  function softReset(full=false){
    GRID_COLS=64; GRID_ROWS=36;
    const mid={x:(GRID_COLS/2)|0, y:(GRID_ROWS/2)|0};
    snakes={
      p1:createSnake({x:mid.x-10,y:mid.y}, dirMap.right),
      p2:createSnake({x:mid.x+10,y:mid.y}, dirMap.left)
    };
    foods.length=0;
    spawnFoodOne(); // tek yem
    acc1=0; acc2=0;
    if(full){ games={p1:0,p2:0}; drawSeries(); }
    stats.p1Food=0; stats.p2Food=0; updateFoodCounters();
    countdown(3);
  }

  function awardGame(who){
    if(who==='p1'){ games.p1++; }
    else if(who==='p2'){ games.p2++; }
    drawSeries();
  }

  // Tek yem üretimi
  function spawnFoodOne(){
    // Tip olasılıkları: normal %84, diamond %8, heart %8 (tek item)
    let tries=0; 
    const occ=new Set([ ...snakes.p1.segments, ...snakes.p2.segments ].map(o=>o.x+','+o.y));
    let f; 
    do{ f=rngCell(); tries++; if(tries>800) return; }while(occ.has(f.x+','+f.y));
    const r=Math.random();
    let type='normal'; if(r>0.92) type='heart'; else if(r>0.84) type='diamond';
    foods.length=0; // sahada sadece 1 item!
    foods.push({x:f.x,y:f.y,type, t:0, spawnAt:performance.now()});
  }

  function eatFoodIfAny(s, ownerKey){
    for(let i=0;i<foods.length;i++){
      const f=foods[i];
      if(f.x===s.segments[0].x && f.y===s.segments[0].y){
        s.grow += (f.type==='normal'?1:(f.type==='diamond'?2:1));
        if(f.type==='heart'){ s.powerEnd = performance.now()+3200; SFX.heart(); }
        else if(f.type==='diamond'){ SFX.diamond(); }
        else { SFX.eat(); }
        foods.splice(i,1);
        spawnFoodOne(); // yine tek yem
        if(ownerKey==='p1') stats.p1Food++; else stats.p2Food++;
        updateFoodCounters();
        return;
      }
    }
  }

  function updateFoodCounters(){
    document.getElementById('p1Food').textContent = stats.p1Food;
    document.getElementById('p2Food').textContent = stats.p2Food;
  }

  function bodyAdvance(s){
    const head=s.segments[0];
    if(!opposite(s.nextDir,s.dir)) s.dir={...s.nextDir};
    const nextHead=wrapCell({x:head.x+s.dir.x, y:head.y+s.dir.y});
    s.prev = s.segments.map(c=>({...c}));
    s.segments.unshift(nextHead);
    if(s.grow>0) s.grow--; else s.segments.pop();
  }

  function collideCheckDetailed(){
    // returns {result:'p1'|'p2'|'draw'|null, eater:null|'p1'|'p2'}
    const s1=snakes.p1, s2=snakes.p2;
    const head1 = s1.segments[0], head2 = s2.segments[0];
    if(head1.x===head2.x && head1.y===head2.y) return {result:'draw', eater:null};

    const self1=new Set(s1.segments.slice(1).map(c=>c.x+','+c.y));
    const self2=new Set(s2.segments.slice(1).map(c=>c.x+','+c.y));
    const k1=head1.x+','+head1.y, k2=head2.x+','+head2.y;

    const hit1Self = self1.has(k1);
    const hit2Self = self2.has(k2);
    const hit1Opp  = self2.has(k1);
    const hit2Opp  = self1.has(k2);

    const hit1 = hit1Self || hit1Opp;
    const hit2 = hit2Self || hit2Opp;

    if(hit1 && hit2) return {result:'draw', eater:null};
    if(hit1){ // P1 öldü; eğer hit1Opp ise "yiyen" P1 kabul (rakip gövdeye girdi)
      return {result:'p2', eater: hit1Opp ? 'p1' : null};
    }
    if(hit2){
      return {result:'p1', eater: hit2Opp ? 'p2' : null};
    }
    return {result:null, eater:null};
  }

  /* === Rendering === */
  const SNAKE_PIXEL_SCALE = 0.92; // kare piksel boyutu (hücreye oran)
  const FOOD_PIXEL_SCALE  = 0.88; // yem boyutu

  function drawSnakePixels(s, owner, alphaProgress){
    const w=canvas.clientWidth,h=canvas.clientHeight,cw=w/GRID_COLS,ch=h/GRID_ROWS;
    const size = Math.min(cw,ch)*SNAKE_PIXEL_SCALE;
    ctx.save();
    for(let i=0;i<s.segments.length;i++){
      const cur=s.segments[i], prev=s.prev[i]||cur;
      const gx=modLerp(prev.x, cur.x, GRID_COLS, alphaProgress);
      const gy=modLerp(prev.y, cur.y, GRID_ROWS, alphaProgress);
      const cx=(gx+.5)*cw, cy=(gy+.5)*ch;
      const x=Math.round(cx - size/2), y=Math.round(cy - size/2);
      ctx.fillStyle = owner==='p1' ? '#ff4fbf' : '#35e6e6';
      ctx.fillRect(x, y, Math.round(size), Math.round(size));
      // hafif piksel parıltısı
      ctx.globalAlpha=0.08;
      ctx.fillStyle='#ffffff';
      ctx.fillRect(x, y, Math.round(size*0.55), Math.round(size*0.55));
      ctx.globalAlpha=1;
    }
    ctx.restore();
  }

  function drawFoodsSquares(){
    const w=canvas.clientWidth,h=canvas.clientHeight,cw=w/GRID_COLS,ch=h/GRID_ROWS;
    const size = Math.min(cw,ch)*FOOD_PIXEL_SCALE;
    for(const f of foods){
      const cx=(f.x+.5)*cw, cy=(f.y+.5)*ch;
      const x=Math.round(cx - size/2), y=Math.round(cy - size/2);
      // glow (ekran karışımı)
      ctx.save();
      ctx.globalCompositeOperation='screen';
      ctx.globalAlpha=0.35;
      ctx.fillStyle = f.type==='diamond' ? '#ffd166' : (f.type==='heart' ? '#ff1744' : '#9ed0ff');
      ctx.fillRect(x-6, y-6, Math.round(size+12), Math.round(size+12));
      ctx.restore();

      // gövde
      ctx.fillStyle = f.type==='diamond' ? '#ffd166' : (f.type==='heart' ? '#ff1744' : '#9ed0ff');
      ctx.fillRect(x, y, Math.round(size), Math.round(size));

      // highlight
      ctx.globalAlpha=0.12;
      ctx.fillStyle='#ffffff';
      ctx.fillRect(x, y, Math.round(size*0.6), Math.round(size*0.6));
      ctx.globalAlpha=1;
    }
  }

  /* === Motion Blur === */
  const BLUR_ALPHA = 0.12; // düşük değer = daha uzun iz
  let firstFrame = true;
  function applyMotionBlur(){
    const w=canvas.clientWidth,h=canvas.clientHeight;
    if(firstFrame){
      ctx.clearRect(0,0,w,h);
      firstFrame=false;
    }else{
      ctx.fillStyle = `rgba(0,0,0,${BLUR_ALPHA})`;
      ctx.fillRect(0,0,w,h);
    }
  }

  /* === Game Flow === */
  let deathAnim = { active:false, loser:null, winner:null, nextAt:0, stepMs:40 };
  function startDeathAnim(loser, winner){
    deathAnim = { active:true, loser, winner, nextAt:performance.now(), stepMs:40 };
    intermission = true;
    SFX.gulp(); SFX.whoosh();
  }

  function endGame(result){
    intermission=true;
    if(result==='p1'){ awardGame('p1'); showBanner(`<h1>${t('winP1')}</h1>`); }
    else if(result==='p2'){ awardGame('p2'); showBanner(`<h1>${t('winP2')}</h1>`); }
    else { showBanner(`<h1>${t('draw')}</h1>`); }
    setTimeout(()=>{ hideBanner(); resetRound(3); }, 1300);
  }

  async function resetRound(count=3){
    const mid={x:(GRID_COLS/2)|0, y:(GRID_ROWS/2)|0};
    snakes={
      p1:createSnake({x:mid.x-10,y:mid.y}, dirMap.right),
      p2:createSnake({x:mid.x+10,y:mid.y}, dirMap.left)
    };
    foods.length=0; spawnFoodOne();
    acc1=0; acc2=0;
    deathAnim.active=false;
    await countdown(count);
  }

  /* === Loop === */
  let last=performance.now();
  function step(){
    const now=performance.now(), dt=now-last; last=now;
    const modeBoost = currentMode ? (MOD_SPEED[currentMode]||1.0) : 1.0;
    const baseStepMs = 1000/(BASE_TPS*modeBoost);

    if(deathAnim.active){
      // hızlı kuyruğundan silinme
      const loser = snakes[deathAnim.loser];
      if(now>=deathAnim.nextAt){
        loser.prev = loser.segments.map(c=>({...c}));
        loser.segments.pop();
        deathAnim.nextAt = now + deathAnim.stepMs;
        if(loser.segments.length===0){
          deathAnim.active=false;
          endGame(deathAnim.winner);
        }
      }
      render(0,0); // alpha önemsiz; prev set
      requestAnimationFrame(step); return;
    }

    if(snakes && !paused && !inCountdown && !intermission && currentMode){
      acc1 += dt; acc2 += dt;
      let guard=0;
      while(guard++<12){
        const s1=snakes.p1, s2=snakes.p2;
        const i1 = baseStepMs / speedMult(s1);
        const i2 = baseStepMs / speedMult(s2);
        const r1 = acc1 >= i1, r2 = acc2 >= i2;
        if(!r1 && !r2) break;
        if(r1 && r2){
          bodyAdvance(s1); bodyAdvance(s2);
          acc1 -= i1; acc2 -= i2;
          eatFoodIfAny(s1,'p1'); eatFoodIfAny(s2,'p2');
          const chk = collideCheckDetailed();
          if(chk.result){
            if(chk.result==='draw'){ endGame('draw'); break; }
            else{
              if(chk.eater){ startDeathAnim(chk.eater, chk.result==='p1'?'p1':'p2'); }
              else{ endGame(chk.result); }
              break;
            }
          }
        }else if(r1){
          bodyAdvance(s1); acc1 -= i1;
          eatFoodIfAny(s1,'p1');
          const chk = collideCheckDetailed();
          if(chk.result){
            if(chk.result==='draw'){ endGame('draw'); break; }
            else{
              if(chk.eater){ startDeathAnim(chk.eater, chk.result==='p1'?'p1':'p2'); }
              else{ endGame(chk.result); }
              break;
            }
          }
        }else if(r2){
          bodyAdvance(s2); acc2 -= i2;
          eatFoodIfAny(s2,'p2');
          const chk = collideCheckDetailed();
          if(chk.result){
            if(chk.result==='draw'){ endGame('draw'); break; }
            else{
              if(chk.eater){ startDeathAnim(chk.eater, chk.result==='p1'?'p1':'p2'); }
              else{ endGame(chk.result); }
              break;
            }
          }
        }
      }
    }

    // render
    const s1=snakes?.p1, s2=snakes?.p2;
    let alpha1=0, alpha2=0;
    if(s1&&currentMode){
      const i1 = (1000/(BASE_TPS*(MOD_SPEED[currentMode]||1.0))) / speedMult(s1);
      alpha1 = Math.max(0, Math.min(1, acc1 / i1));
    }
    if(s2&&currentMode){
      const i2 = (1000/(BASE_TPS*(MOD_SPEED[currentMode]||1.0))) / speedMult(s2);
      alpha2 = Math.max(0, Math.min(1, acc2 / i2));
    }
    render(alpha1, alpha2);
    requestAnimationFrame(step);
  }

  function render(alpha1, alpha2){
    applyMotionBlur();       // hafif iz
    drawGrid();
    if(snakes){
      drawFoodsSquares();
      drawSnakePixels(snakes.p2,'p2',alpha2);
      drawSnakePixels(snakes.p1,'p1',alpha1);
    }
  }

  /* === Boot === */
  function updateFoodCounters(){ // hoisted alias guard
    document.getElementById('p1Food').textContent = stats.p1Food;
    document.getElementById('p2Food').textContent = stats.p2Food;
  }
  function openMenuInit(){ drawSeries(); applyLang(); openMenu(); requestAnimationFrame(step); }
  openMenuInit();
})();
</script>
</body>
