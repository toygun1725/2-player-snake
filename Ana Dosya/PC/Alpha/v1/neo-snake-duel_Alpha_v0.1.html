<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Neo Snake Duel — Alpha v0.1</title>
  <!-- Version: Alpha v0.1 -->
  <style>
    :root{
      --bg:#0b0f14;
      --grid:#213044;
      --p1:#ff4fbf;       /* Pembe (Player 1) */
      --p1g:#ffc4e7;
      --p2:#35e6e6;       /* Turkuvaz (Player 2) */
      --p2g:#bff6f6;
      --gold:#ffd166;     /* Elmas (sarı) */
      --heart:#ff2b50;    /* Kırmızı kalp */
    }
    *{box-sizing:border-box}
    html,body{height:100%}
    body{
      margin:0;background:var(--bg);color:#e7f1ff;
      font-family:ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,Arial;
      overflow:hidden
    }
    .wrap{height:100%;display:grid;grid-template-rows:1fr auto}
    #stage{position:relative;height:calc(100vh - 132px)}
    #canvasWrap{
      position:relative;width:100%;height:100%;border-radius:22px;overflow:hidden;
      box-shadow:0 44px 130px #000a,0 12px 44px #0009,inset 0 0 0 1px #1a2636;
      background:#09101a
    }
    canvas{width:100%;height:100%;display:block;
      background:radial-gradient(1200px 900px at 50% -30%, #122034 0%, #0b121c 40%, #081018 75%, #050a10 100%)
    }
    #canvasWrap::before{
      content:"";position:absolute;inset:0;
      background:linear-gradient(transparent,rgba(0,0,0,.35)),
                 repeating-linear-gradient(180deg,#0000 0 2px,#0003 2px 3px);
      mix-blend-mode:multiply;pointer-events:none
    }

    .hudTop{
      position:absolute;inset:10px 12px auto 12px;
      display:flex;gap:8px;justify-content:center;align-items:center;pointer-events:none;z-index:5
    }
    .title{
      pointer-events:none;margin:0 12px;padding:8px 12px;font-weight:900;font-size:13px;letter-spacing:.6px;opacity:.95;
      background:#0b1420cc;border:1px solid #1a2636;border-radius:10px;box-shadow:0 8px 24px #0007
    }
    .version{opacity:.8}

    .overlay{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none;z-index:6}
    .banner{
      pointer-events:auto;min-width:320px;max-width:92%;text-align:center;padding:18px 22px;border-radius:18px;
      background:linear-gradient(180deg,#0d1624ee,#0a111de0);
      border:1px solid #1b2a41;box-shadow:0 16px 50px #0009;
      transform:translateY(10px) scale(.96);opacity:0;transition:all .45s cubic-bezier(.2,.8,.2,1)
    }
    .banner.show{transform:translateY(0) scale(1);opacity:1}
    .banner h1{margin:0 0 6px;font-size:clamp(22px,4.2vw,44px);letter-spacing:1px}
    .banner p{margin:0;opacity:.9;font-size:14px}
    .banner .p1{color:var(--p1)} .banner .p2{color:var(--p2)} .banner .draw{color:#9ed0ff}

    footer{
      height:132px;display:grid;grid-template-columns: 1fr auto 1fr;align-items:center;gap:10px;
      padding:12px 14px;background:linear-gradient(180deg,#0e1726cc,#0a111dcc);border-top:1px solid #1b2a41;
      backdrop-filter:blur(6px)
    }
    .controls-left{justify-self:start;display:flex;gap:10px}
    .controls-right{justify-self:end;display:flex;gap:10px}
    .btn{padding:10px 14px;border-radius:12px;background:#0c141f;border:1px solid #1b2a41;color:#d9e6ff;cursor:pointer;font-weight:800;letter-spacing:.3px}
    .btn:hover{filter:brightness(1.08)}

    .series-wrap{justify-self:center;display:flex;gap:40px;align-items:center}
    .series{display:flex;gap:14px;align-items:center}
    .series .barLabel{
      font-size:18px;font-weight:900;letter-spacing:.5px;opacity:.98;
      padding:10px 14px;background:#0b1420cc;border:1px solid #1a2636;border-radius:12px
    }
    .barLabel.p1{color:var(--p1)} .barLabel.p2{color:var(--p2)}
    .dot{
      width:30px;height:30px;border-radius:50%;
      background:#263449;box-shadow:inset 0 0 0 2px #162131
    }
    .dot.win-p1{
      background:radial-gradient(circle at 30% 30%,#fff,var(--p1) 55%,#300b22 140%);
      box-shadow:0 0 14px var(--p1), inset 0 0 3px #fff6
    }
    .dot.win-p2{
      background:radial-gradient(circle at 30% 30%,#fff,var(--p2) 55%,#083033 140%);
      box-shadow:0 0 14px var(--p2), inset 0 0 3px #fff6
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div id="stage">
      <div id="canvasWrap">
        <canvas id="game"></canvas>
        <div class="hudTop">
          <div class="title" id="modeTitle">MOD: Seçilmedi</div>
          <div class="title version">Alpha v0.1</div>
        </div>
        <div class="overlay"><div class="banner" id="banner"></div></div>
      </div>
    </div>
    <footer>
      <div class="controls-left">
        <button id="menuBtn" class="btn">Ana Menü</button>
        <button id="pauseBtn" class="btn">Duraklat (Space)</button>
      </div>
      <div class="series-wrap">
        <div class="series left" id="p1Series"><span class="barLabel p1">PLAYER 1</span></div>
        <div class="series right" id="p2Series"><span class="barLabel p2">PLAYER 2</span></div>
      </div>
      <div class="controls-right">
        <button id="resetBtn" class="btn">Maçı Sıfırla (R)</button>
        <button id="muteBtn" class="btn">Ses: Açık (M)</button>
      </div>
    </footer>
  </div>

  <script>
  (()=>{
    const VERSION = 'Alpha v0.1';
    const canvas=document.getElementById('game');
    const ctx=canvas.getContext('2d');
    let GRID_COLS=64, GRID_ROWS=36; const BASE_TPS=14.2; let tAccum=0;
    let dpr=Math.max(1,Math.min(2,window.devicePixelRatio||1));
    function resize(){
      const st=document.getElementById('stage'); const r=st.getBoundingClientRect();
      canvas.width=Math.floor(r.width*dpr); canvas.height=Math.floor(r.height*dpr);
      ctx.setTransform(dpr,0,0,dpr,0,0);
    }
    addEventListener('resize',resize,{passive:true}); resize();

    /* === Sesler === */
    let audioCtx; let muted=localStorage.getItem('neoSnakeMuted')==='1'; const muteBtn=document.getElementById('muteBtn');
    function ensureAudio(){ if(!audioCtx) audioCtx=new (window.AudioContext||window.webkitAudioContext)(); }
    function tone(freq,dur,{type='sine',gain=0.06,attack=0.004,release=0.06,sweep=0}={}){
      if(muted) return; try{
        ensureAudio(); const now=audioCtx.currentTime;
        const o=audioCtx.createOscillator(); const g=audioCtx.createGain();
        o.type=type; o.frequency.value=freq;
        if(sweep){ o.frequency.linearRampToValueAtTime(freq*(1+sweep), now+dur); }
        g.gain.value=0; g.gain.linearRampToValueAtTime(gain, now+attack);
        g.gain.linearRampToValueAtTime(0.0001, now+Math.max(dur-0.01,0)+release);
        o.connect(g).connect(audioCtx.destination); o.start(now); o.stop(now+dur+release+0.03);
      }catch(e){}
    }
    const SFX={
      eatNormal(){ tone(720,0.08,{type:'square',gain:0.05}); tone(560,0.07,{type:'sine',gain:0.03}); },
      eatDiamond(){ tone(980,0.12,{type:'triangle',gain:0.06}); setTimeout(()=>tone(1400,0.12,{type:'triangle',gain:0.06}),60); },
      eatHeart(){ tone(620,0.10,{type:'square',gain:0.06}); setTimeout(()=>tone(1240,0.12,{type:'sawtooth',gain:0.06}),90); },
      crash(){ tone(180,0.20,{type:'sawtooth',gain:0.08,sweep:-0.35}); setTimeout(()=>tone(90,0.2,{type:'sine',gain:0.06}),40); },
      roundWin(){ tone(660,0.10,{type:'triangle',gain:0.05}); setTimeout(()=>tone(880,0.12,{type:'triangle',gain:0.05}),110); setTimeout(()=>tone(1040,0.14,{type:'triangle',gain:0.05}),240); },
      gameStart(){ tone(420,0.10,{type:'sine',gain:0.05}); setTimeout(()=>tone(640,0.12,{type:'sine',gain:0.05}),120); setTimeout(()=>tone(860,0.14,{type:'sine',gain:0.05}),260); },
      pause(){ tone(360,0.06,{type:'square',gain:0.04}); },
      pairSpawn(){ tone(720,0.08,{type:'square',gain:0.045}); },
      pairVanish(){ tone(320,0.08,{type:'sine',gain:0.04}); },
      diamondSpawn(){ tone(1200,0.1,{type:'triangle',gain:0.05}); },
    };
    function updateMuteUI(){ muteBtn.textContent=`Ses: ${muted?'Kapalı':'Açık'} (M)`; localStorage.setItem('neoSnakeMuted', muted?'1':'0'); } updateMuteUI();

    /* === Oyun Durumu === */
    const GAMES_TO_ROUND=5;
    let games={p1:0,p2:0}, roundsWon={p1:0,p2:0};
    const p1Series=document.getElementById('p1Series'), p2Series=document.getElementById('p2Series');
    function drawSeries(){
      const render=(el,count,owner)=>{
        const label=el.querySelector('.barLabel'); el.innerHTML=''; el.appendChild(label);
        for(let i=0;i<GAMES_TO_ROUND;i++){ 
          const dot=document.createElement('div'); 
          dot.className='dot'+(i<count?(' win-'+owner):''); 
          el.appendChild(dot); 
        }
      };
      render(p1Series,games.p1,'p1'); 
      render(p2Series,games.p2,'p2');
    }

    const banner=document.getElementById('banner'); function showBanner(html){ banner.innerHTML=html; banner.classList.add('show'); } function hideBanner(){ banner.classList.remove('show'); }

    const particles=[]; function burst(x,y,color='#fff',n=26,speed=2.2){
      for(let i=0;i<n;i++){ const a=Math.random()*Math.PI*2, v=speed*(.3+Math.random());
        particles.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,life:40+Math.random()*20,color}); }
    }

    const dirMap={up:{x:0,y:-1},down:{x:0,y:1},left:{x:-1,y:0},right:{x:1,y:0}}; function opposite(a,b){return a.x===-b.x&&a.y===-b.y}
    function createSnake(start,dir){ const seg=[ start,{x:start.x-dir.x,y:start.y-dir.y},{x:start.x-2*dir.x,y:start.y-2*dir.y} ]; return { segments:seg, prev:seg.map(s=>({...s})), dir:{...dir}, nextDir:{...dir}, grow:0, eatAnim:0, powerEnd:0, ingest:[] }; }
    function shrinkTail(s,n){ const cut=Math.min(n, s.segments.length); if(cut>0) s.segments.splice(s.segments.length-cut, cut); }
    function isPowered(s){ return s && performance.now()<s.powerEnd; }

    let snakes=null, foods=[], normalsSinceDiamond=0, nextIsDiamond=false, totalEaten=0, nextDouble=false, nextIsHeart=false;
    let paused=false, inCountdown=false, intermission=false;

    /* Kalp (Heart) yendiğinde 10 yemlik BURST modu */
    const BURST_COUNT = 10;
    let burstState = { active:false, endAt:0 };
    function spawnBurstFoods(targetAdd){
      let added=0, tries=0;
      const occ=new Set([ ...snakes.p1.segments, ...snakes.p2.segments, ...foods ].map(o=>o.x+","+o.y));
      while(added<targetAdd && tries<3000){
        const f={ x:(Math.random()*GRID_COLS)|0, y:(Math.random()*GRID_ROWS)|0, type:'normal', t:0, spawnAt:performance.now(), burst:true };
        tries++;
        const key=f.x+","+f.y;
        if(!occ.has(key)){
          foods.push(f); occ.add(key); added++;
        }
      }
    }
    function startBurst(){
      const now=performance.now();
      if(!burstState.active){
        burstState.active=true; burstState.endAt=now+4000;
        spawnBurstFoods(BURST_COUNT);
      }else{
        burstState.endAt=now+4000;
        const currentBurst = foods.filter(f=>f.burst).length;
        if(currentBurst < BURST_COUNT) spawnBurstFoods(BURST_COUNT - currentBurst);
      }
    }
    function endBurst(){
      foods = foods.filter(f=>!f.burst);
      burstState.active=false; burstState.endAt=0;
      normalsSinceDiamond=0; totalEaten=0; nextIsDiamond=false; nextIsHeart=false; nextDouble=false;
      if(foods.length===0) spawnFood(true); // force spawn
    }

    const MOD_SPEED = { NORMAL:1.00, FAST:1.35, EXTREME:1.80 }; let currentMode=null;
    const modeTitle=document.getElementById('modeTitle');

    function openMenu(){
      paused=true;
      showBanner(`<h1>Oyun Modu</h1><p>Birini seç:</p>
        <div class="modeBtns" style="display:flex;gap:10px;justify-content:center;margin-top:10px">
          <button class="btn" id="mNormal">NORMAL</button>
          <button class="btn" id="mFast">FAST</button>
          <button class="btn" id="mExtreme">EXTREME</button>
        </div>`);
      const wait=()=>{
        const n=document.getElementById('mNormal'), f=document.getElementById('mFast'), e=document.getElementById('mExtreme');
        if(!n||!f||!e){ requestAnimationFrame(wait); return; }
        n.onclick=()=>selectMode('NORMAL'); f.onclick=()=>selectMode('FAST'); e.onclick=()=>selectMode('EXTREME');
      }; wait();
    }
    function selectMode(mode){ currentMode=mode; modeTitle.textContent='MOD: '+mode+' — '+VERSION; hideBanner(); paused=false; softReset(true); }

    /* Girişler */
    addEventListener('keydown',e=>{
      if([' ','r','R','m','M','w','a','s','d','W','A','S','D','ArrowUp','ArrowLeft','ArrowDown','ArrowRight','n','N'].includes(e.key)) e.preventDefault();
      if(e.key===' '){ paused=!paused; SFX.pause(); document.getElementById('pauseBtn').textContent=paused?'Sürdür (Space)':'Duraklat (Space)'; }
      if(e.key==='r'||e.key==='R'){ softReset(true); }
      if(e.key==='m'||e.key==='M'){ muted=!muted; updateMuteUI(); }
      if(!snakes || inCountdown || intermission || paused || !currentMode) return;
      if(/^[wasd]$/i.test(e.key)){ const m={w:'up',a:'left',s:'down',d:'right'}; const d=dirMap[m[e.key.toLowerCase()]]; const s=snakes.p1; if(!opposite(d,s.dir)) s.nextDir=d; }
      if(/^Arrow/.test(e.key)){ const m={ArrowUp:'up',ArrowLeft:'left',ArrowDown:'down',ArrowRight:'right'}; const d=dirMap[m[e.key]]; const s=snakes.p2; if(!opposite(d,s.dir)) s.nextDir=d; }
    },{passive:false});
    document.getElementById('pauseBtn').onclick=()=>{ paused=!paused; SFX.pause(); document.getElementById('pauseBtn').textContent=paused?'Sürdür (Space)':'Duraklat (Space)'; };
    document.getElementById('resetBtn').onclick=()=>softReset(true);
    muteBtn.onclick=()=>{ muted=!muted; updateMuteUI(); };
    document.getElementById('menuBtn').onclick=()=>{ openMenu(); };

    /* Döngü */
    let acc=0, last=performance.now();
    function step(){
      const now=performance.now(), dt=now-last; last=now;
      if(!paused){ acc+=dt; tAccum+=dt/1000; }
      if(burstState.active && now>burstState.endAt){ endBurst(); }
      const powerBoost = (snakes && (isPowered(snakes.p1) || isPowered(snakes.p2))) ? 1.28 : 1.0;
      const modeBoost = currentMode ? MOD_SPEED[currentMode] : 1.0;
      const stepMs=(1000/(BASE_TPS*powerBoost*modeBoost));
      while(acc>=stepMs){
        acc-=stepMs;
        if(snakes && !paused && !inCountdown && !intermission && currentMode){
          snakes.p1.prev = snakes.p1.segments.map(s=>({...s}));
          snakes.p2.prev = snakes.p2.segments.map(s=>({...s}));
          try{ tick(); }catch(err){ console.error(err); }
        }
      }
      const alpha = paused ? 1 : Math.max(0, Math.min(1, acc/stepMs));
      try{ render(alpha, paused); }catch(e){ console.error(e); }
      requestAnimationFrame(step);
    }

    /* Yardımcılar */
    function rngCell(){ return { x:(Math.random()*GRID_COLS)|0, y:(Math.random()*GRID_ROWS)|0 } }
    function wrapCell(c){ let x=c.x,y=c.y; if(x<0)x=GRID_COLS-1; else if(x>=GRID_COLS)x=0; if(y<0)y=GRID_ROWS-1; else if(y>=GRID_ROWS)y=0; return {x,y}; }

    async function countdown(n){
      inCountdown=true;
      for(let i=n;i>0;i--){
        showBanner(`<h1>${i}</h1><p>Hazır olun…</p>`);
        await new Promise(r=>setTimeout(r,520));
      }
      showBanner(`<h1 style="color:#9ed0ff">BAŞLA!</h1>`); SFX.gameStart();
      await new Promise(r=>setTimeout(r,360));
      hideBanner(); inCountdown=false; intermission=false;
    }

    function spawnTwo(force=false){
      if(!snakes) return;
      foods=[];
      let tries=0; const occ=new Set([ ...snakes.p1.segments, ...snakes.p2.segments ].map(o=>o.x+","+o.y));
      while(foods.length<2 && tries<800){
        const f=rngCell(); tries++; const key=f.x+","+f.y;
        if(!occ.has(key) && !foods.some(o=>o.x===f.x&&o.y===f.y)){
          foods.push({x:f.x,y:f.y,type:'normal',t:0,spawnAt:performance.now()});
        }
      }
      SFX.pairSpawn();
    }
    function spawnOne(force=false){
      if(!snakes) return;
      let tries=0; const occ=new Set([ ...snakes.p1.segments, ...snakes.p2.segments, ...foods ].map(o=>o.x+","+o.y));
      let f; do{ f=rngCell(); tries++; if(tries>500) break; }while(occ.has(f.x+","+f.y));
      let type='normal';
      if(nextIsHeart){ type='heart'; nextIsHeart=false; }
      else if(nextIsDiamond){ type='diamond'; nextIsDiamond=false; }
      foods.push({x:f.x,y:f.y,type, t:0, spawnAt:performance.now()});
      if(type==='diamond') SFX.diamondSpawn();
    }
    function spawnFood(force=false){
      // force=true ise intermission/inCountdown durumunda bile doğur
      if(!force && (burstState.active || intermission || inCountdown)) return;
      if(nextIsHeart){ spawnOne(true); }
      else if(nextDouble){ nextDouble=false; spawnTwo(true); }
      else { spawnOne(true); }
    }

    function resetRound(preCountdown=3){
      intermission=true;
      const midY=(GRID_ROWS/2)|0;
      snakes={ p1:createSnake({x:5,y:midY},{x:1,y:0}), p2:createSnake({x:GRID_COLS-6,y:midY},{x:-1,y:0}) };
      foods=[]; normalsSinceDiamond=0; nextIsDiamond=false; nextIsHeart=false; nextDouble=false;
      burstState.active=false; burstState.endAt=0;
      spawnFood(true); // ÖNEMLİ: ilk yem intermission'da bile doğsun
      countdown(preCountdown);
    }

    function softReset(full=false){
      if(full){ games={p1:0,p2:0}; roundsWon={p1:0,p2:0}; drawSeries(); }
      foods=[]; resetRound(3);
    }

    function awardGame(winner){
      if(winner==='p1'){ games.p1++; }
      else if(winner==='p2'){ games.p2++; }
      drawSeries();
      if(games.p1>=GAMES_TO_ROUND || games.p2>=GAMES_TO_ROUND){
        const rWinner = games.p1>games.p2 ? 'p1' : (games.p2>games.p1 ? 'p2' : null);
        if(rWinner){ roundsWon[rWinner]++; SFX.roundWin(); }
        games={p1:0,p2:0}; drawSeries();
        return true;
      }
      return false;
    }

    function endGame(result){
      if(intermission) return;
      intermission=true;
      let text=''; 
      if(result==='draw'){ 
        text=`<h1 class="draw">BERABERE</h1><p>Yeni oyuna hazırlanıyor…</p>`; 
        showBanner(text);
        setTimeout(()=>{ hideBanner(); resetRound(3); }, 900);
        return;
      }
      else if(result==='p1'){ text=`<h1 class="p1">PLAYER 1 WON</h1>`; }
      else if(result==='p2'){ text=`<h1 class="p2">PLAYER 2 WON</h1>`; }
      showBanner(text);
      const roundEnded = awardGame(result);
      setTimeout(()=>{ hideBanner(); resetRound(roundEnded?5:3); }, 900);
    }

    function applyEat(s, opp, food){
      s.ingest.push({idx:0, life: s.segments.length + 4, alpha:1});

      if(food.type==='diamond'){
        s.grow+=2; SFX.eatDiamond(); burst(food.x+0.5,food.y+0.5,'#ffd166',46,3.0);
        shrinkTail(opp, 1);
        if(opp.segments.length===0){ endGame(s===snakes.p1 ? 'p1':'p2'); return 'ended'; }
      } else if(food.type==='heart'){
        s.powerEnd = performance.now()+4000; SFX.eatHeart();
        burst(food.x+0.5,food.y+0.5,'#ff4668',36,2.6);
        startBurst();
      } else {
        s.grow++; SFX.eatNormal();
        burst(food.x+0.5,food.y+0.5,s===snakes.p1?'#ff4fbf':'#35e6e6',20,2.2);
        if(!burstState.active){
          normalsSinceDiamond++;
          if(normalsSinceDiamond>=4){ nextIsDiamond=true; normalsSinceDiamond=0; }
        }
      }

      totalEaten++;
      if(!burstState.active){
        if(totalEaten % 8 === 0){ nextIsHeart = true; }
        if(totalEaten % 3 === 0){ nextDouble = true; }
      }
      return null;
    }

    function tick(){
      const s1=snakes.p1, s2=snakes.p2;
      if(!opposite(s1.nextDir,s1.dir)) s1.dir={...s1.nextDir};
      if(!opposite(s2.nextDir,s2.dir)) s2.dir={...s2.nextDir};

      const b1=bodySetNext(s1), b2=bodySetNext(s2);
      // Kafa kafaya çarpışma: BERABERE
      if(b1.nextHead.x===b2.nextHead.x && b1.nextHead.y===b2.nextHead.y){ endGame('draw'); return; }

      let p1Dead=false, p2Dead=false;
      const s1Powered=isPowered(s1), s2Powered=isPowered(s2);

      const b1in2 = (new Set(b2.set)).has(b1.nextHead.x+','+b1.nextHead.y);
      const b2in1 = (new Set(b1.set)).has(b2.nextHead.x+','+b2.nextHead.y);
      if(b1in2 && !s1Powered){ p1Dead=true; }
      if(b2in1 && !s2Powered){ p2Dead=true; }

      const self1=new Set(s1.segments.slice(0, s1.segments.length-(s1.grow>0?0:1)).map(c=>c.x+','+c.y));
      const self2=new Set(s2.segments.slice(0, s2.segments.length-(s2.grow>0?0:1)).map(c=>c.x+','+c.y));
      if(self1.has(b1.nextHead.x+','+b1.nextHead.y)) p1Dead=true;
      if(self2.has(b2.nextHead.x+','+b2.nextHead.y)) p2Dead=true;

      if(p1Dead && p2Dead){ endGame('draw'); return; }
      if(p1Dead || p2Dead){ SFX.crash(); endGame(p1Dead?'p2':'p1'); return; }

      s1.segments.unshift(b1.nextHead); s2.segments.unshift(b2.nextHead);

      let eat1=-1, eat2=-1;
      for(let i=0;i<foods.length;i++){
        const f=foods[i];
        if(f.x===b1.nextHead.x && f.y===b1.nextHead.y) eat1=i;
        if(f.x===b2.nextHead.x && f.y===b2.nextHead.y) eat2=i;
      }
      const ate1=(eat1!==-1), ate2=(eat2!==-1 && !(eat1!==-1 && eat2===eat1));

      if(ate1){
        const res = applyEat(s1,s2,foods[eat1]); if(res==='ended') return;
        if(foods.length===2 && !foods[0].burst && !foods[1].burst){ foods=[]; SFX.pairVanish(); } 
        else { foods.splice(eat1,1); }
      }
      if(ate2){
        const res = applyEat(s2,s1,foods[eat2]); if(res==='ended') return;
        if(foods.length===2 && !foods[0].burst && !foods[1].burst){ foods=[]; SFX.pairVanish(); } 
        else { foods.splice(eat2,1); }
      }

      if(s1.grow>0) s1.grow--; else s1.segments.pop();
      if(s2.grow>0) s2.grow--; else s2.segments.pop();

      if(s1.segments.length===0 || s2.segments.length===0){
        const winner = s1.segments.length===0? 'p2':'p1'; SFX.crash(); endGame(winner); return;
      }

      // Yem tüketildiyse yeni doğum kuralı (kilitliyken doğurma yok)
      if(!burstState.active && (ate1 || ate2)){
        if(foods.length===0) spawnFood();
      }

      // Elmas zaman aşımıyla yer değişimi
      const now=performance.now();
      for(const f of foods){
        f.t=(f.t||0)+1;
        if(f.type==='diamond' && now - (f.spawnAt||now) >= 4000){
          let tries=0, nf=null; const occ=new Set([ ...snakes.p1.segments, ...snakes.p2.segments, ...foods ].map(o=>o.x+","+o.y));
          do{ nf=rngCell(); tries++; if(tries>600) break; } while(occ.has(nf.x+","+nf.y));
          f.x=nf.x; f.y=nf.y; f.spawnAt=now; SFX.diamondSpawn();
        }
      }
    }

    function bodySetNext(s){
      const copy=s.segments.map(o=>({...o}));
      const newHead=wrapCell({x:s.segments[0].x+s.dir.x,y:s.segments[0].y});
      copy.unshift(newHead);
      if(s.grow<=0) copy.pop();
      const set=new Set(); copy.slice(1).forEach(c=> set.add(c.x+','+c.y));
      return {set,nextBody:copy,nextHead:newHead};
    }

    /* Çizim */
    function render(alpha, pausedNow){
      const w=canvas.clientWidth, h=canvas.clientHeight;
      ctx.clearRect(0,0,w,h);
      drawGrid(pausedNow);
      if(!snakes){ return; }
      if(foods.length) drawFoods();
      drawSnake(snakes.p1, alpha, getComputedStyle(document.documentElement).getPropertyValue('--p1').trim()||'#ff4fbf',
                             getComputedStyle(document.documentElement).getPropertyValue('--p1g').trim()||'#ffc4e7');
      drawSnake(snakes.p2, alpha, getComputedStyle(document.documentElement).getPropertyValue('--p2').trim()||'#35e6e6',
                             getComputedStyle(document.documentElement).getPropertyValue('--p2g').trim()||'#bff6f6');
    }

    function drawGrid(pausedNow){
      const w=canvas.clientWidth,h=canvas.clientHeight,cw=w/GRID_COLS,ch=h/GRID_ROWS;
      ctx.save(); const pulse= pausedNow ? .12 : .10+.02*Math.sin(tAccum*1.6);
      ctx.globalAlpha=pulse; ctx.strokeStyle=getComputedStyle(document.documentElement).getPropertyValue('--grid').trim()||'#213044'; ctx.lineWidth=1;
      for(let x=0;x<=GRID_COLS;x++){ const X=Math.round(x*cw)+.5; ctx.beginPath(); ctx.moveTo(X,0); ctx.lineTo(X,h); ctx.stroke(); }
      for(let y=0;y<=GRID_ROWS;y++){ const Y=Math.round(y*ch)+.5; ctx.beginPath(); ctx.moveTo(0,Y); ctx.lineTo(w,Y); ctx.stroke(); }
      ctx.restore();
    }

    function drawFoods(){ for(const f of foods){ drawFood(f); } }
    function drawFood(food){
      const w=canvas.clientWidth,h=canvas.clientHeight,cw=w/GRID_COLS,ch=h/GRID_ROWS;
      const x=(food.x+.5)*cw, y=(food.y+.5)*ch; ctx.save(); ctx.globalCompositeOperation='lighter';
      if(food.type==='diamond'){
        const size=Math.min(cw,ch)*(.88 + .06*Math.sin((food.t||0)*0.2));
        ctx.translate(x,y); ctx.rotate(((food.t||0)*0.08)%(Math.PI*2)); ctx.shadowColor= getComputedStyle(document.documentElement).getPropertyValue('--gold').trim()||'#ffd166'; ctx.shadowBlur=30;
        const g=ctx.createLinearGradient(-size/2,-size/2,size/2,size/2);
        g.addColorStop(0,'#fff'); g.addColorStop(.3,getComputedStyle(document.documentElement).getPropertyValue('--gold').trim()||'#ffd166'); g.addColorStop(1,'#8a5d00');
        ctx.fillStyle=g; ctx.beginPath(); ctx.moveTo(0,-size/2); ctx.lineTo(size/2,0); ctx.lineTo(0,size/2); ctx.lineTo(-size/2,0); ctx.closePath(); ctx.fill();
      } else if(food.type==='heart'){
        const r=Math.min(cw,ch)*.62*(1+0.05*Math.sin((food.t||0)*0.25));
        const col=getComputedStyle(document.documentElement).getPropertyValue('--heart').trim()||'#ff2b50';
        ctx.translate(x,y); ctx.shadowColor=col; ctx.shadowBlur=36; ctx.fillStyle=col;
        ctx.beginPath();
        ctx.moveTo(0,r*0.60);
        ctx.bezierCurveTo(r*1.2, r*0.25,  r*0.9,-r*0.6,  0,-r*0.25);
        ctx.bezierCurveTo(-r*0.9,-r*0.6, -r*1.2, r*0.25,  0,r*0.60);
        ctx.closePath(); ctx.fill();
      } else {
        const r=Math.min(cw,ch)*.46*(1+0.04*Math.sin((food.t||0)*0.2));
        const grad=ctx.createRadialGradient(x,y,r*.18,x,y,r*1.6);
        grad.addColorStop(0,'#fff'); grad.addColorStop(.25,'#9ed0ff'); grad.addColorStop(1,'#0c2542');
        ctx.fillStyle=grad; ctx.shadowColor='#a6d8ff'; ctx.shadowBlur=24; ctx.beginPath(); ctx.arc(x,y,r,0,Math.PI*2); ctx.fill();
      }
      ctx.restore();
    }

    function drawSnake(s, alpha, col, glow){
      const w=canvas.clientWidth,h=canvas.clientHeight,cw=w/GRID_COLS,ch=h/GRID_ROWS;
      ctx.save(); ctx.globalCompositeOperation='lighter'; ctx.shadowColor=glow; ctx.shadowBlur=18;
      const amp=Math.min(cw,ch)*0.18; const freq=0.54; const waveSpeed=2.6;
      const powered=isPowered(s);
      for(let i=0;i<s.segments.length;i++){
        const curr=s.segments[i]; const prev=s.prev[i]||curr;
        let dx=curr.x-prev.x; if(dx>GRID_COLS/2) dx-=GRID_COLS; if(dx<-GRID_COLS/2) dx+=GRID_COLS;
        let dy=curr.y-prev.y; if(dy>GRID_ROWS/2) dy-=GRID_ROWS; if(dy<-GRID_ROWS/2) dy+=GRID_ROWS;
        let ix=prev.x+dx*alpha, iy=prev.y+dy*alpha;
        if(ix<0) ix+=GRID_COLS; if(ix>=GRID_COLS) ix-=GRID_COLS; if(iy<0) iy+=GRID_ROWS; if(iy>=GRID_ROWS) iy-=GRID_ROWS;
        const mag=Math.hypot(dx,dy)||1; const tx=dx/mag, ty=dy/mag; const nx=-ty, ny=tx;
        const phase=(i*freq) - tAccum*waveSpeed; const off=Math.sin(phase)*amp*(i===0? .22:.44);
        const x=((ix+.5)*cw)+nx*off, y=((iy+.5)*ch)+ny*off;
        const size=Math.min(cw,ch)*(i===0?.82:.74);
        let trail=.55+.45*(1 - i/Math.max(1,s.segments.length-1));
        if(powered){ trail*= (i===0?0.75:0.6); }
        ctx.globalAlpha=trail;
        roundedRect(x-size/2,y-size/2,size,size,size*.26, col, powered);
        if(i===0) eyes(x,y,size,s.dir, powered);
      }
      ctx.restore();
    }
    function roundedRect(x,y,w,h,r,color, powered=false){
      const g=ctx.createLinearGradient(x,y,x+w,y+h);
      if(powered){ g.addColorStop(0,'#ffffff'); g.addColorStop(.12,'#ff6b6b'); g.addColorStop(1,'#240b0b'); }
      else{ g.addColorStop(0,'#fff'); g.addColorStop(.12,color); g.addColorStop(1,'#09121e'); }
      ctx.fillStyle=g; if(powered){ ctx.globalAlpha = Math.min(ctx.globalAlpha, 0.7); }
      ctx.beginPath(); ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r); ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath(); ctx.fill();
    }
    function eyes(x,y,size,dir, powered){
      const off=size*.18,r=size*.10; ctx.save(); ctx.fillStyle= powered ? '#2b0000' : '#05101d';
      let dx=0,dy=0; if(dir.x) dx=Math.sign(dir.x)*r; if(dir.y) dy=Math.sign(dir.y)*r;
      ctx.beginPath(); ctx.arc(x-off+dx,y-off+dy,r,0,Math.PI*2); ctx.arc(x+off+dx,y-off+dy,r,0,Math.PI*2); ctx.fill(); ctx.restore();
    }

    /* Başlat */
    function openMenuInit(){ drawSeries(); openMenu(); requestAnimationFrame(step); }
    openMenuInit();
  })();
  </script>
</body>
