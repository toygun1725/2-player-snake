<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>2 Player Snake | Beta v1.43</title>
  <!-- Import fonts: Orbitron for neon/matrix style, VT323 for digital timer -->
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;900&family=VT323&display=swap" rel="stylesheet">
  <!-- Version: Beta v1.40 -->
  <style>
    :root{
      --bg:#0b0f14;
      --grid:#1a2537;
      --p1:#ff4fbf;       /* Pembe (Player 1) */
      --p2:#35e6e6;       /* Turkuaz (Player 2) */
      --gold:#ffd166;     /* Elmas (sarı) */
      --heart:#ff1744;    /* Yakut kırmızısı */
      --orange: '#ff9f1c'; /* Turuncu */
      --green: '#44ff88';    /* Yeşil */
      --purple: '#9b59b6';   /* Mor */
      --red: '#e74c3c';      /* Kırmızı */
      --yellow: '#f1c40f';   /* Sarı */
      --emerald: '#2ecc71';  /* Zümrüt */
      --blue: '#3498db';     /* Mavi */
      --white: '#ffffff';    /* Beyaz */
      --ui-tile:#0c141f;
      --ui-tile-border:#1b2a41;
      --ui-tile-soft:#0f1a2a;
      --text:#e7f1ff;
      --muted:#9fb3d1;
    }
    *{box-sizing:border-box}
    html,body{height:100%}
    body{
      margin:0;background:var(--bg);color:var(--text);
      /* Genel yazı tipi Orbitron olarak ayarlandı */
      font-family:'Orbitron', ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial;
      overflow:hidden;
      text-transform: uppercase; /* BÜYÜK HARF */
    }
    .banner p, .banner .small-text {
        text-transform: none; /* Banner içindeki paragraflar normal kalsın */
    }
    #instructionsContainer, #developersContainer, #highscoreContainer {
        text-transform: none; /* Talimatlar, geliştiriciler ve highscore normal kalsın */
    }
    #instructionsContainer {
        background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
        border-radius: 12px;
        padding: 20px;
        box-shadow: 0 8px 32px rgba(0,0,0,0.3);
        border: 1px solid #334155;
        max-height: 400px;
        overflow-y: auto;
        scrollbar-width: thin;
        scrollbar-color: #475569 #1e293b;
    }
    #instructionsContainer::-webkit-scrollbar {
        width: 6px;
    }
    #instructionsContainer::-webkit-scrollbar-track {
        background: #1e293b;
        border-radius: 3px;
    }
    #instructionsContainer::-webkit-scrollbar-thumb {
        background: #475569;
        border-radius: 3px;
    }
    #instructionsContainer::-webkit-scrollbar-thumb:hover {
        background: #64748b;
    }
    .rules-section {
        margin-bottom: 24px;
        padding: 16px;
        background: rgba(255,255,255,0.02);
        border-radius: 8px;
        border-left: 3px solid #3b82f6;
    }
    .rules-section h3 {
        margin: 0 0 12px 0;
        color: #60a5fa;
        font-size: 16px;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.5px;
    }
    .rules-section p {
        margin: 0 0 8px 0;
        color: #e2e8f0;
        font-size: 14px;
        line-height: 1.6;
    }
    .rules-section ul {
        margin: 8px 0 0 0;
        padding-left: 20px;
    }
    .rules-section li {
        color: #cbd5e1;
        font-size: 13px;
        line-height: 1.5;
        margin-bottom: 4px;
    }
    .rules-section li strong {
        color: #fbbf24;
    }
    .rules-mode {
        display: inline-block;
        padding: 4px 8px;
        border-radius: 6px;
        font-size: 12px;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.5px;
        margin-right: 8px;
    }
    .rules-mode.normal {
        background: linear-gradient(135deg, #10b981, #059669);
        color: white;
    }
    .rules-mode.fast {
        background: linear-gradient(135deg, #f59e0b, #d97706);
        color: white;
    }
    .developers-section {
        margin-bottom: 20px;
        padding: 16px;
        background: rgba(255,255,255,0.02);
        border-radius: 8px;
        border-left: 3px solid #8b5cf6;
    }
    .developers-section h3 {
        margin: 0 0 12px 0;
        color: #a78bfa;
        font-size: 16px;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.5px;
    }
    .developers-section p {
        margin: 0 0 8px 0;
        color: #e2e8f0;
        font-size: 14px;
        line-height: 1.6;
    }
    .developers-section .copyright {
        margin-top: 16px;
        padding-top: 12px;
        border-top: 1px solid rgba(255,255,255,0.1);
        color: #94a3b8;
        font-size: 13px;
        text-align: center;
        font-style: italic;
    }
    #developersContainer {
        max-width: 600px;
        max-height: 400px;
        overflow-y: auto;
        margin: 20px auto;
        padding: 20px;
        background: rgba(255,255,255,0.02);
        border-radius: 12px;
        border: 1px solid rgba(255,255,255,0.1);
    }
    #developersContainer::-webkit-scrollbar {
        width: 8px;
    }
    #developersContainer::-webkit-scrollbar-track {
        background: rgba(255,255,255,0.05);
        border-radius: 4px;
    }
    #developersContainer::-webkit-scrollbar-thumb {
        background: #64748b;
        border-radius: 4px;
    }
    #developersContainer::-webkit-scrollbar-thumb:hover {
        background: #475569;
    }
    .wrap{height:100%;display:grid;grid-template-rows:1fr auto}
    #stage{position:relative;height:calc(100vh - 180px)}
    #canvasWrap{
      position:relative;width:100%;height:100%;border-radius:22px;overflow:hidden;
      box-shadow:0 44px 130px #000a,0 12px 44px #0009,inset 0 0 0 1px #1a2636;
      background:#09101a
    }
    canvas{width:100%;height:100%;display:block;
      background:radial-gradient(1200px 900px at 50% -30%, #122034 0%, #0b121c 40%, #081018 75%, #050a10 100%)
    }
    #canvasWrap.shake {
        animation: shake-anim 0.1s 2;
    }
    @keyframes shake-anim {
        0%, 100% { transform: translateX(0); }
        25% { transform: translateX(-4px); }
        75% { transform: translateX(4px); }
    }
    #canvasWrap::before{
      content:"";position:absolute;inset:0;
      background:linear-gradient(transparent,rgba(0,0,0,.35)),
                 repeating-linear-gradient(180deg,#0000 0 2px,#0003 2px 3px);
      mix-blend-mode:multiply;pointer-events:none
    }

    /* Hide the old HUD; version info will be shown in main menu */
    .hudTop{display:none!important}

    .overlay{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none;z-index:6}
    .banner{
      pointer-events:auto;min-width:320px;max-width:92%;text-align:center;
      transform:translateY(10px) scale(.96);opacity:0;transition:all .45s cubic-bezier(.2,.8,.2,1)
    }
    .banner.show{transform:translateY(0) scale(1);opacity:1}
    .banner.padded {
      padding:18px 22px;border-radius:18px;
      background:linear-gradient(180deg,#0d1624ee,#0a111de0);
      border:1px solid #1b2a41;box-shadow:0 16px 50px #0009;
    }
    .banner h1{margin:0 0 6px;font-size:clamp(22px,4.2vw,44px);letter-spacing:1px}
    .banner p{margin:0;opacity:.9;font-size:14px}
    .banner .p1{color:var(--p1)} .banner .p2{color:var(--p2)} .banner .draw{color:#9ed0ff}

    /* New footer layout */
    footer{
      height:180px;
      display:flex;
      justify-content:space-between;
      align-items:flex-start;
      gap:10px;
      padding:14px;
      background:linear-gradient(180deg,#0e1726cc,#0a111dcc);
      border-top:1px solid #1b2a41;
      backdrop-filter:blur(6px)
    }
    .panel-left, .panel-right{
      display:flex;
      flex-direction:column;
      gap:10px;
      align-items:flex-start;
      width: 180px; /* Sabit genişlik */
    }
    .panel-left {
        flex-direction: row;
        flex-wrap: wrap;
        width: 370px; /* 2 buton + gap */
    }
    .panel-left .btn {
        width: 180px;
    }
    .panel-right{align-items:flex-end}
    .panel-center{
      flex:1;
      display:grid;
      grid-template-areas:
        "p1-label time p2-label"
        "p1-food time p2-food"
        "series-row series-row series-row";
      grid-template-columns: 1fr auto 1fr;
      align-items:center;
      gap:4px 24px; /* Yatay boşluk artırıldı */
    }
    /* 1P Modu için merkezi düzen */
    .panel-center.single-player {
        grid-template-areas:
            "time"
            "p1-stats"
            "series-row";
        grid-template-columns: 1fr;
        justify-items: center;
    }
    .panel-center.single-player .player-label.p1 { grid-area: initial; }
    
    .counters-1p {
        grid-area: p1-stats;
        display: flex;
        gap: 24px;
        justify-content: center;
    }

    .panel-center.single-player #p1FoodBox { grid-area: initial; }


    /* Buttons */
    .btn{
      position: relative;
      overflow: hidden;
      z-index: 1;
      width: 100%; /* Panelin genişliğine uyar */
      padding:12px 16px;
      border-radius:12px;
      background:var(--ui-tile-soft);
      border:1px solid var(--ui-tile-border);
      color:#d9e6ff;
      cursor:pointer;
      font-weight:800;
      letter-spacing:.3px;
      font-size:14px;
      font-family: 'Orbitron', sans-serif;
      text-transform: uppercase; /* Butonlar da büyük harf */
      transition: filter 0.3s ease;
    }

    .btn::after {
        content: '';
        position: absolute;
        top: 0;
        left: -150%;
        width: 40%;
        height: 100%;
        background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.35), transparent);
        transform: skewX(-30deg);
        transition: left 1.8s cubic-bezier(0.23, 1, 0.32, 1);
    }

    .btn:hover::after {
        left: 150%;
    }

    .btn:hover{filter:brightness(1.2)}
    .btn.big{padding:14px 18px;font-size:16px}

    /* Player labels and timer */
    .players-header{
      display:contents; /* Grid'e dahil etmek için */
    }
    .player-label{
      text-shadow:0 0 6px rgba(0,0,0,0.6);
      font-size:24px;
      font-weight:900;
      letter-spacing:1px;
    }
    .player-label.p1{grid-area: p1-label; text-align: right; justify-self: end;}
    .player-label.p2{grid-area: p2-label; text-align: left; justify-self: start;}

    #timeLabel{
      grid-area: time;
      font-family:'VT323', monospace;
      font-size:48px;
      letter-spacing:2px;
      line-height:1;
      text-transform: none; /* Zaman etiketi normal kalsın */
      background: #0b1420;
      padding: 8px 16px;
      border-radius: 12px;
      border: 1px solid var(--ui-tile-border);
      box-shadow: inset 0 0 8px #0005;
      color: var(--white);
      text-shadow: 0 0 5px #fffa, 0 0 12px var(--p2);
    }

    /* Score row containing series and time bar */
    .score-row{
      grid-area: series-row;
      display:flex;
      justify-content:center;
      align-items:center;
      gap:20px;
      width:100%;
      margin-top: 10px; /* Aşağı kaydırma */
    }
    .series{
      display:flex;
      gap:12px;
      align-items:center;
    }
    .dot{
      width:44px; /* Büyütüldü */
      height:44px; /* Büyütüldü */
      border-radius:50%;
      background:#263449;
      box-shadow:inset 0 0 0 2px #162131;
    }
    .dot.win-p1{
      background:radial-gradient(circle at 30% 30%,#fff,var(--p1) 55%,#300b22 140%);
      box-shadow:0 0 14px var(--p1), inset 0 0 3px #fff6;
    }
    .dot.win-p2{
      background:radial-gradient(circle at 30% 30%,#fff,var(--p2) 55%,#083033 140%);
      box-shadow:0 0 14px var(--p2), inset 0 0 3px #fff6;
    }

    .neon-separator {
      content:"";
      width:2px;
      height: 44px; /* dot yüksekliği ile aynı */
      background:linear-gradient(to bottom,var(--p2),var(--p1));
      box-shadow: 0 0 4px var(--p2), 0 0 8px var(--p1);
    }

    .food-row{
      display:contents; /* Grid'e dahil etmek için */
    }
    .counter{
      padding:6px 10px;
      border-radius:10px;
      background:#0b1420cc;
      border:1px solid #1a2636;
      color:var(--muted);
      font-weight:700;
      font-size:18px; /* Büyütüldü */
      text-transform: none; /* Sayaçlar normal kalsın */
    }
    #p1FoodBox { grid-area: p1-food; justify-self: end; }
    #p2FoodBox { grid-area: p2-food; justify-self: start; }

    .counter .val{
      color:#fff;
      font-weight:900;
      margin-left:6px;
    }

    /* 1P Sayaç Renkleri */
    #p1Length.val {
        color: var(--p1);
    }
    #p1Food-1P.val {
        color: var(--p1);
    }
    /* 2P Sayaç Renkleri */
    #p1Food.val {
        color: var(--p1);
    }
    #p2Food.val {
        color: var(--p2);
    }


    /* Hide language button in UI */
    /* #langBtn{display:none;} */

    /* Color selection menu styles */
    .color-options { display: flex; gap: 8px; }
    .color-btn { 
        width: 40px; height: 40px; border-radius: 50%; 
        cursor: pointer; border: 3px solid transparent; 
        transition: all 0.2s;
    }
    .color-menu-separator {
      width: 2px;
      background: #1b2a41;
      align-self: stretch;
      margin: 0 20px;
    }
    .color-btn:hover { transform: scale(1.1); }
    .color-btn:disabled { opacity: 0.3; cursor: not-allowed; transform: none; }
    .banner h2 { font-size: 20px; }
    .edit-icon { cursor: pointer; font-size: 16px; opacity: 0.6; display: inline-block; margin-left: 8px; vertical-align: middle; }
    .edit-icon:hover { opacity: 1; }
    #p1NameInput, #p2NameInput {
        font-family: 'Orbitron', sans-serif;
        background: #0c141f99;
        border: 1px solid #1b2a41;
        color: var(--text);
        font-size: 20px;
        text-align: center;
        width: 200px;
        padding: 4px;
        border-radius: 6px;
        text-transform: uppercase;
    }

    /* Countdown banner style */
    .countdown-text {
        font-family: 'Orbitron', sans-serif;
        font-size: 200px;
        font-weight: 900;
        /* color: var(--white); */ /* Renk artık JS ile dinamik olarak ayarlanacak */
        text-shadow: 0 0 2px #fff, 0 0 8px var(--p1);
        animation: countdown-anim 0.5s cubic-bezier(.25,1.5,.5,1) forwards;
        transform: scale(0.5);
        opacity: 0;
        position: relative;
    }
    @keyframes countdown-anim {
        to {
            transform: scale(1);
            opacity: 1;
        }
    }
    .countdown-text.start {
        font-size: 120px;
        /* color: var(--gold); */ /* Renk artık JS ile dinamik olarak ayarlanacak */
        text-shadow: 0 0 5px var(--gold), 0 0 10px var(--p1);
    }

    .game-over-stats {
        margin: 20px 0;
        text-align: center;
    }
    .stat-item {
        display: flex;
        justify-content: center;
        align-items: center;
        margin-bottom: 10px;
    }
    .stat-label {
        font-size: 1.2em;
        color: #eee;
        margin-right: 15px;
        text-transform: none;
    }
    .stat-value {
        font-size: 2.2em;
        font-weight: bold;
        line-height: 1;
    }
    .food-value {
        color: var(--gold);
        text-shadow: 0 0 8px var(--gold);
    }

  </style>
</head>
<body>
  <div class="wrap">
    <div id="stage">
      <div id="canvasWrap">
        <canvas id="game" aria-label="2 Player Snake canvas"></canvas>
        <!-- Hidden mode title element to satisfy script references -->
        <div id="modeTitle" style="display:none"></div>
        <div class="overlay"><div class="banner" id="banner"></div></div>
      </div>
    </div>

    <footer>
      <div class="panel-left">
        <button id="pauseBtn" class="btn big" data-i18n="pause">DURAKLAT (SPACE)</button>
        <button id="menuBtn" class="btn big" data-i18n="menu">ANA MENÜ</button>
        <button id="resetBtn" class="btn big" data-i18n="reset">MAÇI SIFIRLA (R)</button>
        <button id="highscoreBtn" class="btn big" data-i18n="highscore">YÜKSEK SKORLAR</button>
      </div>
      <div class="panel-center" id="panel-center">
        <div class="players-header">
          <span class="player-label p1" id="p1Label">OYUNCU 1</span>
          <span id="timeLabel">03:00</span>
          <span class="player-label p2" id="p2Label">OYUNCU 2</span>
        </div>
        <div class="food-row">
            <div class="counters-1p">
                <div class="counter" id="p1LengthBox"><span data-i18n="snakeLength">Yılan Uzunluğu</span>: <span class="val" id="p1Length">0</span></div>
                <div class="counter" id="p1FoodBox-1P"><span data-i18n="foodEaten">Yenen Yem</span>: <span class="val" id="p1Food-1P">0</span></div>
            </div>
          <div class="counter" id="p1FoodBox"><span data-i18n="p1Food">P1 YEM</span>: <span class="val" id="p1Food">0</span></div>
          <div class="counter" id="p2FoodBox"><span data-i18n="p2Food">P2 YEM</span>: <span class="val" id="p2Food">0</span></div>
        </div>
        <div class="score-row">
          <div class="series left" id="p1Series"></div>
          <div class="neon-separator" id="neon-separator"></div>
          <div class="series right" id="p2Series"></div>
        </div>

      </div>
      <div class="panel-right">
        <button id="muteBtn" class="btn big">SES: AÇIK (M)</button>
        <button id="langBtn" class="btn big">LANGUAGE: ENGLISH</button>
        <span id="version-info" style="font-size: 12px; opacity: 0.5; text-align: right; margin-top: 4px;"></span>
      </div>
    </footer>
  </div>

<script>
(()=>{
  /* ===========================
    2 Player Snake - Beta v1.12
    =========================== */

    const VERSION = 'Beta v1.43';  /* === i18n === */
  const STRINGS = {
    tr: {
      language: 'Dil',
      languageName: 'Türkçe',
      menu: 'Ana Menü',
      pause: 'Duraklat (Space)',
      resume: 'Sürdür (Space)',
      reset: 'Maçı Sıfırla (R)',
      resetRound: 'Roundu Sıfırla (R)',
      modeNone: 'MOD: Seçilmedi',
      modePick: 'Oyun Modu',
      playerMode: 'Oyuncu Modu',
      onePlayer: '1 Oyuncu',
      twoPlayer: '2 Oyuncu',
      pickOne: 'Birini seç:',
      ready: 'Hazır Olun…',
      start: 'BAŞLA!',
      p1: 'OYUNCU 1',
      p2: 'OYUNCU 2',
      p1Food: 'P1 Yem',
      p2Food: 'P2 Yem',
      winP1: '<span class="p1">P1</span> Kazandı!',
      winP2: '<span class="p2">P2</span> Kazandı!',
      winNamed: '<span class="{playerClass}">{name}</span> Kazandı!',
      draw:  '<span class="draw">Berabere</span>',
      gameOver: 'Oyun Bitti',
      finalScore: 'Nihai Skor',
      snakeLength: 'Yılan Uzunluğu',
      foodEaten: 'Yenen Yem',
      playAgain: 'Tekrar Oyna',
      normal: 'NORMAL',
      fast: 'HIZLI',
      extreme: 'AŞIRI',
      play: 'Oyna',
      normalMode: 'Normal',
      fastCompetitiveMode: 'Hızlı Rekabetçi',
      adventureMode: 'Macera',
      settings: 'Ayarlar',
      instructions: 'Kurallar',
      developers: 'Geliştiriciler',
      mainMenu: 'Ana Menü',
      snakeSpeed: 'Yılan Hızı',
      wallMode: 'Arena Tipi',
      walls: 'Duvarlı',
      noWalls: 'Duvarsız',
      back: 'Geri',
      colorPick: 'Renk Seçimi',
      startMatch: 'Maçı Başlat!',
      startGame: 'Oyunu Başlat!',
      suddenDeath: 'ANİ ÖLÜM',
      highscore: 'Yüksek Skorlar',
      highscoresTitle: 'Yüksek Skorlar',
      top10Scores: 'En İyi 10 Skor',
      noScores: 'Henüz kaydedilmiş skor yok.',
      instructionsText: `<div class="rules-section">
      <h3>🎯 Oyunun Amacı</h3>
      <p>Bu oyun iki kişilik bir yılan düellosudur. Rakibinizi yok ederek veya süre sonunda ondan daha uzun olarak roundu kazanın. 5 round kazanan maçı alır.</p>
    </div>
    <div class="rules-section">
      <h3>⏱️ Süre ve Roundlar</h3>
      <p>Her round 3 dakika sürer. Süre dolduğunda, daha uzun olan yılan roundu kazanır. Eğer uzunluklar eşitse, arena kenarlardan daralmaya başlar ve yılanlardan biri elenene kadar oyun devam eder (Ani Ölüm).</p>
    </div>
    <div class="rules-section">
      <h3>🏟️ Arena Tipleri</h3>
      <ul>
        <li><strong>Duvarsız:</strong> Arena kenarlarından geçerek karşı taraftan çıkabilirsiniz.</li>
        <li><strong>Duvarlı:</strong> Arena kenarları kapalıdır. Duvarlara çarpmak roundu kaybettirir.</li>
      </ul>
    </div>
    <div class="rules-section">
      <h3>🍎 Yemler ve Güçlendirmeler</h3>
      <ul>

  function tone(freq,dur,{type='square',gain=0.06,attack=0.004,release=0.06,sweep=0}={}){
    if(muted) return; try{
      ensureAudio(); const now=audioCtx.currentTime;

  function addHighScore(name, score) {

    try {

        let scores = [];
        if (scoresJSON) {
            try {
                const parsed = JSON.parse(scoresJSON);
                // Check if it's the old format (array of numbers) or new format
                if (Array.isArray(parsed) && parsed.every(item => typeof item === 'object' && 'name' in item && 'score' in item)) {
                    scores = parsed;
                }
            } catch (e) {
                // If parsing fails, start with a fresh list
                scores = [];
            }
        }
        
        scores.push({ name, score });
        scores.sort((a, b) => b.score - a.score);
        
        if (scores.length > 10) {
            scores = scores.slice(0, 10);
        }
        
        localStorage.setItem('neoSnakeHighscores', JSON.stringify(scores));
    } catch (e) {
        console.error("Could not save high score", e);
    }
  }

  function modLerp(prev, cur, cap, t){
    if (currentWallMode === MOD_WALLS.SOLID) {
        return prev + (cur - prev) * t;
    }
    let a=prev, b=cur;
    let d=b-a;
    if(d>cap/2) a+=cap; else if(d<-cap/2) a-=cap;
    const v=a + (b-a)*t;
    let out=v%cap; if(out<0) out+=cap;
    return out;
  }

  function hexToRgba(hex, alpha=1.0){
    if(!hex) return `rgba(255,255,255,${alpha})`;
    let c = hex.replace('#','');
    if(c.length === 3){ c = c[0]+c[0] + c[1]+c[1] + c[2]+c[2]; }
    const bigint = parseInt(c, 16);
    const r = (bigint >> 16) & 255;
    const g = (bigint >> 8) & 255;
    const bcol = bigint & 255;
    return `rgba(${r},${g},${bcol},${alpha})`;
  }

  function mixColors(a, b, t){
    function parse(hex){ let c = hex.replace('#',''); if(c.length === 3){ c = c[0]+c[0]+c[1]+c[1]+c[2]+c[2]; } const n=parseInt(c,16); return {r:(n>>16)&255,g:(n>>8)&255,b:n&255}; }
    const ca=parse(a), cb=parse(b);
    const r = Math.round(ca.r + (cb.r - ca.r) * t);
    const g = Math.round(ca.g + (cb.g - ca.g) * t);
    const bcol = Math.round(ca.b + (cb.b - ca.b) * t);
    return `#${((1<<24)+(r<<16)+(g<<8)+bcol).toString(16).slice(1)}`;
  }

  // Tetromino barrier generation for Adventure
  const TETROMINO_SHAPES = [
    // I
    [{x:0,y:0},{x:1,y:0},{x:2,y:0},{x:3,y:0}],
    // O
    [{x:0,y:0},{x:1,y:0},{x:0,y:1},{x:1,y:1}],
    // T
    [{x:0,y:0},{x:1,y:0},{x:2,y:0},{x:1,y:1}],
    // L
    [{x:0,y:0},{x:0,y:1},{x:0,y:2},{x:1,y:2}],
    // J
    [{x:1,y:0},{x:1,y:1},{x:1,y:2},{x:0,y:2}],
    // S
    [{x:1,y:0},{x:2,y:0},{x:0,y:1},{x:1,y:1}],
    // Z
    [{x:0,y:0},{x:1,y:0},{x:1,y:1},{x:2,y:1}]
  ];
  function rotateCells(cells, times){
    let out = cells.map(c=>({...c}));
    for(let t=0;t<times;t++){
      // rotate 90deg: (x,y)->(y,-x). Normalize to positive by shifting min to 0
      out = out.map(c=>({x:c.y, y:-c.x}));
      const minX = Math.min(...out.map(c=>c.x));
      const minY = Math.min(...out.map(c=>c.y));
      out = out.map(c=>({x:c.x - minX, y:c.y - minY}));
    }
    return out;
  }
  function translateCells(cells, dx, dy){ return cells.map(c=>({x:c.x+dx, y:c.y+dy})); }
  function getBarrierCellsSet(){
    const set = new Set();
    for(const b of barriers){ if(!b||!b.cells) continue; for(const c of b.cells){ set.add(c.x+','+c.y); } }
    return set;
  }
  function spawnBarriers(desiredCount){
    barriers = [];
    const maxAttempts = 2000;
    let attempts = 0;
    while(barriers.length < desiredCount && attempts++ < maxAttempts){
      const base = TETROMINO_SHAPES[(Math.random()*TETROMINO_SHAPES.length)|0];
      const rot = (Math.random()*4)|0;
      let cells = rotateCells(base, rot);
      // random translate within bounds
      const maxX = GRID_COLS - Math.max(...cells.map(c=>c.x)) - 1;
      const maxY = GRID_ROWS - Math.max(...cells.map(c=>c.y)) - 1;
      const dx = (Math.random() * Math.max(1,maxX)) | 0;
      const dy = (Math.random() * Math.max(1,maxY)) | 0;
      cells = translateCells(cells, dx, dy);
      // avoid start area and overlaps
      let valid = true;
      const occ = getBarrierCellsSet();
      // mark snakes, foods, portals as occupied
      if (snakes && snakes.p1) snakes.p1.segments.forEach(s => occ.add(s.x+','+s.y));
      if (snakes && snakes.p2) snakes.p2.segments.forEach(s => occ.add(s.x+','+s.y));
      foods.forEach(f => occ.add(f.x+','+f.y));
      portals.forEach(p => occ.add(p.x+','+p.y));
      // avoid center start zone
      for(let x=30; x<34; x++){ for(let y=16; y<20; y++){ occ.add(x+','+y); } }
      
      // Ensure barriers are at least 2 cells away from snakes
      const snakeCells = new Set();
      if (snakes && snakes.p1) {
        snakes.p1.segments.forEach(s => {
          // Add snake cell and surrounding 2-cell radius
          for(let dx=-2; dx<=2; dx++){
            for(let dy=-2; dy<=2; dy++){
              snakeCells.add((s.x+dx)+','+(s.y+dy));
            }
          }
        });
      }
      if (snakes && snakes.p2) {
        snakes.p2.segments.forEach(s => {
          // Add snake cell and surrounding 2-cell radius
          for(let dx=-2; dx<=2; dx++){
            for(let dy=-2; dy<=2; dy++){
              snakeCells.add((s.x+dx)+','+(s.y+dy));
            }
          }
        });
      }
      
      for(const c of cells){
        if(c.x<0||c.x>=GRID_COLS||c.y<0||c.y>=GRID_ROWS){ valid=false; break; }
        if(occ.has(c.x+','+c.y)){ valid=false; break; }
        if(snakeCells.has(c.x+','+c.y)){ valid=false; break; }
      }
      if(!valid) continue;
      barriers.push({ cells });
    }
  }

  function bodyAdvance(s, ownerKey){
    const head=s.segments[0];
    if(!opposite(s.nextDir,s.dir)) s.dir={...s.nextDir};
    const nextPos = {x:head.x+s.dir.x, y:head.y+s.dir.y};
    const nextHead = handleBoundaries(nextPos);

    // Adventure mode portal check (tunnel style)
    if(gameStyle === 'adventure' && portals.length === 2 && nextHead){
      if(isPortalCell(nextHead.x, nextHead.y)){
        const otherKey = ownerKey === 'p1' ? 'p2' : 'p1';
        if(!teleportingOwner && attemptedPortalEntry[otherKey]){ endGame('draw'); return false; }
        if(teleportingOwner && teleportingOwner !== ownerKey){ startDeathAnim(ownerKey, otherKey); return false; }
        const p = portals.find(pt => pt.x===nextHead.x && pt.y===nextHead.y);
        const op = otherPortal(p.x, p.y);
        if(op){
          attemptedPortalEntry[ownerKey] = true;
          teleportingOwner = ownerKey;
          teleportStepsRemaining = s.segments.length;
          // Move head into exit portal cell; do not instantly reposition the rest.
          nextHead.x = op.x; nextHead.y = op.y;
        }
      }
    }

    s.prev = s.segments.map(c=>({...c}));

    if (!nextHead) { // Duvara çarptı
      const winner = gameMode === '1P' ? null : (ownerKey === 'p1' ? 'p2' : 'p1');
      startDeathAnim(ownerKey, winner);
      return false; // İlerleme durdu
    }

    s.segments.unshift(nextHead);
    if(s.grow>0) s.grow--; else s.segments.pop();
    return true; // İlerleme başarılı
  }

  function collideCheckDetailed(){
    if (!snakes) return { result: null, eater: null };

    // 1P Logic
    if (gameMode === '1P') {
        const s1 = snakes.p1;
        if (!s1) return { result: null, eater: null };
        const head1 = s1.segments[0];

        // Wall collision
        if (currentWallMode === MOD_WALLS.SOLID) {
            if (head1.x < 0 || head1.x >= GRID_COLS || head1.y < 0 || head1.y >= GRID_ROWS) {
                lastKnownLength1P = s1.segments.length;
                return { result: 'p1_self', eater: null };
            }
        }
    // Barrier collision for Adventure mode
    if(gameStyle === 'adventure'){
      const barrierSet = getBarrierCellsSet();
      if(barrierSet.has(head1.x+','+head1.y)){
        lastKnownLength1P = s1.segments.length;
        return { result: 'p1_self', eater: null };
      }
    }
        // Self collision
        const self1 = new Set(s1.segments.slice(1).map(c => c.x + ',' + c.y));
        if (self1.has(head1.x + ',' + head1.y)) {
            lastKnownLength1P = s1.segments.length;
            return { result: 'p1_self', eater: null };
        }
        return { result: null, eater: null };
    }

    // 2P Logic
    const s1 = snakes.p1, s2 = snakes.p2;
    const head1 = s1.segments[0], head2 = s2.segments[0];
    const beast1 = isPowered(s1);
    const beast2 = isPowered(s2);

    // Head-on collision
    if (head1.x === head2.x && head1.y === head2.y) {
        if (beast1 && !beast2) return { result: 'p1', eater: 'p1' }; // Beast P1 wins
        if (beast2 && !beast1) return { result: 'p2', eater: 'p2' }; // Beast P2 wins
        return { result: 'draw', eater: null }; // Normal or both beast
    }

    const body1 = new Set(s1.segments.map(c => c.x + ',' + c.y));
    const body2 = new Set(s2.segments.map(c => c.x + ',' + c.y));
    const self1 = new Set(s1.segments.slice(1).map(c => c.x + ',' + c.y));
    const self2 = new Set(s2.segments.slice(1).map(c => c.x + ',' + c.y));

    const head1Pos = head1.x + ',' + head1.y;
    const head2Pos = head2.x + ',' + head2.y;

    // Check collisions for P1
    let p1HitBarrier = false;
    if(gameStyle === 'adventure'){
      const barrierSet = getBarrierCellsSet();
      if(barrierSet.has(head1.x+','+head1.y)) p1HitBarrier = true;
    }
    const p1HitSelf = self1.has(head1Pos);
    const p1HitOpponentBody = !beast1 && body2.has(head1Pos);
    
    // Check collisions for P2
    let p2HitBarrier = false;
    if(gameStyle === 'adventure'){
      const barrierSet2 = getBarrierCellsSet();
      if(barrierSet2.has(head2.x+','+head2.y)) p2HitBarrier = true;
    }
    const p2HitSelf = self2.has(head2Pos);
    const p2HitOpponentBody = !beast2 && body1.has(head2Pos);

    const p1Loses = p1HitSelf || p1HitOpponentBody || p1HitBarrier;
    const p2Loses = p2HitSelf || p2HitOpponentBody || p2HitBarrier;

    if (p1Loses && p2Loses) return { result: 'draw', eater: null };
    if (p1Loses) return { result: 'p2', eater: p1HitOpponentBody ? 'p2' : null };
    if (p2Loses) return { result: 'p1', eater: p2HitOpponentBody ? 'p1' : null };

    return { result: null, eater: null };
  }

  let deathAnim = { active:false, loser:null, winner:null, nextAt:0, stepMs:0 };
  function startDeathAnim(loser, winner){
    const len = snakes && snakes[loser] ? snakes[loser].segments.length : 1;

    deathAnim = { active:true, loser, winner, nextAt:performance.now(), stepMs: ms };

  }
  let winAnim = { active:false, winner:null, start:0, duration:5000, blinkPeriod:350, final:false, color:'#fff' };
  function startWinAnim(winner, final=false){
    winAnim.active = true;
    winAnim.winner = winner;
    winAnim.start = performance.now();
    winAnim.final = final;
    if(final){ winAnim.duration = 3000; SFX.win(); }
    else{ winAnim.duration = 1500; SFX.winRound(); } 
    const col = playerColors[winner]; // Seçilen rengi al
    winAnim.color = col || '#fff';
    intermission = true;
    foods.length = 0;
    const winnerName = playerNames[winner] && playerNames[winner].trim();
    let winText;

    if (winnerName) {
        winText = t('winNamed').replace('{name}', winnerName).replace('{playerClass}', winner);
    } else {
        winText = (winner === 'p1') ? t('winP1') : t('winP2');
    }
    
    if(final){
      // For Adventure mode, don't show buttons during ceremony
      if(gameStyle === 'adventure'){
        showBanner(`<h1 style="color:${col}; text-shadow: 0 0 8px ${col};">${winText}</h1>`);
      } else {
        showBanner(`<h1 style="color:${col}; text-shadow: 0 0 8px ${col};">${winText}</h1>
          <div style="margin-top:12px;display:flex;gap:10px;justify-content:center">
            <button class="btn big" id="playAgainBtn">${t('playAgain')}</button>
            <button class="btn" id="mainMenuBtn">${t('mainMenu')}</button>
          </div>`);
      }
    } else {
      showBanner(`<h1 style="color:${col}; text-shadow: 0 0 8px ${col};">${winText}</h1>`);
    }
    const patterns = {
      'P': [ [0,1,2,3], [0,3], [0,3], [0,1,2], [0], [0], [0] ],
      '1': [ [1,2], [0,1,2,3], [2], [2], [2], [2], [0,1,2,3] ],
      '2': [ [0,1,2,3], [3], [2], [1], [0], [0], [0,1,2,3] ]
    };
    const charWidths = { 'P':4, '1':4, '2':4 };
    const charHeight = 7;
    const scale = 2;
    function scaledChar(char){ const rows = patterns[char]; const positions=[]; for(let row=0; row<rows.length; row++){ for(const col of rows[row]){ for(let dy=0; dy<scale; dy++){ for(let dx=0; dx<scale; dx++){ positions.push({ x: col*scale + dx, y: row*scale + dy }); } } } } return { positions, width: charWidths[char] * scale, height: charHeight * scale }; }
    const numChar = (winner === 'p1') ? '1' : '2';
    const pData = scaledChar('P');
    const nData = scaledChar(numChar);
    const gap = scale;
    const totalWidth = pData.width + gap + nData.width;
    const totalHeight = Math.max(pData.height, nData.height);
    const offsetX = Math.floor((GRID_COLS - totalWidth) / 2);
    const offsetY = Math.floor((GRID_ROWS - totalHeight) / 2);
    const pPositions = pData.positions.map(p => ({ x: p.x + offsetX, y: p.y + offsetY }));
    const nPositions = nData.positions.map(p => ({ x: p.x + offsetX + pData.width + gap, y: p.y + offsetY }));
    if(final){
      if(winner === 'p1'){ snakes.p1.segments = [...pPositions, ...nPositions]; snakes.p2.segments = []; }
      else{ snakes.p2.segments = [...pPositions, ...nPositions]; snakes.p1.segments = []; }
    }else{
      if(winner === 'p1'){ snakes.p1.segments = nPositions; snakes.p2.segments = pPositions; }
      else{ snakes.p2.segments = nPositions; snakes.p1.segments = pPositions; }
    }
    for(const key of ['p1','p2']){
      if (!snakes[key]) continue;
      const s = snakes[key];
      s.prev = s.segments.map(c => ({...c}));
      s.dir = {x:0,y:0}; s.nextDir = {x:0,y:0}; s.grow = 0; s.powerEnd = 0;
    }
    if(final){
      // Only wire buttons for non-Adventure modes
      if(gameStyle !== 'adventure'){
        const wait=()=>{
          const pa=document.getElementById('playAgainBtn');
          const mm=document.getElementById('mainMenuBtn');
          if(!pa||!mm){ requestAnimationFrame(wait); return; }
          pa.onclick=()=>{ SFX.menuClick(); winAnim.active=false; hideBanner(); // restart full match with same selections
            games = { p1:0, p2:0 }; drawSeries();
            resetRound(3);
          };
          mm.onclick=()=>{ SFX.menuClick(); winAnim.active=false; hideBanner(); openMainMenu(); };
        }; wait();
      }
    }
  }

  function endGame(result){
    if (gameMode === '1P') {
        if (result === 'p1_self') {
            intermission = true;
            SFX.crash();
            const now = performance.now();
            const finalLength = lastKnownLength1P; // Kaydedilen uzunluğu kullan
            if (snakes && snakes.p1) {
                snakes.p1.shakeUntil = now + 200;
            }
            
            canvasWrap.classList.add('shake');
            setTimeout(() => {
                canvasWrap.classList.remove('shake');
                show1PGameOver();
                snakes = null; // Yılanı oyun bittikten sonra null yap
            }, 400);
        }
        return;
    }

    // 2P Logic
    if(result==='p1' || result==='p2'){
      addHighScore(playerNames.p1.trim() || t('p1'), stats.p1Food);
      addHighScore(playerNames.p2.trim() || t('p2'), stats.p2Food);
      awardGame(result);
      hideBanner(); // Önceki banner'ı gizle
      const isFinal = games[result] >= GAMES_TO_ROUND;
      startWinAnim(result, isFinal);
    } else { // Beraberlik
      intermission = true;
      showBanner(`<h1>${t('draw')}</h1>`);
      SFX.drawCrash();

      snakes.p1.shakeUntil = now + 200;
      snakes.p2.shakeUntil = now + 200;
      canvasWrap.classList.add('shake');
      setTimeout(()=>{ 
        canvasWrap.classList.remove('shake');
        hideBanner(); 
        resetRound(3); 
      }, 1300);
    }
  }
  async function resetRound(count=3){
    const mid={x:(GRID_COLS/2)|0, y:(GRID_ROWS/2)|0};
    const startP1={x:mid.x-20, y:mid.y-6}; const startP2={x:mid.x+20, y:mid.y+6};

    snakes={ p1:createSnake(startP1, dirMap.right), p2:createSnake(startP2, dirMap.left) };

    deathAnim.active=false; snakes.p1.slowEnd=0; snakes.p2.slowEnd=0; flashColorEnd=0; sapphireTeleportEnd=0;
    spawnFood();

      spawnPortals();
      // Increase barrier count per round up to 25
      adventureRound = Math.min(5, adventureRound + 1);

      spawnBarriers(desired);
    }
    timerEnded = true; // Timer starts after countdown
    updateTimerUI(ROUND_DURATION);
    await countdown(count);
  }

  function drawGrid(){
    const w=canvas.clientWidth,h=canvas.clientHeight,cw=w/GRID_COLS,ch=h/GRID_ROWS;
    ctx.save(); ctx.strokeStyle=getComputedStyle(document.documentElement).getPropertyValue('--grid') || '#1a2537'; ctx.globalAlpha=0.14;
    ctx.beginPath();
    for(let x=0;x<=GRID_COLS;x++){ const X=Math.round(x*cw)+.5; ctx.moveTo(X,0); ctx.lineTo(X,h); }
    for(let y=0;y<=GRID_ROWS;y++){ const Y=Math.round(y*ch)+.5; ctx.moveTo(0,Y); ctx.lineTo(w,Y); }
    ctx.stroke(); 
    
    if (currentWallMode === MOD_WALLS.SOLID) {
        ctx.strokeStyle = '#e74c3c';
        ctx.lineWidth = 6;
        ctx.globalAlpha = 0.7;
        ctx.shadowColor = '#e74c3c';
        ctx.shadowBlur = 10;
        ctx.strokeRect(2, 2, w - 4, h - 4);
    }
    
    // Draw tetromino barriers for Adventure mode
    if(gameStyle === 'adventure' && barriers.length > 0){
      ctx.globalAlpha = 0.9;
      for(const b of barriers){
        // Give each barrier a subtle neon outline
        for(const c of b.cells){
          const x = c.x * cw;
          const y = c.y * ch;
          ctx.fillStyle = '#243b55';
          ctx.fillRect(x, y, cw, ch);
          ctx.save();
          ctx.globalAlpha = 0.6;
          ctx.strokeStyle = '#00e5ff';
          ctx.lineWidth = 2;
          ctx.strokeRect(x+1, y+1, cw-2, ch-2);
          ctx.restore();
        }
      }
    }
    
    ctx.restore();
  }
  function drawSnakeBlocks(s, ownerKey, alphaProgress){
    if (!s) return;
    const cw=canvas.clientWidth/GRID_COLS, ch=canvas.clientHeight/GRID_ROWS;
    ctx.save();

    const now = performance.now();
    if (s.shakeUntil > now) {
        const shakeAmount = 4;
        const shakeX = (Math.random() - 0.5) * shakeAmount;
        const shakeY = (Math.random() - 0.5) * shakeAmount;
        ctx.translate(shakeX, shakeY);
    }

    const winning = winAnim.active;
    for(let i=0;i<s.segments.length;i++){
      const cur=s.segments[i], prev=s.prev[i]||cur;
      const x=modLerp(prev.x, cur.x, GRID_COLS, alphaProgress); 
      const y=modLerp(prev.y, cur.y, GRID_ROWS, alphaProgress); 
      const cx=(x+.5)*cw, cy=(y+.5)*ch;
      const size=Math.min(cw,ch)*0.80;
      const half=size/2;
      const left=cx-half, top=cy-half;
      const beast = isPowered(s);
      const flashing = s.flashUntil && performance.now() < s.flashUntil;
      const flashPeriod = 120;
      const flashVisible = ((performance.now()/flashPeriod)|0) % 2 === 0;
      ctx.save();
      ctx.globalCompositeOperation='screen';
      const g=ctx.createRadialGradient(cx,cy,1,cx,cy,size*1.0);
      if(winning){
        const col = winAnim.color || '#ffffff';
        g.addColorStop(0, hexToRgba(col,0.40));
      } else if(beast){
        g.addColorStop(0,'rgba(255,23,68,0.4)');
      } else {
        const baseAura = hexToRgba(playerColors[ownerKey], 0.25);
        g.addColorStop(0, baseAura);
      }
      g.addColorStop(1, 'rgba(0,0,0,0)');
      ctx.fillStyle=g;
      ctx.fillRect(left-size*0.3, top-size*0.3, size*1.6, size*1.6);
      ctx.restore();
      let bodyColor;
      let digestGlowColor = null;
      for(let anim of s.digestAnims){
        const elapsed = now - anim.startTime;
        const duration = 1000;
        if(elapsed > duration){
          s.digestAnims.shift();
          continue;
        }
        const progress = elapsed / duration;
        const idx = Math.floor(progress * s.segments.length);
        if(idx === i){
          digestGlowColor = anim.color;
          break;
        }
      }
      if(digestGlowColor){
        bodyColor = digestGlowColor;
      } else if(winning){
        bodyColor = winAnim.color || '#ffffff';
      } else if(flashing && flashVisible){
        bodyColor = s.flashColor || '#ffd166';
      } else if(beast){
        bodyColor = '#ff1744';
      } else {
        bodyColor = playerColors[ownerKey];
      }
      ctx.fillStyle = bodyColor;
      ctx.fillRect(left, top, size, size);
      ctx.save();
      ctx.globalCompositeOperation='lighter';
      const ig=ctx.createRadialGradient(cx,cy,1,cx,cy,size*0.4);
      ig.addColorStop(0,'rgba(255,255,255,0.40)');
      ig.addColorStop(1,'rgba(255,255,255,0.04)');
      ctx.fillStyle=ig; ctx.fillRect(left, top, size, size);
      ctx.restore();
    }
    ctx.restore();
  }
  function drawFoods(){
    const w=canvas.clientWidth,h=canvas.clientHeight,cw=w/GRID_COLS,ch=h/GRID_ROWS;
    for(const f of foods){
      const cx=(f.x+.5)*cw, cy=(f.y+.5)*ch;
      const r=Math.min(cw,ch)*0.34;
      ctx.save();
      ctx.globalCompositeOperation='screen';
      let haloRadius, base, innerColor;
      const glowAnim = 0.5 + (Math.sin(performance.now() / 200) + 1) / 4; // 0.5 to 1.0

      if(f.type === 'diamond'){
        haloRadius = r * 4.5 * glowAnim; // Increased glow
        base = `rgba(255,209,102,${0.7 * glowAnim})`; // Brighter base
        innerColor = '#ffd166';
      } else if(f.type === 'sapphire'){
        haloRadius = r * 4.3 * glowAnim; // Blue glow
        base = `rgba(0,255,255,${0.7 * glowAnim})`; // Blue base
        innerColor = '#00ffff';
      } else if(f.type === 'heart'){
        haloRadius = r * 4.2 * glowAnim; // Increased glow
        base = `rgba(255,23,68,${0.7 * glowAnim})`; // Brighter base
        innerColor = '#ff1744';
      } else { // normal food
        const normalGlowAnim = 0.7 + (Math.sin(performance.now() / 300) + 1) / 6; // subtle glow
        haloRadius = r * 2.8 * normalGlowAnim;
        base = `rgba(255,209,102,${0.3 * normalGlowAnim})`;
        innerColor = '#ffd166';
      }
      const halo=ctx.createRadialGradient(cx,cy,1,cx,cy,haloRadius);
      halo.addColorStop(0, base);
      halo.addColorStop(1, 'rgba(0,0,0,0)');
      ctx.fillStyle=halo; ctx.beginPath(); ctx.arc(cx,cy,haloRadius*0.75,0,Math.PI*2); ctx.fill();
      ctx.restore();
      ctx.beginPath();
      ctx.arc(cx,cy,r,0,Math.PI*2);
      ctx.fillStyle = innerColor;
      ctx.fill();
      ctx.save();
      ctx.globalCompositeOperation='lighter';
      ctx.beginPath();
      ctx.arc(cx,cy,r*0.75,0,Math.PI*2);
      ctx.fillStyle=`rgba(255,255,255,${0.55 * glowAnim})`;
      ctx.fill();
      ctx.restore();
    }
    
    // Draw portals for Adventure mode
    if(gameStyle === 'adventure' && portals.length > 0){
      for(const p of portals){
        const cx=(p.x+.5)*cw, cy=(p.y+.5)*ch;
        const r=Math.min(cw,ch)*0.4;
        ctx.save();
        // Portal glow effect
        const glowAnim = 0.5 + (Math.sin(performance.now() / 150) + 1) / 4;
        const haloRadius = r * 3 * glowAnim;
        const halo=ctx.createRadialGradient(cx,cy,1,cx,cy,haloRadius);
        halo.addColorStop(0, `rgba(138,43,226,${0.8 * glowAnim})`); // Purple glow
        halo.addColorStop(1, 'rgba(0,0,0,0)');
        ctx.fillStyle=halo;
        ctx.beginPath();
        ctx.arc(cx,cy,haloRadius*0.8,0,Math.PI*2);
        ctx.fill();
        
        // Portal ring
        ctx.strokeStyle = '#8A2BE2';
        ctx.lineWidth = 3;
        ctx.globalAlpha = 0.9;
        ctx.beginPath();
        ctx.arc(cx,cy,r,0,Math.PI*2);
        ctx.stroke();
        
        // Inner portal effect
        ctx.fillStyle = '#4B0082';
        ctx.globalAlpha = 0.6;
        ctx.beginPath();
        ctx.arc(cx,cy,r*0.7,0,Math.PI*2);
        ctx.fill();
        
        ctx.restore();
      }
    }
  }
  function render(alpha1, alpha2){

  function renderWinAnim(){

    drawGrid();
    const elapsed = performance.now() - winAnim.start;
    const period = winAnim.blinkPeriod;

        drawSnakeBlocks(snakes.p1, 'p1', 0);

  /* === Loop === */
  let last=performance.now();
  function step(){
    const now=performance.now(), dt=now-last; last=now;
    if(winAnim.active){
      const elapsed = now - winAnim.start;
      if(elapsed >= winAnim.duration){
        winAnim.active = false; intermission = false; hideBanner(); // Animasyon bitince banner'ı gizle
        if(winAnim.final){ 
          // For Adventure mode, show separate window with buttons after ceremony
          if(gameStyle === 'adventure'){
            showBanner(`<h1>${t('gameOver')}</h1>
              <div style="margin-top:12px;display:flex;gap:10px;justify-content:center">
                <button class="btn big" id="playAgainBtn">${t('playAgain')}</button>
                <button class="btn" id="mainMenuBtn">${t('mainMenu')}</button>
              </div>`);
            const wait=()=>{
              const pa=document.getElementById('playAgainBtn');
              const mm=document.getElementById('mainMenuBtn');
              if(!pa||!mm){ requestAnimationFrame(wait); return; }
              pa.onclick=()=>{ SFX.menuClick(); hideBanner(); softReset(true, 3); };
              mm.onclick=()=>{ SFX.menuClick(); hideBanner(); openMainMenu(); };
            }; wait();
          }
          // For other modes, buttons are already shown in startWinAnim function
        }
        else{ resetRound(3); }
        requestAnimationFrame(step); return;
      }
      renderWinAnim();
      requestAnimationFrame(step); return;
    }
    // Reset frame-level portal entry tracking
    if(gameStyle === 'adventure'){
      attemptedPortalEntry.p1 = false;
      attemptedPortalEntry.p2 = false;
    }
    if(redBulkEndTime && now >= redBulkEndTime){
      foods.length = 0;
      redBulkEndTime = 0;
      redFoodPresent = false;
      beastOwner = null;
      spawnFood();
    }
    const modeBoost = currentSpeedMode ? (MOD_SPEED[currentSpeedMode]||1.0) : 1.0;
    const baseStepMs = 1000/(BASE_TPS*modeBoost);
    for(let i=0; i<foods.length; i++){
      const f=foods[i];
      if(f.type==='diamond' && f.expiryTime && now >= f.expiryTime){
        let tries=0;
        const occ = new Set();
        if (snakes.p1) snakes.p1.segments.forEach(s => occ.add(s.x+','+s.y));
        if (snakes.p2) snakes.p2.segments.forEach(s => occ.add(s.x+','+s.y));
        foods.forEach(food => occ.add(food.x+','+food.y));
        occ.delete(f.x+','+f.y);
        let newPos;
        do{ newPos=rngCell(); tries++; if(tries>800) break; }while(occ.has(newPos.x+','+newPos.y));
        if(tries<=800){ f.x=newPos.x; f.y=newPos.y; f.spawnAt=now; f.expiryTime=now+3000; }
      }
    }
    // Ruby food teleport logic
    if (sapphireTeleportEnd && now >= sapphireTeleportEnd) {
      const rubyFood = foods.find(f => f.type === 'heart');
      if (rubyFood) {
        let tries = 0;
        const occ = new Set();
        if (snakes.p1) snakes.p1.segments.forEach(s => occ.add(s.x + ',' + s.y));
        if (snakes.p2) snakes.p2.segments.forEach(s => occ.add(s.x + ',' + s.y));
        foods.forEach(food => occ.add(food.x + ',' + food.y));
        occ.delete(rubyFood.x + ',' + rubyFood.y);
        let newPos;
        do { newPos = rngCell(); tries++; if (tries > 800) break; } while (occ.has(newPos.x + ',' + newPos.y));
        if (tries <= 800) { rubyFood.x = newPos.x; rubyFood.y = newPos.y; rubyFood.spawnAt = now; }
        sapphireTeleportEnd = now + 3500; // Reset timer
      }
    }
    // Adventure mode portal timer (ms based)
    if(gameStyle === 'adventure' && portals.length === 2){
      portalTimerMs -= dt;
      if(portalTimerMs <= 0 && !teleportingOwner){
        spawnPortals();
      }
    }
    if(deathAnim.active){
      const loser = snakes[deathAnim.loser];
      if(now>=deathAnim.nextAt){
        loser.prev = loser.segments.map(c=>({...c}));
        loser.segments.pop();
        deathAnim.nextAt = now + deathAnim.stepMs;
        if(loser.segments.length === 0){ 
            deathAnim.active=false; 
            if (gameMode === '1P') {
                show1PGameOver();
            } else {
                endGame(deathAnim.winner); 
            }
        }
      }
      render(0,0);
      requestAnimationFrame(step); return;
    }
    if(gameMode === '2P' && currentSpeedMode && !paused && !inCountdown && !intermission && !winAnim.active && !deathAnim.active){
      const tLeft = roundTimerEnd - now;
      if(!timerEnded && tLeft <= 0){ timerEnded = true; endRoundByTime(); requestAnimationFrame(step); return; }
    }
    if(snakes && !paused && !inCountdown && !intermission && currentSpeedMode){
      acc1 += dt; 
      if (gameMode === '2P') acc2 += dt;
      let guard=0;
      while(guard++<12){
        const s1=snakes.p1, s2=snakes.p2;
        const i1 = baseStepMs / speedMult(s1);
        const r1 = acc1 >= i1;

        if (gameMode === '2P') {
            const i2 = baseStepMs / speedMult(s2);
            const r2 = acc2 >= i2;
            if(!r1 && !r2) break;
            if(r1 && r2){
              const moved1 = bodyAdvance(s1, 'p1');
              const moved2 = bodyAdvance(s2, 'p2');
              if (!moved1 || !moved2) break;
              acc1 -= i1; acc2 -= i2;
              eatFoodIfAny(s1,'p1'); eatFoodIfAny(s2,'p2');
              const chk = collideCheckDetailed();
              if(chk.result){ endGame(chk.result); break; }
            } else if(r1){
              const moved1 = bodyAdvance(s1, 'p1');
              if (!moved1) break;
              acc1 -= i1;
              eatFoodIfAny(s1,'p1');
              const chk = collideCheckDetailed();
              if(chk.result){ endGame(chk.result); break; }
            } else if(r2){
              const moved2 = bodyAdvance(s2, 'p2');
              if (!moved2) break;
              acc2 -= i2;
              eatFoodIfAny(s2,'p2');
              const chk = collideCheckDetailed();
              if(chk.result){ endGame(chk.result); break; }
            }
            // Handle teleport completion countdown per step
            if(gameStyle==='adventure' && teleportingOwner){
              // Release 2 segments per step through the tunnel
              teleportStepsRemaining = Math.max(0, teleportStepsRemaining - 2);
              if(teleportStepsRemaining === 0){
                teleportingOwner = null;
                portalTimerMs = 15000; // restart timer after full exit
              }
            }
        } else { // 1P
            if(!r1) break;
            const moved1 = bodyAdvance(s1, 'p1');
            if (!moved1) break;
            acc1 -= i1;
            eatFoodIfAny(s1, 'p1');
            updateFoodCounters();
            const chk = collideCheckDetailed();
            if (chk.result) { endGame(chk.result); break; }
            if(gameStyle==='adventure' && teleportingOwner){
              teleportStepsRemaining = Math.max(0, teleportStepsRemaining - 2);
              if(teleportStepsRemaining === 0){
                teleportingOwner = null;
                portalTimerMs = 15000;
              }
            }
        }
      }
    }
    const s1=snakes?.p1, s2=snakes?.p2;
    let alpha1=0, alpha2=0;
    if(s1 && currentSpeedMode){ const i1=(1000/(BASE_TPS*(MOD_SPEED[currentSpeedMode]||1.0)))/speedMult(s1); alpha1=Math.min(1,acc1/i1); }
    if(s2 && currentSpeedMode){ const i2=(1000/(BASE_TPS*(MOD_SPEED[currentSpeedMode]||1.0)))/speedMult(s2); alpha2=Math.min(1,acc2/i2); }
    if(currentSpeedMode){
      if(paused && gameMode === '2P'){
        roundTimerEnd += dt;
      }
      if (!timerEnded && gameMode === '2P') {
        updateTimerUI(roundTimerEnd - now);
      }
    }
    render(alpha1, alpha2);
    requestAnimationFrame(step);
  }

  // Başlangıçta ana menüyü aç
  openMainMenu();
  applyLang();
  requestAnimationFrame(step);
})();
</script>
