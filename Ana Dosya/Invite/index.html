<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2 Player Snake - Davet Yönlendirmesi</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #0d0d1a;
            color: #fff;
            font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            text-align: center;
        }
        .container {
            max-width: 400px;
            padding: 20px;
        }
        .logo {
            width: 120px;
            height: auto;
            margin-bottom: 20px;
            animation: pulse 2s infinite ease-in-out;
        }
        .loader {
            border: 4px solid rgba(255, 255, 255, 0.1);
            width: 48px;
            height: 48px;
            border-radius: 50%;
            border-left-color: #00e5ff;
            animation: spin 1s linear infinite;
            margin: 20px auto;
        }
        h1 {
            font-size: 20px;
            margin: 10px 0;
            color: #00e5ff;
            text-shadow: 0 0 10px rgba(0,229,255,0.3);
        }
        p {
            color: #a0a0c0;
            font-size: 14px;
            line-height: 1.5;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        @keyframes pulse {
            0%, 100% { transform: scale(1); opacity: 0.9; }
            50% { transform: scale(1.05); opacity: 1; }
        }
    </style>
</head>
<body>
    <div class="container">
        <img class="logo" src="https://2playersnake.com/wp-content/uploads/2026/04/2-Player-Snake-Logo-v3-no-bg-500px-web.webp" alt="2 Player Snake">
        <div class="loader"></div>
        <h1>Oyuna Katılınıyor</h1>
        <p id="statusMsg">Lütfen bekleyin, lobiye yönlendiriliyorsunuz...</p>
        <div id="appButtons" style="margin-top: 24px; display: flex; flex-direction: column; gap: 12px; align-items: center;">
            <a id="btnOpenApp" href="#" style="display: none; background: #00e5ff; color: #000; font-weight: bold; text-decoration: none; padding: 12px 28px; border-radius: 25px; font-size: 15px; box-shadow: 0 0 15px rgba(0,229,255,0.4);">UYGULAMADA AÇ</a>
            <a id="btnPlayWeb" href="#" style="display: none; color: #8888aa; font-size: 13px; text-decoration: underline;">Web Sürümünde Oyna</a>
        </div>
    </div>

    <script>
        (function() {
            // Get URL parameters
            const urlParams = new URLSearchParams(window.location.search);
            const room = urlParams.get('room');
            const mode = urlParams.get('mode');

            // Build target URLs
            const targetBase = 'https://2playersnake.com/wp-content/uploads/game-mobile/index.html';
            let targetUrl = targetBase;
            let schemeUrl = 'twoplayersnake://invite';
            
            if (room) {
                targetUrl += '?room=' + encodeURIComponent(room);
                schemeUrl += '?room=' + encodeURIComponent(room);
                if (mode) {
                    targetUrl += '&mode=' + encodeURIComponent(mode);
                    schemeUrl += '&mode=' + encodeURIComponent(mode);
                }
            }

            const btnOpenApp = document.getElementById('btnOpenApp');
            const btnPlayWeb = document.getElementById('btnPlayWeb');
            const statusMsg = document.getElementById('statusMsg');

            if (btnOpenApp) {
                btnOpenApp.href = schemeUrl;
                btnOpenApp.style.display = 'inline-block';
            }
            if (btnPlayWeb) {
                btnPlayWeb.href = targetUrl;
                btnPlayWeb.style.display = 'inline-block';
            }

            // iOS & Android device detection
            const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) && !window.MSStream;
            const isAndroid = /Android/.test(navigator.userAgent);

            if (room && (isIOS || isAndroid)) {
                // Try launching native app first
                window.location.href = schemeUrl;
            }

            // Fallback redirect to web version if app is not installed or opened
            setTimeout(function() {
                if (!document.hidden) {
                    window.location.replace(targetUrl);
                }
            }, 1500);
        })();
    </script>
</body>
</html>
