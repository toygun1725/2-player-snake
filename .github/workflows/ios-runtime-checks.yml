name: iOS Runtime Checks
on:
  workflow_dispatch:
  workflow_call:
  push:
    branches: [main]
    paths:
      - 'Ana Dosya/iOS/**'
      - 'Ana Dosya/Mobile/Beta/v3/**'
      - 'Ana Dosya/PC/Beta/v3/**'
      - 'Ana Dosya/Android/app/src/main/assets/offline/mobile_offline_fallback.html'
      - 'tests/**'
      - 'tools/test-ios-runtime.sh'
      - '.github/workflows/ios-runtime-checks.yml'
jobs:
  runtime:
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check Fastlane syntax and signing configuration without running it
        run: |
          ruby -c 'Ana Dosya/iOS/fastlane/Fastfile'
          node tools/check-ios-fastlane-config.cjs
      - name: JavaScript regression and native WebKit resource checks
        run: bash tools/test-ios-runtime.sh
      - name: Type-check iOS cloud save source
        run: xcrun swiftc -typecheck 'Ana Dosya/iOS/TwoPlayerSnake/Bridge/CloudSaveStore.swift'
      - name: Exercise cloud save parsing and merging
        run: |
          xcrun swiftc 'Ana Dosya/iOS/TwoPlayerSnake/Bridge/CloudSaveStore.swift' tests/CloudSaveRecordProbe.swift tests/CloudSaveCoordinatorProbe.swift -o "$RUNNER_TEMP/cloud-save-probe"
          "$RUNNER_TEMP/cloud-save-probe"
      - name: Check Xcode cloud settings without building the app
        run: |
          xcodebuild -project 'Ana Dosya/iOS/TwoPlayerSnake.xcodeproj' -target TwoPlayerSnake -configuration Debug -sdk iphonesimulator -showBuildSettings -json > "$RUNNER_TEMP/cloud-debug-settings.json"
          xcodebuild -project 'Ana Dosya/iOS/TwoPlayerSnake.xcodeproj' -target TwoPlayerSnake -configuration Release -sdk iphonesimulator -showBuildSettings -json > "$RUNNER_TEMP/cloud-release-settings.json"
          xcodebuild -project 'Ana Dosya/iOS/TwoPlayerSnake.xcodeproj' -target TwoPlayerSnake -configuration Release -sdk iphonesimulator -showBuildSettings -json CODE_SIGN_ENTITLEMENTS=TwoPlayerSnake/CloudKit.staged.entitlements SNAKE_CLOUDKIT_CONTAINER_ID=iCloud.com.twoplayersnake.app > "$RUNNER_TEMP/cloud-testflight-settings.json"
          node tools/check-ios-cloud-settings.cjs "$RUNNER_TEMP/cloud-debug-settings.json" "$RUNNER_TEMP/cloud-release-settings.json" "$RUNNER_TEMP/cloud-testflight-settings.json"
