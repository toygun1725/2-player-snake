name: iOS Build & TestFlight Deployment

permissions:
  contents: read
  actions: read

on:
  workflow_dispatch:
    inputs:
      build_number:
        description: 'Özel Build Numarası (Boş bırakılırsa GitHub Run numarası kullanılır)'
        required: false
        default: ''
      version_number:
        description: 'Pazarlama Sürüm Numarası (Örn: 3.3.5 veya 3.3.6)'
        required: false
        default: '3.3.6'
  push:
    tags:
      - 'ios-v*'

jobs:
  runtime-checks:
    uses: ./.github/workflows/ios-runtime-checks.yml
  build-and-deploy:
    needs: runtime-checks
    name: 🍏 iOS Build & TestFlight Deploy
    runs-on: macos-latest
    timeout-minutes: 60

    steps:
      - name: 📥 Depoyu Klonla (Checkout)
        uses: actions/checkout@v4

      - name: ⚙️ Xcode ve SDK Bilgisi (Xcode 26+ / iOS 26 SDK)
        run: |
          xcodebuild -version

      - name: 💎 Ruby ve Fastlane Kurulumu
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true
          working-directory: 'Ana Dosya/iOS'

      - name: 🔑 Sabit Dağıtım Sertifikasını Yükle (GitHub Secret'tan)
        env:
          DIST_CERT_SECRET: ${{ secrets.DISTRIBUTION_CERTIFICATE }}
          FALLBACK_CERT_SECRET: ${{ secrets.APPLE_CERT_P12_BASE64 }}
        run: |
          CERT_DATA="${DIST_CERT_SECRET:-$FALLBACK_CERT_SECRET}"
          if [ -n "$CERT_DATA" ]; then
            mkdir -p "Ana Dosya/iOS/certs"
            echo "$CERT_DATA" | base64 --decode > "Ana Dosya/iOS/certs/dist_certificate.p12"
            echo "Sabit dağıtım sertifikası GitHub Secrets üzerinden başarıyla yüklendi."
          else
            echo "Sabit sertifika secret'ı tanımlanmamış, standart akış devam ediyor."
          fi

      - name: 🔑 Sertifika Önbelleği (Certificate Cache)
        uses: actions/cache@v4
        with:
          path: Ana Dosya/iOS/certs
          key: ios-certs-v2-${{ secrets.APPLE_TEAM_ID }}-${{ hashFiles('Ana Dosya/iOS/certs/dist_certificate.p12') }}
          restore-keys: |
            ios-certs-v2-${{ secrets.APPLE_TEAM_ID }}-

      - name: Check cached signing identity
        id: signing-material
        run: |
          if [ -s "Ana Dosya/iOS/certs/dist_certificate.p12" ]; then
            echo "missing=false" >> "$GITHUB_OUTPUT"
          else
            echo "missing=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Recover existing identity from successful Build 35
        if: steps.signing-material.outputs.missing == 'true'
        uses: actions/download-artifact@v4
        with:
          name: iOS-Distribution-Certificate-p12
          path: Ana Dosya/iOS/certs
          github-token: ${{ github.token }}
          run-id: 35006468857

      - name: 📦 CocoaPods Kurulumu (Google Mobile Ads SDK)
        run: |
          cd "Ana Dosya/iOS"
          pod install --repo-update

      - name: 🚀 Fastlane ile TestFlight'a Derle ve Dağıt
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          CI_KEYCHAIN_PASSWORD: ${{ secrets.CI_KEYCHAIN_PASSWORD || 'SnakeCI_Temp_Pass_2026' }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
        run: |
          cd "Ana Dosya/iOS"
          bundle exec fastlane beta build_number:"${{ github.event.inputs.build_number }}" version:"${{ github.event.inputs.version_number || '3.3.6' }}"

      - name: 📦 Üretilen IPA Dosyasını GitHub Artifact Olarak Kaydet
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: 2PlayerSnake-iOS-IPA
          path: 'Ana Dosya/iOS/**/*.ipa'
          if-no-files-found: ignore

      - name: 🔑 Dağıtım Sertifikasını Artifact Olarak Kaydet (Sabitleme için)
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: iOS-Distribution-Certificate-p12
          path: |
            Ana Dosya/iOS/certs/*.p12
            Ana Dosya/iOS/certs/*.base64
          if-no-files-found: ignore
