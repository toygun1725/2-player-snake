name: iOS Build & TestFlight Deployment

permissions:
  contents: read
  actions: read

on:
  workflow_dispatch:
    inputs:
      build_number:
        description: 'Özel Build Numarası (Boş bırakılırsa GitHub Run numarası kullanılır)'
        required: false
        default: ''
      version_number:
        description: 'Pazarlama Sürüm Numarası (Örn: 3.3.5 veya 3.3.6)'
        required: false
        default: '3.6.5'
      icloud_testflight:
        description: 'Yalnız TestFlight doğrulaması için iCloud’u etkinleştir'
        type: boolean
        required: false
        default: false
      icloud_release:
        description: 'Canlı web sürümüyle kullanılacak iCloud açık yayın adayı'
        type: boolean
        required: false
        default: false
  push:
    tags:
      - 'ios-v*'

jobs:
  runtime-checks:
    uses: ./.github/workflows/ios-runtime-checks.yml
  build-and-deploy:
    needs: runtime-checks
    name: 🍏 iOS Build & TestFlight Deploy
    runs-on: macos-latest
    timeout-minutes: 60

    steps:
      - name: 📥 Depoyu Klonla (Checkout)
        uses: actions/checkout@v4

      - name: Web sürümü kontrolü için Node.js hazırla
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Yayın türünü ve canlı web sürümünü doğrula
        env:
          SNAKE_ENABLE_TESTFLIGHT_CLOUDKIT: ${{ inputs.icloud_testflight }}
          SNAKE_ENABLE_RELEASE_CLOUDKIT: ${{ inputs.icloud_release }}
        run: |
          node tools/check-ios-release-mode.cjs
          node tools/check-ios-source-readiness.cjs
          if [ "$SNAKE_ENABLE_RELEASE_CLOUDKIT" = "true" ]; then
            node tools/check-ios-live-release.cjs
          fi

      - name: ⚙️ Xcode ve SDK Bilgisi (Xcode 26+ / iOS 26 SDK)
        run: |
          xcodebuild -version

      - name: 💎 Ruby ve Fastlane Kurulumu
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true
          working-directory: 'Ana Dosya/iOS'

      - name: 🔑 Sabit Dağıtım Sertifikasını Yükle (GitHub Secret'tan)
        env:
          DIST_CERT_SECRET: ${{ secrets.IOS_SIGNING_P12_V3 }}
        run: |
          CERT_DATA="$DIST_CERT_SECRET"
          if [ -n "$CERT_DATA" ]; then
            mkdir -p "Ana Dosya/iOS/certs"
            printf '%s' "$CERT_DATA" | base64 --decode > "Ana Dosya/iOS/certs/dist_certificate.p12"
            test -s "Ana Dosya/iOS/certs/dist_certificate.p12"
            echo "Dağıtım sertifikası güvenli değişkenden hazırlandı."
          else
            echo "Dağıtım sertifikası güvenli değişkeni eksik; build başlatılmadı."
            exit 1
          fi

      - name: 📦 CocoaPods Kurulumu (Google Mobile Ads SDK)
        run: |
          cd "Ana Dosya/iOS"
          pod install --repo-update

      - name: 🚀 Fastlane ile TestFlight'a Derle ve Dağıt
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          CI_KEYCHAIN_PASSWORD: ${{ secrets.IOS_SIGNING_PASSWORD_V3 }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
          SNAKE_ENABLE_TESTFLIGHT_CLOUDKIT: ${{ inputs.icloud_testflight }}
          SNAKE_ENABLE_RELEASE_CLOUDKIT: ${{ inputs.icloud_release }}
        run: |
          if [ -z "$CI_KEYCHAIN_PASSWORD" ]; then
            echo "Sertifika parolası güvenli değişkeni eksik; build başlatılmadı."
            exit 1
          fi
          cd "Ana Dosya/iOS"
          bundle exec fastlane beta build_number:"${{ github.event.inputs.build_number }}" version:"${{ github.event.inputs.version_number }}"

      - name: 📦 Üretilen IPA Dosyasını GitHub Artifact Olarak Kaydet
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: 2PlayerSnake-iOS-IPA
          path: 'Ana Dosya/iOS/**/*.ipa'
          if-no-files-found: ignore
