name: iOS Signing Readiness (Read Only)
on:
  push:
    branches: [codex/ios-cloud-check]
    paths:
      - 'tools/check-ios-signing-readiness.cjs'
      - '.github/workflows/ios-signing-readiness-check.yml'
permissions:
  contents: read
jobs:
  signing-readiness:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Compare signing identity with active profile
        env:
          DIST_CERT_SECRET: ${{ secrets.IOS_SIGNING_P12_V2 }}
          CI_KEYCHAIN_PASSWORD: ${{ secrets.IOS_SIGNING_PASSWORD_V2 }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
        run: node tools/check-ios-signing-readiness.cjs
